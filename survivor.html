// ─── 배틀 루프 ───
function battleLoop() {
  // 배틀 화면이 아니면 루프 중단
  if (gs.screen !== '__battle__') {
    battleAnimId = null;
    return;
  }
  // 캔버스 transform 스택을 매 프레임 초기화 — save/restore 불균형 방어
  try { gctx.resetTransform(); } catch(e) {}
  try {
    if (bt && !bt.paused && !bt.won) {
      updateBattle();
      // 2배속 모드: 같은 프레임에 한 번 더 업데이트
      if ((bt.speedMult||1) >= 2 && !bt.won) updateBattle();
    }
    if (bt) { drawBattle(); updateHUD(); }
  } catch(err) {
    console.warn('battleLoop error:', err);
    try { gctx.resetTransform(); gctx.globalAlpha = 1; gctx.shadowBlur = 0; } catch(e2) {}
  }
  battleAnimId = requestAnimationFrame(battleLoop);
}

// 슬로우모션용 서브프레임 카운터
let _slowFrameAcc = 0;

function updateBattle() {
  // 승리/패배 이미 처리됐으면 즉시 탈출 (타이머 레이스 방지)
  if (!bt || bt.won) return;

  // 슬로우 모션: slowScale(0~1) 비율로 프레임 실행
  // 히트스톱 처리
  if (bt.hitstop > 0) { bt.hitstop--; return; }

  if (bt.slowMotion) {
    _slowFrameAcc += (bt.slowScale || 0.15);
    if (_slowFrameAcc < 1) return;
    _slowFrameAcc -= 1;
  } else {
    _slowFrameAcc = 0;
  }

  // 콤보 타이머 감소
  if (bt.comboTimer > 0) {
    bt.comboTimer--;
    if (bt.comboTimer <= 0) bt.comboKills = 0;
  }
  if (bt.comboDisplay > 0) bt.comboDisplay--;

  const p = gs.player, s = gs.skills;
  // 유물 프레임 틱
  tickRelics(bt);
  // 미니 도전 타이머
  if(bt.miniChallenge && bt.miniChallenge.id==='speed' && !bt.miniChallenge.completed){
    if((bt._miniKillTimer||0)>0) bt._miniKillTimer--;
    else if((bt._miniKillCount||0)<10) bt.miniChallenge.failed=true; // 시간 초과로 실패
  }
  // _relicDamageEnemy: startBattle에서 한 번만 설정됨 (매 프레임 재생성 제거)

  // ── 독 틱 데미지 ──
  for(const e of bt.enemies){
    if((e.poison||0)>0){
      e.poison--;
      // 독: 30프레임(0.5초)마다 1 데미지 적용
      if(e.poison % 30 === 0){ damageEnemy(e, 1); if(e.poison % 90 === 0) spawnDN(e.x,e.y-e.size,'☠','#80ff40',false,'poison'); if(Math.random()<0.15) Audio.sfx.poison(); }
    }
  }

  // ── 시간 왜곡 타이머 (timeSlow 카드) ──
  if((s.timeSlow||0)>0){
    if(!bt.timeSlowTimer) bt.timeSlowTimer = 0;
    bt.timeSlowTimer++;
    const interval = Math.max(180, 420 - (s.timeSlow-1)*60);
    if(bt.timeSlowTimer >= interval){
      bt.timeSlowTimer = 0;
      bt.enemies.forEach(e=>{ e.frozen = Math.max(e.frozen||0, 120); });
      bt.explosions.push({x:p.x,y:p.y,maxRadius:250,radius:0,timer:18,color:'#88ddff'});
      spawnDN(p.x,p.y-30,'⌛시간 왜곡!','#88ddff',true);
      Audio.sfx.timeWarp();
    }
  }

  // ── 동료 소환 타이머 (summonAlly 카드) ──
  if((s.summonAlly||0)>0){
    if(!bt.allyTimer) bt.allyTimer = 0;
    bt.allyTimer++;
    if(bt.allyTimer >= Math.max(120, 240 - (s.summonAlly-1)*60)){
      bt.allyTimer = 0;
      const ar = 80 + s.summonAlly*20;
      const near = bt.enemies.filter(e=>Math.hypot(e.x-p.x,e.y-p.y)<ar);
      bt.explosions.push({x:p.x,y:p.y,maxRadius:ar,radius:0,timer:15,color:'#80e0ff'});
      near.forEach(e=>damageEnemy(e, 2+s.summonAlly));
      spawnP(p.x,p.y,'#80e0ff',8,4);
      Audio.sfx.allyExplode();
    }
    // 동료 미니 드로잉 (플레이어 주위 작은 펭귄)
    const allyAngle = (bt.bgTime||0)*0.03;
    if(!bt._allyDrawPos) bt._allyDrawPos = {x:p.x,y:p.y};
    bt._allyDrawPos.x = p.x + Math.cos(allyAngle)*40;
    bt._allyDrawPos.y = p.y + Math.sin(allyAngle)*40;
  }

  // ── 1. 플레이어 이동 ── [M16]
  let mx=0,my=0;
  if(keys['ArrowUp']||keys['w']||keys['W']) my--;
  if(keys['ArrowDown']||keys['s']||keys['S']) my++;
  if(keys['ArrowLeft']||keys['a']||keys['A']) mx--;
  if(keys['ArrowRight']||keys['d']||keys['D']) mx++;
  if(joystick.active) { const n=Math.hypot(joystick.dx,joystick.dy); if(n>5){mx=joystick.dx/50;my=joystick.dy/50;} }
  p._isMoving = !!(mx||my); // 운동량 증폭기 추적
  if(mx||my) {
    const len=Math.hypot(mx,my);
    p.dirX=mx/len; p.dirY=my/len;
    let spd=p.speed;
    if(bt.dashActive>0){spd*=4;bt.dashActive--;p.invincible=Math.max(p.invincible,bt.dashActive+2);}
    const speedMult = (p._speedMult || 1.0) * ((bt.playerSlowTimer||0)>0 ? 0.45 : 1.0);
    // 월드 좌표계 — 경계 없음 (카메라가 따라감)
    p.x += (mx/len)*spd*speedMult;
    p.y += (my/len)*spd*speedMult;
    // speed_demon: 이동 시 미니 대시 자동 발동
    if(s._synSpeedDemon && bt.dashCooldown<=0 && Math.random()<0.015){
      bt.dashCooldown=80; bt.dashActive=6;
      spawnP(p.x,p.y,'#4ecf7a',4,3);
    }
  }
  // ── 카메라 스무스 팔로우 (플레이어를 화면 중앙에 유지) ──
  {
    const cam = bt.cam;
    const targetX = p.x - 400, targetY = p.y - 400;
    cam.x += (targetX - cam.x) * 0.10;
    cam.y += (targetY - cam.y) * 0.10;
  }
  if(bt.dashCooldown>0) bt.dashCooldown--;
  if((bt.playerSlowTimer||0)>0) bt.playerSlowTimer--;

  // ── 캐릭터 패시브 타이머 ──
  // [펭귄 패시브] 원검 일체: 스택 타이머 감소 → 0이면 스택 소멸
  if((bt._penguinBladeTimer||0) > 0){ bt._penguinBladeTimer--; if(bt._penguinBladeTimer<=0) bt._penguinBladeStack=0; }
  // [토끼 패시브] 도약 반격: 대시 종료 감지 → 강화 창 30프레임 오픈
  if((bt._rabbitPrevDash||0) > 0 && bt.dashActive === 0 && gs.selectedChar?.id === 'rabbit'){
    bt._rabbitStrikeWindow = 30;
    spawnDN(p.x, p.y - 44, '⚡반격!', '#ffe040', true);
    spawnP(p.x, p.y, '#ffe040', 7, 3);
  }
  bt._rabbitPrevDash = bt.dashActive;
  if((bt._rabbitStrikeWindow||0) > 0) bt._rabbitStrikeWindow--;

  // [고양이 패시브] 광란: 매 25킬마다 3초(180프레임) 동안 발사 속도 2배
  if (gs.selectedChar && gs.selectedChar.id === 'cat') {
    if ((bt._catFrenzy||0) > 0) bt._catFrenzy--;
  }

  // 자동 발사 (60fps 기준 프레임 카운트)
  bt.fireTimer++;
  const _catFrenzyActive = (gs.selectedChar?.id === 'cat') && (bt._catFrenzy||0) > 0;
  const fireInterval = _catFrenzyActive
    ? Math.max(3, Math.floor((Math.max(6, 22 - Math.floor((s.fireRateBonus||0)/45))) / 2))
    : Math.max(6, 22 - Math.floor((s.fireRateBonus||0)/45));
  if(bt.fireTimer >= fireInterval && bt.enemies.length>0) {
    bt.fireTimer=0;
    // Math.hypot(sqrt) 대신 제곱 거리로 최근 적 탐색 — sqrt 연산 n회 절감
    let near=bt.enemies[0];
    let _nd2=(near.x-p.x)**2+(near.y-p.y)**2;
    for(let _ni=1;_ni<bt.enemies.length;_ni++){const _ne=bt.enemies[_ni];const _d2=(_ne.x-p.x)**2+(_ne.y-p.y)**2;if(_d2<_nd2){near=_ne;_nd2=_d2;}}
    const dx=near.x-p.x,dy=near.y-p.y;
    // 시너지 효과 반영
    const synGunslinger = s._synGunslinger;
    const synStorm      = s._synStormGunner;
    const synDeathRay   = s._synDeathRay;

    let cnt = 1 + (s.bulletCount||0) + (synGunslinger ? 3 : 0);
    let spd = 6 + (s.bulletSpeed||0) * (synStorm ? 2 : 1);
    const pierce = s.piercing || synGunslinger;

    // [여우 패시브] 폭발 직감: 충전 중이면 이번 발사를 폭발탄으로
    const _foxExplode = (gs.selectedChar?.id==='fox') && (bt._foxExplosiveShots||0) > 0;
    if(_foxExplode) bt._foxExplosiveShots = Math.max(0, bt._foxExplosiveShots - 1);
    for(let i=0;i<cnt;i++){
      const angle=Math.atan2(dy,dx)+(i-(cnt-1)/2)*0.14;
      bt.bullets.push({x:p.x,y:p.y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,pierce,
        explosive: _foxExplode || undefined});
    }
    // 발사 SFX
    if (s.piercing || s._synGunslinger) Audio.sfx.shootPiercing();
    else Audio.sfx.shoot();
    // 소멸광선
    if(s.deathBeam&&Math.random()<0.3){
      const angle=Math.atan2(dy,dx);
      const beamCount = synDeathRay ? 3 : 1;
      for(let b=0;b<beamCount;b++){
        const bAngle = angle + (b-(beamCount-1)/2)*0.25;
        bt.bullets.push({x:p.x,y:p.y,vx:Math.cos(bAngle)*(spd+4),vy:Math.sin(bAngle)*(spd+4),beam:true,pierce:true});
      }
      Audio.sfx.shootBeam();
    }
  }

  // 블랙홀
  if(s.blackhole) {
    bt.blackholeAngle=(bt.blackholeAngle||0)+0.02;
    const bhPull = s._synGravity ? 2.4 : 0.8;
    const bhRange = s._synGravity ? 360 : 200;
    const bhMaxPull = 350; // 최대 흡인 범위 상한 (화면 밖 적 예외 방지)
    bt.enemies.forEach(e=>{
      const dx=p.x-e.x,dy=p.y-e.y;
      const dist=Math.hypot(dx,dy);
      if(dist<bhRange&&dist>1&&dist<bhMaxPull){e.x+=dx/dist*bhPull;e.y+=dy/dist*bhPull;}
    });
  }

  // 빙결
  if(s.freeze>0){
    bt.freezeTimer--;
    if(bt.freezeTimer<=0){
      bt.freezeTimer=Math.max(80,200-s.freeze*30);
      const r=80+s.freeze*30;
      bt.enemies.forEach(e=>{
        if(Math.hypot(e.x-p.x,e.y-p.y)<r){e.frozen=90+s.freeze*20+(gs._freezeDurBonus||0);spawnP(e.x,e.y,'#8df',5,2);}
      });
    }
  }

  // 재생 — 파티클 + 사운드 피드백
  if(s.regen>0){
    bt.regenTimer--;
    if(bt.regenTimer<=0){
      bt.regenTimer=60;
      const before=p.hp;
      // [곰 패시브] 강인한 의지: 보호막이 없을 때 재생량 2배
      const _bearBonus = (gs.selectedChar?.id === 'bear' && (gs.shieldCount||0) === 0) ? 2 : 1;
      p.hp=Math.min(p.maxHp,p.hp+s.regen*_bearBonus);
      if(p.hp>before){
        spawnDN(p.x,p.y-p.size-10,'+'+(s.regen*_bearBonus)+'♥','#4ecf7a');
        spawnP(p.x,p.y,'#4ecf7a',4,2);
        if(Math.random()<0.4) Audio.sfx.regenTick(); // 40% 확률로 소리 (너무 반복 방지)
      }
    }
  }

  // ── 3. 적 이동 / AI ── [M16]
  for(let i=bt.enemies.length-1;i>=0;i--){
    const e=bt.enemies[i];
    if(e.hitFlash>0)e.hitFlash--;
    if(e.frozen>0){e.frozen--;e.walkTime=(e.walkTime||0);continue;}
    const dx=p.x-e.x,dy=p.y-e.y,dist=Math.hypot(dx,dy);
    e.facingRight = dx > 0;
    e.x+=(dx/dist)*e.speed; e.y+=(dy/dist)*e.speed;
    e.walkTime = (e.walkTime||0) + 1;
    if(e.isBoss){
      // 페이즈 전환 무적 타이머 감소
      if((e._phaseInvincible||0) > 0) e._phaseInvincible--;

      // ── 페이즈 전환 감지 ──
      if(!e.phase) e.phase = 1;
      const has4Phase = e._boss4Phase;
      const isPhase2 = e.hp <= e.maxHp * (has4Phase ? 0.65 : 0.5);
      const isPhase3 = e.hp <= e.maxHp * (has4Phase ? 0.35 : 0.25);
      const isPhase4 = has4Phase && e.hp <= e.maxHp * 0.15;
      if(isPhase2 && e.phase === 1){
        e.phase = 2;
        e._phaseInvincible = 100;
        e.speed = 0;
        setTimeout(()=>{ if(bt&&bt.enemies.includes(e)) e.speed = 0.75*(e._spdM||1); }, 1800);
        bt.screenShake = 18;
        e.color = '#e07040';
        e.bossBulletTimer = 0;
        Audio.sfx.phaseTransition();
        showBossPhaseTransition(2, '#f07030', '💢 PHASE 2', '보스가 격노합니다!');
        for(let k=0;k<28;k++){ const a=k/28*Math.PI*2; spawnP(e.x+Math.cos(a)*70,e.y+Math.sin(a)*70,'#f07030',8,5); }
        bt.explosions.push({x:e.x,y:e.y,maxRadius:180,radius:0,timer:22,color:'#f07030'});
      }
      else if(isPhase3 && e.phase === 2){
        e.phase = 3;
        e._phaseInvincible = 120;
        e.speed = 0;
        setTimeout(()=>{ if(bt&&bt.enemies.includes(e)) e.speed = 0.9*(e._spdM||1); }, 2100);
        bt.screenShake = 26;
        e.color = '#e03030';
        Audio.sfx.phaseTransition();
        showBossPhaseTransition(3, '#e03030', '🔥 FINAL PHASE', has4Phase ? '절망이 가까워진다!' : '최후의 발악!');
        for(let k=0;k<36;k++){ const a=k/36*Math.PI*2; spawnP(e.x+Math.cos(a)*90,e.y+Math.sin(a)*90,'#e03030',10,6); }
        bt.explosions.push({x:e.x,y:e.y,maxRadius:220,radius:0,timer:26,color:'#e03030'});
      }
      else if(isPhase4 && e.phase === 3){
        // 4페이즈: ACT3 / 초월25+ 전용 절망 페이즈
        e.phase = 4;
        e._phaseInvincible = 150;
        e.speed = 0;
        setTimeout(()=>{ if(bt&&bt.enemies.includes(e)) e.speed = 1.1*(e._spdM||1); }, 2400);
        bt.screenShake = 35;
        e.color = '#8800ff';
        Audio.sfx.phaseTransition();
        showBossPhaseTransition(4, '#aa00ff', '☠️ DESPAIR', '절망의 영역!');
        for(let k=0;k<48;k++){ const a=k/48*Math.PI*2; spawnP(e.x+Math.cos(a)*100,e.y+Math.sin(a)*100,'#aa00ff',12,7); }
        bt.explosions.push({x:e.x,y:e.y,maxRadius:300,radius:0,timer:32,color:'#aa00ff'});
        for(let k=0;k<16;k++){
          const a=(k/16)*Math.PI*2;
          bt.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,size:9,color:'#cc44ff',life:200});
        }
      }

      // ── 돌진 ──
      e.chargeTimer--;
      const chargeInterval = e.phase>=4 ? 90 : e.phase>=2 ? 140 : 220;
      if(e.chargeTimer<=0){
        const chargeSpd = e.phase>=4 ? 11 : e.phase>=3 ? 9 : e.phase>=2 ? 7.5 : 6;
        e.speed = chargeSpd;
        e.color = '#ff4400';
        const restoreCol = e.phase>=4?'#8800ff':e.phase>=3?'#e03030':e.phase>=2?'#e07040':'#c9a84c';
        setTimeout(()=>{ if(bt.enemies.includes(e)){ e.speed = e.phase>=4?1.1:e.phase>=3?0.9:e.phase>=2?0.85:0.7; e.color=restoreCol; }}, 420);
        e.chargeTimer = chargeInterval + Math.random()*100;
        bt.screenShake = e.phase>=2 ? 8 : 5;
      }

      // ── 소환 ──
      e.summonTimer--;
      const summonInterval = e.phase>=4 ? 150 : e.phase>=3 ? 180 : e.phase>=2 ? 260 : 380; // [H3] phase4 간격 120→150으로 완화
      if(e.summonTimer<=0){
        const cnt = e.phase>=4 ? 4 : e.phase>=3 ? 5 : e.phase>=2 ? 4 : 3; // [H3] phase4 소환 수 6→4로 감소
        for(let k=0;k<cnt;k++){
          const a=(k/cnt)*Math.PI*2;
          const col = e.phase>=4 ? '#cc44ff' : e.phase>=3 ? '#ff3030' : e.phase>=2 ? '#f86040' : '#f88';
          const spd = e.phase>=4 ? 3.2 : e.phase>=2 ? 2.6 : 2;
          bt.enemies.push({x:e.x+Math.cos(a)*60,y:e.y+Math.sin(a)*60,size:9,speed:spd,hp:1,maxHp:1,color:col,type:'normal',hitFlash:0});
        }
        e.summonTimer = summonInterval + Math.random()*100;
        spawnP(e.x, e.y, e.phase>=4?'#aa00ff':'#f08040', 8, 3);
      }

      // ── 페이즈 2+: 산탄 발사 ──
      if(e.phase >= 2){
        if(!e.bossBulletTimer) e.bossBulletTimer = 0;
        e.bossBulletTimer--;
        const shootInterval = e.phase>=3 ? 90 : 140;
        if(e.bossBulletTimer <= 0){
          e.bossBulletTimer = shootInterval + Math.random()*40;
          const baseAngle = Math.atan2(p.y-e.y, p.x-e.x);
          const bulletCount = e.phase>=3 ? 7 : 5;
          const spread = e.phase>=3 ? 0.52 : 0.38;
          for(let k=0;k<bulletCount;k++){
            const a = baseAngle + (k - (bulletCount-1)/2) * spread;
            const spd = 3.2 + (e.phase>=3?0.8:0);
            bt.enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, size:7, color:'#ff6030', life:160});
          }
          spawnP(e.x, e.y, '#ff6030', 5, 2);
        }
      }

      // ── ACT별 보스 고유 패턴 ──
      const bossAct = gs.act || 1;

      // ACT 1: 돌진 특화 — 추가 연속 돌진 (3페이즈에서 2연돌진)
      if(bossAct === 1 && e.phase >= 3){
        if(!e.act1ComboTimer) e.act1ComboTimer = 0;
        e.act1ComboTimer--;
        if(e.act1ComboTimer <= 0){
          e.act1ComboTimer = 260 + Math.random()*80;
          // 연속 2번 돌진 예약
          const restoreSpd = 0.85;
          const restoreCol = e.phase>=3?'#e03030':'#c9a84c';
          setTimeout(()=>{
            if(!bt.enemies.includes(e)) return;
            e.speed=10; e.color='#ff2200';
            setTimeout(()=>{
              if(!bt.enemies.includes(e)) return;
              e.speed=restoreSpd; e.color='#ff8800';
              spawnP(e.x,e.y,'#ff4400',10,4);
              setTimeout(()=>{
                if(!bt.enemies.includes(e)) return;
                e.speed=10; e.color='#ff2200';
                setTimeout(()=>{ if(bt.enemies.includes(e)){e.speed=restoreSpd;e.color=restoreCol;} },300);
              },350);
            },300);
          },100);
        }
      }

      // ACT 2: 얼음장판 — 링 형태 얼음 투사체 (페이즈 1부터)
      if(bossAct === 2){
        if(!e.iceRingTimer) e.iceRingTimer = 200;
        e.iceRingTimer--;
        const iceInterval = e.phase>=3 ? 120 : e.phase>=2 ? 160 : 220;
        if(e.iceRingTimer <= 0){
          e.iceRingTimer = iceInterval + Math.random()*60;
          const cnt = e.phase>=3 ? 12 : e.phase>=2 ? 8 : 6;
          for(let k=0;k<cnt;k++){
            const a = (k/cnt)*Math.PI*2;
            const spd = 2.0 + (e.phase-1)*0.4;
            bt.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,size:8,color:'#80d8ff',life:220,isIce:true});
          }
          spawnP(e.x,e.y,'#80d8ff',8,3);
        }
      }

      // ACT 3: 전방위 화염 — 나선형 스파이럴 발사 (페이즈 1부터)
      if(bossAct === 3){
        if(!e.spiralTimer) e.spiralTimer = 0;
        if(!e.spiralAngle) e.spiralAngle = 0;
        e.spiralTimer--;
        const spiralInterval = e.phase>=4 ? 8 : e.phase>=3 ? 12 : e.phase>=2 ? 18 : 25;
        if(e.spiralTimer <= 0){
          e.spiralTimer = spiralInterval;
          const arms = e.phase>=4 ? 6 : e.phase>=3 ? 4 : e.phase>=2 ? 3 : 2;
          const spd = 3.0 + (e.phase-1)*0.6;
          for(let k=0;k<arms;k++){
            const a = e.spiralAngle + (k/arms)*Math.PI*2;
            bt.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,size:6,color:e.phase>=4?'#cc44ff':'#ff9040',life:180});
          }
          e.spiralAngle += 0.18;
          if(e.phase>=3) e.spiralAngle += 0.08;
          if(e.phase>=4) e.spiralAngle += 0.06; // 4페이즈: 더욱 빠른 회전
        }
      }

      // ── ACT 1 보스 고유 패턴: 포효 충격파 ──
      // Phase 2+: 주기적으로 원형 충격파 발사 (황금빛 16방향 산탄)
      if(bossAct===1 && e.phase>=2){
        if(!e.roarTimer) e.roarTimer = 300+Math.random()*120;
        e.roarTimer--;
        if(e.roarTimer<=0){
          e.roarTimer = 280+Math.random()*160;
          const bCnt = e.phase>=3 ? 20 : 16;
          bt.screenShake = Math.max(bt.screenShake,14);
          for(let k=0;k<bCnt;k++){
            const a=(k/bCnt)*Math.PI*2;
            const spd=3.2+(e.phase>=3?0.8:0);
            bt.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,size:7,color:'#c9a84c',life:200});
          }
          bt.explosions.push({x:e.x,y:e.y,maxRadius:160,radius:0,timer:20,color:'#c9a84c'});
          spawnP(e.x,e.y,'#ffd060',20,6);
          spawnDN(e.x,e.y-70,'🦁 포효!','#ffd060',false);
          playSound(80,0.25,'sawtooth',0.12);
        }
      }

      // ── ACT 2 보스 고유 패턴: 얼음 숨결 ──
      // Phase 2+: 플레이어 방향 부채꼴 얼음 투사체 연사 → 플레이어 슬로우
      if(bossAct===2 && e.phase>=2){
        if(!e.breathTimer) e.breathTimer = 320+Math.random()*80;
        e.breathTimer--;
        if(e.breathTimer<=0){
          e.breathTimer = 280+Math.random()*140;
          const baseA = Math.atan2(p.y-e.y,p.x-e.x);
          const bCnt = e.phase>=3 ? 9 : 7;
          const spread = e.phase>=3 ? 0.30 : 0.22;
          const spd = 3.6+(e.phase>=3?0.7:0);
          for(let k=0;k<bCnt;k++){
            const a=baseA+(k-(bCnt-1)/2)*spread;
            bt.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,size:8,color:'#a8e8ff',life:220,isIce:true});
          }
          spawnP(e.x,e.y,'#c0f4ff',14,5);
          bt.explosions.push({x:e.x,y:e.y,maxRadius:90,radius:0,timer:16,color:'#80d8ff'});
          spawnDN(e.x,e.y-70,'🐉 얼음 숨결!','#a8e8ff',false);
        }
      }

      // ── ACT 3 보스 고유 패턴: 메테오 ──
      // Phase 2+: 플레이어 근처에 경고 원 → 80프레임 후 폭발+용암 구역 생성
      if(bossAct===3 && e.phase>=2){
        if(!e.meteorTimer) e.meteorTimer = 360+Math.random()*100;
        e.meteorTimer--;
        if(e.meteorTimer<=0){
          e.meteorTimer = 320+Math.random()*180;
          const mx = p.x+(Math.random()-0.5)*180;
          const my = p.y+(Math.random()-0.5)*180;
          // 용암 경고 구역 (빠른 경고)
          if(!bt.lavaZones) bt.lavaZones=[];
          bt.lavaZones.push({x:mx,y:my,r:70,warn:75,active:0,maxActive:200,_isMeteor:true});
          spawnDN(e.x,e.y-70,'😈 메테오!','#ff4400',false);
          // 75프레임 후 대형 폭발
          const _bRef=bt, _pRef=gs.player;
          setTimeout(()=>{
            if(!_bRef||_bRef.won) return;
            _bRef.explosions.push({x:mx,y:my,maxRadius:110,radius:0,timer:24,color:'#ff3300'});
            _bRef.screenShake=Math.max(_bRef.screenShake||0,22);
            spawnP(mx,my,'#ff6600',22,7);
            playSound(70,0.3,'sawtooth',0.12);
            if(_pRef.invincible<=0 && Math.hypot(_pRef.x-mx,_pRef.y-my)<90){
              let mdmg=18;
              if(gs._curseDemonEye) mdmg=Math.ceil(mdmg*1.25);
              _pRef.hp=Math.max(0,_pRef.hp-mdmg); _pRef.invincible=45;
              _bRef._noDamageThisBattle=false;
              spawnDN(_pRef.x,_pRef.y-44,mdmg+'💥','#ff4400',true);
              spawnP(_pRef.x,_pRef.y,'#ff4400',10,4);
              if(_pRef.hp<=0){ _pRef.hp=0; if(!relicsOnDeath()) battleLost(); }
            }
          }, Math.ceil(75*1000/60));
        }
      }
    }
    // ── 엘리트 보스 AI ──
    if(e.isEliteBoss){
      if(e.type==='elite_berserker'){
        if(!e.dashTimer)e.dashTimer=120;
        e.dashTimer--;
        if(e.dashTimer<=0){e.dashActive=18;e.dashTimer=100+Math.random()*80;bt.screenShake=3;spawnP(e.x,e.y,'#e05050',8,4);}
        if(e.dashActive>0){e.speed=4.5;e.dashActive--;}else e.speed=1.3*(0.8+(gs.act-1)*0.18);
      }
      if(e.type==='elite_necromancer'){
        if(!e.summonTimer)e.summonTimer=180;
        e.summonTimer--;
        if(e.summonTimer<=0){
          e.summonTimer=160+Math.random()*100;
          for(let k=0;k<2;k++){const a=Math.random()*Math.PI*2;bt.enemies.push({x:e.x+Math.cos(a)*80,y:e.y+Math.sin(a)*80,size:8,speed:1.8,hp:1,maxHp:1,color:'#c080f0',type:'normal',hitFlash:0});}
          spawnP(e.x,e.y,'#9060d0',10,3);
        }
        if(e.hasShield&&e.hp<=e.maxHp*0.5&&!e._shieldRestored){
          e.hasShield=false;e._shieldRestored=true;e.hp+=Math.ceil(e.maxHp*0.2);
          spawnP(e.x,e.y,'#c0a0ff',16,5); Audio.sfx.shield();
        }
      }
      if(e.type==='elite_colossus'){
        if(!e.shockTimer)e.shockTimer=200;
        e.shockTimer--;
        if(e.shockTimer<=0){
          e.shockTimer=180+Math.random()*120;
          bt.explosions.push({x:e.x,y:e.y,maxRadius:120,radius:0,timer:20});
          bt.screenShake=7;
          if(Math.hypot(p.x-e.x,p.y-e.y)<120&&p.invincible<=0){
            p.hp-=8;p.invincible=40;spawnP(p.x,p.y,'#f44',6,3);
            if(p.hp<=0){p.hp=0; if(!relicsOnDeath()){battleLost();return;}}
          }
          playSound(80,0.4,'sawtooth',0.1);spawnP(e.x,e.y,'#40a060',14,6);
        }
      }
    } // end isEliteBoss

    // ── 일반 적 공격 다양성 (Wave 3+ / ACT 2+) ──
    if(!e.isBoss && !e.isEliteBoss && !e.isSplit){
      const actWaveThreshold = gs.act >= 2 || bt.wave >= 3;
      if(actWaveThreshold){
        // 탱크: 느린 단발 투사체 (ACT2에서 더 자주, 더 빠름)
        if(e.type==='tank'){
          const tankInterval = gs.act>=3 ? 90+Math.floor(Math.random()*50) : gs.act>=2 ? 115+Math.floor(Math.random()*60) : 140+Math.floor(Math.random()*80); // [M8] ACT별 점진적 조정
          if(!e.shootTimer) e.shootTimer = tankInterval;
          e.shootTimer--;
          if(e.shootTimer <= 0 && dist < 400){
            e.shootTimer = tankInterval;
            const a = Math.atan2(p.y-e.y, p.x-e.x);
            const spd = 2.5 + (gs.act-1)*0.6;  // ACT2: 3.1, ACT3: 3.7
            const dmg = gs.act>=2 ? 12 : 8;
            bt.enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, size:9+(gs.act-1)*2, color:'#80e060', life:200, dmg});
            spawnP(e.x, e.y, '#80e060', 3, 2);
          }
        }
        // 패스트: ACT2에서 3발 저격 (더 빠른 주기)
        if(e.type==='fast' && (gs.act >= 2 || bt.wave >= 4)){
          const fastInterval = gs.act>=2 ? 60+Math.floor(Math.random()*40) : 90+Math.floor(Math.random()*60);
          if(!e.shootTimer) e.shootTimer = fastInterval;
          e.shootTimer--;
          if(e.shootTimer <= 0 && dist < 350){
            e.shootTimer = fastInterval;
            const a = Math.atan2(p.y-e.y, p.x-e.x);
            const spd = 4.0 + (gs.act-1)*0.6;
            // ACT2: 3발 부채꼴 (더 위협적)
            const bulletCount = gs.act>=2 ? 3 : 2;
            const spread = gs.act>=2 ? 0.18 : 0.12;
            for(let _bi=0;_bi<bulletCount;_bi++){
              const off = (_bi - (bulletCount-1)/2) * spread;
              bt.enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a+off)*spd, vy:Math.sin(a+off)*spd, size:5, color:'#f0d060', life:160});
            }
          }
        }
        // 노멀: ACT2에서도 가끔 투사체 (ACT3보다 적게)
        if(e.type==='normal' && gs.act >= 2){
          const normalInterval = gs.act>=3 ? 180+Math.floor(Math.random()*80) : 260+Math.floor(Math.random()*120);
          if(!e.shootTimer) e.shootTimer = normalInterval;
          e.shootTimer--;
          if(e.shootTimer <= 0 && dist < 300){
            e.shootTimer = normalInterval;
            const a = Math.atan2(p.y-e.y, p.x-e.x);
            const spd = 2.6 + (gs.act-1)*0.4;
            bt.enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, size:6, color:'#f08080', life:160});
          }
        }
      }
    }
  } // end enemy movement for loop

  // ── 카메라에서 너무 멀어진 일반 적 제거 (보스/엘리트 제외) ──
  {
    const cx=bt.cam.x+400, cy=bt.cam.y+400;
    for(let i=bt.enemies.length-1;i>=0;i--){
      const e=bt.enemies[i];
      if(!e.isBoss&&!e.isEliteBoss&&Math.hypot(e.x-cx,e.y-cy)>1400){bt.enemies.splice(i,1);}
    }
  }

  // ── 2. 총알 업데이트 ── [M16]
  for(let i=bt.bullets.length-1;i>=0;i--){
    const b=bt.bullets[i];
    if(!b.trail) b.trail=[];
    b.trail.unshift({x:b.x,y:b.y});
    const _trailMax = b.pierce ? 12 : 6;
    if(b.trail.length>_trailMax) b.trail.pop();
    b.x+=b.vx; b.y+=b.vy;
    // 카메라 기준 화면 밖으로 나가면 제거
    {const _cx=bt.cam.x,_cy=bt.cam.y;if(b.x<_cx-60||b.x>_cx+860||b.y<_cy-60||b.y>_cy+860){bt.bullets.splice(i,1);continue;}}
    for(let j=bt.enemies.length-1;j>=0;j--){
      if(!bt.bullets[i])break;
      const d=Math.hypot(b.x-bt.enemies[j].x,b.y-bt.enemies[j].y);
      if(d<bt.enemies[j].size+(b.beam?8:5)){
        if(s.aoe>0){
          const ar=20+s.aoe*15;
          bt.explosions.push({x:b.x,y:b.y,maxRadius:ar,radius:0,timer:15});
          bt.enemies.forEach(e=>{if(Math.hypot(b.x-e.x,b.y-e.y)<ar)damageEnemy(e,1+s.aoe*0.5);});
          Audio.sfx.explosion();
        }
        const baseDmg = (b.beam?4:2) * relicsBulletMult();
        // 치명타 (critical1 카드)
        const critChance = Math.min(0.65, (s.critical||0)*0.20);
        let isCritCard = critChance > 0 && Math.random() < critChance;
        // [고양이 패시브] 집중 사격: 같은 적 4발 연속 명중 → 5번째 강제 크리 ×4
        const _isCat = gs.selectedChar?.id === 'cat';
        let _catMegaCrit = false;
        if(_isCat && bt.enemies[j]){
          const _ej = bt.enemies[j];
          if(!_ej._uid){ bt._uidCounter = (bt._uidCounter||0)+1; _ej._uid = bt._uidCounter; }
          if(_ej._uid === bt._catFocusUid){ bt._catFocusHits = (bt._catFocusHits||0)+1; }
          else { bt._catFocusUid = _ej._uid; bt._catFocusHits = 1; }
          if(bt._catFocusHits > 0 && bt._catFocusHits % 5 === 0) _catMegaCrit = true;
        }
        // 그림자 망토 보너스
        let finalDmg = (gs._relicShadowReady) ? baseDmg*3 : baseDmg;
        if(isCritCard) finalDmg *= (gs._critDmgUpgraded || gs._curseDemonEye) ? 4 : 3;
        // [고양이 패시브] 집중 사격 크리 ×4 (카드 크리와 중복 적용 안함)
        if(_catMegaCrit && !isCritCard){ finalDmg *= 4; }
        // [펭귄 패시브] 원검 일체: 스택당 탄환 데미지 +25%
        if(gs.selectedChar?.id==='penguin' && (bt._penguinBladeStack||0) > 0){
          finalDmg = Math.ceil(finalDmg * (1 + 0.25 * bt._penguinBladeStack));
        }
        // [토끼 패시브] 도약 반격: 대시 직후 30프레임 탄환 데미지 ×2.5
        if(gs.selectedChar?.id==='rabbit' && (bt._rabbitStrikeWindow||0) > 0){
          finalDmg = Math.ceil(finalDmg * 2.5);
        }
        if(gs._relicShadowReady) gs._relicShadowReady=false;
        if(isCritCard){ spawnDN(bt.enemies[j].x,bt.enemies[j].y-bt.enemies[j].size,'CRIT!','#ffcc20',true,'crit'); Audio.sfx.criticalHit(); }
        if(_catMegaCrit && !isCritCard){ spawnDN(bt.enemies[j].x,bt.enemies[j].y-bt.enemies[j].size-14,'🎯 집중!','#ff44ff',true,'crit'); Audio.sfx.criticalHit(); }
        damageEnemy(bt.enemies[j], finalDmg);
        // [여우 패시브] 폭발 직감: 폭발탄 명중 시 소형 폭발 (AOE 독립)
        if(b.explosive && bt.enemies[j]){
          const _foxR = 55 + (s.aoe||0)*10;
          bt.explosions.push({x:b.x,y:b.y,maxRadius:_foxR,radius:0,timer:14,color:'#ff7820'});
          bt.enemies.forEach(_fe=>{ if(_fe!==bt.enemies[j]&&Math.hypot(b.x-_fe.x,b.y-_fe.y)<_foxR) damageEnemy(_fe, 1+(s.aoe||0)*0.5); });
          spawnP(b.x,b.y,'#ff8840',8,3);
          Audio.sfx.explosion();
        }
        // 흡혈석
        if(hasRelic('r_leech_stone')){ gs.player.hp=Math.min(gs.player.maxHp,gs.player.hp+finalDmg*0.01); }
        // 빙결 룬
        if(hasRelic('r_frost_rune')&&Math.random()<0.2&&bt.enemies[j]){ bt.enemies[j].frozen=Math.max(bt.enemies[j].frozen||0,90); }
        // 독탄 (poisonShot 카드)
        if(s.poisonShot && bt.enemies[j]){ bt.enemies[j].poison=Math.max(bt.enemies[j].poison||0, 180); }
        // 충격파 (shockwave 카드) — 적 밀어내기
        if((s.shockwave||0)>0 && bt.enemies[j]){
          const pushA=Math.atan2(bt.enemies[j].y-p.y,bt.enemies[j].x-p.x);
          const _pushDist = Math.min(20, 8 + s.shockwave * 4);
          bt.enemies[j].x+=Math.cos(pushA)*_pushDist;
          bt.enemies[j].y+=Math.sin(pushA)*_pushDist;
        }
        // 치명타+번개 시너지
        if(isCritCard && s._synCritThunder && bt.enemies[j]){
          const near=bt.enemies.filter(e=>e!==bt.enemies[j]).sort((a,b2)=>Math.hypot(a.x-bt.enemies[j].x,a.y-bt.enemies[j].y)-Math.hypot(b2.x-bt.enemies[j].x,b2.y-bt.enemies[j].y)).slice(0,3);
          near.forEach(t=>{ bt.lightningbolts.push({x1:bt.enemies[j].x,y1:bt.enemies[j].y,x2:t.x,y2:t.y,timer:8}); damageEnemy(t,3); });
          if(near.length) Audio.sfx.lightning();
        }
        if(!s.piercing&&!b.beam){bt.bullets.splice(i,1);break;}// [H2] 관통탄은 내부 루프 계속 진행하여 다음 적도 타격
      }
    }
  }

  // ── 적 총알 (보스 Phase 2+) ──
  for(let i=(bt.enemyBullets||[]).length-1;i>=0;i--){
    const eb=bt.enemyBullets[i];
    eb.x+=eb.vx; eb.y+=eb.vy; eb.life--;
    {const _cx=bt.cam.x,_cy=bt.cam.y;if(eb.life<=0||eb.x<_cx-60||eb.x>_cx+860||eb.y<_cy-60||eb.y>_cy+860){bt.enemyBullets.splice(i,1);continue;}}
    // 퍼펙트 닷지: 총알이 스쳐지나가면 소량 회복 (무적 중 아닐 때만)
    if(p.invincible<=0){
      const _pd=Math.hypot(eb.x-p.x,eb.y-p.y);
      const _hitR=p.size+eb.size*0.7;
      if(_pd>_hitR && _pd<_hitR+28 && !eb._dodgeChecked){
        eb._dodgeChecked=true;
        const _heal=Math.min(3,p.maxHp-p.hp);
        if(_heal>0){p.hp+=_heal;spawnDN(p.x,p.y-30,`+${_heal}💚`,'#4ecf7a');}
        bt._perfectDodgeCombo=(bt._perfectDodgeCombo||0)+1;
        if(bt._perfectDodgeCombo>=3){
          p._speedMult=(p._speedMult||1)*1.08;
          setTimeout(()=>{p._speedMult=Math.max(1,(p._speedMult||1)/1.08);},2500);
          spawnDN(p.x,p.y-50,'🔥 퍼펙트!','#ffdd44',true);
          bt._perfectDodgeCombo=0;
        }
      }
    }
    if(p.invincible<=0){
      const d=Math.hypot(eb.x-p.x,eb.y-p.y);
      if(d<p.size+eb.size*0.7){
        bt.enemyBullets.splice(i,1);
        // 무적 유물 처리
        let blocked=false;
        if(gs.shieldCount>0){
          gs.shieldCount--; gs.skills.shield=Math.max(0,gs.skills.shield-1); blocked=true;
          spawnP(p.x,p.y,'#4af',12,4); spawnDN(p.x,p.y-30,'🛡️','#4af'); // 보호막 파괴 파티클
          bt.screenShake = Math.max(bt.screenShake, 6);
          if(gs._shieldHealBonus) { const _sh=healPlayer(gs._shieldHealBonus); spawnDN(p.x,p.y-50,`+${_sh}❤️`,'#4ef'); }
          Audio.sfx.shield();
          playSound(200, 0.15, 'sawtooth', 0.06); // 보호막 파괴음
          // 빙결 폭발 유물: 보호막 파괴 시 주변 빙결
          if(gs._relicFrostNova){
            bt.enemies.forEach(e=>{ e.frozen=Math.max(e.frozen||0,120); });
            bt.explosions.push({x:p.x,y:p.y,maxRadius:150,radius:0,timer:20,color:'#80d8ff'});
            spawnDN(p.x,p.y-30,'❄️빙결 폭발!','#7dd8ff',true);
            Audio.sfx.freeze();
          }
          // [곰 패시브] 철옹 반격: 보호막 파괴 시 주변 160px 폭발 + 60프레임 스턴
          if(gs.selectedChar?.id==='bear'){
            const _bearR=160;
            bt.explosions.push({x:p.x,y:p.y,maxRadius:_bearR,radius:0,timer:18,color:'#f08030'});
            bt.enemies.forEach(be=>{ if(Math.hypot(be.x-p.x,be.y-p.y)<_bearR){ damageEnemy(be,8); be.frozen=Math.max(be.frozen||0,60); } });
            spawnDN(p.x,p.y-54,'🐻 반격!','#f08030',true);
            spawnP(p.x,p.y,'#f08030',14,5);
            Audio.sfx.explosion();
          }
        }
        if(!blocked){
          bt._perfectDodgeCombo=0; // 피격 시 콤보 리셋
          // ACT별 적 총알 데미지 상향 + 초월 배율
          const baseDmg = eb.dmg || (eb.isIce ? 5 : 8);
          const _ascDmgMult = (gs.ascMult && gs.ascMult.dmg) || 1;
          let dmg = Math.ceil((baseDmg + (gs.act-1)*4) * _ascDmgMult); // ACT2: +4, ACT3: +8
          // [곰 패시브] 철옹 반격: HP 50% 이하에서 받는 피해 -25%
          if(gs.selectedChar?.id==='bear' && p.hp <= p.maxHp*0.5) dmg = Math.ceil(dmg*0.75);
          // [저주] 악마의 눈: 받는 피해 +25%
          if(gs._curseDemonEye) dmg = Math.ceil(dmg * 1.25);
          p.hp-=dmg; p.invincible=50; bt.screenShake=Math.max(bt.screenShake,4);
          spawnP(p.x,p.y,eb.isIce?'#80d8ff':'#f44',6,3); Audio.sfx.playerHurt();
          if(eb.isIce){ bt.playerSlowTimer=(bt.playerSlowTimer||0)+180; spawnDN(p.x,p.y-30,'❄️SLOW','#80d8ff'); }
          // 가시 갑옷 유물: 데미지 30% 반사
          if(gs._relicThorns){
            const reflect = Math.ceil(dmg*0.30);
            const near = bt.enemies.filter(e=>Math.hypot(e.x-p.x,e.y-p.y)<120);
            near.forEach(e=>{ damageEnemy(e,reflect); });
            if(near.length) spawnDN(p.x,p.y-40,'🌵반사!','#4ecf7a');
          }
          bt._miniChallengeHitThisWave = true; // 미니도전: 피격 기록
          if(p.hp<=0){ battleLost(); return; }
        }
      }
    }
  }

  // 회전 검
  if(s.sword>0){
    bt.swordAngle+=0.055;
    let swordHit=false;
    for(let sv=0;sv<s.sword;sv++){
      const angle=bt.swordAngle+(sv/s.sword)*Math.PI*2;
      const sx=p.x+Math.cos(angle)*55,sy=p.y+Math.sin(angle)*55;
      bt.enemies.forEach(e=>{ if(Math.hypot(sx-e.x,sy-e.y)<e.size+13){ damageEnemy(e,Math.max(1,s.sword)); swordHit=true;
        // [펭귄 패시브] 원검 일체: 검 명중 시 스택 +1 (최대4), 3초 유지
        if(gs.selectedChar?.id==='penguin'){ bt._penguinBladeStack=Math.min(4,(bt._penguinBladeStack||0)+1); bt._penguinBladeTimer=180; }
      }}); // [M5] 검 레벨에 따라 데미지 증가
    }
    if(swordHit && Math.random()<0.15) Audio.sfx.sword();
  }

  // 번개
  if(s.lightning>0){
    bt.lightningTimer--;
    if(bt.lightningTimer<=0){
      bt.lightningTimer=Math.max(8,55-s.lightning*8);
      const targets=[...bt.enemies].sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y)).slice(0,s.lightning+1);
      targets.forEach(t=>{
        bt.lightningbolts.push({x1:p.x,y1:p.y,x2:t.x,y2:t.y,timer:8});
        const lDmg = (s._synFrostStorm && (t.frozen || 0) > 30) ? (2+s.lightning*0.5)*3 : (2+s.lightning*0.5);
        damageEnemy(t, lDmg);
      });
      Audio.sfx.lightning();
    }
  }

  // ── 4. 충돌 감지 (플레이어-적 접촉) ── [M16]
  for(let i=bt.enemies.length-1;i>=0;i--){
    const d=Math.hypot(bt.enemies[i].x-p.x,bt.enemies[i].y-p.y);
    if(d<p.size+bt.enemies[i].size-4){
      if(p.invincible>0)continue;
      if(gs.shieldCount>0){
        gs.shieldCount--;gs.skills.shield=Math.max(0,gs.skills.shield-1);p.invincible=60;
        spawnP(p.x,p.y,'#4af',12,4); Audio.sfx.shield(); // 보호막 파괴 파티클
        bt.screenShake = Math.max(bt.screenShake, 6);
        if(gs._shieldHealBonus) { const _sh2=healPlayer(gs._shieldHealBonus); spawnDN(p.x,p.y-50,`+${_sh2}❤️`,'#4ef'); }
        playSound(200, 0.15, 'sawtooth', 0.06); // 보호막 파괴음
        // [곰 패시브] 철옹 반격: 보호막 파괴 시 주변 160px 폭발 + 60프레임 스턴
        if(gs.selectedChar?.id==='bear'){
          const _bearR=160;
          bt.explosions.push({x:p.x,y:p.y,maxRadius:_bearR,radius:0,timer:18,color:'#f08030'});
          bt.enemies.forEach(be=>{ if(Math.hypot(be.x-p.x,be.y-p.y)<_bearR){ damageEnemy(be,8); be.frozen=Math.max(be.frozen||0,60); } });
          spawnDN(p.x,p.y-54,'🐻 반격!','#f08030',true);
          spawnP(p.x,p.y,'#f08030',14,5);
          Audio.sfx.explosion();
        }
        bt.enemies.splice(i,1);continue;
      }
      const hitEnemy = bt.enemies[i];
      let dmg = hitEnemy.isBoss?15:hitEnemy.type==='elite'?12:hitEnemy.type==='tank'?11:hitEnemy.type==='fast'?7:9;
      // ACT별 접촉 데미지 상향 (ACT2: +4, ACT3: +8) + 초월 배율
      dmg += (gs.act-1)*4;
      const _ascDmg2 = (gs.ascMult && gs.ascMult.dmg) || 1;
      dmg = Math.ceil(dmg * _ascDmg2);
      // ACT 3 (불): 화상 +2 추가 데미지
      if(hitEnemy.actTint==='fire') dmg+=2;
      // [곰 패시브] 철옹 반격: HP 50% 이하에서 받는 피해 -25%
      if(gs.selectedChar?.id==='bear' && p.hp <= p.maxHp*0.5) dmg = Math.ceil(dmg*0.75);
      // [저주] 악마의 눈: 받는 피해 +25%
      if(gs._curseDemonEye) dmg = Math.ceil(dmg * 1.25);
      p.hp-=dmg; p.invincible=38+(hasRelic('r_iron_heart')?20:0); bt.screenShake=Math.max(bt.screenShake,3);
      bt._noDamageThisBattle = false; // 무결점 메달 해제
      gs._totalDmgTaken = (gs._totalDmgTaken||0) + dmg;
      bt._miniChallengeHitThisWave = true; // 미니도전: 피격 기록
      // ACT 2 (빙결): 피격 시 1.5초 이동 속도 30% 감속
      if(hitEnemy.actTint==='ice'&&!p._iceSlowed){
        p._iceSlowed=true; p._iceSavedSpeed=p.speed; p.speed*=0.7;
        spawnP(p.x,p.y,'#a8d8f0',10,3);
        setTimeout(()=>{ if(p._iceSlowed){p.speed=p._iceSavedSpeed;p._iceSlowed=false;} },1500);
      }
      // 거울 영혼: 데미지 반사 (25%, 최대 8)
      if(hasRelic('r_mirror_soul')){
        const reflectedDmg = Math.min(8, dmg*0.25);
        bt.enemies.forEach(ne=>{ if(Math.hypot(ne.x-p.x,ne.y-p.y)<120) damageEnemy(ne,reflectedDmg); });
      }
      spawnP(p.x,p.y,hitEnemy.actTint==='fire'?'#f84':hitEnemy.actTint==='ice'?'#8cf':'#f44',8,3);
      spawnDN(p.x,p.y-25,dmg,hitEnemy.actTint==='fire'?'#f84':hitEnemy.actTint==='ice'?'#8cf':'#f44');
      Audio.sfx.playerHurt();
      vib(60);
      bt.enemies.splice(i,1);
      if(p.hp<=0){p.hp=0;vib([80,30,80]);battleLost();return;}
    }
  }
  if(p.invincible>0)p.invincible=Math.max(0,p.invincible-1); // [M3] 음수 방지

  // ── 5. 아이템 수집 ── [M16]
  const magnetR = s._synGravity ? 500 : Math.min(300, 80+(s.magnet||0)*50); // [H4] gravity_well 600→500, 일반 자석 상한 300 추가
  for(let i=bt.items.length-1;i>=0;i--){
    const it=bt.items[i],d=Math.hypot(it.x-p.x,it.y-p.y);
    if(d<magnetR&&d>1){
      // [Fix] 고정 속도 기반 당김 — 이동 중에도 아이템이 플레이어를 따라잡을 수 있도록
      const spd = Math.max(7, d * 0.22);
      it.x += (p.x-it.x)/d * spd;
      it.y += (p.y-it.y)/d * spd;
    }
    if(d<p.size+18){
      if(it.type==='hp'){p.hp=Math.min(p.maxHp,p.hp+16);spawnP(it.x,it.y,'#f44',5,2); Audio.sfx.hpPickup();}
      else if(it.type==='freeze'){bt.enemies.forEach(e=>{if(Math.hypot(e.x-p.x,e.y-p.y)<200){e.frozen=120;spawnP(e.x,e.y,'#8df',5,2);}});Audio.sfx.freeze();}
      else if(it.type==='gold'){
        const _goldAmt = Math.round(10 * (1 + (gs.act-1)*0.3) * (1 + (bt.wave-1)*0.1));
        gs.gold += _goldAmt; gs._totalGoldEarned = (gs._totalGoldEarned||0) + _goldAmt;
        trackMission('gold', _goldAmt);
        Audio.sfx.gold(); spawnDN(p.x,p.y-24,`+${_goldAmt}🪙`,'#c9a84c');
      }
      bt.items.splice(i,1);
    }
  }

  // ── 6. 정리 (파티클·데미지숫자·폭발 업데이트) ── [M16]
  // 파티클 — 상한 유지 (메모리·성능 보호, 사전 체크)
  if(bt.particles.length >= 100) bt.particles.splice(0, bt.particles.length - 80);
  for(let i=bt.particles.length-1;i>=0;i--){const p=bt.particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.92;p.vy*=0.92;p.life--;if(p.life<=0)bt.particles.splice(i,1);}

  // 배경 파티클 스폰 & 업데이트
  bt.bgTime++;
  spawnBgParticles();
  const _bgCap = gs.act >= 3 ? 20 : gs.act >= 2 ? 32 : 55;
  if(bt.bgParticles.length > _bgCap) bt.bgParticles.splice(0, bt.bgParticles.length - _bgCap);
  for(let i=bt.bgParticles.length-1;i>=0;i--){
    const bp=bt.bgParticles[i];
    bp.x+=bp.vx; bp.y+=bp.vy;
    bp.life--;
    bp.alpha=bp.life/bp.maxLife*(bp.baseAlpha||0.4);
    if(bp.life<=0)bt.bgParticles.splice(i,1);
  }
  // 데미지 숫자 상한 (화면이 숫자로 꽉 차는 현상 방지)
  if(bt.damageNums.length > 10) bt.damageNums.splice(0, bt.damageNums.length - 10);
  for(let i=bt.damageNums.length-1;i>=0;i--){const d=bt.damageNums[i];d.y+=d.vy;d.life--;if(d.life<=0)bt.damageNums.splice(i,1);}
  for(let i=bt.explosions.length-1;i>=0;i--){bt.explosions[i].timer--;if(bt.explosions[i].timer<=0)bt.explosions.splice(i,1);}
  for(let i=bt.lightningbolts.length-1;i>=0;i--){bt.lightningbolts[i].timer--;if(bt.lightningbolts[i].timer<=0)bt.lightningbolts.splice(i,1);}
  if(bt.screenShake>0)bt.screenShake=Math.max(0,bt.screenShake-0.7);

  // ── 7. ACT 전용 환경 메카닉 ──
  const _actP = gs.player;
  bt.actMechTimer = (bt.actMechTimer || 0) + 1;

  // ACT 2: 빙판 — 주기적으로 빙판 생성 (월드 좌표), 플레이어 이동 시 미끄러짐
  if(gs.act === 2){
    if(!bt.icePatches) bt.icePatches = [];
    // 일반전: 180프레임(3초), 보스전: 120프레임(2초)마다 생성
    const iceInterval = bt.isBoss ? 120 : 180;
    if(bt.actMechTimer % iceInterval === 0){
      const ix = _actP.x + (Math.random()-0.5)*460;
      const iy = _actP.y + (Math.random()-0.5)*460;
      bt.icePatches.push({x:ix, y:iy, r:50+Math.random()*35, life:540, maxLife:540});
    }
    // 빙판 위에 있으면 속도 감소 (이미 iceSlowed가 아닐 때만)
    if(!_actP._onIcePatch){
      const onPatch = bt.icePatches.some(ip=>Math.hypot(_actP.x-ip.x,_actP.y-ip.y)<ip.r*0.85);
      if(onPatch && !_actP._iceSlowed){
        _actP._onIcePatch = true;
        _actP._iceSlowed = true;
        _actP._iceSavedSpeed = _actP.speed;
        _actP.speed *= 0.55;
        spawnDN(_actP.x, _actP.y-30, '❄️빙판!', '#a8e8ff');
        spawnP(_actP.x, _actP.y, '#a8e8ff', 6, 2);
        bt.playerSlowTimer = (bt.playerSlowTimer||0) + 120;
      }
    } else {
      const stillOn = bt.icePatches.some(ip=>Math.hypot(_actP.x-ip.x,_actP.y-ip.y)<ip.r*0.85);
      if(!stillOn){
        _actP._onIcePatch = false;
        if(_actP._iceSlowed){ _actP.speed=_actP._iceSavedSpeed||_actP.speed; _actP._iceSlowed=false; }
      }
    }
    // 빙판 수명 감소
    for(let i=bt.icePatches.length-1;i>=0;i--){
      bt.icePatches[i].life--;
      if(bt.icePatches[i].life<=0) bt.icePatches.splice(i,1);
    }
  }

  // ACT 3: 용암 균열 — 경고 후 지속 데미지 구역 생성
  if(gs.act === 3){
    if(!bt.lavaZones) bt.lavaZones = [];
    // 일반전: 240프레임(4초), 보스전: 180프레임(3초)마다 경고 시작
    const lavaInterval = bt.isBoss ? 180 : 240;
    if(bt.actMechTimer % lavaInterval === 60){ // 타이밍 분산
      const lx = _actP.x + (Math.random()-0.5)*480;
      const ly = _actP.y + (Math.random()-0.5)*480;
      bt.lavaZones.push({x:lx, y:ly, r:50+Math.random()*25, warn:80, active:0, maxActive:300});
    }
    // 용암 구역 업데이트
    for(let i=bt.lavaZones.length-1;i>=0;i--){
      const lz = bt.lavaZones[i];
      if(lz.warn > 0){
        lz.warn--;
      } else if(lz.active < lz.maxActive){
        lz.active++;
        // 30프레임(0.5초)마다 범위 내 플레이어 데미지
        if(lz.active % 30 === 0 && _actP.invincible<=0 && Math.hypot(_actP.x-lz.x,_actP.y-lz.y)<lz.r){
          let ldmg = 7;
          if(gs._curseDemonEye) ldmg = Math.ceil(ldmg*1.25);
          _actP.hp = Math.max(0, _actP.hp - ldmg);
          _actP.invincible = 22;
          bt._noDamageThisBattle = false;
          gs._totalDmgTaken = (gs._totalDmgTaken||0) + ldmg;
          spawnDN(_actP.x, _actP.y-34, ldmg+'🔥', '#ff5500', false, 'fire');
          spawnP(_actP.x, _actP.y, '#ff4400', 5, 2);
          if(_actP.hp<=0){ _actP.hp=0; if(!relicsOnDeath()){battleLost();return;} }
        }
      } else {
        bt.lavaZones.splice(i,1);
      }
    }
  }
}

/** 적에게 데미지. 페이즈 전환 중 무적이면 무시. */
function damageEnemy(e,dmg){
  if((e._phaseInvincible||0) > 0) return; // 보스 페이즈 전환 중 무적
  if(e.frozen)dmg*=1.5;
  if(gs._relicKineticSurge && gs.player._isMoving) dmg = Math.ceil(dmg * 1.5); // 운동량 증폭기
  gs._totalDmgDealt = (gs._totalDmgDealt||0) + dmg;
  e.hp-=dmg; e.hitFlash=5;
  // 스파크 (보스/엘리트는 항상, 일반은 크리 or 2타마다)
  const isCrit = dmg >= 5 || (e.isBoss && dmg >= 3);
  e._hitCount = (e._hitCount||0) + 1;
  if(isCrit || e.isBoss || e.isEliteBoss || e._hitCount % 2 === 0){
    const hitAngle = Math.atan2(e.y-gs.player.y, e.x-gs.player.x);
    const sparkColor = e.frozen>0?'#a8e8ff': gs.act===3?'#ff8840': gs.act===2?'#88ccff':'#ffe080';
    const sparkCount = isCrit ? 5 : 3;
    for(let k=0;k<sparkCount;k++){
      const a=hitAngle+(k-(sparkCount-1)*0.5)*0.35;
      const spd=2.5+Math.random()*2.5;
      bt.particles.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:14+Math.random()*8,maxLife:22,color:sparkColor,size:1.2+Math.random()*1.8});
    }
  }
  // 데미지 숫자: 크리 or 중요 피해(≥3)만 표시, 자잘한 연속타는 4번마다 1회
  if(isCrit){
    spawnDN(e.x, e.y - e.size, Math.ceil(dmg)+'!', '#ffcc20', true, 'crit');
  } else if(dmg >= 3 || e._hitCount % 4 === 0){
    spawnDN(e.x, e.y - e.size, Math.ceil(dmg), dmg>=3?'#f87030':'#ccc', false, dmg>=5?'fire':'');
  }

}
function killEnemy(e){
  // split 자식은 킬카운트/골드보상 제외 (원본 1킬만 인정)

  }

    bt.won = true; gs.player.invincible = 80; // 1.2초 동안 무적

  }
  Audio.sfx.kill();

  }
  // 독탄+폭발 시너지 (독에 걸린 적 사망 → 독구름 전파)
  if(gs.skills._synPoisonBoom && (e.poison||0)>0){

// ─── 아이템 전체 수거 연출 (슬로우 모션 포함) ───
function collectAllItems(onDone) {
  if (!bt || !bt.items || bt.items.length === 0) { if(onDone) onDone(); return; }
  const p = gs.player;
  bt.items.forEach(it => { it.collecting = true; });

  // 슬로우 모션 시작
  bt.slowMotion = true;
  bt.slowScale  = 0.15; // 게임 속도를 15%로

  // 수거 효과음 (딸랑딸랑)
  const baseFreqs = [880, 1100, 1320];
  bt.items.forEach((it, idx) => {
    setTimeout(() => {
      if (it.type === 'gold') playSound(baseFreqs[idx % 3], 0.12, 'sine', 0.06);
      else if (it.type === 'hp') playSound(660, 0.15, 'sine', 0.05);
    }, idx * 40);
  });

  let ticks = 0;
  const totalTicks = 18; // 약 0.54초 (30ms × 18)
  const collectInterval = setInterval(() => {
    if (!bt || bt.won) { clearInterval(collectInterval); if(onDone) onDone(); return; }
    ticks++;

    // 아이템들을 플레이어 쪽으로 빠르게 당김 (가속)
    const pull = 0.18 + ticks * 0.018;
    bt.items.forEach(it => {
      it.x += (p.x - it.x) * pull;
      it.y += (p.y - it.y) * pull;
    });

    // 슬로우 점점 빠르게 복귀
    bt.slowScale = Math.min(1.0, 0.15 + ticks * 0.05);

    if (ticks >= totalTicks) {
      clearInterval(collectInterval);

      // 슬로우 해제
      bt.slowMotion = false;
      bt.slowScale  = 1.0;

      // 수거 적용
      let hpGain = 0, goldGain = 0;
      (bt.items || []).forEach(it => {
        if (it.type === 'hp')   hpGain   += 16;
        if (it.type === 'gold') { const _g=Math.round(10*(1+(gs.act-1)*0.3)*(1+(bt.wave-1)*0.1)); goldGain+=_g; gs.gold+=_g; gs._totalGoldEarned=(gs._totalGoldEarned||0)+_g; trackMission('gold',_g); }
      });
      if (hpGain > 0) {
        p.hp = Math.min(p.maxHp, p.hp + hpGain);
        spawnP(p.x, p.y, '#4ecf7a', 12, 4);
        spawnDN(p.x, p.y - 40, '+' + hpGain + ' HP', '#4ecf7a');
        Audio.sfx.hpPickup();
      }
      if (goldGain > 0) {
        spawnDN(p.x + 28, p.y - 56, '+' + goldGain + ' 🪙', '#c9a84c');
        Audio.sfx.gold();
      }
      // 수거 완료 파티클 burst
      spawnP(p.x, p.y, '#fff', 16, 5);
      spawnP(p.x, p.y, '#c9a84c', 10, 4);
      bt.items = [];
      if (onDone) onDone();
    }
  }, 30);
}

// 언덕1 곡선 Y값 계산 (SVG bezier 근사)
function hillY1(px) {
  // SVG: M-10,800 C30,462 110,438 230,450 C340,462 460,436 580,448 C668,456 742,452 820,448
  const segs = [
    {x0:-10,x1:230, y0:462, y1:450, c0x:30, c0y:462, c1x:110, c1y:438},
    {x0:230,x1:580, y0:450, y1:448, c0x:340,c0y:462, c1x:460, c1y:436},
    {x0:580,x1:820, y0:448, y1:448, c0x:668,c0y:456, c1x:742, c1y:452},
  ];
  for(const seg of segs){
    if(px>=seg.x0 && px<=seg.x1){
      const t=(px-seg.x0)/(seg.x1-seg.x0);
      // cubic bezier Y (control points simplified)
      const y=seg.y0*(1-t)**2+((seg.c0y+seg.c1y)/2)*2*t*(1-t)+seg.y1*t**2;
      return y;
    }
  }
  return 450;
}

// 풍성한 캔버스 나무 — 수관을 여러 원으로 겹쳐 자연스럽게
function drawCanvasTree(ctx, tx, groundY, size, wobble) {
  const w = wobble || 0; // 바람 흔들림
  const trunkH = size * 1.4;
  const trunkW = size * 0.18;

  ctx.save();

  // 나무 그림자 (바닥 타원)
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#1a4010';
  ctx.beginPath();
  ctx.ellipse(tx, groundY + 3, size * 0.7, size * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 줄기 — 위아래 너비 다르게
  const tg = ctx.createLinearGradient(tx - trunkW, 0, tx + trunkW, 0);
  tg.addColorStop(0, '#3a2008'); tg.addColorStop(0.4,'#6a4020'); tg.addColorStop(1,'#3a2008');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(tx - trunkW * 0.6, groundY);
  ctx.bezierCurveTo(tx - trunkW * 0.9, groundY - trunkH * 0.3,
                    tx - trunkW * 0.5 + w * 0.3, groundY - trunkH * 0.7,
                    tx - trunkW * 0.3 + w * 0.6, groundY - trunkH);
  ctx.lineTo(tx + trunkW * 0.3 + w * 0.6, groundY - trunkH);
  ctx.bezierCurveTo(tx + trunkW * 0.5 + w * 0.3, groundY - trunkH * 0.7,
                    tx + trunkW * 0.9, groundY - trunkH * 0.3,
                    tx + trunkW * 0.6, groundY);
  ctx.closePath(); ctx.fill();

  // 수관 기준점 (줄기 끝 + 바람 오프셋)
  const cx = tx + w * 0.8;
  const cy = groundY - trunkH - size * 0.3;

  // 수관 레이어 — 뒤(어두운) → 앞(밝은) 순서
  const blobs = [
    // [dx, dy, r, layer]  layer: 0=dark 1=mid 2=light
    [  0,     0,     size,      0],
    [-size*0.7, size*0.25, size*0.75, 0],
    [ size*0.68, size*0.22, size*0.72, 0],
    [-size*0.28, -size*0.55, size*0.68, 1],
    [ size*0.25, -size*0.52, size*0.65, 1],
    [-size*0.12, size*0.15, size*0.82, 1],
    [ size*0.08, size*0.12, size*0.78, 1],
    [-size*0.38, -size*0.28, size*0.58, 2],
    [ size*0.35, -size*0.25, size*0.55, 2],
    [  0,      -size*0.72, size*0.52, 2],
    [-size*0.14, -size*0.90, size*0.42, 2],
  ];

  const colors = [
    ['#2a6818','#1e5010'], // dark
    ['#3a8c25','#2a6818'], // mid
    ['#4eb035','#389028'], // light
  ];

  blobs.forEach(([dx, dy, r, layer]) => {
    const [c1, c2] = colors[layer];
    const blobGrad = ctx.createRadialGradient(
      cx + dx - r*0.2, cy + dy - r*0.2, 0,
      cx + dx, cy + dy, r
    );
    blobGrad.addColorStop(0, c1);
    blobGrad.addColorStop(1, c2);
    ctx.fillStyle = blobGrad;
    ctx.beginPath();
    ctx.arc(cx + dx, cy + dy, r, 0, Math.PI * 2);
    ctx.fill();
  });

  // 수관 하이라이트 (왼쪽 위 밝은 반사광)
  ctx.save();
  ctx.globalAlpha = 0.22;
  const hg = ctx.createRadialGradient(cx - size*0.3, cy - size*0.7, 0, cx - size*0.3, cy - size*0.7, size*0.5);
  hg.addColorStop(0, '#a0f060'); hg.addColorStop(1, 'rgba(100,220,50,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(cx - size*0.3, cy - size*0.7, size*0.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.restore();
}

// 나무 배치 데이터 (언덕1 위 — x좌표는 언덕 곡선 참조)
// 중앙 나무 제거, 좌우 비대칭으로 배치


// ─── 배틀 그리기 ───
function drawBattle(){
  const p=gs.player,s=gs.skills;
  const cam = bt.cam || {x:0,y:0};
  const _drawNow = Date.now(); // [P2] Date.now() 캐싱 — 매 프레임 1회만 호출
  // 전투 종료 후 화면 떨림 즉시 제거
  if (bt.won) bt.screenShake = 0;
  const _shk = Math.min(bt.screenShake, 20); // 최대 20으로 클램프
  const sx=_shk>0?(Math.random()-.5)*_shk*1.4:0;
  const sy=_shk>0?(Math.random()-.5)*_shk*1.4:0;

  if (!bt.bgParticles) bt.bgParticles = [];
  if (bt.bgTime === undefined) bt.bgTime = 0;

  const theme = ACT_THEMES[gs.act - 1] || ACT_THEMES[0];
  const now = bt.bgTime || 0;
  const act = gs.act;
  const isBoss = bt.isBoss;
  const cloudOff = (now * 0.12) % 900;

  // ════════════════════════════════════════════════
  //  [스크린 공간] 하늘 배경 — 카메라 영향 없음
  // ════════════════════════════════════════════════
  gctx.save(); gctx.translate(sx, sy);
  {
    // 하늘 그라데이션 (전체 화면 고정, 매우 느린 패럴랙스)
    const pxOff = cam.x * 0.02, pyOff = cam.y * 0.02; // 0.02배 패럴랙스
    const sky = gctx.createLinearGradient(0,-pyOff,0,800-pyOff);
    if(act===1){
      sky.addColorStop(0,'#1a6abf'); sky.addColorStop(0.3,'#3a9ad8');
      sky.addColorStop(0.55,'#6ac8e8'); sky.addColorStop(0.75,'#a8e0b0');
      sky.addColorStop(1,'#5ab840');
    } else if(act===2){
      sky.addColorStop(0,'#1a4a78'); sky.addColorStop(0.35,'#4a9ad8');
      sky.addColorStop(0.65,'#8acce8'); sky.addColorStop(0.85,'#b8e0f8'); sky.addColorStop(1,'#d0eeff');
    } else {
      sky.addColorStop(0,'#1e0410'); sky.addColorStop(0.3,'#6a1008');
      sky.addColorStop(0.6,'#c83210'); sky.addColorStop(0.82,'#e84820'); sky.addColorStop(1,'#c06030');
    }
    gctx.fillStyle=sky; gctx.fillRect(-100,-100,1000,1000);

    // ACT1: 태양 글로우 (좌상단)
    if(act===1 && !isBoss){
      const sunX = 90 - cam.x*0.01, sunY = 70 - cam.y*0.01;
      const sunGlow = gctx.createRadialGradient(sunX,sunY,0,sunX,sunY,200);
      sunGlow.addColorStop(0,'rgba(255,240,180,0.35)');
      sunGlow.addColorStop(0.3,'rgba(255,210,100,0.18)');
      sunGlow.addColorStop(1,'rgba(255,180,60,0)');
      gctx.fillStyle=sunGlow; gctx.fillRect(-100,-100,1000,1000);
      // 태양 본체
      gctx.save();
      gctx.globalAlpha=0.92;
      const sunCore = gctx.createRadialGradient(sunX,sunY,0,sunX,sunY,28);
      sunCore.addColorStop(0,'#fffef8'); sunCore.addColorStop(0.4,'#ffe8a0'); sunCore.addColorStop(1,'rgba(255,200,80,0)');
      gctx.fillStyle=sunCore; gctx.beginPath(); gctx.arc(sunX,sunY,28,0,Math.PI*2); gctx.fill();
      gctx.restore();
    }

    // ── ACT별 지평선/분위기 ──
    if(!isBoss){
      if(act===1){
        // 원거리 산 실루엣 (보라빛 안개)
        gctx.save(); gctx.globalAlpha=0.18;
        gctx.fillStyle='#7080b8';
        gctx.beginPath();
        const mBase=490; const pxR=cam.x*0.025;
        gctx.moveTo(-100,mBase);
        gctx.bezierCurveTo(60-pxR,mBase-60, 130-pxR,mBase-90, 200-pxR,mBase-55);
        gctx.bezierCurveTo(280-pxR,mBase-20, 330-pxR,mBase-75, 410-pxR,mBase-50);
        gctx.bezierCurveTo(490-pxR,mBase-25, 560-pxR,mBase-65, 630-pxR,mBase-40);
        gctx.bezierCurveTo(700-pxR,mBase-15, 760-pxR,mBase-55, 900-pxR,mBase-30);
        gctx.lineTo(900,mBase+50); gctx.lineTo(-100,mBase+50);
        gctx.closePath(); gctx.fill();
        gctx.restore();
        // 지평선 연두빛 안개
        gctx.save(); gctx.globalAlpha=0.12;
        const hFog=gctx.createLinearGradient(0,460,0,560);
        hFog.addColorStop(0,'rgba(100,200,60,0)');
        hFog.addColorStop(0.5,'rgba(80,180,40,0.5)');
        hFog.addColorStop(1,'rgba(60,160,20,0)');
        gctx.fillStyle=hFog; gctx.fillRect(-100,430,1000,150);
        gctx.restore();
      } else if(act===2){
        // 얼음 산 실루엣 (청백색)
        gctx.save(); gctx.globalAlpha=0.28;
        gctx.fillStyle='#c0d8ef';
        const pxR2=cam.x*0.03;
        gctx.beginPath();
        gctx.moveTo(-100,480);
        gctx.lineTo(80-pxR2,320); gctx.lineTo(140-pxR2,360);
        gctx.lineTo(210-pxR2,280); gctx.lineTo(290-pxR2,350);
        gctx.lineTo(370-pxR2,290); gctx.lineTo(440-pxR2,350);
        gctx.lineTo(510-pxR2,310); gctx.lineTo(570-pxR2,360);
        gctx.lineTo(650-pxR2,295); gctx.lineTo(720-pxR2,345);
        gctx.lineTo(790-pxR2,300); gctx.lineTo(900,380);
        gctx.lineTo(900,520); gctx.lineTo(-100,520);
        gctx.closePath(); gctx.fill();
        // 눈 정상 하이라이트
        gctx.fillStyle='rgba(255,255,255,0.55)';
        [[80-pxR2,320,28],[210-pxR2,280,22],[370-pxR2,290,20],[510-pxR2,310,18],[650-pxR2,295,24],[790-pxR2,300,20]].forEach(([px,py,r])=>{
          gctx.beginPath(); gctx.moveTo(px,py); gctx.lineTo(px-r,py+r*1.4); gctx.lineTo(px+r,py+r*1.4); gctx.closePath(); gctx.fill();
        });
        gctx.restore();
        // 오로라 (상단)
        if(!isBoss){
          gctx.save(); gctx.globalAlpha=0.1+0.05*Math.sin(now*0.02);
          const aurora=gctx.createLinearGradient(0,0,800,0);
          aurora.addColorStop(0,'rgba(40,220,180,0)');
          aurora.addColorStop(0.25,'rgba(40,200,160,0.6)');
          aurora.addColorStop(0.5,'rgba(80,160,220,0.4)');
          aurora.addColorStop(0.75,'rgba(120,80,200,0.5)');
          aurora.addColorStop(1,'rgba(60,180,200,0)');
          gctx.fillStyle=aurora;
          const aw=150+30*Math.sin(now*0.015);
          gctx.fillRect(-100,50,1000,aw);
          gctx.restore();
        }
        // 지평선 냉기 안개
        gctx.save(); gctx.globalAlpha=0.14;
        const hFog2=gctx.createLinearGradient(0,450,0,550);
        hFog2.addColorStop(0,'rgba(160,220,255,0)');
        hFog2.addColorStop(0.5,'rgba(140,200,240,0.6)');
        hFog2.addColorStop(1,'rgba(120,180,220,0)');
        gctx.fillStyle=hFog2; gctx.fillRect(-100,430,1000,140);
        gctx.restore();
      } else {
        // ACT3: 화산 실루엣
        gctx.save(); gctx.globalAlpha=0.55;
        gctx.fillStyle='#2c0c08';
        const pxR3=cam.x*0.03;
        gctx.beginPath();
        gctx.moveTo(-100,500);
        gctx.lineTo(60-pxR3,360); gctx.lineTo(150-pxR3,420);
        gctx.lineTo(240-pxR3,350); gctx.lineTo(320-pxR3,400);
        gctx.lineTo(400-pxR3,330); gctx.lineTo(480-pxR3,390);
        gctx.lineTo(570-pxR3,345); gctx.lineTo(650-pxR3,395);
        gctx.lineTo(740-pxR3,350); gctx.lineTo(900,440);
        gctx.lineTo(900,560); gctx.lineTo(-100,560);
        gctx.closePath(); gctx.fill();
        gctx.restore();
        // 화산 분화구 용암 글로우
        gctx.save(); gctx.globalAlpha=0.45+0.15*Math.sin(now*0.03);
        [[400-cam.x*0.03, 330],[240-cam.x*0.03, 350],[570-cam.x*0.03, 345]].forEach(([vx,vy])=>{
          const lavag=gctx.createRadialGradient(vx,vy+5,0,vx,vy+5,60);
          lavag.addColorStop(0,'rgba(255,100,0,0.5)');
          lavag.addColorStop(0.4,'rgba(255,40,0,0.2)');
          lavag.addColorStop(1,'transparent');
          gctx.fillStyle=lavag; gctx.fillRect(vx-70,vy-30,140,100);
        });
        gctx.restore();
        // 지평선 용암 글로우
        gctx.save(); gctx.globalAlpha=0.38+0.12*Math.sin(now*0.04);
        const hFog3=gctx.createLinearGradient(0,400,0,560);
        hFog3.addColorStop(0,'rgba(255,80,0,0)');
        hFog3.addColorStop(0.4,'rgba(255,60,0,0.55)');
        hFog3.addColorStop(1,'rgba(220,30,0,0)');
        gctx.fillStyle=hFog3; gctx.fillRect(-100,420,1000,160);
        gctx.restore();
      }
    }

    // ACT2: 보스방 — 더 강한 냉기 분위기
    if(isBoss && act===2){
      const iceAtm = gctx.createRadialGradient(400,200,50,400,400,600);
      iceAtm.addColorStop(0,'rgba(80,180,255,0.08)');
      iceAtm.addColorStop(1,'rgba(0,20,60,0.2)');
      gctx.fillStyle=iceAtm; gctx.fillRect(-100,-100,1000,1000);
    }
    if(isBoss && act===3){
      const fireAtm = gctx.createRadialGradient(400,600,50,400,400,600);
      fireAtm.addColorStop(0,'rgba(255,80,0,0.12)');
      fireAtm.addColorStop(1,'rgba(60,0,0,0.2)');
      gctx.fillStyle=fireAtm; gctx.fillRect(-100,-100,1000,1000);
    }

    // 보스방: 어두운 분위기 오버레이 (캐주얼하게 감소)
    if(isBoss){
      const bossAtm = gctx.createRadialGradient(400,400,100,400,400,580);
      bossAtm.addColorStop(0,'rgba(0,0,0,0)'); bossAtm.addColorStop(1,'rgba(0,0,0,0.15)');
      gctx.fillStyle=bossAtm; gctx.fillRect(-100,-100,1000,1000);
    }
  }

  // ── 구름 (하늘 레이어, 패럴랙스 스크롤) ──
  if(!isBoss && window._perfMode !== 'low'){
    gctx.save(); gctx.globalAlpha=0.82;
    // 구름은 카메라의 8% 속도로 움직여 패럴랙스 효과
    const cldOffX = cam.x * 0.08 - cloudOff;
    const cldOffY = cam.y * 0.04;
    if(act===1){
      [[60,40,110,42],[280,24,140,52],[540,44,106,40],[820,36,124,46],[1100,28,132,48],[1350,48,100,38]].forEach(([cx,cy,cw,ch])=>{
        const rx = cx - (cldOffX % (cw+900+900)) - 900; if(rx<-280||rx>1080)return;
        drawCloud(gctx, rx, cy-cldOffY*0.3, cw, ch, 0.82, '#ffffff');
      });
    } else if(act===2){
      [[60,112,110,38],[340,96,140,46],[640,108,100,34],[1010,112,110,38],[1260,96,140,46]].forEach(([cx,cy,cw,ch])=>{
        const rx = cx - (cldOffX % (cw+900+900)) - 900; if(rx<-260||rx>1060)return;
        drawCloud(gctx, rx, cy-cldOffY*0.3, cw, ch, 0.5, '#d8eeff');
      });
    } else {
      [[70,142,110,38],[330,126,148,44],[630,138,102,34],[990,142,110,38],[1240,126,148,44]].forEach(([cx,cy,cw,ch])=>{
        const rx = cx - (cldOffX % (cw+900+900)) - 900; if(rx<-260||rx>1060)return;
        drawCloud(gctx, rx, cy-cldOffY*0.3, cw, ch, 0.55, '#c04820');
      });
    }
    gctx.restore();
  }

  // ════════════════════════════════════════════════
  //  [월드 공간] 카메라 트랜스폼 적용 — 이하 모든 게임 오브젝트
  // ════════════════════════════════════════════════
  gctx.save();
  gctx.translate(-cam.x, -cam.y);

  // ── 타일링 바닥 ──
  drawWorldFloor(gctx, cam, act, now);

  // ── ACT2 빙판 렌더링 ──
  if(gs.act===2 && bt.icePatches && bt.icePatches.length){
    bt.icePatches.forEach(ip=>{
      const fadeIn  = Math.min(1, (ip.maxLife - ip.life) / 40);
      const fadeOut = Math.min(1, ip.life / 60);
      const alpha   = fadeIn * fadeOut * 0.55;
      gctx.save();
      gctx.globalAlpha = alpha;
      const ig = gctx.createRadialGradient(ip.x,ip.y,0,ip.x,ip.y,ip.r);
      ig.addColorStop(0,'rgba(200,240,255,0.85)');
      ig.addColorStop(0.5,'rgba(140,210,255,0.55)');
      ig.addColorStop(1,'rgba(80,170,230,0)');
      gctx.fillStyle = ig;
      gctx.beginPath(); gctx.ellipse(ip.x,ip.y,ip.r,ip.r*0.45,0,0,Math.PI*2); gctx.fill();
      gctx.strokeStyle='rgba(180,230,255,0.7)'; gctx.lineWidth=1.5;
      gctx.setLineDash([5,4]);
      gctx.beginPath(); gctx.ellipse(ip.x,ip.y,ip.r,ip.r*0.45,0,0,Math.PI*2); gctx.stroke();
      gctx.setLineDash([]);
      gctx.restore();
    });
  }

  // ── ACT3 용암 균열 렌더링 ──
  if(gs.act===3 && bt.lavaZones && bt.lavaZones.length){
    const _lT = Date.now()*0.003;
    bt.lavaZones.forEach(lz=>{
      gctx.save();
      if(lz.warn > 0){
        // 경고: 점멸 빨간 원
        const blink = Math.sin(_lT*10)*0.5+0.5;
        gctx.globalAlpha = 0.30+blink*0.40;
        gctx.strokeStyle='#ff2200'; gctx.lineWidth=2.5;
        gctx.setLineDash([6,5]);
        gctx.shadowColor='#ff2200'; gctx.shadowBlur=10;
        gctx.beginPath(); gctx.arc(lz.x,lz.y,lz.r,0,Math.PI*2); gctx.stroke();
        gctx.setLineDash([]);
        // 십자 표식
        gctx.globalAlpha=0.55+blink*0.25;
        gctx.strokeStyle='#ff4400'; gctx.lineWidth=1.5; gctx.shadowBlur=6;
        gctx.beginPath();
        gctx.moveTo(lz.x-10,lz.y); gctx.lineTo(lz.x+10,lz.y);
        gctx.moveTo(lz.x,lz.y-10); gctx.lineTo(lz.x,lz.y+10);
        gctx.stroke();
      } else {
        // 활성: 용암 웅덩이
        const fadeOut = Math.min(1,(lz.maxActive-lz.active)/30);
        const pulse = Math.sin(_lT*5+lz.x*0.01)*0.12;
        gctx.globalAlpha = (0.65+pulse)*fadeOut;
        const lg = gctx.createRadialGradient(lz.x,lz.y,0,lz.x,lz.y,lz.r);
        lg.addColorStop(0,`rgba(255,${140+pulse*60|0},0,0.9)`);
        lg.addColorStop(0.45,'rgba(220,50,0,0.65)');
        lg.addColorStop(1,'rgba(160,20,0,0)');
        gctx.fillStyle=lg;
        gctx.beginPath(); gctx.arc(lz.x,lz.y,lz.r,0,Math.PI*2); gctx.fill();
        gctx.globalAlpha=0.5*fadeOut; gctx.strokeStyle='#ff6600'; gctx.lineWidth=2;
        gctx.shadowColor='#ff4400'; gctx.shadowBlur=14;
        gctx.beginPath(); gctx.arc(lz.x,lz.y,lz.r,0,Math.PI*2); gctx.stroke();
      }
      gctx.restore();
    });
  }

  // ── SVG 보스방 배경 (보스 전투 시 월드 오버레이로) ──
  if(isBoss){
    const bgObj = buildBgSVG(act, isBoss);
    if(bgObj && bgObj.ready){
      gctx.save(); gctx.globalAlpha=0.55;
      try { gctx.drawImage(bgObj.img, cam.x-100, cam.y-100, 1000, 1000); } catch(e){}
      gctx.restore();
    }
  }

  // ── 배경 파티클 렌더 ──
  const _bgGlow = window._perfMode !== 'low';
  gctx.save();
  if (window._perfMode !== 'low') bt.bgParticles.forEach(bp => {
    gctx.save();
    gctx.globalAlpha = bp.alpha || 0.3;
    if (bp.glow && _bgGlow) { gctx.shadowColor = bp.color; gctx.shadowBlur = 6; }

    if (bp.type === 'leaf') {
      gctx.translate(bp.x, bp.y);
      gctx.rotate(bp.rot + bp.x*0.01);
      gctx.fillStyle = bp.color;
      gctx.beginPath();
      gctx.ellipse(0, 0, bp.size, bp.size*0.5, 0, 0, Math.PI*2);
      gctx.fill();
    } else if (bp.type === 'firefly') {
      const pulse = 0.4+0.6*Math.abs(Math.sin(now*0.05+(bp.pulse||0)));
      gctx.globalAlpha *= pulse;
      gctx.shadowColor='#c8ff80'; gctx.shadowBlur=8;
      gctx.fillStyle='#c8ff80';
      gctx.beginPath(); gctx.arc(bp.x,bp.y,bp.size,0,Math.PI*2); gctx.fill();
    } else if (bp.type === 'fog' || bp.type === 'smoke') {
      const rg = gctx.createRadialGradient(bp.x,bp.y,0,bp.x,bp.y,bp.size);
      rg.addColorStop(0,bp.color); rg.addColorStop(1,'transparent');
      gctx.fillStyle=rg;
      gctx.beginPath(); gctx.arc(bp.x,bp.y,bp.size,0,Math.PI*2); gctx.fill();
    } else if (bp.type === 'snow') {
      gctx.fillStyle=bp.color;
      // 눈송이 (6각)
      gctx.translate(bp.x,bp.y);
      gctx.rotate((bp.rot||0)+now*0.01);
      for(let k=0;k<6;k++){
        gctx.beginPath(); gctx.moveTo(0,0); gctx.lineTo(0,bp.size*1.5);
        gctx.strokeStyle=bp.color; gctx.lineWidth=0.8; gctx.stroke();
        gctx.rotate(Math.PI/3);
      }
    } else if (bp.type === 'crystal') {
      gctx.strokeStyle=bp.color; gctx.lineWidth=1;
      gctx.shadowColor='#c8f0ff'; gctx.shadowBlur=4;
      gctx.translate(bp.x,bp.y); gctx.rotate(bp.rot||0);
      gctx.beginPath();
      gctx.moveTo(0,-bp.size); gctx.lineTo(bp.size*0.5,0); gctx.lineTo(0,bp.size); gctx.lineTo(-bp.size*0.5,0);
      gctx.closePath(); gctx.stroke();
    } else if (bp.type === 'mist') {
      gctx.fillStyle=bp.color;
      gctx.beginPath(); gctx.arc(bp.x,bp.y,bp.size,0,Math.PI*2); gctx.fill();
    } else if (bp.type === 'ember') {
      gctx.shadowColor=bp.color; gctx.shadowBlur=6;
      gctx.fillStyle=bp.color;
      gctx.beginPath(); gctx.arc(bp.x,bp.y,bp.size*(bp.life/bp.maxLife),0,Math.PI*2); gctx.fill();
    } else if (bp.type === 'lava') {
      gctx.shadowColor='#ff4400'; gctx.shadowBlur=12;
      const lg=gctx.createRadialGradient(bp.x,bp.y,0,bp.x,bp.y,bp.size*2);
      lg.addColorStop(0,'#ffcc00'); lg.addColorStop(0.5,'#ff4400'); lg.addColorStop(1,'transparent');
      gctx.fillStyle=lg;
      gctx.beginPath(); gctx.arc(bp.x,bp.y,bp.size*2,0,Math.PI*2); gctx.fill();
    } else {
      gctx.fillStyle=bp.color;
      gctx.beginPath(); gctx.arc(bp.x,bp.y,bp.size,0,Math.PI*2); gctx.fill();
    }
    gctx.restore();
  });
  gctx.restore();

  // ── 보스방 분위기 오버레이 (월드 공간 — 카메라 중심 기준) ──
  if (bt.isBoss) {
    const pulseAlpha = 0.06 + 0.03*Math.sin(now*0.05);
    const bcx=cam.x+400, bcy=cam.y+400;
    const bossGlow = gctx.createRadialGradient(bcx,bcy,80,bcx,bcy,500);
    bossGlow.addColorStop(0, theme.color+'33');
    bossGlow.addColorStop(1, 'transparent');
    gctx.save(); gctx.globalAlpha=pulseAlpha*2;
    gctx.fillStyle=bossGlow; gctx.fillRect(cam.x,cam.y,800,800);
    gctx.restore();
  }

  // 파티클
  bt.particles.forEach(p=>{
    const a=p.life/p.maxLife;
    gctx.save();gctx.globalAlpha=a;gctx.fillStyle=p.color;
    gctx.beginPath();gctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);gctx.fill();gctx.restore();
  });

  // 아이템 드롭 — 고품질 캔버스 드로잉
  bt.items.forEach(it=>{
    if(!it._phase) it._phase = (it.x * 7 + it.y * 3) % (Math.PI*2);
    const t = now;
    const col = it.collecting;
    const bob = Math.sin(t * 0.09 + it._phase) * (col ? 0 : 3.5);
    const scale = col ? (1.25 + 0.12*Math.sin(t*0.25)) : 1;
    const ix = it.x, iy = it.y + bob;
    gctx.save();
    try {
    gctx.scale(scale, scale); // apply scale around item center
    const sx = ix/scale, sy = iy/scale;

    if(it.type === 'gold'){
      // ─── 회전 금화 ───
      const spin = Math.cos(t * 0.1 + it._phase);
      const cw = Math.max(1, 9 * Math.abs(spin));
      const ch = 11;
      gctx.shadowColor = '#f0c030'; gctx.shadowBlur = col ? 22 : 14;
      // 외곽 테두리 (어두운 금)
      gctx.fillStyle = '#a07010';
      gctx.beginPath(); gctx.ellipse(sx, sy, cw+1.5, ch+1.5, 0, 0, Math.PI*2); gctx.fill();
      // 본체 그라데이션
      const cg = gctx.createLinearGradient(sx-cw, sy, sx+cw, sy);
      if(spin >= 0){
        cg.addColorStop(0,'#b08820'); cg.addColorStop(0.35,'#f0d060');
        cg.addColorStop(0.65,'#fff8a0'); cg.addColorStop(1,'#c09030');
      } else {
        cg.addColorStop(0,'#c09030'); cg.addColorStop(0.35,'#fff8a0');
        cg.addColorStop(0.65,'#f0d060'); cg.addColorStop(1,'#b08820');
      }
      gctx.fillStyle = cg;
      gctx.beginPath(); gctx.ellipse(sx, sy, cw, ch, 0, 0, Math.PI*2); gctx.fill();
      // 하이라이트 섬광
      if(cw > 3){
        gctx.fillStyle = 'rgba(255,255,255,0.55)';
        gctx.beginPath(); gctx.ellipse(sx-cw*0.2, sy-ch*0.28, cw*0.32, ch*0.22, 0, 0, Math.PI*2); gctx.fill();
      }
      // 글자 (✦)
      if(cw > 5){
        gctx.fillStyle = 'rgba(140,90,0,0.7)';
        gctx.font = `bold ${Math.round(cw*1.4)}px Arial`;
        gctx.textAlign='center'; gctx.textBaseline='middle';
        gctx.fillText('✦', sx, sy+1);
      }
      // 수거 중: 반짝이 파티클
      if(col){
        for(let k=0;k<3;k++){
          const a=t*0.4+it._phase+k*2.1;
          const r=14+k*5;
          gctx.fillStyle=`rgba(255,240,80,${0.5-k*0.12})`;
          gctx.beginPath(); gctx.arc(sx+Math.cos(a)*r, sy+Math.sin(a)*r, 2.5-k*0.5, 0, Math.PI*2); gctx.fill();
        }
      }

    } else if(it.type === 'hp'){
      // ─── 심장 하트 ───
      const pulse = 1 + 0.13*Math.abs(Math.sin(t*0.1+it._phase));
      const hr = 10 * pulse;
      gctx.shadowColor = '#ff3060'; gctx.shadowBlur = col ? 26 : 16;
      // 하트 그리기 (베지어)
      function drawHeart(cx,cy,r){
        gctx.beginPath();
        gctx.moveTo(cx, cy+r*0.35);
        gctx.bezierCurveTo(cx,cy-r*0.1, cx-r*1.05,cy-r*0.1, cx-r*1.05,cy+r*0.35);
        gctx.bezierCurveTo(cx-r*1.05,cy+r*0.8, cx,cy+r*1.1, cx,cy+r*1.3);
        gctx.bezierCurveTo(cx,cy+r*1.1, cx+r*1.05,cy+r*0.8, cx+r*1.05,cy+r*0.35);
        gctx.bezierCurveTo(cx+r*1.05,cy-r*0.1, cx,cy-r*0.1, cx,cy+r*0.35);
        gctx.closePath();
      }
      // 그림자/빛 레이어
      gctx.fillStyle='#c81040';
      drawHeart(sx, sy-hr*0.65, hr*0.95); gctx.fill();
      // 본체 그라데이션
      const hg=gctx.createRadialGradient(sx-hr*0.25,sy-hr*0.5,0, sx,sy,hr*1.4);
      hg.addColorStop(0,'#ff8090'); hg.addColorStop(0.45,'#ff2050'); hg.addColorStop(1,'#c01040');
      gctx.fillStyle=hg;
      drawHeart(sx, sy-hr*0.65, hr*0.95); gctx.fill();
      // 상단 하이라이트
      gctx.fillStyle='rgba(255,255,255,0.45)';
      gctx.beginPath(); gctx.ellipse(sx-hr*0.32, sy-hr*0.9, hr*0.28, hr*0.2, -0.4, 0, Math.PI*2); gctx.fill();
      // 수거: 회전 광채
      if(col){
        gctx.strokeStyle='rgba(255,120,140,0.6)'; gctx.lineWidth=1.5;
        for(let k=0;k<4;k++){
          const a=t*0.3+it._phase+k*Math.PI/2;
          gctx.beginPath(); gctx.arc(sx,sy-hr*0.3, hr*1.8+k*3, a, a+0.5); gctx.stroke();
        }
      }

    } else if(it.type === 'freeze'){
      // ─── 빙결 크리스탈 오브 ───
      const spin2 = t*0.06 + it._phase;
      const or = col ? 13 : 11;
      gctx.shadowColor = '#60d8ff'; gctx.shadowBlur = col ? 28 : 18;
      // 외곽 링 (얼음색)
      gctx.strokeStyle='rgba(160,220,255,0.5)'; gctx.lineWidth=2;
      gctx.beginPath(); gctx.arc(sx,sy,or+3,0,Math.PI*2); gctx.stroke();
      // 구체 방사형 그라데이션
      const ig=gctx.createRadialGradient(sx-or*0.3,sy-or*0.35,0, sx,sy,or*1.1);
      ig.addColorStop(0,'#f0faff'); ig.addColorStop(0.35,'#a0e8ff');
      ig.addColorStop(0.72,'#3090d0'); ig.addColorStop(1,'#1060a0');
      gctx.fillStyle=ig;
      gctx.beginPath(); gctx.arc(sx,sy,or,0,Math.PI*2); gctx.fill();
      // 크리스탈 눈결정 (6방향)
      gctx.strokeStyle='rgba(255,255,255,0.75)'; gctx.lineWidth=1.2;
      for(let k=0;k<6;k++){
        const a=spin2+k*Math.PI/3;
        gctx.save();
        gctx.translate(sx,sy); gctx.rotate(a);
        gctx.beginPath(); gctx.moveTo(0,0); gctx.lineTo(0,or*0.82);
        // 가지
        gctx.moveTo(0,or*0.35); gctx.lineTo(or*0.2,or*0.55);
        gctx.moveTo(0,or*0.35); gctx.lineTo(-or*0.2,or*0.55);
        gctx.stroke();
        gctx.restore();
      }
      // 상단 유리 하이라이트
      gctx.fillStyle='rgba(255,255,255,0.42)';
      gctx.beginPath(); gctx.ellipse(sx-or*0.28,sy-or*0.3, or*0.3, or*0.2, -0.5, 0, Math.PI*2); gctx.fill();
    }
    } catch(e) { /* 아이템 드로잉 오류 무시 — restore()는 반드시 실행 */ }
    gctx.restore();
  });

  // 적 총알 (보스 산탄)
  (bt.enemyBullets||[]).forEach(eb=>{
    gctx.save();
    gctx.shadowColor = eb.color; gctx.shadowBlur = 6;
    // 꼬리 잔상
    const tailLen = 5;
    for(let k=0;k<tailLen;k++){
      const tx = eb.x - eb.vx*(k+1)*1.2, ty = eb.y - eb.vy*(k+1)*1.2;
      gctx.globalAlpha = (1-k/tailLen)*0.35;
      gctx.fillStyle = eb.color;
      gctx.beginPath(); gctx.arc(tx,ty,eb.size*(1-k/tailLen)*0.6,0,Math.PI*2); gctx.fill();
    }
    // 본체
    gctx.globalAlpha = 0.95;
    const bg = gctx.createRadialGradient(eb.x-eb.size*0.3,eb.y-eb.size*0.3,0, eb.x,eb.y,eb.size);
    bg.addColorStop(0,'#fff8e0'); bg.addColorStop(0.4,'#ff8040'); bg.addColorStop(1,'#c02000');
    gctx.fillStyle = bg;
    gctx.beginPath(); gctx.arc(eb.x,eb.y,eb.size,0,Math.PI*2); gctx.fill();
    gctx.restore();
  });

  // 번개
  bt.lightningbolts.forEach(lb=>{
    gctx.save();gctx.globalAlpha=lb.timer/8;gctx.strokeStyle='#ffea00';gctx.lineWidth=2+Math.random()*2;gctx.shadowColor='#fff';gctx.shadowBlur=8;
    gctx.beginPath();gctx.moveTo(lb.x1,lb.y1);
    for(let k=1;k<6;k++){const t=k/6;gctx.lineTo(lb.x1+(lb.x2-lb.x1)*t+(Math.random()-.5)*14,lb.y1+(lb.y2-lb.y1)*t+(Math.random()-.5)*14);}
    gctx.lineTo(lb.x2,lb.y2);gctx.stroke();gctx.restore();
  });

  // 폭발 — timer가 다양 (12~20), radius 음수 방지 필수 (arc에 음수 → IndexSizeError)
  bt.explosions.forEach(ex=>{
    // 첫 드로우 시 maxTimer 기록 (updateBattle이 먼저 실행되므로 timer는 이미 1 감소)
    if(ex._mt === undefined) ex._mt = ex.timer + 1;
    const mt = ex._mt;
    const prog = Math.max(0, Math.min(1, 1 - ex.timer / mt));
    ex.radius = ex.maxRadius * prog;
    const alpha = Math.min(1, ex.timer / mt);
    const r = Math.max(0.5, ex.radius);
    const col = ex.color || '#f84';
    gctx.save();gctx.globalAlpha=alpha*0.6;gctx.strokeStyle='#fff';gctx.lineWidth=3;
    gctx.beginPath();gctx.arc(ex.x,ex.y,r,0,Math.PI*2);gctx.stroke();
    gctx.globalAlpha=alpha*0.3;gctx.fillStyle=col;
    gctx.beginPath();gctx.arc(ex.x,ex.y,r*0.6,0,Math.PI*2);gctx.fill();gctx.restore();
  });

  // 블랙홀
  if(s.blackhole){
    gctx.save();
    const bha=bt.blackholeAngle;
    gctx.strokeStyle='rgba(155,110,232,0.4)';gctx.lineWidth=2;
    gctx.beginPath();gctx.arc(p.x,p.y,200,0,Math.PI*2);gctx.stroke();
    for(let i=0;i<6;i++){
      const a=bha+(i/6)*Math.PI*2;
      gctx.fillStyle=`rgba(155,110,232,${0.3+Math.sin(bha+i)*0.2})`;
      gctx.beginPath();gctx.arc(p.x+Math.cos(a)*200,p.y+Math.sin(a)*200,5,0,Math.PI*2);gctx.fill();
    }
    gctx.restore();
  }

  // 적
  bt.enemies.forEach(e=>{ if(e && e.x !== undefined) drawEnemyAnimal(gctx,e); }); // [M1] null 참조 방어

  // 적 HP 바 (데미지 입었을 때만, 보스/엘리트 제외)
  bt.enemies.forEach(e=>{
    if(e.isBoss || e.isEliteBoss) return;
    if(e.maxHp <= 1) return; // HP가 1인 적은 생략
    const ratio = Math.max(0, e.hp / e.maxHp);
    if(ratio >= 1) return; // 풀체력이면 생략
    const bw = e.size * 2.2, bh = 3;
    const bx = e.x - bw/2, by = e.y - e.size - 6;
    // 배경
    gctx.save();
    gctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(gctx, bx-1, by-1, bw+2, bh+2, 2); gctx.fill();
    // 채움
    const hpColor = ratio > 0.5 ? '#44ee88' : ratio > 0.25 ? '#f8a030' : '#ff4040';
    gctx.fillStyle = hpColor;
    if(ratio < 0.25){ gctx.shadowColor=hpColor; gctx.shadowBlur=4; }
    roundRect(gctx, bx, by, bw*ratio, bh, 2); gctx.fill();
    gctx.shadowBlur=0;
    gctx.restore();
  });

  // [고양이 패시브] 집중 사격: 현재 집중 타겟에 조준 마커 표시
  if(gs.selectedChar?.id==='cat' && (bt._catFocusHits||0) > 0){
    const _focusE = bt.enemies.find(e=>e._uid===bt._catFocusUid);
    if(_focusE && !_focusE.isBoss && !_focusE.isEliteBoss){
      const _stk = bt._catFocusHits % 5; // 0=방금 크리, 1~4=진행
      const _prog = _stk / 4; // 0~1
      gctx.save();
      // 진행 아크
      gctx.globalAlpha = 0.75 + 0.25*Math.sin(Date.now()*0.015);
      gctx.strokeStyle = _stk===0 ? '#ff44ff' : '#ff88ff';
      gctx.lineWidth = 2;
      gctx.shadowColor = '#ff44ff'; gctx.shadowBlur = 8;
      gctx.beginPath();
      gctx.arc(_focusE.x, _focusE.y, _focusE.size+7, -Math.PI/2, -Math.PI/2 + _prog*Math.PI*2);
      gctx.stroke();
      // 집중 수 텍스트
      gctx.globalAlpha = 0.9;
      gctx.fillStyle = '#ff88ff'; gctx.font = 'bold 9px Arial';
      gctx.textAlign = 'center'; gctx.textBaseline = 'bottom';
      gctx.shadowBlur = 4;
      gctx.fillText(`🎯${_stk||5}/5`, _focusE.x, _focusE.y - _focusE.size - 7);
      gctx.restore();
    }
  }

  // 엘리트/보스 HP 바 (항상 표시, 대형)
  bt.enemies.forEach(e=>{
    if(!e.isEliteBoss && !e.isBoss) return;
    const ratio = Math.max(0, e.hp / e.maxHp);
    const bw = e.isBoss ? 160 : 120, bh = e.isBoss ? 10 : 8;
    const bx = e.x - bw/2, by = e.y - e.size - (e.isBoss ? 22 : 18);
    gctx.save();
    gctx.fillStyle = 'rgba(0,0,0,0.7)';
    roundRect(gctx, bx-2, by-2, bw+4, bh+4, 4); gctx.fill();
    const barCol = e.isBoss ? '#c9a84c' : '#d060ff';
    const glowCol = e.isBoss ? '#ffcc44' : '#ff44ff';
    const depleted = ratio < 0.25;
    gctx.fillStyle = depleted ? '#ff4040' : barCol;
    gctx.shadowColor = depleted ? '#ff2020' : glowCol;
    gctx.shadowBlur = 8;
    if(ratio > 0) { roundRect(gctx, bx, by, bw*ratio, bh, 3); gctx.fill(); }
    gctx.shadowBlur = 0;
    gctx.strokeStyle = 'rgba(0,0,0,0.4)'; gctx.lineWidth = 1;
    for(let seg=1; seg<4; seg++){
      const sx = bx + bw*seg/4;
      gctx.beginPath(); gctx.moveTo(sx, by); gctx.lineTo(sx, by+bh); gctx.stroke();
    }
    gctx.fillStyle = '#fff'; gctx.shadowColor = glowCol; gctx.shadowBlur = 6;
    gctx.font = `bold ${e.isBoss?9:8}px Arial`;
    gctx.textAlign = 'center'; gctx.textBaseline = 'bottom';
    const eName = e.emoji ? `${e.emoji} ${Math.ceil(e.hp)}/${e.maxHp}` : `${Math.ceil(e.hp)}/${e.maxHp}`;
    gctx.fillText(eName, e.x, by-2);
    if(e.shield > 0){
      gctx.fillStyle = '#4af'; gctx.shadowColor = '#4af'; gctx.shadowBlur = 4;
      gctx.font = 'bold 8px Arial'; gctx.textAlign = 'center'; gctx.textBaseline = 'top';
      gctx.fillText(`🛡${e.shield}`, e.x, by+bh+3);
    }
    gctx.restore();
  });

  // 회전 검
  if(s.sword>0){
    for(let sv=0;sv<s.sword;sv++){
      const angle=bt.swordAngle+(sv/s.sword)*Math.PI*2;
      const swx=p.x+Math.cos(angle)*55,swy=p.y+Math.sin(angle)*55;
      gctx.save();gctx.translate(swx,swy);gctx.rotate(angle+Math.PI/4+Math.PI);
      gctx.font='22px serif';gctx.textAlign='center';gctx.textBaseline='middle';gctx.fillText('🗡️',0,0);gctx.restore();
    }
  }

  // 보호막
  if(gs.shieldCount>0){
    gctx.save();gctx.globalAlpha=0.45;gctx.strokeStyle='#8af';gctx.lineWidth=2+Math.sin(_drawNow/200);gctx.shadowColor='#8af';gctx.shadowBlur=15;
    gctx.beginPath();gctx.arc(p.x,p.y,p.size+9,0,Math.PI*2);gctx.stroke();gctx.restore();
  }

  // 얼음 슬로우 상태 표시
  if((bt.playerSlowTimer||0)>0){
    gctx.save();gctx.globalAlpha=0.35+0.1*Math.sin(_drawNow/120);
    gctx.strokeStyle='#80d8ff';gctx.lineWidth=3;gctx.shadowColor='#80d8ff';gctx.shadowBlur=14;
    gctx.beginPath();gctx.arc(p.x,p.y,p.size+14,0,Math.PI*2);gctx.stroke();gctx.restore();
  }
  // ── 캐릭터 패시브 시각 효과 ──
  {
    const _charId = gs.selectedChar?.id;
    const _passLowPerf = window._perfMode === 'low';
    // [펭귄] 원검 일체: 검날 스택 수만큼 청색 오브가 플레이어 주위를 공전
    if(_charId==='penguin' && (bt._penguinBladeStack||0) > 0 && !_passLowPerf){
      const stk = bt._penguinBladeStack;
      for(let oi=0; oi<stk; oi++){
        const oa = (oi/4)*Math.PI*2 - Math.PI/2 + _drawNow*0.003;
        const ox = p.x + Math.cos(oa)*22, oy = p.y + Math.sin(oa)*22;
        gctx.save();
        gctx.globalAlpha = 0.9;
        gctx.fillStyle = '#88e8ff'; gctx.shadowColor='#88e8ff'; gctx.shadowBlur=10;
        gctx.beginPath(); gctx.arc(ox,oy,3.5,0,Math.PI*2); gctx.fill();
        gctx.restore();
      }
      // 스택 수 텍스트
      gctx.save(); gctx.globalAlpha=0.85;
      gctx.fillStyle='#88e8ff'; gctx.font='bold 11px sans-serif';
      gctx.textAlign='center'; gctx.textBaseline='middle';
      gctx.shadowColor='#006688'; gctx.shadowBlur=4;
      gctx.fillText('×'+(1+bt._penguinBladeStack*0.25).toFixed(2), p.x, p.y - p.size - 16);
      gctx.restore();
    }
    // [토끼] 도약 반격: 황금 확산 링
    if(_charId==='rabbit' && (bt._rabbitStrikeWindow||0) > 0){
      const rProg = 1 - bt._rabbitStrikeWindow/30; // 0→1
      gctx.save();
      gctx.globalAlpha = (1 - rProg) * 0.75;
      gctx.strokeStyle='#ffe040'; gctx.lineWidth=2.5;
      gctx.shadowColor='#ffe040'; gctx.shadowBlur=18;
      gctx.beginPath(); gctx.arc(p.x, p.y, p.size+6+rProg*26, 0, Math.PI*2); gctx.stroke();
      gctx.restore();
      // ×2.5 배율 표시
      gctx.save(); gctx.globalAlpha=0.9;
      gctx.fillStyle='#ffe040'; gctx.font='bold 12px sans-serif';
      gctx.textAlign='center'; gctx.textBaseline='middle';
      gctx.shadowColor='#996600'; gctx.shadowBlur=5;
      gctx.fillText('×2.5', p.x, p.y - p.size - 16);
      gctx.restore();
    }
    // [여우] 폭발 직감: 폭발탄 충전 중 → 주황 글로우 + 잔탄 표시
    if(_charId==='fox' && (bt._foxExplosiveShots||0) > 0){
      const fPulse = 0.25 + 0.12*Math.sin(_drawNow*0.012);
      gctx.save();
      gctx.globalAlpha=fPulse;
      gctx.strokeStyle='#ff8840'; gctx.lineWidth=2.5;
      gctx.shadowColor='#ff8840'; gctx.shadowBlur=16;
      gctx.beginPath(); gctx.arc(p.x,p.y,p.size+13,0,Math.PI*2); gctx.stroke();
      gctx.restore();
      gctx.save(); gctx.globalAlpha=0.85;
      gctx.fillStyle='#ff9050'; gctx.font='bold 11px sans-serif';
      gctx.textAlign='center'; gctx.textBaseline='middle';
      gctx.shadowColor='#883000'; gctx.shadowBlur=4;
      gctx.fillText('💥'+bt._foxExplosiveShots, p.x, p.y - p.size - 16);
      gctx.restore();
    }
    // [곰] 철옹 반격: HP 50% 이하 → 붉은 요새 오라
    if(_charId==='bear' && p.hp <= p.maxHp*0.5){
