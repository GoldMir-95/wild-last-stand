      for(let i=0;i<4;i++){const a=-0.6+i*0.4;ctx.beginPath();ctx.ellipse(x-s*.8+i*s*.55,y-s*.3,s*.22,s*.38,a-.5,0,Math.PI*2);ctx.fill();}
      ctx.fillStyle=fr?'#9cc5e0':'#e03030';
      ctx.beginPath();ctx.arc(x,y-s*.7,s*.55,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=fr?'#7bb5d0':'#801010';
      ctx.beginPath();ctx.moveTo(x-s*.3,y-s*1.15);ctx.lineTo(x-s*.15,y-s*.8);ctx.lineTo(x,y-s*1.3);ctx.lineTo(x+s*.15,y-s*.8);ctx.lineTo(x+s*.3,y-s*1.15);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ff4040';ctx.shadowColor='#ff0000';ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(x-s*.2,y-s*.75,s*.1,0,Math.PI*2);ctx.arc(x+s*.2,y-s*.75,s*.1,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      ctx.save();ctx.translate(x+s*.9,y);ctx.rotate(performance.now()/400);
      ctx.fillStyle=fr?'#8ab5d0':'#909090';ctx.beginPath();ctx.ellipse(0,0,s*.5,s*.22,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=fr?'#6da3c0':'#c0c0c0';ctx.beginPath();ctx.ellipse(0,0,s*.32,s*.13,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
      break;
    }

    case'elite_necromancer': {
      // 강령술사: 어두운 로브, 해골 지팡이
      const t2=performance.now()/300;
      ctx.fillStyle=fr?'#6da3c0':'#3a1060';
      ctx.beginPath();ctx.ellipse(x,y+s*.2,s*1.3,s*1.0,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=fr?'#5aa0c0':'#5020a0';
      ctx.beginPath();ctx.ellipse(x,y,s*1.1,s*.85,0,0,Math.PI*2);ctx.fill();
      if(e.hasShield){
        ctx.save();ctx.strokeStyle='#c0a0ff';ctx.lineWidth=2;
        ctx.globalAlpha=0.5+Math.sin(t2)*0.3;ctx.shadowColor='#c0a0ff';ctx.shadowBlur=10;
        ctx.beginPath();ctx.arc(x,y,s*1.45,0,Math.PI*2);ctx.stroke();ctx.restore();
      }
      ctx.fillStyle=fr?'#a8d0e8':'#d0c8b0';
      ctx.beginPath();ctx.arc(x,y-s*.7,s*.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=fr?'#7bb5d0':'#5020a0';ctx.shadowColor='#8040f0';ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(x-s*.18,y-s*.75,s*.13,0,Math.PI*2);ctx.arc(x+s*.18,y-s*.75,s*.13,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      ctx.strokeStyle=fr?'#9cc5e0':'#6030a0';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x+s*.7,y+s*.5);ctx.lineTo(x+s*.7,y-s*.8);ctx.stroke();
      ctx.fillStyle='#c0a0ff';ctx.shadowColor='#c0a0ff';ctx.shadowBlur=8+Math.sin(t2*2)*4;
      ctx.beginPath();ctx.arc(x+s*.7,y-s*.9,s*.22,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      break;
    }

    case'elite_colossus': {
      // 거인: 거대한 바위 골렘
      const t3=performance.now()/400;
      ctx.fillStyle=fr?'#7bb5d0':'#2a5a30';
      ctx.beginPath();ctx.ellipse(x,y+s*.1,s*1.4,s*1.1,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=fr?'#6da3c0':'#1e4022';
      for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(x+(i-2)*s*.35,y+s*.1+(i%2)*.2*s,s*.22,s*.18,i*.4,0,Math.PI*2);ctx.fill();}
      ctx.fillStyle=fr?'#7bb5d0':'#2a5a30';
      ctx.beginPath();ctx.ellipse(x-s*1.3,y+s*.1,s*.55,s*.45,-.3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(x+s*1.3,y+s*.1,s*.55,s*.45,.3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=fr?'#9cc5e0':'#3a6a40';
      ctx.beginPath();ctx.arc(x,y-s*.75,s*.6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#80ff80';ctx.shadowColor='#40ff40';ctx.shadowBlur=10+Math.sin(t3)*4;
      ctx.beginPath();ctx.arc(x-s*.22,y-s*.8,s*.12,0,Math.PI*2);ctx.arc(x+s*.22,y-s*.8,s*.12,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      if(e.shockTimer<40){
        const prog2=(40-(e.shockTimer||0))/40;
        ctx.save();ctx.strokeStyle='#80ff80';ctx.lineWidth=2;
        ctx.globalAlpha=prog2*.7;ctx.shadowColor='#40ff40';ctx.shadowBlur=8;
        ctx.beginPath();ctx.arc(x,y,s+120*prog2,0,Math.PI*2);ctx.stroke();ctx.restore();
      }
      break;
    }
    case'boss': {
      const bossAct = gs.act||1;
      const phase   = e.phase||1;
      const bT      = performance.now()/1000;
      const phaseCol= phase>=3?'#e03030':phase>=2?'#f07030':'#c9a84c';
      const isTransit=(e._phaseInvincible||0)>0;

      // 페이즈 전환 무적 중 — 흰 깜빡임 처리
      // ctx.restore()를 여기서 호출하면 스택 불균형 → 매 프레임 canvas 상태 오염
      // 이후 8577·8603의 restore가 flip/outer save를 정상 처리함
      if(isTransit&&Math.floor((e._phaseInvincible||0)/5)%2===0){
        break; // 보스 몸체만 숨김, canvas 상태 스택은 아래 restore들이 처리
      }

      // ── 바깥 오라 (항상) ──
      {
        const auraSz = s*2.0+s*0.25*Math.sin(bT*2.2);
        ctx.save();
        const ag=ctx.createRadialGradient(x,y,s*.4,x,y,auraSz);
        ag.addColorStop(0,phaseCol+'55');
        ag.addColorStop(1,'transparent');
        ctx.globalAlpha=0.55+0.2*Math.sin(bT*1.8);
        ctx.fillStyle=ag;
        ctx.beginPath();ctx.arc(x,y,auraSz,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }

      if(bossAct===1){
        // ━━ ACT1: 초원의 군주 — 거대 암흑 야수 (늑대형) ━━
        const c1=fr?'#6da3c0':phase>=3?'#3a1a1a':phase>=2?'#282818':'#1a2a10';
        const c2=fr?'#9cc5d5':phase>=3?'#5a2828':phase>=2?'#484030':'#2a4a18';
        // 꼬리
        ctx.save();
        ctx.strokeStyle=c2; ctx.lineWidth=s*.28; ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(x+s*.7,y+s*.1);
        ctx.bezierCurveTo(x+s*1.5,y-s*.4+Math.sin(bT*2)*s*.12,x+s*1.8,y+s*.3,x+s*1.5,y+s*.7);
        ctx.stroke();
        ctx.restore();
        // 몸통
        ctx.fillStyle=c2;
        ctx.beginPath();ctx.ellipse(x+s*.08,y+s*.15,s*1.25,s*.95,0,0,Math.PI*2);ctx.fill();
        // 앞다리
        ctx.fillStyle=c1;
        ctx.beginPath();ctx.ellipse(x-s*.6,y+s*.85,s*.28,s*.42,-.2,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(x+s*.1,y+s*.9,s*.28,s*.42,.1,0,Math.PI*2);ctx.fill();
        // 머리
        ctx.fillStyle=c1;
        ctx.beginPath();ctx.arc(x-s*.45,y-s*.4,s*.78,0,Math.PI*2);ctx.fill();
        // 갈기 (방사형 가시)
        ctx.fillStyle=c2;
        for(let i=0;i<8;i++){
          const a=-Math.PI*0.75+(i/7)*Math.PI*1.5;
          const mLen=s*(1.35+0.12*Math.sin(bT*3+i));
          ctx.beginPath();
          ctx.moveTo(x-s*.45+Math.cos(a-.22)*s*.72,y-s*.4+Math.sin(a-.22)*s*.72);
          ctx.lineTo(x-s*.45+Math.cos(a)*mLen,y-s*.4+Math.sin(a)*mLen);
          ctx.lineTo(x-s*.45+Math.cos(a+.22)*s*.72,y-s*.4+Math.sin(a+.22)*s*.72);
          ctx.closePath();ctx.fill();
        }
        // 주둥이
        ctx.fillStyle=c2;
        ctx.beginPath();ctx.ellipse(x-s*.95,y-s*.32,s*.35,s*.24,-.25,0,Math.PI*2);ctx.fill();
        // 눈 (노란 빛)
        ctx.save();
        ctx.shadowColor=phaseCol;ctx.shadowBlur=14+6*Math.sin(bT*4);
        ctx.fillStyle='#ffee40';
        ctx.beginPath();ctx.ellipse(x-s*.65,y-s*.55,s*.16,s*.12,0,0,Math.PI*2);
        ctx.ellipse(x-s*.28,y-s*.55,s*.16,s*.12,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=phase>=3?'#ff2020':phase>=2?'#ff8800':'#8b4000';
        ctx.beginPath();ctx.arc(x-s*.65,y-s*.54,s*.08,0,Math.PI*2);
        ctx.arc(x-s*.28,y-s*.54,s*.08,0,Math.PI*2);ctx.fill();
        ctx.restore();
        // 이빨
        ctx.fillStyle='#e8e8e0';
        ctx.beginPath();ctx.moveTo(x-s*1.08,y-s*.22);ctx.lineTo(x-s*1.02,y-s*.08);ctx.lineTo(x-s*.94,y-s*.22);ctx.closePath();ctx.fill();
        ctx.beginPath();ctx.moveTo(x-s*.88,y-s*.24);ctx.lineTo(x-s*.82,y-s*.1);ctx.lineTo(x-s*.74,y-s*.24);ctx.closePath();ctx.fill();
        // 발톱
        ctx.strokeStyle=c1;ctx.lineWidth=s*.1;ctx.lineCap='round';
        for(let ci=0;ci<3;ci++){
          const clx=x-s*.75+ci*s*.35+s*.5,cly=y+s*1.25;
          ctx.beginPath();ctx.moveTo(clx,cly);ctx.lineTo(clx-s*.06,cly+s*.22);ctx.stroke();
        }

      } else if(bossAct===2){
        // ━━ ACT2: 빙하의 왕 — 거대 얼음 드래곤 ━━
        const c1=fr?'#6da3c0':phase>=3?'#c0e8ff':phase>=2?'#88bce0':'#4878b8';
        const c2=fr?'#9cc5d5':phase>=3?'#e4f4ff':phase>=2?'#a8d0f0':'#6898d0';
        // 날개
        ctx.save();ctx.globalAlpha=0.72;ctx.fillStyle=c2;
        for(let wi=0;wi<2;wi++){
          const wf=wi===0?1:-1;
          const wflap=Math.sin(bT*2.6+wi*Math.PI)*s*.18;
          ctx.beginPath();
          ctx.moveTo(x,y-s*.1);
          ctx.bezierCurveTo(x+wf*s*1.1,y-s*1.1+wflap,x+wf*s*2.6,y-s*.7+wflap,x+wf*s*2.3,y+s*.35+wflap);
          ctx.bezierCurveTo(x+wf*s*1.6,y+s*.65,x+wf*s*.8,y+s*.4,x,y+s*.3);
          ctx.closePath();ctx.fill();
          // 날개 막 무늬
          ctx.strokeStyle=c1;ctx.lineWidth=1.5;ctx.globalAlpha=0.4;
          for(let wri=1;wri<=3;wri++){
            ctx.beginPath();
            ctx.moveTo(x,y);
            ctx.lineTo(x+wf*s*(0.8+wri*.5),y-s*(0.7-wri*.1)+wflap);
            ctx.stroke();
          }
          ctx.globalAlpha=0.72;
        }
        ctx.restore();
        // 꼬리
        ctx.save();ctx.strokeStyle=c1;ctx.lineWidth=s*.32;ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(x+s*.7,y+s*.2);
        ctx.bezierCurveTo(x+s*1.5,y+s*.7+Math.sin(bT*1.4)*s*.15,x+s*2.0,y+s*.3,x+s*1.8,y-s*.2);
        ctx.stroke();
        ctx.restore();
        // 몸통
        ctx.fillStyle=c1;
        ctx.beginPath();ctx.ellipse(x,y+s*.12,s*1.15,s*.88,0,0,Math.PI*2);ctx.fill();
        // 얼음 갑옷 무늬
        ctx.fillStyle=c2+'88';
        for(let ki=0;ki<6;ki++){
          const ka=(ki/6)*Math.PI*2;
          ctx.beginPath();ctx.ellipse(x+Math.cos(ka)*s*.7,y+s*.1+Math.sin(ka)*s*.55,s*.18,s*.14,ka,0,Math.PI*2);ctx.fill();
        }
        // 머리
        ctx.fillStyle=c2;
        ctx.beginPath();ctx.ellipse(x-s*.42,y-s*.42,s*.8,s*.68,-.18,0,Math.PI*2);ctx.fill();
        // 얼음 왕관 뿔
        ctx.fillStyle='#d0eeff';
        [[-.82,-.9,-.12],[-.58,-1.08,.06],[-.28,-.96,.2]].forEach(([hx,hy,ha])=>{
          ctx.beginPath();
          ctx.moveTo(x+s*hx,y+s*hy);
          ctx.lineTo(x+s*(hx-.13+ha*.15),y+s*(hy-.38));
          ctx.lineTo(x+s*(hx+.13+ha*.15),y+s*(hy-.38));
          ctx.closePath();ctx.fill();
        });
        // 눈
        ctx.save();ctx.shadowColor='#80d8ff';ctx.shadowBlur=16+8*Math.sin(bT*3.5);
        ctx.fillStyle='#c8f2ff';
        ctx.beginPath();ctx.ellipse(x-s*.7,y-s*.55,s*.16,s*.2,0,0,Math.PI*2);
        ctx.ellipse(x-s*.26,y-s*.55,s*.16,s*.2,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#002266';
        ctx.beginPath();ctx.arc(x-s*.7,y-s*.53,s*.09,0,Math.PI*2);
        ctx.arc(x-s*.26,y-s*.53,s*.09,0,Math.PI*2);ctx.fill();
        ctx.restore();
        // 얼음 브레스 (페이즈2+)
        if(phase>=2){
          ctx.save();ctx.globalAlpha=0.22+0.12*Math.sin(bT*4);
          ctx.fillStyle='#80d8ff';ctx.shadowColor='#80d8ff';ctx.shadowBlur=12;
          ctx.beginPath();ctx.ellipse(x-s*1.1,y-s*.35,s*.25+s*.1*Math.sin(bT*5),s*.14,-.3,0,Math.PI*2);ctx.fill();
          ctx.restore();
        }

      } else {
        // ━━ ACT3: 심연의 지배자 — 불꽃 악마 ━━
        const c1=fr?'#6da3c0':phase>=3?'#ff1a30':phase>=2?'#c01820':'#780c18';
        const c2=fr?'#9cc5d5':phase>=3?'#ff5040':phase>=2?'#e02820':'#a01818';
        // 불꽃 오라 (파티클형)
        ctx.save();
        for(let fi=0;fi<10;fi++){
          const fa=fi/10*Math.PI*2+bT*1.8;
          const fr2=s*1.4+s*.5*Math.sin(bT*3.5+fi*0.95);
          const fsz=s*.38+s*.18*Math.sin(bT*2.8+fi);
          ctx.globalAlpha=0.3+0.18*Math.sin(bT*2+fi);
          ctx.fillStyle=fi%2===0?'#ff3300':'#ff8800';
          ctx.shadowColor='#ff4400';ctx.shadowBlur=8;
          ctx.beginPath();ctx.arc(x+Math.cos(fa)*fr2,y+Math.sin(fa)*fr2,fsz,0,Math.PI*2);ctx.fill();
        }
        ctx.restore();
        // 날개 (악마형)
        ctx.save();ctx.globalAlpha=0.7;ctx.fillStyle=c1;
        for(let wi=0;wi<2;wi++){
          const wf=wi===0?1:-1;
          const wflap=Math.sin(bT*2.2+wi*Math.PI)*s*.12;
          ctx.beginPath();
          ctx.moveTo(x,y-s*.2);
          ctx.lineTo(x+wf*s*2.4,y-s*.9+wflap);
          ctx.lineTo(x+wf*s*2.0,y+s*.2+wflap);
          ctx.lineTo(x+wf*s*1.2,y+s*.5);
          ctx.lineTo(x,y+s*.2);
          ctx.closePath();ctx.fill();
          // 날개 갈비 뼈
          ctx.strokeStyle=c2+'88';ctx.lineWidth=1.5;ctx.globalAlpha=0.55;
          for(let wr=1;wr<=3;wr++){
            ctx.beginPath();ctx.moveTo(x,y-s*.1);
            ctx.lineTo(x+wf*s*(0.7+wr*.4),y-s*(0.4-wr*.1)+wflap);ctx.stroke();
          }
          ctx.globalAlpha=0.7;
        }
        ctx.restore();
        // 몸통
        ctx.fillStyle=c1;
        ctx.beginPath();ctx.ellipse(x,y+s*.1,s*1.18,s*1.0,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=c2+'66';
        ctx.beginPath();ctx.ellipse(x,y+s*.2,s*.75,s*.65,0,0,Math.PI*2);ctx.fill(); // 흉부 문양
        // 어깨
        ctx.fillStyle=c2;
        [[-1.08,-.05],[1.08,-.05]].forEach(([hx,hy])=>{
          ctx.beginPath();ctx.ellipse(x+s*hx,y+s*hy,s*.42,s*.36,hx>0?.3:-.3,0,Math.PI*2);ctx.fill();
        });
        // 머리
        ctx.fillStyle=c1;
        ctx.beginPath();ctx.arc(x,y-s*.52,s*.72,0,Math.PI*2);ctx.fill();
        // 뿔 (두 갈래)
        ctx.fillStyle='#ff1100';
        [[-.38,-1.26,-.12],[.38,-1.26,.12]].forEach(([hx,hy,ha])=>{
          ctx.beginPath();
          ctx.moveTo(x+s*hx,y+s*(hy+.36));
          ctx.lineTo(x+s*(hx+ha),y+s*hy);
          ctx.lineTo(x+s*(hx+ha*.4+.1),y+s*(hy+.26));
          ctx.closePath();ctx.fill();
          // 뿔 빛
          ctx.save();ctx.globalAlpha=0.55+0.3*Math.sin(bT*4);
          ctx.fillStyle='#ff6600';
          ctx.beginPath();ctx.arc(x+s*(hx+ha*.5),y+s*(hy+.14),s*.06,0,Math.PI*2);ctx.fill();
          ctx.restore();
        });
        // 눈 (불꽃)
        ctx.save();ctx.shadowColor='#ff4400';ctx.shadowBlur=18+10*Math.sin(bT*4.5);
        ctx.fillStyle='#ffcc00';
        ctx.beginPath();ctx.ellipse(x-s*.3,y-s*.65,s*.18,s*.14,0,0,Math.PI*2);
        ctx.ellipse(x+s*.3,y-s*.65,s*.18,s*.14,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ff1100';
        ctx.beginPath();ctx.arc(x-s*.3,y-s*.63,s*.1,0,Math.PI*2);
        ctx.arc(x+s*.3,y-s*.63,s*.1,0,Math.PI*2);ctx.fill();
        ctx.restore();
        // 입 (이빨)
        ctx.strokeStyle='#440000';ctx.lineWidth=s*.06;
        ctx.beginPath();ctx.arc(x,y-s*.38,s*.3,0.2,Math.PI-.2);ctx.stroke();
        ctx.fillStyle='#e8e0d0';
        for(let ti=0;ti<4;ti++){
          const ta=0.35+(ti/3)*(.5);
          ctx.beginPath();
          ctx.moveTo(x-s*.28+ti*s*.19,y-s*.36);
          ctx.lineTo(x-s*.24+ti*s*.19,y-s*.22);
          ctx.lineTo(x-s*.2+ti*s*.19,y-s*.36);
          ctx.closePath();ctx.fill();
        }
      }
      break;
    }
    default:
      ctx.fillStyle=e.color||'#aaa';ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();
  }

  // ── 유니버설 조명 오버레이 (보스 제외 일반 적) ──
  // 좌상단에서 오는 가상 광원 → 상단 하이라이트 + 하단 그림자로 입체감 부여
  if(!e.isBoss && !e.isEliteBoss && window._perfMode !== 'low'){
    const _lx = x - s*0.32, _ly = y - s*0.38;
    // 상단 하이라이트 (부드러운 흰색 빛)
    ctx.save();
    ctx.globalAlpha = hitAlpha * 0.20;
    const _hl = ctx.createRadialGradient(_lx, _ly, 0, _lx, _ly, s*1.1);
    _hl.addColorStop(0,   'rgba(255,255,255,0.9)');
    _hl.addColorStop(0.35,'rgba(255,255,255,0.4)');
    _hl.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = _hl;
    ctx.beginPath(); ctx.ellipse(x, y, s*1.3, s*1.1, 0, 0, Math.PI*2); ctx.fill();
    // 하단 어두운 그림자 면
    ctx.globalAlpha = hitAlpha * 0.14;
    const _sh = ctx.createLinearGradient(x, y, x, y + s*1.1);
    _sh.addColorStop(0,  'rgba(0,0,0,0)');
    _sh.addColorStop(0.5,'rgba(0,0,0,0.35)');
    _sh.addColorStop(1,  'rgba(0,0,0,0.65)');
    ctx.fillStyle = _sh;
    ctx.beginPath(); ctx.ellipse(x, y+s*0.3, s*1.2, s*0.9, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // 엘리트 보스: 더 강한 조명
  if(e.isEliteBoss && window._perfMode !== 'low'){
    ctx.save();
    ctx.globalAlpha = hitAlpha * 0.18;
    const _ehl = ctx.createRadialGradient(x-s*0.4, y-s*0.5, 0, x-s*0.3, y-s*0.3, s*1.5);
    _ehl.addColorStop(0,  'rgba(255,255,255,0.85)');
    _ehl.addColorStop(0.4,'rgba(255,255,255,0.3)');
    _ehl.addColorStop(1,  'rgba(255,255,255,0)');
    ctx.fillStyle = _ehl;
    ctx.beginPath(); ctx.ellipse(x, y, s*1.6, s*1.3, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.restore(); // end flip transform

  // HP 바 (플립/밥 없이 원래 위치에)
  if(e.maxHp>2){
    const isElite = e.isEliteBoss;
    const isBoss  = e.isBoss;
    const bw = isBoss?e.size*2.8:isElite?e.size*2.4:e.size*2.2;
    const bh = isBoss?6:isElite?5:3;
    const by = e.y - e.size - (isBoss?14:isElite?12:8);
    const hpRatio = e.hp/e.maxHp;
    const hpColor = isBoss?'#c9a84c':
                    e.type==='elite_berserker'?'#e05050':
                    e.type==='elite_necromancer'?'#9b6ee8':
                    e.type==='elite_colossus'?'#40a060':e.color;
    ctx.save(); ctx.globalAlpha=0.88;
    // 배경바
    ctx.fillStyle='#111'; ctx.fillRect(e.x-bw/2,by,bw,bh);
    // HP바 (체력 낮으면 붉게 펄스)
    if(hpRatio < 0.3){
      const pulse = 0.7+0.3*Math.abs(Math.sin(_now*0.008));
      ctx.globalAlpha=pulse*0.88;
    }
    ctx.fillStyle=hpRatio<0.3?'#ff4040':hpColor;
    ctx.fillRect(e.x-bw/2,by,bw*hpRatio,bh);
    ctx.restore();
  }
  ctx.restore(); // end outer save
}

// ═══════════════════════════════════════════════
//  CARD SELECTION
// ═══════════════════════════════════════════════

function showPowerUpToast(card) {
  // 카드 획득 시 현재 데미지 배율을 간략히 표시
  const s = gs.skills;
  const bullets = 1 + (s.bulletCount||0);
  const dmgMult = relicsBulletMult ? relicsBulletMult() : 1;
  const dps = Math.round(bullets * dmgMult * 2 * (60 / Math.max(6, 22 - Math.floor((s.fireRateBonus||0)/45))));
  showToast(`✨ ${card.name} 획득! · 예상 DPS: ~${dps}`, 2000);
}

// showCardSelection(onDone)  또는  showCardSelection(onDone, {title, sub, count})
// count 는 반드시 숫자여야 함 — 이전 버그(문자열 '3' 전달) 수정
function showCardSelection(onDone, opts) {
  const title = (opts && opts.title) || t('룬 선택', 'Rune Select');
  const _baseCount = (opts && opts.count) || 3;
  const _extraCard = 0;
  const count = Math.max(1, (parseInt(_baseCount) || 3) + _extraCard);
  const sub   = (opts && opts.sub)   || t(`룬을 ${count}장 선택하세요`, `Choose ${count} rune${count>1?'s':''}`);

  document.getElementById('cardScreenTitle').textContent = title;
  document.getElementById('cardScreenSub').textContent   = sub;

  // ── 현재 상태 바 (컴팩트 + 접기/펼치기) ──
  document.getElementById('_cardStatBar')?.remove();
  document.getElementById('cardSynBar')?.remove();
  document.getElementById('_cardInfoPanel')?.remove();

  const activeSynsNow = getActiveSynergies();
  const deckIdSet = new Set(gs.deck.map(c=>c.id));
  const nearSyns = SYNERGIES
    .filter(syn => !activeSynsNow.includes(syn))
    .map(syn => ({syn, have: syn.requires.filter(r=>deckIdSet.has(r)).length, total: syn.requires.length}))
    .filter(x => x.have > 0)
    .sort((a,b) => (b.have/b.total) - (a.have/a.total))
    .slice(0, 4);

  const infoPanel = document.createElement('div');
  infoPanel.id = '_cardInfoPanel';
  infoPanel.style.cssText = 'width:100%;max-width:600px;margin:0 auto;';

  // ── 항상 보이는 줄: 활성 시너지 + 토글 버튼 ──
  const alwaysRow = document.createElement('div');
  alwaysRow.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:28px;';

  if (activeSynsNow.length > 0) {
    activeSynsNow.forEach(syn => {
      const pill = document.createElement('span');
      pill.style.cssText = `background:${syn.color}22;border:1px solid ${syn.color}66;border-radius:100px;
        padding:3px 11px;font-size:11px;color:${syn.color};font-weight:700;white-space:nowrap;`;
      pill.textContent = `${syn.emoji} ${syn.name} ✓`;
      alwaysRow.appendChild(pill);
    });
  } else {
    const noSyn = document.createElement('span');
    noSyn.style.cssText = 'font-size:11px;color:rgba(100,130,160,0.6);';
    noSyn.textContent = '활성 시너지 없음';
    alwaysRow.appendChild(noSyn);
  }

  // 토글 버튼 (스탯 + 진행 중 시너지)
  const detailCount = nearSyns.length;
  const toggleBtn = document.createElement('button');
  toggleBtn.style.cssText = `margin-left:6px;padding:3px 10px;font-size:10px;font-family:'Noto Sans KR',sans-serif;
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:100px;
    color:rgba(160,190,220,0.7);cursor:pointer;transition:all 0.18s;white-space:nowrap;`;
  toggleBtn.textContent = `📊 스탯 · 시너지 진행 ${detailCount > 0 ? `(+${detailCount})` : ''}`;
  alwaysRow.appendChild(toggleBtn);
  infoPanel.appendChild(alwaysRow);

  // ── 접혀 있는 상세 패널 ──
  const detailPanel = document.createElement('div');
  detailPanel.style.cssText = 'display:none;padding:10px 0 0;';

  // 스탯 한 줄
  if (gs && gs.player) {
    const s2 = gs.skills || {};
    const bullets = 1 + (s2.bulletCount||0);
    const fireMs = Math.round(Math.max(6, 22 - Math.floor((s2.fireRateBonus||0)/45)) / 60 * 1000);
    const hp = Math.ceil(gs.player.hp), mhp = gs.player.maxHp;
    const hpCol = hp/mhp>0.6?'#4ecf7a':hp/mhp>0.3?'#f8a030':'#e05050';
    const statRow = document.createElement('div');
    statRow.style.cssText = 'display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;';
    statRow.innerHTML = [
      {l:'HP', v:`${hp}/${mhp}`, c:hpCol},
      {l:'탄수', v:`×${bullets}발`, c:bullets>=4?'#f8e030':bullets>=2?'#4ecf7a':'#8aaccc'},
      {l:'발사', v:`${fireMs}ms`, c:fireMs<300?'#f87040':fireMs<450?'#f8c030':'#8aaccc'},
      {l:'룬', v:`${gs.deck.length}장`, c:'#c8a8ff'},
      {l:'골드', v:`🪙${gs.gold}`, c:'#c9a84c'},
    ].map(x=>`<span style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
      border-radius:8px;padding:2px 9px;font-size:10px;font-family:'Noto Sans KR',sans-serif;">
      <span style="color:#4a6a8a">${x.l} </span><span style="color:${x.c};font-weight:700">${x.v}</span></span>`).join('');
    detailPanel.appendChild(statRow);
  }

  // 진행 중 시너지
  if (nearSyns.length > 0) {
    const nearRow = document.createElement('div');
    nearRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:5px;justify-content:center;';
    nearSyns.forEach(({syn,have,total}) => {
      const pill = document.createElement('span');
      // 진행 바 느낌: have/total 비율로 배경 채우기
      const pct = Math.round(have/total*100);
      pill.style.cssText = `position:relative;overflow:hidden;border:1px solid ${syn.color}33;border-radius:100px;
        padding:3px 11px;font-size:11px;color:#8aaac8;background:rgba(255,255,255,0.03);`;
      pill.innerHTML = `<span style="position:absolute;inset:0;width:${pct}%;background:${syn.color}18;border-radius:inherit;"></span>
        <span style="position:relative">${syn.emoji} ${syn.name} <span style="color:${syn.color};font-weight:700">${have}/${total}</span></span>`;
      nearRow.appendChild(pill);
    });
    detailPanel.appendChild(nearRow);
  }

  infoPanel.appendChild(detailPanel);

  let _detailOpen = false;
  toggleBtn.addEventListener('click', () => {
    _detailOpen = !_detailOpen;
    detailPanel.style.display = _detailOpen ? 'block' : 'none';
    toggleBtn.style.background = _detailOpen ? 'rgba(100,160,255,0.12)' : 'rgba(255,255,255,0.05)';
    toggleBtn.style.borderColor = _detailOpen ? 'rgba(100,160,255,0.35)' : 'rgba(255,255,255,0.12)';
    toggleBtn.style.color = _detailOpen ? '#9ac8ff' : 'rgba(160,190,220,0.7)';
  });

  document.getElementById('cardScreenSub').after(infoPanel);

  // 가중치 적용 랜덤 선택 (noDupe: 덱에 없는 카드 우선)
  // ACT별 희귀도 가중치 보정: 후반일수록 rare/epic 비율 증가
  const noDupe = !!(opts && opts.noDupe);
  const deckIds = new Set(gs.deck.map(c => c.id));
  const actRarityBoost = gs.act >= 3
    ? {common:3, uncommon:3, rare:3, epic:2, curse:1}   // ACT3: rare/epic 비중 대폭 증가
    : gs.act >= 2
    ? {common:5, uncommon:3, rare:2, epic:1, curse:1}   // ACT2: 살짝 보정
    : {...RARITY_WEIGHT, curse:0};                       // ACT1: 저주 카드 미등장
  // 테마 카드 ID 세트 (없으면 빈 Set)
  const _themeCardSet = new Set(gs.buildTheme?.cardIds || []);
  // 정제된 룬: 커먼 가중치를 절반으로 (언커먼↑ 상대적으로 유리)
  const _qualityBoost = false;
  function buildWeighted(pool) {
    const w = [];
    pool.forEach(c => {
      let wt = actRarityBoost[c.rarity] || 1;
      if (_qualityBoost && c.rarity === 'common') wt = Math.max(1, Math.floor(wt * 0.4));
      // 빌드 테마 카드 +50% 가중치 (운빨 유지하면서 방향성 부여)
      if (_themeCardSet.has(c.id)) wt = Math.round(wt * 1.5);
      for(let i=0;i<wt;i++) w.push(c);
    });
    return w;
  }
  // ── 카드 생성 헬퍼 (리롤 시 재사용) ──
  function _pickCards(excludeIds) {
    const _basePool = noDupe
      ? CARD_POOL.filter(c => !deckIds.has(c.id) && !excludeIds.has(c.id))
      : CARD_POOL.filter(c => !excludeIds.has(c.id));
    const _fallback = CARD_POOL.filter(c => !excludeIds.has(c.id));
    let _w = buildWeighted(_basePool.length >= count ? _basePool : (_fallback.length ? _fallback : CARD_POOL));
    const _result = [], _seen = new Set();
    let _s = 0;
    while(_result.length < count && _w.length > 0 && ++_s < 1000) {
      const idx = Math.floor(Math.random() * _w.length);
      const c = _w.splice(idx, 1)[0];
      if(!_seen.has(c.id)){ _seen.add(c.id); _result.push(c); }
    }
    return _result;
  }

  const newPool  = noDupe ? CARD_POOL.filter(c => !deckIds.has(c.id)) : CARD_POOL;
  const fullPool = CARD_POOL;
  let weighted = buildWeighted(newPool.length >= count ? newPool : fullPool);
  const selected = [], seen = new Set();
  let safety = 0;
  while(selected.length < count && weighted.length > 0 && ++safety < 1000) {
    const idx = Math.floor(Math.random() * weighted.length);
    const c = weighted.splice(idx, 1)[0];
    if(!seen.has(c.id)){ seen.add(c.id); selected.push(c); }
  }

  // [V3] 카드 선택지 0장 방지: 카드 없으면 골드 보상으로 대체
  if (selected.length === 0) {
    gs.gold += 15;
    showToast('카드 없음 — +15🪙 보상', 2000);
    if(onDone) onDone(); else showMapScreen();
    return;
  }

  // 리롤: 이미 보여준 카드 id 누적 (같은 카드 반복 등장 방지)
  const _shownInSession = new Set(selected.map(c => c.id));

  const row = document.getElementById('cardRow');
  row.innerHTML = '';

  // 상세 툴팁 (우클릭/꾹누르기)
  let _detailTip = document.getElementById('_cardDetailTip');
  if (!_detailTip) {
    _detailTip = document.createElement('div');
    _detailTip.id = '_cardDetailTip';
    _detailTip.style.cssText = `position:fixed;z-index:9999;display:none;max-width:260px;
      background:#0d1526;border:1px solid rgba(100,140,200,0.35);border-radius:14px;
      padding:14px 16px;font-family:'Noto Sans KR',sans-serif;font-size:11px;color:#c8d8e8;
      box-shadow:0 8px 32px rgba(0,0,0,0.7);pointer-events:none;`;
    document.body.appendChild(_detailTip);
  }
  function showCardDetail(card, preview, contrib, anchorEl) {
    let html = `<div style="font-size:13px;font-weight:700;color:#e8f0ff;margin-bottom:6px">${card.emoji} ${card.name}</div>`;
    html += `<div style="color:#8090a8;margin-bottom:8px;line-height:1.5">${card.desc}</div>`;
    html += `<div style="color:#c9a84c;font-size:10px;margin-bottom:10px">${card.effect}</div>`;
    if (preview.length > 0) {
      html += preview.map(s =>
        `<div style="padding:6px 8px;border-radius:8px;background:${s.color}18;border:1px solid ${s.color}55;margin-bottom:6px">
          <div style="color:${s.color};font-weight:700;margin-bottom:3px">✨ ${s.emoji} ${s.name} 발동!</div>
          <div style="color:${s.color}99;font-size:9px;line-height:1.4">${s.desc}</div></div>`
      ).join('');
    }
    if (contrib.length > 0) {
      contrib.forEach(({ syn, missing, have, total }) => {
        const missingNames = CARD_POOL.filter(c=>missing.includes(c.id)).map(c=>`${c.emoji}${c.name}`).join(', ')||'?';
        html += `<div style="padding:5px 8px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid ${syn.color}33;margin-bottom:5px">
          <span style="color:${syn.color};font-weight:700">${syn.emoji} ${syn.name}</span>
          <span style="color:#5a7a9a"> ${have+1}/${total}</span>
          ${missing.length>0?`<div style="color:#4a6a8a;margin-top:3px;font-size:9px">추가 필요: ${missingNames}</div>`:''}
        </div>`;
      });
    }
    if (preview.length === 0 && contrib.length === 0) {
      html += `<div style="color:#4a6a8a;font-size:10px">시너지 없음</div>`;
    }
    html += `<div style="margin-top:8px;color:#3a5a7a;font-size:9px;text-align:center">우클릭 / 꾹누르기로 열었습니다</div>`;
    _detailTip.innerHTML = html;
    _detailTip.style.display = 'block';
    const rect = anchorEl.getBoundingClientRect();
    let left = rect.right + 8;
    if (left + 270 > window.innerWidth) left = rect.left - 278;
    let top = Math.min(rect.top, window.innerHeight - _detailTip.offsetHeight - 12);
    _detailTip.style.left = Math.max(4, left) + 'px';
    _detailTip.style.top  = Math.max(4, top)  + 'px';
  }
  function hideCardDetail() { _detailTip.style.display = 'none'; }
  document.addEventListener('click', hideCardDetail, { once: true });

  // ── 💫 레벨업 연출 (등급별 플래시 + 중앙 팝업 + 화음) ──
  function _levelUpEffect(card, anchorEl) {
    const _RC = {
      common:   { c:'#8ab8d8', g:'120,170,220', s:[[523,0.20,'sine',0.09],[659,0.18,'sine',0.08]] },
      uncommon: { c:'#40c8ff', g:'40,180,255',  s:[[440,0.22,'sine',0.09],[554,0.20,'sine',0.08],[659,0.18,'sine',0.07]] },
      rare:     { c:'#d090ff', g:'160,80,255',  s:[[392,0.25,'sine',0.10],[523,0.22,'sine',0.08],[659,0.20,'sine',0.07],[784,0.18,'sine',0.06]] },
      epic:     { c:'#ffc840', g:'255,180,0',   s:[[330,0.30,'sine',0.11],[415,0.26,'sine',0.09],[523,0.22,'sine',0.08],[659,0.20,'sine',0.07],[880,0.18,'sine',0.06]] },
      curse:    { c:'#ff5555', g:'255,60,60',   s:[[220,0.30,'sawtooth',0.10],[165,0.22,'sawtooth',0.08]] }
    };
    const rc = _RC[card.rarity] || _RC.common;
    // 사운드 (등급별 화음)
    rc.s.forEach(([f,v,tp,d],i) => setTimeout(()=>playSound(f,v,tp,d), i*75));
    // 화면 플래시 (방사형 그라디언트)
    const _fl = document.createElement('div');
    _fl.style.cssText = `position:fixed;inset:0;z-index:8000;pointer-events:none;opacity:0;
      background:radial-gradient(ellipse 70% 70% at 50% 50%,rgba(${rc.g},0.22) 0%,transparent 70%);
      transition:opacity 0.07s ease;`;
    document.body.appendChild(_fl);
    requestAnimationFrame(()=>{ _fl.style.opacity='1'; });
    setTimeout(()=>{ _fl.style.transition='opacity 0.55s ease'; _fl.style.opacity='0'; },90);
    setTimeout(()=>_fl.remove(),700);
    // 중앙 팝업 (이모지 + 카드명 + 등급)
    const _RL = {common:'',uncommon:'UNCOMMON',rare:'✦ RARE ✦',epic:'⚡ EPIC ⚡',curse:'💀 CURSE 💀'};
    const _pop = document.createElement('div');
    _pop.style.cssText = `position:fixed;z-index:8500;pointer-events:none;
      left:50%;top:50%;transform:translate(-50%,-50%) scale(0.5);
      font-family:'Jua',sans-serif;text-align:center;opacity:0;
      transition:all 0.35s cubic-bezier(0.16,1,0.3,1);`;
    _pop.innerHTML = `<div style="font-size:64px;line-height:1;filter:drop-shadow(0 0 28px ${rc.c});">${card.emoji}</div>
      <div style="font-size:20px;font-weight:800;color:${rc.c};text-shadow:0 0 18px ${rc.c}88;
        letter-spacing:0.5px;margin-top:8px;">${card.name}</div>
      ${_RL[card.rarity]?`<div style="font-size:10px;color:${rc.c}99;margin-top:3px;letter-spacing:3px;">${_RL[card.rarity]}</div>`:''}`;
    document.body.appendChild(_pop);
    requestAnimationFrame(()=>{ _pop.style.opacity='1'; _pop.style.transform='translate(-50%,-50%) scale(1)'; });
    setTimeout(()=>{ _pop.style.transition='all 0.38s ease'; _pop.style.opacity='0'; _pop.style.transform='translate(-50%,-58%) scale(1.05)'; },400);
    setTimeout(()=>_pop.remove(),850);
  }

  // 카드 행 렌더링 (초기 + 리롤 공용)
  function _renderCardRow(cardList) { cardList.forEach((card, _cardIdx) => {
    const el = document.createElement('div');
    el.className = `card ${card.rarity}`;
    // 카드별 슬라이드인 딜레이 (0ms, 80ms, 160ms…)
    el.style.animationDelay = `${_cardIdx * 80}ms`;
    const preview = getSynergyPreview(card.id);
    const contrib = preview.length === 0 ? getSynergyContribution(card.id) : [];

    // 기본 뷰: 아이콘/이름/등급/설명/효과 + 발동 배지만
    const _isCurseCard = card.rarity === 'curse';
    el.innerHTML = `<div class="card-icon">${card.emoji}</div>
      <div class="card-name">${card.name}</div>
      <div class="card-rarity">${_isCurseCard ? '💀 CURSE' : card.rarity.toUpperCase()}</div>
      <div class="card-desc">${card.desc}${card.flavor ? `<div style="font-size:9px;color:rgba(255,255,255,0.4);font-style:italic;margin-top:4px;line-height:1.4">${card.flavor}</div>` : ''}</div>
      <div class="card-effect">${card.effect}</div>
      ${_isCurseCard ? `<div style="margin-top:6px;padding:3px 8px;border-radius:6px;background:rgba(224,80,80,0.12);border:1px solid rgba(224,80,80,0.3);font-size:9px;color:#e05050;font-weight:700;">⚠️ 고위험 고보상</div>` : ''}`;

    // 시너지 발동 배지만 기본 표시 (✨ 발동 시에만)
    if (preview.length > 0) {
      const badge = document.createElement('div');
      badge.style.cssText = `margin-top:8px;padding:5px 8px;border-radius:8px;
        background:${preview[0].color}18;border:1px solid ${preview[0].color}66;text-align:center;`;
      badge.innerHTML = preview.map(s =>
        `<div style="color:${s.color};font-size:10px;font-weight:700">✨ ${s.emoji} ${s.name} 발동!</div>`
      ).join('');
      el.appendChild(badge);
    } else if (contrib.length > 0) {
      // 미완성 시너지: 아이콘 힌트 한 줄만 (최소 표시)
      const hint = document.createElement('div');
      hint.style.cssText = `margin-top:6px;padding:3px 6px;border-radius:6px;font-size:9px;
        color:#5a7a9a;text-align:center;`;
      hint.textContent = contrib.slice(0,2).map(({syn,have,total})=>`${syn.emoji} ${have+1}/${total}`).join('  ');
      el.appendChild(hint);
    }

    // 우클릭 — 상세 정보
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      showCardDetail(card, preview, contrib, el);
    });

    // 꾹누르기 (모바일 500ms)
    let pressTimer = null;
    el.addEventListener('touchstart', () => {
      pressTimer = setTimeout(() => { showCardDetail(card, preview, contrib, el); }, 500);
    }, { passive: true });
    el.addEventListener('touchend',  () => { clearTimeout(pressTimer); pressTimer = null; });
    el.addEventListener('touchmove', () => clearTimeout(pressTimer));

    let _descShown = false;
    el.addEventListener('click', (e) => {
      const descEl = el.querySelector('.card-desc');
      if (descEl && window.innerWidth < 768) { // 모바일만
        _descShown = !_descShown;
        descEl.style.display = _descShown ? 'block' : '';
      }
    });

    el.onclick = () => {
      if (bt && bt._cardSelectBlocked) return;
      hideCardDetail();
      _hideRerollBtn();
      // 선택 flash 이펙트 (등급별 색상 발광)
      const _cgc = {common:'rgba(140,180,220,0.7)',uncommon:'rgba(40,200,255,0.85)',rare:'rgba(180,100,255,0.9)',epic:'rgba(255,190,0,0.95)',curse:'rgba(255,70,70,0.85)'};
      el.style.transition = 'box-shadow 0.12s ease, transform 0.12s ease';
      el.style.boxShadow = `0 0 52px 20px ${_cgc[card.rarity]||_cgc.common}`;
      el.style.transform = 'scale(1.07)';
      setTimeout(()=>{ el.style.transition='opacity 0.42s ease, transform 0.42s ease'; el.style.opacity='0'; el.style.transform='scale(1.12)'; },140);
      row.querySelectorAll('.card').forEach(c => { if(c!==el){ c.style.transition='opacity 0.2s'; c.style.opacity='0'; c.onclick=null; } });
      row.querySelectorAll('.card').forEach(c => c.onclick = null);
      // ── 중복 카드 강화 체크 (push 전에 확인) ──
      const _isDupe = gs.deck.some(d => d.id === card.id);
      gs.deck.push(card);
      trackMission('cards', 1);
      // pick(n) 콜백: 카드가 추가 룬 선택을 n회 요청할 때 사용
      let _extraPicks = 0;
      const _cardPick = (n=1) => { _extraPicks += n; };
      card.action(gs.skills, gs.player, gs, _cardPick);
      // ── 중복 강화 발동 (1회만) ──
      if (_isDupe && CARD_UPGRADES[card.id]) {
        if (!gs._upgradedCards) gs._upgradedCards = new Set();
        if (!gs._upgradedCards.has(card.id)) {
          gs._upgradedCards.add(card.id);
          const upg = CARD_UPGRADES[card.id];
          upg.bonus(gs.skills, gs.player, gs);
          setTimeout(() => {
            showToast(`⬆️ ${upg.emoji} ${card.name} 강화! — ${upg.desc}`, 2800);
          }, 350);
          playSound(880,0.25,'sine',0.08);
          setTimeout(()=>playSound(1100,0.2,'sine',0.06),80);
        }
      }
      if(typeof updateGrowthBar==='function') setTimeout(updateGrowthBar, 100);
      const newSyns = applyAllSynergies();
      if (newSyns.length > 0) {
        const names = newSyns.map(s=>s.emoji+' '+s.name).join(', ');
        setTimeout(() => showToast(`✨ 시너지 발동! ${names}`, 2500), 400);
        [660,784,988].forEach((f,i)=>setTimeout(()=>playSound(f,0.2,'sine',0.07),i*80));
        // 드라마틱 배너
        const bn = document.createElement('div');
        bn.style.cssText = `position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.6);z-index:9000;
    text-align:center;pointer-events:none;opacity:0;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);`;
        bn.innerHTML = newSyns.map(sy=>`<div style="font-size:32px;margin-bottom:4px;">${sy.emoji}</div>
    <div style="font-family:'Cinzel',serif;font-size:22px;color:${sy.color};text-shadow:0 0 20px ${sy.color};font-weight:800;">${sy.name}</div>
    <div style="font-size:13px;color:${sy.color}99;margin-top:4px;">시너지 발동!</div>`).join('<hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:12px 0;">');
        document.body.appendChild(bn);
        requestAnimationFrame(()=>{ bn.style.opacity='1'; bn.style.transform='translate(-50%,-50%) scale(1)'; });
        setTimeout(()=>{ bn.style.opacity='0'; bn.style.transform='translate(-50%,-50%) scale(1.1)'; }, 1600);
        setTimeout(()=>bn.remove(), 2000);
      } else {
        _levelUpEffect(card, el);
        showToast(`✨ ${card.name} 획득!`);
      }
      // pick(n)을 요청한 카드: 추가 선택 체인 후 onDone (480ms 딜레이 — 연출 후 전환)
      setTimeout(() => {
        if (_extraPicks > 0) {
          let _chain = onDone || (() => showMapScreen());
          for (let _pi = 0; _pi < _extraPicks; _pi++) {
            const _next = _chain;
            _chain = () => setTimeout(() => showCardSelection(_next, {title:t('📜 추가 룬 선택','📜 Bonus Rune'), sub:t('계약의 대가로 룬을 선택하세요','Choose a rune as pact reward'), count:3}), 220);
          }
          _chain();
        } else {
          if(onDone) onDone(); else showMapScreen();
        }
      }, 480);
    };
    row.appendChild(el);
  }); } // _renderCardRow 끝
  _renderCardRow(selected); // 초기 렌더링

  const skipBtn = document.getElementById('skipCardBtn');
  skipBtn.onclick = () => {
    skipBtn.onclick = null;
    _hideRerollBtn();
    if(onDone) onDone(); else showMapScreen();
  };

  // ── 💎 리롤 버튼 ──
  const _rerollRow = document.getElementById('_cardRerollRow');
  const _rerollBtn = document.getElementById('_rerollBtn');
  const _rerollGemCount = document.getElementById('_rerollGemCount');

  function _hideRerollBtn() {
    if (_rerollRow) _rerollRow.style.display = 'none';
    if (_rerollBtn) _rerollBtn.onclick = null;
  }
  function _updateRerollBtn() {
    if (!_rerollRow) return;
    const gems = prem.gems || 0;
    _rerollGemCount.textContent = gems;
    const canReroll = gems >= 1;
    _rerollBtn.style.opacity = canReroll ? '1' : '0.38';
    _rerollBtn.style.cursor = canReroll ? 'pointer' : 'not-allowed';
    _rerollBtn.style.borderColor = canReroll ? 'rgba(80,180,255,0.5)' : 'rgba(80,80,80,0.3)';
  }

  // 리롤 실행 함수
  function _executeReroll() {
    if ((prem.gems || 0) < 1) { showToast('💎 다이아가 부족합니다!', 1200); return; }
    prem.gems--;
    if (typeof savePremium === 'function') savePremium();
    playSound(660, 0.15, 'sine', 0.06); playSound(880, 0.12, 'sine', 0.05);

    // 새 카드 뽑기 (이미 보여준 카드 제외)
    const _newCards = _pickCards(_shownInSession);
    _newCards.forEach(c => _shownInSession.add(c.id));

    if (_newCards.length === 0) { showToast('더 이상 새 카드가 없습니다', 1500); _updateRerollBtn(); return; }

    // 카드 행 갱신 (슬라이드아웃 → 슬라이드인)
    row.querySelectorAll('.card').forEach(c => {
      c.style.transition = 'all 0.18s ease';
      c.style.opacity = '0'; c.style.transform = 'translateY(-20px) scale(0.9)';
    });
    setTimeout(() => {
      row.innerHTML = '';
      _renderCardRow(_newCards);
      requestAnimationFrame(() => {
        row.querySelectorAll('.card').forEach((c, i) => {
          c.style.opacity = '0'; c.style.transform = 'translateY(28px) scale(0.93)';
          setTimeout(() => {
            c.style.transition = 'opacity 0.28s ease, transform 0.28s cubic-bezier(0.16,1,0.3,1)';
            c.style.opacity = '1'; c.style.transform = 'translateY(0) scale(1)';
          }, i * 60);
        });
      });
      _updateRerollBtn();
    }, 200);

    showToast(`🔄 리롤! 💎 ${prem.gems} 남음`, 1000);
  }

  if (_rerollRow) {
    _rerollRow.style.display = 'flex';
    _updateRerollBtn();
    _rerollBtn.onclick = _executeReroll;
  }

  // ── 전투 결과 배너 (battleWon 직후 카드 선택 시만 표시) ──
  const _prevResultEl = document.getElementById('_btResultBanner');
  if (_prevResultEl) _prevResultEl.remove();
  const _br = window._btResult;
  if (_br) {
    window._btResult = null;
    const _brEl = document.createElement('div');
    _brEl.id = '_btResultBanner';
    const _noDmgTag = _br.noDmg ? `<span style="background:#1a3a20;border:1px solid #4ecf7a55;border-radius:8px;padding:2px 10px;font-size:11px;color:#4ecf7a;font-weight:700;">✨ 무결점</span>` : '';
    const _typeTag = _br.isElite
      ? `<span style="background:#1e0a30;border:1px solid #9b6ee855;border-radius:8px;padding:2px 10px;font-size:11px;color:#b880f0;font-weight:700;">⚔️ 엘리트</span>`
      : `<span style="background:#0a1830;border:1px solid #4a9eff55;border-radius:8px;padding:2px 10px;font-size:11px;color:#6abaff;font-weight:700;">🏆 클리어</span>`;
    _brEl.style.cssText = `width:100%;max-width:560px;margin:0 auto 8px;padding:12px 20px;
      background:linear-gradient(135deg,rgba(8,18,40,0.9) 0%,rgba(12,24,50,0.9) 100%);
      border:1px solid rgba(255,255,255,0.08);border-radius:14px;display:flex;
      align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
      animation:waveNotifIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;`;
    _brEl.innerHTML = `
      ${_typeTag}${_noDmgTag}
      <span style="color:#e8d090;font-size:12px;">처치 <b style="color:#fff">${_br.kills}</b></span>
      <span style="color:#c9a84c;font-size:12px;">🪙 <b style="color:#ffe080">+${_br.gold}</b></span>
      ${_br.noDmgBonus ? `<span style="color:#4ecf7a;font-size:12px;">보너스 <b>+${_br.noDmgBonus}🪙</b></span>` : ''}`;
    const _cardScreenEl = document.getElementById('cardScreen');
    _cardScreenEl.insertBefore(_brEl, _cardScreenEl.firstChild);
  }

  showScreen('cardScreen');

  // 카드 입장 애니메이션 — 아래에서 순서대로 슬라이드인
  requestAnimationFrame(() => {
    const cards = row.querySelectorAll('.card');
    cards.forEach((c, i) => {
      c.style.opacity = '0';
      c.style.transform = 'translateY(36px) scale(0.92)';
      c.style.transition = 'none';
      setTimeout(() => {
        c.style.transition = `opacity 0.32s ease, transform 0.32s cubic-bezier(0.16,1,0.3,1)`;
        c.style.opacity = '';
        c.style.transform = '';
      }, 60 + i * 80);
    });
  });
}

function showDeckScreen() {
  const prevScreen = gs.screen;
  document.getElementById('deckCount').textContent = gs.deck.length;
  const grid = document.getElementById('deckGrid');
  grid.innerHTML = '';
  if(gs.deck.length === 0){
    grid.innerHTML = '<div style="color:var(--text2);font-size:13px;text-align:center;width:100%;padding:20px;">아직 룬이 없습니다.</div>';
  }
  gs.deck.forEach(c=>{
    const el=document.createElement('div');
    el.className='deck-card-mini';
    el.style.borderColor = c._upgraded ? '#f0c050' : (RARITY_COLOR[c.rarity]||'var(--border)');
    if (c._upgraded) el.style.background = 'rgba(240,192,80,0.07)';
    el.innerHTML=`<span class="d-icon">${c.emoji}</span>${c.name}${c._upgraded?'<span style="color:#f0c050;font-weight:700">+</span>':''}<div style="font-size:9px;color:${RARITY_COLOR[c.rarity]};margin-top:2px;">${c.rarity.toUpperCase()}${c._upgraded?'<span style="color:#f0c050"> ★</span>':''}</div>`;
    grid.appendChild(el);
  });

  // 시너지 현황 표시
  const synContainer = document.createElement('div');
  synContainer.style.cssText = 'width:100%;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);';
  synContainer.innerHTML = '<div style="font-size:12px;color:var(--text2);margin-bottom:12px;text-align:center;letter-spacing:1px;">⚡ 시너지</div>';

  const deckIds = new Set(gs.deck.map(c=>c.id));
  const sortedSyns = [...SYNERGIES].sort((a,b) => {
    const pa = a.requires.filter(r=>deckIds.has(r)).length / a.requires.length;
    const pb = b.requires.filter(r=>deckIds.has(r)).length / b.requires.length;
    return pb - pa; // 진행도 높은 순
  });
  sortedSyns.forEach(syn => {
    const gotCount = syn.requires.filter(r => deckIds.has(r)).length;
    const total = syn.requires.length;
    const isActive = gotCount === total;
    const pct = gotCount / total;
    const missingIds = syn.requires.filter(r => !deckIds.has(r));
    const missingCards = missingIds.map(id => CARD_POOL.find(c=>c.id===id)).filter(Boolean);

    const el2 = document.createElement('div');
    el2.style.cssText = `
      margin-bottom:8px;padding:10px 12px;border-radius:10px;
      border:1px solid ${isActive ? syn.color+'88' : pct>0 ? syn.color+'33' : 'rgba(255,255,255,0.06)'};
      background:${isActive ? syn.color+'14' : pct>0 ? syn.color+'07' : 'rgba(255,255,255,0.02)'};
    `;

    const missingHtml = isActive
      ? `<div style="font-size:10px;color:${syn.color};font-weight:700;margin-top:4px;">✓ 발동 중 — ${syn.desc}</div>`
      : missingCards.length > 0
        ? `<div style="font-size:10px;color:#5a7a9a;margin-top:5px;">필요: ${missingCards.map(c=>`<span style="color:#8aa0c8">${c.emoji} ${c.name}</span>`).join(' · ')}</div>`
        : '';

    el2.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:20px;">${syn.emoji}</span>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-size:12px;font-weight:700;color:${isActive?syn.color:'#c8d8e8'}">${syn.name}</span>
            ${isActive ? `<span style="font-size:9px;background:${syn.color}22;border:1px solid ${syn.color}55;color:${syn.color};border-radius:100px;padding:1px 6px;letter-spacing:1px">ACTIVE</span>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:5px;">
            <div style="flex:1;height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;">
              <div style="width:${pct*100}%;height:100%;background:${syn.color};border-radius:3px;transition:width 0.4s;"></div>
            </div>
            <span style="font-size:10px;font-weight:700;color:${isActive?syn.color:'#6b8aaa'};flex-shrink:0">${gotCount}/${total}</span>
          </div>
        </div>
      </div>
      ${missingHtml}
    `;
    synContainer.appendChild(el2);
  });
  grid.parentElement.appendChild(synContainer);

  // 유물 현황 섹션
  const relicSection2 = document.createElement('div');
  relicSection2.style.cssText='width:100%;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);';
  if(gs.relics.length===0){
    relicSection2.innerHTML='<div style="color:var(--text2);font-size:13px;text-align:center;padding:12px;">아직 아티팩트가 없습니다.</div>';
  } else {
    relicSection2.innerHTML='<div style="font-size:12px;color:var(--text2);margin-bottom:12px;text-align:center;letter-spacing:1px;">✦ 보유 아티팩트</div>';
    gs.relics.forEach(r=>{
      const el3=document.createElement('div');
      el3.style.cssText=`display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:10px 12px;
        border-radius:10px;border:1px solid ${r.color}44;background:${r.color}0a;`;
      el3.innerHTML=`<span style="font-size:26px;">${r.emoji}</span>
        <div>
          <div style="font-size:12px;font-weight:700;color:${r.color};">${r.name}</div>
          <div style="font-size:10px;color:#6a8a9a;margin-top:2px;">${r.desc}</div>
        </div>`;
      relicSection2.appendChild(el3);
    });
  }
  grid.parentElement.appendChild(relicSection2);

  showScreen('deckScreen');
  document.getElementById('closeDeckBtn').onclick = () => {
    if(prevScreen==='mapScreen')showMapScreen();
    else showScreen('__battle__');
  };
}

document.getElementById('deckBtn').onclick = () => showDeckScreen();

function showShop() {
  trackMission('shop', 1);
  showScreen('shopScreen');
  const _shopTitle = document.getElementById('shopTitle');
  if (_shopTitle) _shopTitle.textContent = t('🏪 상점', '🏪 Shop');
  const _shopGoldLabel = document.getElementById('shopGoldLabel');
  if (_shopGoldLabel) _shopGoldLabel.textContent = t('보유 골드', 'Gold');
  const _leaveShopBtn = document.getElementById('leaveShopBtn');
  if (_leaveShopBtn) _leaveShopBtn.textContent = t('🗺️ 지도로 돌아가기', '🗺️ Back to Map');
  const _updateGold = () => {
    const el = document.getElementById('shopGold');
    if(el) el.textContent = gs.gold;
  };
  _updateGold();
  // 이전 내용 초기화
  ['shopRelicSection','shopUpgradeSection','shopRemoveSection'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.remove();
  });
  const svcSection = document.getElementById('shopServicesSection');
  if(svcSection){ svcSection.innerHTML=''; svcSection.style.display='none'; }
  const container = document.getElementById('shopItems');
  container.innerHTML = '';

  const shopDisc = 1.0;
  const cloverDisc = hasRelic('r_lucky_clover') ? 0.90 : 1.0;
  const ascShopMult = (gs.ascMult && gs.ascMult.shopPrice) || 1.0;
  const priceMult = shopDisc * cloverDisc * ascShopMult;

  // ── 아이템 렌더 헬퍼 (가로 행 스타일) ──
  function makeShopItem(emoji, name, desc, price, onBuy) {
    const adjPrice = Math.ceil(price * priceMult);
    const canBuy = gs.gold >= adjPrice;
    const el = document.createElement('div');
    el.className = `shop-item ${canBuy ? 'can-buy' : 'cannot-buy'}`;
    const surcharge = priceMult > 1 ? `<span style="font-size:9px;color:#e05050;margin-left:4px">▲${Math.round((priceMult-1)*100)}%</span>` : '';
    const discount  = priceMult < 1 ? `<span style="font-size:9px;color:#4ecf7a;margin-left:4px">▼${Math.round((1-priceMult)*100)}%</span>` : '';
    el.innerHTML = `
      <div class="si-icon">${emoji}</div>
      <div class="si-info">
        <div class="si-name">${name}</div>
        <div class="si-desc">${desc}</div>
      </div>
      <div class="si-price">🪙 ${adjPrice}${surcharge}${discount}</div>`;
    if(canBuy) {
      el.onclick = () => {
        if(gs.gold < adjPrice) return;
        gs.gold -= adjPrice;
        _updateGold();
        onBuy(el);
        el.classList.remove('can-buy');
        el.classList.add('bought');
        el.onclick = null;
      };
    }
    return el;
  }

  // ── 재고 확정 (없으면 생성) ──
  if (!gs._shopInventory) gs._shopInventory = generateShopInventory();
  const inv = gs._shopInventory;

  // ── 오늘의 특가 ──
  const dealItem = SHOP_ITEMS.find(i => i.id === inv.deal);
  if (dealItem) {
    const dName = LANG==='en' ? (dealItem.nameEn||dealItem.name) : dealItem.name;
    const dDesc = LANG==='en' ? (dealItem.descEn||dealItem.desc) : dealItem.desc;
    const dealPrice = Math.ceil(dealItem.price * 0.65 * priceMult); // 35% 할인
    const canDeal = gs.gold >= dealPrice;
    const dealEl = document.createElement('div');
    dealEl.className = `shop-item ${canDeal ? 'can-buy' : 'cannot-buy'}`;
    dealEl.style.cssText += 'border-color:rgba(255,200,40,0.5);background:rgba(255,180,0,0.07);';
    dealEl.innerHTML = `
      <div class="si-icon">${dealItem.emoji}</div>
      <div class="si-info">
        <div class="si-name" style="color:#f0d060">${dName} <span style="background:#f0c030;color:#1a1000;font-size:8px;font-weight:900;padding:1px 5px;border-radius:3px;vertical-align:middle;">-35%</span></div>
        <div class="si-desc">${dDesc}</div>
      </div>
      <div class="si-price">🪙 ${dealPrice}<span style="font-size:9px;color:#666;text-decoration:line-through;margin-left:4px">${Math.ceil(dealItem.price*priceMult)}</span></div>`;
    if (canDeal) {
      dealEl.onclick = () => {
        if (gs.gold < dealPrice) return;
        gs.gold -= dealPrice; _updateGold();
        dealItem.action(gs.skills, gs.player, gs, ()=>showCardSelection(()=>showShop(),{noDupe:true}));
        Audio.sfx.purchase();
        showToast(`${dealItem.emoji} ${dName}!`);
        dealEl.classList.replace('can-buy','bought'); dealEl.onclick=null;
      };
    }
    container.appendChild(dealEl);
  }

  // ── 일반 아이템 3개 ──
  inv.regular.forEach(id => {
    const item = SHOP_ITEMS.find(i => i.id === id);
    if (!item || item.id === 'shop_card') return;
    const iName = LANG==='en' ? (item.nameEn||item.name) : item.name;
    const iDesc = LANG==='en' ? (item.descEn||item.desc) : item.desc;
    container.appendChild(makeShopItem(item.emoji, iName, iDesc, item.price, (el) => {
      item.action(gs.skills, gs.player, gs, ()=>showCardSelection(()=>showShop(),{noDupe:true}));
      Audio.sfx.purchase();
      showToast(`${item.emoji} ${iName}!`);
    }));
  });

  // 신비한 룬 (카드 구매)
  const cardPrice = 90;
  container.appendChild(makeShopItem('🔮', t('신비한 룬','Mystery Rune'), t('랜덤 룬 1장 즉시 획득','Pick 1 random rune immediately'), cardPrice, (el) => {
    showCardSelection(()=>showShop(), {noDupe: true});
  }));

  // 체력 회복
  const healOpts = document.getElementById('healOptions');
  healOpts.innerHTML = '';
  [{hp:30,price:30,emoji:'❤️'},{hp:60,price:55,emoji:'💊'}].forEach(opt=>{
    const canH = gs.gold>=opt.price && gs.player.hp<gs.player.maxHp;
    const btn = document.createElement('button');
    btn.style.cssText = `flex:1;padding:7px 8px;border-radius:9px;font-family:'Jua',sans-serif;font-size:12px;
      border:1px solid ${canH?'rgba(78,207,122,0.45)':'rgba(255,255,255,0.07)'};
      background:${canH?'rgba(78,207,122,0.09)':'rgba(255,255,255,0.02)'};
      color:${canH?'#4ecf7a':'rgba(255,255,255,0.22)'};
      cursor:${canH?'pointer':'not-allowed'};transition:all 0.15s;line-height:1.3;`;
    btn.innerHTML = `${opt.emoji} +${opt.hp} HP<br><span style="font-size:10px;opacity:0.7">🪙 ${opt.price}</span>`;
    if(canH){
      btn.onmouseenter = ()=>{ btn.style.background='rgba(78,207,122,0.2)'; };
      btn.onmouseleave = ()=>{ btn.style.background='rgba(78,207,122,0.1)'; };
      btn.onclick=()=>{ gs.gold-=opt.price; const _h=healPlayer(opt.hp); showToast(`${opt.emoji} +${_h} HP 회복!`); showShop(); };
    }
    healOpts.appendChild(btn);
  });

  // ── 서비스 섹션 — HTML에 이미 있는 div를 재사용 ──
  const svcEl = document.getElementById('shopServicesSection');
  let svcCount = 0;

  function addService(icon, label, priceStr, canDo, accentColor, onClick) {
    const row = makeServiceBtn(icon, label, priceStr, canDo, accentColor, onClick);
    svcEl.appendChild(row);
    svcCount++;
  }

  // ── 유물 진열대 ──
  {
    const ownedIds = new Set(gs.relics.map(r=>r.id));
    const relicsForSale = (inv.relicIds || [])
      .map(id => RELIC_POOL.find(r => r.id === id))
      .filter(r => r && !ownedIds.has(r.id));
    const relicPrice = Math.ceil(140 * priceMult);
    relicsForSale.forEach(relic => {
      const rName = LANG==='en' ? (relic.nameEn||relic.name) : relic.name;
      const rDesc = LANG==='en' ? (relic.descEn||relic.desc) : relic.desc;
      const canBuyR = gs.gold >= relicPrice;
      const shortDesc = rDesc.length > 22 ? rDesc.slice(0,22)+'…' : rDesc;
      addService(relic.emoji, `${rName} — ${shortDesc}`, `🪙 ${relicPrice}`, canBuyR, '#c9a84c', () => {
        if(gs.gold < relicPrice){ showToast(t('🪙 골드 부족!','🪙 Not enough gold!'),1500); return; }
        gs.gold -= relicPrice; _updateGold();
        Audio.sfx.purchase();
        gs.relics.push(relic);
        if(relic.onGet) relic.onGet(gs);
        showToast(`${relic.emoji} ${rName} 획득!`, 2000);
        // 진열대에서 제거
        inv.relicIds = (inv.relicIds||[]).filter(id=>id!==relic.id);
        showShop();
      });
    });
    // 유물 재고 없으면 랜덤 구매 버튼 fallback
    if(relicsForSale.length === 0) {
      const availRelics = RELIC_POOL.filter(r=>!ownedIds.has(r.id));
      if(availRelics.length > 0) {
        addService('🎲', t('랜덤 아티팩트','Random Relic'), `🪙 150`, gs.gold >= 150, '#c9a84c', () => {
          if(gs.gold < 150){ showToast(t('🪙 골드 부족!','🪙 Not enough gold!'),1500); return; }
          gs.gold -= 150; _updateGold();
          Audio.sfx.purchase();
          showRelicSelection(2, ()=>showShop());
        });
      }
    }
  }

  // 룬 강화
  const upgradeable = gs.deck.filter(c => !c._upgraded);
  if(upgradeable.length > 0) {
    const upgradePrice = 75;
    addService('⬆️', t('룬 1장 강화','Upgrade Rune'), `🪙 ${upgradePrice}`, gs.gold >= upgradePrice, '#f0c050', () => {
      if(gs.gold < upgradePrice){ showToast(t('🪙 골드 부족!','🪙 Not enough gold!'), 1500); return; }
      gs.gold -= upgradePrice; _updateGold();
      showCardUpgradeOverlay(()=>showShop());
    });
  }

  // 룬 제거
  if(gs.deck.length > 0) {
    const removePrice = 50;
    addService('✂️', t('룬 1장 제거','Remove Rune'), `🪙 ${removePrice}`, gs.gold >= removePrice, '#9b6ee8', () => {
      if(gs.gold < removePrice){ showToast(t('🪙 골드 부족!','🪙 Not enough gold!'), 1500); return; }
      gs.gold -= removePrice; _updateGold();
      showCardRemoveOverlay(()=>showShop());
    });
  }

  if(svcCount > 0) svcEl.style.display = 'flex';

  document.getElementById('leaveShopBtn').onclick = () => showMapScreen();

  // ── 서비스 버튼 헬퍼 ──
  function makeServiceBtn(icon, label, priceStr, canDo, accentColor, onClick) {
    const row = document.createElement('div');
    row.style.cssText = `display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;
      border:1px solid ${canDo ? accentColor+'40' : 'rgba(255,255,255,0.05)'};
      background:${canDo ? accentColor+'0b' : 'rgba(255,255,255,0.02)'};
      cursor:${canDo?'pointer':'not-allowed'};transition:all 0.15s;`;
    row.innerHTML = `
      <span style="font-size:18px;">${icon}</span>
      <span style="flex:1;font-size:12px;color:${canDo?'#d0dff0':'rgba(255,255,255,0.22)'};font-family:'Jua',sans-serif;">${label}</span>
      <span style="font-size:12px;color:${canDo?accentColor:'rgba(255,255,255,0.18)'};font-family:'Jua',sans-serif;">${priceStr}</span>`;
    if(canDo) {
      row.onmouseenter = ()=>{ row.style.background=accentColor+'1a'; row.style.borderColor=accentColor+'66'; };
      row.onmouseleave = ()=>{ row.style.background=accentColor+'0d'; row.style.borderColor=accentColor+'44'; };
      row.onclick = onClick;
    }
    return row;
  }
}

// ─── 유물 획득 함수 ───
function giveRelic(relic, onDone) {
  if (gs.relics.some(r=>r.id===relic.id)) { if(onDone) onDone(); return; } // 중복 방지
  gs.relics.push(relic);
  trackMission('relics', 1);
  if (relic.onPickup) relic.onPickup(gs.player, gs.skills, gs);
  Audio.sfx.synergy();
  showRelicGetOverlay(relic, onDone);
}

function showRelicGetOverlay(relic, onDone) {
  const ov = document.createElement('div');
  ov.style.cssText=`position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);opacity:0;transition:opacity 0.3s;`;
  ov.innerHTML=`
    <div style="text-align:center;padding:32px 40px;background:#0e1628;border:2px solid ${relic.color};border-radius:20px;
      box-shadow:0 0 60px ${relic.color}44;max-width:360px;animation:relicPop 0.4s ease;">
      <style>@keyframes relicPop{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}</style>
      <div style="font-size:56px;margin-bottom:8px;">${relic.emoji}</div>
      <div style="font-size:10px;color:${relic.color};letter-spacing:3px;margin-bottom:6px;">✦ RELIC OBTAINED ✦</div>
      <div style="font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:#f0d080;margin-bottom:10px;">${relic.name}</div>
      <div style="font-size:13px;color:#8aa0b8;line-height:1.7;margin-bottom:24px;">${relic.desc}</div>

        style="padding:12px 36px;font-size:15px;font-weight:800;border:none;cursor:pointer;border-radius:10px;

// 랜덤 유물 선택 오버레이 (1~3종 중 선택)
function showRelicSelection(count=2, onDone) {
  const owned = new Set(gs.relics.map(r=>r.id));
  const pool = RELIC_POOL.filter(r=>!owned.has(r.id));
  if (pool.length === 0) { if(onDone) onDone(); return; }

  // 희귀도 가중치
  const weighted=[];
  pool.forEach(r=>{ const w=r.tier==='common'?4:r.tier==='uncommon'?2:1; for(let i=0;i<w;i++) weighted.push(r); });
  const picks=[]; const seen=new Set();
  let safe=0;
  while(picks.length<Math.min(count,pool.length)&&weighted.length&&++safe<500){
    const r=weighted.splice(Math.floor(Math.random()*weighted.length),1)[0];
    if(!seen.has(r.id)){seen.add(r.id);picks.push(r);}
  }

  const TIER_COLOR={common:'#6b7a8d',uncommon:'#4a9eff',rare:'#c9a84c'};
  const ov=document.createElement('div');
  ov.style.cssText=`position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);opacity:0;transition:opacity 0.3s;`;

  let cardsHTML=picks.map((r,i)=>`
    <div onclick="window._pickRelic(${i})" style="cursor:pointer;width:180px;padding:22px 16px;
      background:rgba(14,22,40,0.95);border:2px solid ${r.color}66;border-radius:16px;text-align:center;
      transition:all 0.2s;box-shadow:0 0 20px ${r.color}22;"
      onmouseover="this.style.borderColor='${r.color}';this.style.transform='translateY(-6px)';this.style.boxShadow='0 0 30px ${r.color}55'"
      onmouseout="this.style.borderColor='${r.color}66';this.style.transform='';this.style.boxShadow='0 0 20px ${r.color}22'">
      <div style="font-size:40px;margin-bottom:8px;">${r.emoji}</div>
      <div style="font-size:9px;color:${TIER_COLOR[r.tier]};letter-spacing:2px;margin-bottom:4px;">${r.tier.toUpperCase()}</div>
      <div style="font-size:14px;font-weight:700;color:#f0d080;margin-bottom:8px;">${r.name}</div>
      <div style="font-size:11px;color:#8aa0b8;line-height:1.6;">${r.desc}</div>
    </div>`).join('');

  ov.innerHTML=`
    <div style="text-align:center;">
      <div style="font-family:'Cinzel',serif;font-size:22px;color:#c9a84c;margin-bottom:6px;">✦ 아티팩트 선택 ✦</div>
      <div style="font-size:13px;color:#6a8a9a;margin-bottom:24px;">강력한 아티팩트를 1개 선택하세요</div>
      <div style="display:flex;gap:16px;justify-content:center;">${cardsHTML}</div>
      <div style="margin-top:16px;"><span onclick="window._pickRelic(-1)"
        style="font-size:12px;color:#5a7a9a;cursor:pointer;text-decoration:underline;">건너뛰기</span></div>
    </div>`;

  window._pickRelic=(i)=>{
    document.body.removeChild(ov);
    if(i>=0) giveRelic(picks[i], onDone);
    else if(onDone) onDone();
  };
  document.body.appendChild(ov);
  requestAnimationFrame(()=>ov.style.opacity='1');
}

//  배틀 일시정지 + 배속

function toggleBattlePause() {
  if (!bt || bt.won) return;
  if (document.getElementById('_pauseOverlay')) {
    closeBattlePause(); return;
  }
  bt.paused = true;
  const p = gs.player, s = gs.skills;
  const syns = getActiveSynergies();
  const nearSyns = (() => {
    const deckIdSet = new Set(gs.deck.map(c=>c.id));
    return SYNERGIES.filter(syn=>!syns.includes(syn))
      .map(syn=>({syn, have:syn.requires.filter(r=>deckIdSet.has(r)).length, total:syn.requires.length}))
      .filter(x=>x.have>0).sort((a,b)=>(b.have/b.total)-(a.have/a.total)).slice(0,4);
  })();

  const RARITY_COL = {common:'#6b7a8d',uncommon:'#4a9eff',rare:'#c9a84c',epic:'#9b6ee8'};
  const deckHtml = gs.deck.length
    ? gs.deck.map(c=>`<span title="${c.name}" style="display:inline-flex;align-items:center;gap:3px;background:${RARITY_COL[c.rarity]||'#333'}18;border:1px solid ${RARITY_COL[c.rarity]||'#333'}44;border-radius:6px;padding:2px 6px;font-size:11px;color:${RARITY_COL[c.rarity]||'#aaa'}">${c.emoji} <span style="color:#c8d8e8;font-size:10px">${c.name}${c._upgraded?'<span style="color:#f0c050">+</span>':''}</span></span>`).join('')
    : '<span style="color:#4a5a6a;font-size:11px">룬 없음</span>';

  const relicHtml = gs.relics.length
    ? gs.relics.map(r=>`<span title="${r.name}: ${r.desc}" style="font-size:20px;cursor:help">${r.emoji}</span>`).join('')
    : '<span style="color:#4a5a6a;font-size:11px">아티팩트 없음</span>';

  const synHtml = syns.length
    ? syns.map(sy=>`<span style="background:${sy.color}22;border:1px solid ${sy.color}55;border-radius:100px;padding:3px 10px;font-size:11px;color:${sy.color};font-weight:700">${sy.emoji} ${sy.name} ✓</span>`).join('')
    : '';
  const nearHtml = nearSyns.length
    ? nearSyns.map(({syn,have,total})=>`<span style="background:rgba(255,255,255,0.04);border:1px solid ${syn.color}33;border-radius:100px;padding:3px 10px;font-size:11px;color:#6a8aaa">${syn.emoji} ${syn.name} ${have}/${total}</span>`).join('')
    : '';

  const speedMult = bt.speedMult || 1;

  const ov = document.createElement('div');
  ov.id = '_pauseOverlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(2,4,12,0.88);backdrop-filter:blur(4px);';
  ov.innerHTML = `
    <div style="width:min(440px,96vw);max-height:90vh;overflow-y:auto;padding:24px;background:linear-gradient(160deg,#0a1428,#0e1e3a);border:1px solid rgba(100,160,255,0.2);border-radius:20px;box-shadow:0 0 60px rgba(0,0,0,0.8);">
      <div style="text-align:center;margin-bottom:18px;">
        <div style="font-family:'Cinzel',serif;font-size:22px;color:#d8e4f0;margin-bottom:4px;">${t('⏸ 일시정지', '⏸ Paused')}</div>
        <div style="font-size:11px;color:#5a7a9a;letter-spacing:1px;">ACT ${gs.act} · WAVE ${bt.wave}/${bt.wavesTotal} · 처치 ${p.kills}</div>
      </div>

      <!-- 핵심 스탯 -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;">
        ${[
          {l:'HP', v:`${Math.ceil(p.hp)}/${p.maxHp}`, c: p.hp/p.maxHp<0.3?'#e05050':p.hp/p.maxHp<0.6?'#f8a030':'#4ecf7a'},
          {l:'골드', v:`🪙 ${gs.gold}`, c:'#c9a84c'},
          {l:'속도', v:`${speedMult}x`, c:speedMult>1?'#f8e030':'#8aa0b8'},
        ].map(x=>`<div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:10px;text-align:center;">
          <div style="font-size:9px;color:#4a6a8a;letter-spacing:1px;margin-bottom:4px">${x.l}</div>
          <div style="font-size:15px;font-weight:800;color:${x.c}">${x.v}</div>
        </div>`).join('')}
      </div>

      <!-- 시너지 현황 -->
      ${(synHtml||nearHtml) ? `
      <div style="margin-bottom:14px;">
        <div style="font-size:10px;color:#4a6a8a;letter-spacing:2px;margin-bottom:8px;">⚡ 시너지</div>

function closeBattlePause() {
  const ov = document.getElementById('_pauseOverlay');
  if (ov) ov.remove();
  if (bt) bt.paused = false;
}

function toggleBattleSpeed() {
  if (!bt) return;
  bt.speedMult = (bt.speedMult || 1) >= 2 ? 1 : 2;
  const btn = document.getElementById('_pauseSpeedBtn');
  if (btn) btn.textContent = bt.speedMult > 1 ? '⚡ 2x ON' : '▷ 배속';
  showToast(bt.speedMult > 1 ? '⚡ 2배속 ON' : '▷ 1배속', 800);
}

//  카드 업그레이드 시스템
// ═══════════════════════════════════════════════
// 카드 업그레이드 효과 (card.id → 강화 시 적용)
// 대부분의 스탯 카드: action 재적용 (효과 2배)
// boolean/특수 카드: 별도 보너스
const CARD_UPGRADE_BONUS = {
  piercing:   (s,p,gs) => { s.bulletSpeed+=1.5; s.bulletCount+=1; },
  deathBeam:  (s,p,gs) => { s.bulletSpeed+=2.5; s.fireRateBonus=(s.fireRateBonus||0)+30; },
  blackhole:  (s,p,gs) => { s.magnet=(s.magnet||0)+2; },
  fullArmor:  (s,p,gs) => { gs.shieldCount++; s.shield=(s.shield||0)+1; p.maxHp+=20; p.hp+=20; },
  dash1:      (s,p,gs) => { p.speed+=0.4; },
};

// 강화 후 효과 설명 (오버레이에서 표시)
const CARD_UPGRADE_HINT = {
  piercing:   '탄속 +1.5 · 발사 수 +1',
  deathBeam:  '탄속 +2.5 · 연사 속도 ▲',
  blackhole:  '자석 범위 +2',
  fullArmor:  '보호막 +1 · 최대HP +20',
  dash1:      '이동속도 +0.4',
};
function getUpgradeHint(card) {
  if (CARD_UPGRADE_HINT[card.id]) return CARD_UPGRADE_HINT[card.id];
  // 기본: effect 문자열 재적용
  return (card.effect || t('효과 재적용','Re-apply Effect')) + t(' 추가','');
}

function upgradeCard(card) {
  if (!card || card._upgraded) return;
  card._upgraded = true;
  const s = gs.skills, p = gs.player;
  const bonus = CARD_UPGRADE_BONUS[card.id];
  if (bonus) {
    bonus(s, p, gs);
  } else {
    // 기본: action 재적용
    if (card.action) card.action(s, p, gs);
  }
  applyAllSynergies && applyAllSynergies();
}

function showEvent() {
  // 상황 인식: 조건 충족 이벤트 우선 (70% + 행운의 별 보너스), 아니면 일반 이벤트
  const conditional = EVENTS.filter(e=>e.condition && e.condition());
  const general = EVENTS.filter(e=>!e.condition);
  const conditionalChance = 0.70;
  let pool;
  if(conditional.length > 0 && Math.random() < conditionalChance) pool = conditional;
  else pool = general;
  const ev = pool[Math.floor(Math.random()*pool.length)];
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(5,8,18,0.96);display:flex;align-items:center;justify-content:center;z-index:150;';

  // 클로저로 ev를 캡처해 고유 핸들러 생성 — window 전역에 덮어쓰지 않음
  const handleChoice = (i) => {
    const choice = ev.choices[i];
    overlay.remove();
    const done = () => { showMapScreen(); };
    try {
      const stayed = choice.action(done, gs);
      if(!stayed) done();
    } catch(e) {
      console.warn('Event action error:', e);
      done();
    }
  };

  const evTitle = LANG==='en' ? (ev.titleEn||ev.title) : ev.title;
  const evText  = LANG==='en' ? (ev.textEn||ev.text)   : ev.text;
  overlay.innerHTML=`<div style="width:360px;padding:28px 32px;background:var(--panel);border:1px solid var(--border);border-radius:16px;text-align:center;"><div style="font-family:'Cinzel',serif;font-size:22px;color:var(--gold);margin-bottom:10px;">❓ ${evTitle}</div><div style="color:var(--text2);font-size:14px;margin-bottom:24px;line-height:1.6;">${evText}</div><div id="_evBtns"></div></div>`;
  document.body.appendChild(overlay);

  // innerHTML 완성 후 버튼에 직접 이벤트 리스너 부착 (인라인 onclick 제거)
  const btnContainer = overlay.querySelector('#_evBtns');
  ev.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.textContent = LANG==='en' ? (c.labelEn||c.label) : c.label;
    btn.style.cssText = 'width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);cursor:pointer;font-size:13px;font-family:\'Noto Sans KR\',sans-serif;transition:all 0.2s;display:block;';
    btn.addEventListener('mouseenter', () => btn.style.borderColor = 'var(--gold)');
    btn.addEventListener('mouseleave', () => btn.style.borderColor = 'var(--border)');
    btn.addEventListener('click', () => handleChoice(i));
    btnContainer.appendChild(btn);
  });
}

function showAscensionSelector(onDone) {
  const maxUnlocked = meta.maxAscension || 0;
  if (maxUnlocked < 1) { if(onDone) onDone(); return; }

  const ov = document.createElement('div');
  ov.id = 'ascensionOverlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:350;display:flex;align-items:center;justify-content:center;background:rgba(4,2,16,0.96);opacity:0;transition:opacity 0.4s;';

  let chosen = Math.min(meta.ascension || 0, maxUnlocked);

  function render() {
    const mods = ASCENSION_MODS.slice(0, chosen);
    const am = calcAscMultipliers(chosen);
    const nextMod = (chosen < 30 && chosen < maxUnlocked) ? ASCENSION_MODS[chosen] : null;
    const statItems = [
      {l:'적 HP',    v:'×'+am.hp.toFixed(2)},
      {l:'적 속도',  v:'×'+am.spd.toFixed(2)},
      {l:'적 피해',  v:'×'+am.dmg.toFixed(2)},
      {l:'보스 HP',  v:'×'+am.bossHp.toFixed(2)},
      {l:'보스 속도',v:'×'+am.bossSpd.toFixed(2)},
      {l:'상점 가격',v:'×'+am.shopPrice.toFixed(2)},
    ];
    const tierColor = chosen===0?'#8aa0b8':chosen<10?'#4ecf7a':chosen<20?'#f0c050':chosen<30?'#e05050':'#cc88ff';
    const tierName  = chosen===0?'일반':chosen<10?'입문':chosen<20?'고급':chosen<30?'극한':'완전 초월';

    ov.innerHTML = '<div id="_ascInner" style="width:500px;max-height:88vh;overflow-y:auto;padding:24px 26px;background:linear-gradient(160deg,#0e0820,#080618);border:1px solid rgba(170,0,255,0.35);border-radius:18px;box-shadow:0 0 80px rgba(100,0,200,0.3);"></div>';
    const inner = ov.querySelector('#_ascInner');

    // 헤더 (뒤로가기 포함)
    inner.innerHTML += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">'
      +'<button id="_ascBack" style="padding:6px 12px;border:1px solid rgba(255,255,255,0.14);border-radius:8px;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.55);font-size:12px;cursor:pointer;font-family:\'Noto Sans KR\',sans-serif;flex-shrink:0;">← 뒤로</button>'
      +'<div style="font-family:\'Cinzel\',serif;font-size:20px;color:#cc88ff;font-weight:700;flex:1;text-align:center;">☠️ 초월 선택</div>'
      +'<div style="font-size:11px;color:#6a5a8a;flex-shrink:0;">초월 '+maxUnlocked+'/30</div>'
      +'</div>';
    inner.innerHTML += '<div style="font-size:11px;color:#5a4a6a;margin-bottom:16px;">도전할 초월 레벨을 선택하세요. 높을수록 어렵고, 클리어 시 다음 초월이 해금됩니다.</div>';

    // 선택기
    inner.innerHTML += '<div style="text-align:center;margin-bottom:14px;"><div style="display:flex;align-items:center;justify-content:center;gap:14px;">'
      +'<button id="_ascPrev" style="width:36px;height:36px;border-radius:50%;border:1px solid rgba(170,0,255,0.4);background:rgba(170,0,255,0.1);color:#cc88ff;font-size:20px;cursor:pointer;font-weight:900;">‹</button>'
      +'<div style="min-width:130px;"><div style="font-family:\'Cinzel\',serif;font-size:30px;font-weight:900;color:'+tierColor+';">초월 '+chosen+'</div>'
      +'<div style="font-size:10px;color:#5a4a6a;margin-top:2px;">'+tierName+'</div></div>'
      +'<button id="_ascNext" style="width:36px;height:36px;border-radius:50%;border:1px solid rgba(170,0,255,0.4);background:rgba(170,0,255,0.1);color:#cc88ff;font-size:20px;cursor:pointer;font-weight:900;">›</button>'
      +'</div></div>';

    // 배율 미리보기
    if(chosen > 0){
      inner.innerHTML += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px;">'
        +statItems.map(s=>'<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:7px;padding:6px 4px;text-align:center;">'
          +'<div style="font-size:9px;color:#6a5a8a;margin-bottom:2px;">'+s.l+'</div>'
          +'<div style="font-size:13px;font-weight:700;color:#e05050;">'+s.v+'</div></div>').join('')+'</div>';
      let penalties = '';
      if(am.startHpPen>0) penalties += '<span style="color:#e08060;">⬇️ 시작HP -'+am.startHpPen+'</span>  ';
      if(am.healPenalty>0) penalties += '<span style="color:#e08060;">💔 회복-'+Math.round(am.healPenalty*100)+'%</span>  ';
      if(am.noHeal) penalties += '<span style="color:#e05050;font-weight:700;">☠️ 회복 불가!</span>  ';
      if(am.cardMinus>0) penalties += '<span style="color:#aa88cc;">🃏 선택지-'+am.cardMinus+'장</span>  ';
      if(penalties) inner.innerHTML += '<div style="font-size:10px;margin-bottom:10px;">'+penalties+'</div>';
    } else {
      inner.innerHTML += '<div style="font-size:12px;color:#5a6a8a;text-align:center;margin-bottom:12px;">일반 난이도 — 패널티 없음</div>';
    }

    // 활성 모디파이어
    if(mods.length > 0){
      inner.innerHTML += '<div style="border-top:1px solid rgba(255,255,255,0.06);padding-top:10px;margin-bottom:12px;">'
        +'<div style="font-size:10px;color:#6a5a8a;letter-spacing:1px;margin-bottom:6px;">활성 초월 효과 ('+mods.length+'개)</div>'
        +'<div style="max-height:130px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;">'
        +mods.map(m=>'<div style="display:flex;align-items:center;gap:7px;padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:11px;">'
          +'<span style="font-size:13px;">'+m.emoji+'</span>'
          +'<span style="color:#8a7a9a;font-weight:700;">'+m.name+'</span>'
          +'<span style="color:#5a4a6a;margin-left:auto;">'+m.desc+'</span></div>').join('')+'</div></div>';
    }

    // 다음 초월 미리보기
    if(nextMod){
      inner.innerHTML += '<div style="padding:9px 12px;background:rgba(170,0,255,0.07);border:1px dashed rgba(170,0,255,0.3);border-radius:9px;margin-bottom:14px;">'
        +'<div style="font-size:10px;color:#8a5aaa;margin-bottom:4px;">초월 '+chosen+' 클리어 시 해금</div>'
        +'<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#9a6acc;">'
        +'<span style="font-size:15px;">'+nextMod.emoji+'</span>'
        +'<span style="font-weight:700;">'+nextMod.name+'</span>'
        +'<span style="color:#6a4a8a;margin-left:auto;">'+nextMod.desc+'</span></div></div>';
    }

    // 시작 버튼
    const startBtnEl = document.createElement('button');
    startBtnEl.id = '_ascStart';
    startBtnEl.style.cssText = 'width:100%;padding:14px;font-size:16px;font-weight:800;border:none;cursor:pointer;border-radius:12px;font-family:\'Noto Sans KR\',sans-serif;'
      +'background:'+(chosen===0?'linear-gradient(135deg,#4ecf7a,#28a845)':'linear-gradient(135deg,#aa00ff,#6600cc)')+';color:#fff;'
      +'box-shadow:0 0 28px '+(chosen===0?'#4ecf7a':'#aa00ff')+'44;margin-top:4px;';
    startBtnEl.textContent = chosen===0 ? '⚔️ 모험 시작' : '☠️ 초월 '+chosen+' 도전';
    inner.appendChild(startBtnEl);

    // 버튼 이벤트
    ov.querySelector('#_ascBack').onclick = ()=>{ ov.style.opacity='0'; setTimeout(()=>ov.remove(),400); };
    ov.querySelector('#_ascPrev').onclick = ()=>{ if(chosen>0){ chosen--; render(); }};
    ov.querySelector('#_ascNext').onclick = ()=>{ if(chosen<maxUnlocked){ chosen++; render(); }};
    startBtnEl.onclick = ()=>{
      meta.ascension = chosen;
      saveMeta();
      ov.style.opacity='0';
      setTimeout(()=>{ ov.remove(); if(onDone) onDone(); }, 400);
    };
  }

  render();
  document.body.appendChild(ov);
  requestAnimationFrame(()=> ov.style.opacity='1');
}

  }
  document.body.appendChild(ov);
  requestAnimationFrame(()=>ov.style.opacity='1');
  const dismiss = () => {
    ov.style.opacity='0';
    setTimeout(()=>{ ov.remove(); if(onDone) onDone(); }, 600);
  };
  setTimeout(()=>{ ov.addEventListener('click', dismiss); }, 800);
  setTimeout(dismiss, 5000); // 5초 후 자동 진행
}

// ═══════════════════════════════════════════════
//  로비로 이동 — 어디서든 안전하게 호출 가능
// ═══════════════════════════════════════════════
function goToLobby(overlayEl, keepSave = false) {
  // 배틀루프가 gs.screen !== '__battle__' 이면 자기종료하므로 먼저 세팅
  gs.screen = 'startScreen';
  if (battleAnimId) { cancelAnimationFrame(battleAnimId); battleAnimId = null; }
  try { stopBattleTimers(); } catch(e) {}
  // bt.won=true: battleLoop 내 updateBattle/drawBattle 실행 차단
  // bt 자체는 null로 만들지 않음 — 터치/키보드 핸들러가 bt를 참조하므로
  if (bt) { try { bt.won = true; bt.paused = false; bt.screenShake = 0; bt.enemies = []; bt.items = []; bt.particles = []; } catch(e) {} }

  try { Audio.stopBGM(0.5); } catch(e) {}

  // 오버레이 제거 (전달된 것 + 혹시 남은 것 모두)
  if (overlayEl) { try { overlayEl.remove(); } catch(e) {} }
  ['finalVictoryOverlay', '_pauseOverlay', '_deathOverlay'].forEach(id => {
    try { document.getElementById(id)?.remove(); } catch(e) {}
  });

  // 화면 전환 먼저 (빈 화면보다 낫다)
  try { showScreen('startScreen'); } catch(e) {}

  // 로비 초기화 (에러가 나도 화면 전환은 이미 됨)
  try {
    if (!keepSave) clearRunSave();
    initLobby();
  } catch(e) {
    console.warn('goToLobby initLobby error:', e);
    // 최후 수단: 페이지 새로고침 없이 startScreen만 표시
    try { showScreen('startScreen'); } catch(e2) {}
  }
}

function showFinalVictory() {
