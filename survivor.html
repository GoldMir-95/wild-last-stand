      const bPulse = 0.28 + 0.14*Math.sin(_drawNow*0.007);
      gctx.save();
      gctx.globalAlpha=bPulse;
      gctx.strokeStyle='#ff4430'; gctx.lineWidth=3;
      gctx.shadowColor='#ff4430'; gctx.shadowBlur=22;
      gctx.beginPath(); gctx.arc(p.x,p.y,p.size+17,0,Math.PI*2); gctx.stroke();
      gctx.restore();
    }
  }

  // 대시 잔상 (dashActive 중 흰색 afterimage)
  if((bt.dashActive||0) > 0){
    const _da = bt.dashActive;
    const _dAngle = Math.atan2(p.dirY,p.dirX);
    for(let ai=1; ai<=3; ai++){
      const _aAlpha = (_da/12) * (1 - ai*0.25);
      const _aDist  = ai * 14;
      gctx.save();
      gctx.globalAlpha = Math.max(0, _aAlpha);
      gctx.translate(p.x - Math.cos(_dAngle)*_aDist, p.y - Math.sin(_dAngle)*_aDist);
      gctx.rotate(_dAngle + Math.PI/2);
      gctx.font = '40px serif'; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
      gctx.filter = 'brightness(10) saturate(0)';
      gctx.shadowColor = '#ffffff'; gctx.shadowBlur = 20;
      gctx.fillText(gs.selectedChar.emoji, 0, 0);
      gctx.restore();
    }
    // 흰 링 효과
    gctx.save();
    gctx.globalAlpha = (_da/12) * 0.7;
    gctx.strokeStyle = '#ffffff'; gctx.lineWidth = 3;
    gctx.shadowColor = '#88ccff'; gctx.shadowBlur = 18;
    gctx.beginPath(); gctx.arc(p.x, p.y, p.size + 6 + (12-_da)*1.5, 0, Math.PI*2); gctx.stroke();
    gctx.restore();
  }
  // 플레이어
  gctx.save();gctx.translate(p.x,p.y);
  if(p.invincible>0&&Math.floor(p.invincible/4)%2===1)gctx.globalAlpha=0.4;
  if((bt.dashActive||0)>0){gctx.shadowColor='#ffffff';gctx.shadowBlur=24;} // 대시 중 흰 글로우
  else if((bt.playerSlowTimer||0)>0){gctx.filter='hue-rotate(180deg) brightness(0.8) saturate(0.7)';} // 얼음 틴트
  const pAngle=Math.atan2(p.dirY,p.dirX);gctx.rotate(pAngle+Math.PI/2);
  gctx.font='40px serif';gctx.textAlign='center';gctx.textBaseline='middle';
  if(!(bt.dashActive>0)) gctx.shadowColor=(bt.playerSlowTimer||0)>0?'#80d8ff':'rgba(74,158,255,0.5)';
  if(!(bt.dashActive>0)) gctx.shadowBlur=12;
  gctx.fillText(gs.selectedChar.emoji,0,Math.sin(_drawNow/150)*2);gctx.restore();

  // ── 캐릭터 직하 HP바 (탕탕특공대 스타일) ──
  {
    const hpR = Math.max(0, p.hp / p.maxHp);
    const bW = 44, bH = 6;
    const bX = p.x - bW/2, bY = p.y + p.size + 7;
    const isLow = hpR < 0.3;
    const pulse = isLow ? 0.7 + 0.3*Math.abs(Math.sin(_drawNow*0.008)) : 1;
    const alpha = p.invincible>0 ? 0.5 : 0.92;
    gctx.save();
    gctx.globalAlpha = alpha;
    // 바 배경 (어두운 반투명)
    gctx.fillStyle = 'rgba(0,0,0,0.55)';
    gctx.beginPath(); gctx.roundRect(bX-1,bY-1,bW+2,bH+2,4); gctx.fill();
    // HP 채우기
    if(hpR > 0){
      const hpColor = hpR>0.5 ? '#38ee66' : hpR>0.25 ? '#f8a030' : '#ff3838';
      const hpGrad = gctx.createLinearGradient(bX,0,bX+bW,0);
      hpGrad.addColorStop(0, hpColor);
      hpGrad.addColorStop(1, hpR>0.5?'#80ffaa':hpR>0.25?'#ffd080':'#ff8060');
      gctx.fillStyle = hpGrad;
      if(isLow){ gctx.shadowColor='#ff3838'; gctx.shadowBlur = 8*pulse; }
      gctx.globalAlpha = alpha * pulse;
      gctx.beginPath(); gctx.roundRect(bX,bY,bW*hpR,bH,3); gctx.fill();
      gctx.shadowBlur = 0;
      // 상단 하이라이트
      gctx.globalAlpha = alpha * 0.35;
      gctx.fillStyle = 'rgba(255,255,255,0.6)';
      gctx.beginPath(); gctx.roundRect(bX,bY,bW*hpR,bH*0.45,2); gctx.fill();
    }
    // 방어막 점 표시 (shieldCount)
    if(gs.shieldCount>0){
      for(let _si=0;_si<gs.shieldCount&&_si<5;_si++){
        const _sx = p.x - (gs.shieldCount-1)*6 + _si*12;
        gctx.globalAlpha=0.9; gctx.fillStyle='#88ccff';
        gctx.shadowColor='#88ccff'; gctx.shadowBlur=6;
        gctx.beginPath(); gctx.arc(_sx, bY+bH+7, 3.5, 0, Math.PI*2); gctx.fill();
      }
      gctx.shadowBlur=0;
    }
    gctx.globalAlpha=1; gctx.restore();
  }

  // ── 동료 소환 그리기 (summonAlly 카드) ──
  if((s.summonAlly||0)>0 && bt._allyDrawPos){
    const ax=bt._allyDrawPos.x, ay=bt._allyDrawPos.y;
    gctx.save();
    gctx.globalAlpha=0.82;
    gctx.shadowColor='#80e0ff'; gctx.shadowBlur=10;
    gctx.font='22px serif'; gctx.textAlign='center'; gctx.textBaseline='middle';
    gctx.fillText('🐧',ax,ay);
    // 충전 게이지 원형
    const frac = Math.min(1,(bt.allyTimer||0)/Math.max(1,Math.max(120,240-(s.summonAlly-1)*60)));
    gctx.strokeStyle='#80e0ff'; gctx.lineWidth=2; gctx.globalAlpha=0.4;
    gctx.beginPath(); gctx.arc(ax,ay,16,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); gctx.stroke();
    gctx.restore();
  }

  // 총알 (트레일 + 색상 강화)
  const _lowPerf = window._perfMode === 'low'; // [P4] 저성능 모드 캐싱

  // 운동량 증폭기 활성화 표시 (이동 중일 때 플레이어 주변 빠른 파문)
  if(gs._relicKineticSurge && gs.player._isMoving && !_lowPerf){
    gctx.save();
    const _kPulse = (_drawNow % 600) / 600; // 0→1 반복
    gctx.globalAlpha = (1 - _kPulse) * 0.45;
    gctx.strokeStyle = '#f8e030';
    gctx.lineWidth = 2;
    gctx.shadowColor = '#f8e030'; gctx.shadowBlur = 8;
    gctx.beginPath();
    gctx.arc(p.x, p.y, p.size + 8 + _kPulse * 28, 0, Math.PI*2);
    gctx.stroke();
    gctx.restore();
  }

  bt.bullets.forEach(b=>{
    const _kineticActive = gs._relicKineticSurge && gs.player._isMoving;
    const bColor = b.beam?'#ff44ff': b.explosive?'#ff6620': b.pierce?'#00ffff': s.aoe?'#ff8800': _kineticActive?'#ffe840':'#ffee00';
    const bGlow  = b.beam?'#cc00cc': b.explosive?'#cc3300': b.pierce?'#0088cc': s.aoe?'#cc4400': _kineticActive?'#d4b800':'#cc9900';
    const bR     = b.beam ? 5 : 2.5 + Math.min((s.bulletSpeed||0)*0.3, 3);
    // 트레일 — 저성능 모드에서 생략
    if(!_lowPerf && b.trail&&b.trail.length>0){
      b.trail.forEach((pt,ti)=>{
        const _trailAlpha = b.pierce ? 0.72 : 0.45;
        const _trailBlur  = b.pierce ? 14 : 6;
        const a=(1-(ti+1)/b.trail.length)*_trailAlpha;
        const r=bR*(1-(ti+1)/b.trail.length*0.6);
        gctx.save(); gctx.globalAlpha=a;
        gctx.fillStyle=bColor; gctx.shadowColor=bGlow; gctx.shadowBlur=_trailBlur;
        gctx.beginPath(); gctx.arc(pt.x,pt.y,r,0,Math.PI*2); gctx.fill();
        gctx.restore();
      });
    }
    // 총알 본체
    gctx.save();
    gctx.fillStyle=bColor;
    if(!_lowPerf){ gctx.shadowColor=bGlow; gctx.shadowBlur=b.beam?12:7; } // [P4] 저성능: 그림자 생략
    gctx.beginPath(); gctx.arc(b.x,b.y,bR,0,Math.PI*2); gctx.fill();
    // 내부 밝은 코어
    gctx.fillStyle='#ffffff'; gctx.shadowBlur=0; gctx.globalAlpha=0.7;
    gctx.beginPath(); gctx.arc(b.x,b.y,bR*0.4,0,Math.PI*2); gctx.fill();
    gctx.restore();
  });

  // 데미지 숫자 — 타입별 크기·색상·팝 애니메이션
  bt.damageNums.forEach(d=>{
    const maxLife = d.type==='crit' ? 62 : d.big ? 55 : 38;
    const t = d.life / maxLife; // 1→0
    const fadeIn  = t < 0.25 ? t / 0.25 : 1;
    const fadeOut = t > 0.55 ? 1 : t / 0.55;
    gctx.save();
    gctx.globalAlpha = fadeIn * fadeOut * (d.big ? 0.96 : 0.85);

    // 스케일: crit은 초반에 크게 시작해 줄어듦 (팡 효과)
    let scaleNow = 1;
    if(d.type==='crit'){
      const popT = Math.min(1, (1-t) / 0.3); // 0→1 (첫 30% 라이프)
      scaleNow = (d.scale||1.5) - ((d.scale||1.5) - 1.0) * popT; // 1.5 → 1.0
    }

    // 폰트 크기
    const fs = d.type==='crit' ? 22 : d.big ? 17 : 11;

    gctx.translate(d.x, d.y);
    if(scaleNow !== 1) gctx.scale(scaleNow, scaleNow);
    gctx.font = `bold ${fs}px Arial`;
    gctx.textAlign = 'center'; gctx.textBaseline = 'middle';

    // 외곽선 (가독성)
    gctx.strokeStyle = 'rgba(0,0,0,0.65)';
    gctx.lineWidth = d.type==='crit' ? 4 : d.big ? 3 : 2;
    gctx.strokeText(d.val, 0, 0);

    // 글로우 (big / crit / 특수 타입)
    if(d.big || d.type){
      gctx.shadowColor = d.color;
      gctx.shadowBlur = d.type==='crit' ? 14 : 7;
    }
    gctx.fillStyle = d.color;
    gctx.fillText(d.val, 0, 0);
    gctx.shadowBlur = 0;
    gctx.restore();
  });

  // ════════════════════════════════════════════════
  //  [카메라 공간 종료] — 이후는 스크린 공간 오버레이
  // ════════════════════════════════════════════════
  gctx.restore(); // camera save 종료 — 스크린 좌표로 복귀

  // ── 오프스크린 적 레이더 — 방향별 그룹핑 (스크린 공간) ──
  {
    const _W = 800, _margin = 22, _arrowSize = 10;
    const _cx = _W/2, _cy = _W/2;
    // 방향을 12분할하여 그룹핑 (key: 0~11 정수 섹터)
    const _sectors = new Map();
    bt.enemies.forEach(e => {
      const sx = e.x - bt.cam.x, sy = e.y - bt.cam.y;
      if(sx >= -20 && sx <= _W+20 && sy >= -20 && sy <= _W+20) return;
      const ang = Math.atan2(sy - _cy, sx - _cx);
      const sectorIdx = Math.round((ang + Math.PI) / (Math.PI*2/12)) % 12;
      if(!_sectors.has(sectorIdx)) _sectors.set(sectorIdx, {count:0, hasBoss:false, hasElite:false, ang});
      const sec = _sectors.get(sectorIdx);
      sec.count++;
      if(e.isBoss) sec.hasBoss = true;
      if(e.isEliteBoss) sec.hasElite = true;
    });
    const _pulse = 0.75 + 0.25*Math.abs(Math.sin(_drawNow*0.004));
    _sectors.forEach(sec => {
      const cos = Math.cos(sec.ang), sin = Math.sin(sec.ang);
      let ex = _cx + cos * (_W/2 - _margin);
      let ey = _cy + sin * (_W/2 - _margin);
      ex = Math.max(_margin, Math.min(_W - _margin, ex));
      ey = Math.max(_margin, Math.min(_W - _margin, ey));
      const col = sec.hasBoss ? '#c9a84c' : sec.hasElite ? '#d060ff' : '#ff4444';
      gctx.save();
      gctx.globalAlpha = _pulse;
      gctx.translate(ex, ey);
      gctx.rotate(sec.ang);
      gctx.fillStyle = col;
      gctx.shadowColor = col; gctx.shadowBlur = sec.hasBoss ? 12 : 6;
      gctx.beginPath();
      gctx.moveTo(_arrowSize, 0);
      gctx.lineTo(-_arrowSize*0.6, -_arrowSize*0.6);
      gctx.lineTo(-_arrowSize*0.3, 0);
      gctx.lineTo(-_arrowSize*0.6, _arrowSize*0.6);
      gctx.closePath(); gctx.fill();
      // 2명 이상이면 숫자 표시
      if(sec.count > 1){
        gctx.rotate(-sec.ang); // 텍스트는 회전 해제
        gctx.shadowBlur = 4;
        gctx.fillStyle = '#fff';
        gctx.font = 'bold 9px Arial';
        gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
        gctx.fillText(sec.count, 0, -_arrowSize - 5);
      }
      gctx.restore();
    });
  }

  // ── ACT1 안개 비네트 (스크린 공간) ──
  if(gs.act===1 && window._perfMode!=='low'){
    const _fp = gs.player;
    const _fpx = _fp.x - cam.x, _fpy = _fp.y - cam.y;
    // 웨이브가 높아질수록, 보스전에선 더 좁아지는 시야
    const _fogR = bt.isBoss ? 310 : Math.max(200, 340 - (bt.wave||1)*10);
    const _fogOuter = _fogR + 160;
    gctx.save();
    const _fog = gctx.createRadialGradient(_fpx,_fpy,_fogR*0.5,_fpx,_fpy,_fogOuter);
    _fog.addColorStop(0,'rgba(4,14,8,0)');
    _fog.addColorStop(0.45,'rgba(4,14,8,0.10)');
    _fog.addColorStop(1,'rgba(4,14,8,0.38)');
    gctx.fillStyle = _fog;
    gctx.fillRect(0,0,800,800);
    gctx.restore();
  }

  // ══════════════════════════════════════════
  //  인게임 HUD (스크린 공간 — 카메라 restore 후)
  // ══════════════════════════════════════════
  drawHUD(gctx);

  // 보스 처치 플래시 (스크린 공간)
  if(bt.bossKillFlash > 0) {
    gctx.save();
    gctx.globalAlpha = bt.bossKillFlash * 0.7;
    gctx.fillStyle = '#ffffff';
    gctx.fillRect(0,0,800,800);
    gctx.restore();
    bt.bossKillFlash = Math.max(0, bt.bossKillFlash - 0.035);
  }

  // 슬로우 모션 비네트 오버레이
  if(bt.slowMotion){
    const vignAlpha = (1 - (bt.slowScale||0.15)) * 0.55;
    const vig = gctx.createRadialGradient(400,400,180,400,400,580);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, `rgba(10,0,30,${vignAlpha.toFixed(2)})`);
    gctx.save();
    gctx.fillStyle = vig;
    gctx.fillRect(0,0,800,800);
    // 상단 "SLOW" 텍스트
    const textAlpha = Math.min(0.7, vignAlpha * 1.8);
    gctx.globalAlpha = textAlpha;
    gctx.fillStyle = '#c9a84c';
    gctx.font = 'bold 11px Arial';
    gctx.textAlign = 'center';
    gctx.textBaseline = 'top';
    gctx.letterSpacing = '4px';
    gctx.fillText('● COLLECTING', 400, 60);
    gctx.restore();
  }

  // ── ACT별 화면 테두리 환경 효과 ──
  if(window._perfMode !== 'low'){
    const now2 = bt.bgTime || 0;
    if(gs.act === 2){
      // ACT2: 얼음 결정 화면 테두리
      gctx.save();
      const iceVig = gctx.createRadialGradient(400,400,260,400,400,560);
      iceVig.addColorStop(0,'rgba(0,0,0,0)');
      iceVig.addColorStop(0.7,'rgba(100,190,255,0.06)');
      iceVig.addColorStop(1,'rgba(80,170,240,0.24)');
      gctx.fillStyle = iceVig; gctx.fillRect(0,0,800,800);
      // 모서리 얼음 빛 번짐
      [[0,0],[800,0],[0,800],[800,800]].forEach(([cx,cy])=>{
        const cg = gctx.createRadialGradient(cx,cy,0,cx,cy,180);
        cg.addColorStop(0,'rgba(120,200,255,0.10)'); cg.addColorStop(1,'rgba(0,0,0,0)');
        gctx.fillStyle=cg; gctx.fillRect(0,0,800,800);
      });
      // 하단 얼음 지형선
      gctx.globalAlpha=0.18;
      gctx.fillStyle = gctx.createLinearGradient(0,680,0,800);
      gctx.fillStyle = '#c8f0ff';
      gctx.fillRect(0,790,800,10);
      gctx.restore();
    } else if(gs.act === 3){
      // ACT3: 용암 테두리 이글거림
      gctx.save();
      const lavaVig = gctx.createRadialGradient(400,400,240,400,400,570);
      lavaVig.addColorStop(0,'rgba(0,0,0,0)');
      lavaVig.addColorStop(0.65,'rgba(255,80,0,0.08)');
      lavaVig.addColorStop(1,'rgba(255,60,0,0.32)');
      gctx.fillStyle = lavaVig; gctx.fillRect(0,0,800,800);
      // 하단 용암 빛
      const lavaBtm = gctx.createLinearGradient(0,660,0,800);
      lavaBtm.addColorStop(0,'rgba(255,80,0,0)');
      lavaBtm.addColorStop(1,`rgba(255,${80+Math.sin(now2*0.08)*25|0},0,0.48)`);
      gctx.fillStyle = lavaBtm; gctx.fillRect(0,700,800,100);
      // 왼쪽/오른쪽 불꽃 기둥
      [-10, 810].forEach(fx=>{
        const fg = gctx.createRadialGradient(fx,760,0,fx,760,120);
        fg.addColorStop(0,`rgba(255,${80+Math.sin(now2*0.12)*30|0},0,${0.15+Math.sin(now2*0.07)*0.05})`);
        fg.addColorStop(1,'rgba(0,0,0,0)');
        gctx.fillStyle=fg; gctx.fillRect(0,0,800,800);
      });
      gctx.restore();
    } else if(gs.act === 1 && bt.isBoss){
      // ACT1 보스방: 황금빛 테두리
      gctx.save();
      const goldVig = gctx.createRadialGradient(400,400,300,400,400,570);
      goldVig.addColorStop(0,'rgba(0,0,0,0)');
      goldVig.addColorStop(1,`rgba(200,160,20,${0.10+Math.sin(now2*0.05)*0.04})`);
      gctx.fillStyle = goldVig; gctx.fillRect(0,0,800,800);
      gctx.restore();
    }
  }

  // 조이스틱 (개선 — 더 크고 반응적)
  if(joystick.active){
    const r2=gameCanvas.getBoundingClientRect();
    const scX=800/r2.width, scY=800/r2.height;
    const jx=(joystick.startX-r2.left)*scX, jy=(joystick.startY-r2.top)*scY;
    const knobX=jx+joystick.dx*scX, knobY=jy+joystick.dy*scY;
    gctx.save();
    // 외곽 링
    gctx.globalAlpha=0.18; gctx.strokeStyle='#ffffff'; gctx.lineWidth=2;
    gctx.beginPath(); gctx.arc(jx,jy,56,0,Math.PI*2); gctx.stroke();
    // 배경 원
    gctx.globalAlpha=0.12; gctx.fillStyle='#ffffff';
    gctx.beginPath(); gctx.arc(jx,jy,54,0,Math.PI*2); gctx.fill();
    // 방향 지시선
    const angle=Math.atan2(joystick.dy,joystick.dx), dist=Math.hypot(joystick.dx,joystick.dy);
    if(dist>4){
      gctx.globalAlpha=0.2; gctx.strokeStyle='#ffffff'; gctx.lineWidth=1.5;
      gctx.setLineDash([4,4]);
      gctx.beginPath(); gctx.moveTo(jx,jy); gctx.lineTo(jx+Math.cos(angle)*50,jy+Math.sin(angle)*50); gctx.stroke();
      gctx.setLineDash([]);
    }
    // 노브 (이동 원)
    const knobR = 22;
    gctx.globalAlpha=0.75;
    const kg=gctx.createRadialGradient(knobX-4,knobY-4,0,knobX,knobY,knobR);
    kg.addColorStop(0,'rgba(255,255,255,0.9)'); kg.addColorStop(1,'rgba(200,220,255,0.5)');
    gctx.fillStyle=kg;
    gctx.beginPath(); gctx.arc(knobX,knobY,knobR,0,Math.PI*2); gctx.fill();
    // 노브 테두리
    gctx.globalAlpha=0.4; gctx.strokeStyle='#ffffff'; gctx.lineWidth=1.5;
    gctx.beginPath(); gctx.arc(knobX,knobY,knobR,0,Math.PI*2); gctx.stroke();
    gctx.restore();
  }
  // 오른쪽 대시 버튼 힌트 (대시 스킬 있을 때)
  if(gs.skills.dash>0){
    gctx.save();
    const dashAlpha = bt.dashCooldown>0 ? 0.15 : 0.28;
    gctx.globalAlpha=dashAlpha; gctx.strokeStyle='#aef'; gctx.lineWidth=1.5;
    gctx.beginPath(); gctx.arc(750,740,30,0,Math.PI*2); gctx.stroke();
    gctx.globalAlpha=dashAlpha*0.5; gctx.fillStyle='#aef';
    gctx.beginPath(); gctx.arc(750,740,28,0,Math.PI*2); gctx.fill();
    gctx.globalAlpha=dashAlpha*2; gctx.fillStyle='#ffffff';
    gctx.font='14px serif'; gctx.textAlign='center'; gctx.textBaseline='middle';
    gctx.fillText('💫',750,740);
    // 쿨다운 표시
    if(bt.dashCooldown>0){
      gctx.globalAlpha=0.5; gctx.fillStyle='#aef'; gctx.font='bold 9px Arial';
      gctx.textAlign='center'; gctx.textBaseline='bottom';
      gctx.fillText(Math.ceil(bt.dashCooldown/60)+'s',750,768);
    }
    gctx.restore();
  }

  gctx.restore();
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

// ─── 캔버스 인게임 HUD (800×800 내부 좌표) ───
function drawHUD(ctx) {
  const p = gs.player, s = gs.skills;
  const W = 800;
  const PAD = 10;

  ctx.save();

  // ── 공통 계산 ──
  const elapsed   = bt.battleTime;
  const total     = bt.totalBattleSec;
  const remaining = bt.isBoss ? elapsed : Math.max(0, total - elapsed);
  const prog      = bt.isBoss ? 0 : Math.min(1, elapsed / total);
  const hue       = Math.round(120 - prog * 120);

  // ════════════════════════════════════════════════
  //  상단 HUD — 슬림 3-pill 바 (모던 미니멀)
  //  [❤ ████▓░░ 248/300  🛡×2]   [WAVE 2/4 · ⚔ 47]   [MM:SS  🪙 290]
  // ════════════════════════════════════════════════
  const barH = 38, barY = PAD;
  const hpRatio = Math.max(0, p.hp / p.maxHp);
  const hpColor = hpRatio > 0.5 ? '#3de87a' : hpRatio > 0.25 ? '#f8a030' : '#ff4444';

  // ── 헬퍼: 슬림 유리 pill 배경 ──
  function glassPill(x, y, w, h, accentColor) {
    ctx.save();
    // 배경
    ctx.fillStyle = 'rgba(4,10,26,0.72)';
    roundRect(ctx, x, y, w, h, 10); ctx.fill();
    // 상단 하이라이트 줄
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, x+1, y+1, w-2, h*0.4, 9); ctx.fill();
    ctx.globalAlpha = 1;
    // 테두리
    ctx.strokeStyle = accentColor ? accentColor+'44' : 'rgba(70,130,210,0.22)';
    ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h, 10); ctx.stroke();
    // 하단 미세 그림자 선
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(x+10, y+h); ctx.lineTo(x+w-10, y+h); ctx.stroke();
    ctx.restore();
  }

  // ══ 좌측 pill: HP ══
  const hpPillW = 228, hpPillX = PAD;
  glassPill(hpPillX, barY, hpPillW, barH,
    hpRatio > 0.5 ? '#3de87a' : hpRatio > 0.25 ? '#f8a030' : '#ff4444');

  // 하트 아이콘
  ctx.font = '13px serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('❤️', hpPillX+8, barY+12);

  // HP 수치
  ctx.fillStyle = hpColor; ctx.font = 'bold 14px Arial';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(Math.ceil(p.hp), hpPillX+27, barY+4);
  const hpNumW = ctx.measureText(String(Math.ceil(p.hp))).width;
  ctx.fillStyle='rgba(160,185,210,0.5)'; ctx.font='10px Arial';
  ctx.fillText(`/${p.maxHp}`, hpPillX+29+hpNumW, barY+7);

  // HP 바 — 슬림하고 선명하게
  const hpBx = hpPillX+8, hpBY = barY+24, hpBW = hpPillW-16, hpBH = 8;
  ctx.fillStyle='rgba(255,255,255,0.05)';
  roundRect(ctx,hpBx,hpBY,hpBW,hpBH,4); ctx.fill();
  if(hpRatio>0){
    const hpGrad = ctx.createLinearGradient(hpBx,0,hpBx+hpBW,0);
    if(hpRatio>0.5){
      hpGrad.addColorStop(0,'#1acc50'); hpGrad.addColorStop(1,'#50ff90');
    } else if(hpRatio>0.25){
      hpGrad.addColorStop(0,'#e07020'); hpGrad.addColorStop(1,'#ffb840');
    } else {
      hpGrad.addColorStop(0,'#cc1010'); hpGrad.addColorStop(1,'#ff4040');
      ctx.shadowColor='#ff2020'; ctx.shadowBlur=8;
    }
    ctx.fillStyle=hpGrad;
    roundRect(ctx,hpBx,hpBY,hpBW*hpRatio,hpBH,4); ctx.fill();
    ctx.shadowBlur=0;
    // 하이라이트
    ctx.fillStyle='rgba(255,255,255,0.22)';
    roundRect(ctx,hpBx+1,hpBY+1,hpBW*hpRatio-2,2.5,2); ctx.fill();
  }

  // 보호막 (오른쪽 상단)
  if(gs.shieldCount>0){
    ctx.save();
    ctx.shadowColor='#60c0ff'; ctx.shadowBlur=6;
    ctx.font='11px serif'; ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.fillText('🛡', hpPillX+hpPillW-6, barY+4);
    ctx.fillStyle='#90d8ff'; ctx.font='bold 10px Arial';
    ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.fillText(`×${gs.shieldCount}`, hpPillX+hpPillW-18, barY+5);
    ctx.restore();
  }

  // 회복 불가 표시 (초월 30단계)
  if (gs.ascMult && gs.ascMult.noHeal) {
    ctx.save();
    ctx.fillStyle = '#ff4444'; ctx.shadowColor = '#ff2020'; ctx.shadowBlur = 5;
    ctx.font = 'bold 9px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('☠ ' + t('회복불가','NO HEAL'), hpPillX+8, barY+barH-3);
    ctx.restore();
  }

  // ══ 중앙 pill: 웨이브 + 처치 ══
  const midPillW = 200, midPillX = W/2 - midPillW/2;
  if(bt.isBoss){
    glassPill(midPillX, barY, midPillW, barH, '#c9a84c');
    ctx.save();
    const _bPulse = 0.75+0.25*Math.abs(Math.sin(Date.now()*0.004));
    ctx.globalAlpha = _bPulse;
    ctx.shadowColor='#c9a84c'; ctx.shadowBlur=14;
    ctx.fillStyle='#ffd060'; ctx.font='bold 14px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('👑  BOSS BATTLE', W/2, barY+barH/2);
    ctx.restore();
  } else {
    glassPill(midPillX, barY, midPillW, barH, '#4a8eff');

    // 웨이브 번호 (좌측)
    ctx.fillStyle='rgba(120,160,230,0.65)'; ctx.font='700 9px Arial';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('WAVE', midPillX+10, barY+4);
    ctx.fillStyle='#cce0ff'; ctx.font='bold 17px Arial'; ctx.textBaseline='top';
    ctx.fillText(`${bt.wave}`, midPillX+10, barY+12);
    const _wNumW2 = ctx.measureText(String(bt.wave)).width;
    ctx.fillStyle='rgba(100,145,210,0.55)'; ctx.font='10px Arial';
    ctx.fillText(`/${bt.wavesTotal}`, midPillX+11+_wNumW2, barY+15);

    // 진척 도트 (하단 좌측)
    const _dotR=3, _dotGap=9, _dotStartX=midPillX+10, _dotY=barY+barH-8;
    for(let _di=0;_di<bt.wavesTotal;_di++){
      const _dx=_dotStartX+_di*_dotGap+_dotR;
      const _done=_di<bt.wave-1, _curr=_di===bt.wave-1;
      ctx.save();
      if(_curr){
        const _p=0.55+0.45*Math.abs(Math.sin(Date.now()*0.007));
        ctx.shadowColor='#4a9eff'; ctx.shadowBlur=5*_p;
        ctx.fillStyle=`rgba(74,158,255,${_p})`;
        ctx.beginPath(); ctx.arc(_dx,_dotY,_dotR,0,Math.PI*2); ctx.fill();
        const _wProg2=bt.waveTimer/bt.waveDuration;
        ctx.strokeStyle='rgba(74,158,255,0.3)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(_dx,_dotY,_dotR+2.5,-Math.PI/2,-Math.PI/2+_wProg2*Math.PI*2); ctx.stroke();
      } else if(_done){
        ctx.fillStyle='#4a9eff'; ctx.globalAlpha=0.85;
        ctx.beginPath(); ctx.arc(_dx,_dotY,_dotR,0,Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle='rgba(60,100,170,0.3)';
        ctx.beginPath(); ctx.arc(_dx,_dotY,_dotR,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(60,100,170,0.4)'; ctx.lineWidth=0.8;
        ctx.beginPath(); ctx.arc(_dx,_dotY,_dotR,0,Math.PI*2); ctx.stroke();
      }
      ctx.restore();
    }

    // 구분선
    ctx.strokeStyle='rgba(70,120,200,0.2)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(midPillX+midPillW/2,barY+7); ctx.lineTo(midPillX+midPillW/2,barY+barH-7); ctx.stroke();

    // 우측: 처치 수
    ctx.fillStyle='rgba(120,160,230,0.65)'; ctx.font='700 9px Arial';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('⚔ 처치', midPillX+midPillW/2+10, barY+4);
    ctx.fillStyle='#50f090'; ctx.font='bold 17px Arial'; ctx.textBaseline='top';
    ctx.fillText(String(p.kills), midPillX+midPillW/2+10, barY+12);

    // 웨이브 남은 시간 (우측 하단)
    const _wRemSec2 = Math.max(0, bt.waveDuration - bt.waveTimer);
    ctx.fillStyle='rgba(100,145,210,0.5)'; ctx.font='bold 9px Arial';
    ctx.textAlign='right'; ctx.textBaseline='bottom';
    ctx.fillText(`${_wRemSec2}s`, midPillX+midPillW-8, barY+barH-3);

    // 빌드 테마 (중앙 pill 아래 — 소형 배지)
    if (gs.buildTheme) {
      const _bt2 = gs.buildTheme;
      const _btLabel = `${_bt2.emoji} ${_bt2.name}`;
      ctx.font = 'bold 10px Arial';
      const _btW = ctx.measureText(_btLabel).width + 16;
      const _btX = W/2 - _btW/2, _btY = barY + barH + 4, _btH = 17;
      ctx.save();
      ctx.globalAlpha = 0.88;
      ctx.fillStyle = 'rgba(4,10,24,0.75)';
      roundRect(ctx, _btX, _btY, _btW, _btH, 8); ctx.fill();
      ctx.strokeStyle = _bt2.color + '66'; ctx.lineWidth = 1;
      roundRect(ctx, _btX, _btY, _btW, _btH, 8); ctx.stroke();
      ctx.fillStyle = _bt2.color; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor = _bt2.color; ctx.shadowBlur = 5;
      ctx.fillText(_btLabel, W/2, _btY + _btH/2);
      ctx.restore();
    }
  }

  // ══ 우측 pill: 타이머 + 골드 ══
  const remMM = String(Math.floor(remaining/60)).padStart(2,'0');
  const remSS = String(remaining%60).padStart(2,'0');
  const urgent = !bt.isBoss && remaining <= 10;
  const timerPillW = 162, timerPillX = W - PAD - timerPillW;
  glassPill(timerPillX, barY, timerPillW, barH, urgent?'#e04040':'rgba(70,130,210,0.35)');

  // 타이머 (좌측, 모노스페이스)
  ctx.save();
  if(urgent && Math.floor(Date.now()/500)%2===0){
    ctx.shadowColor='#ff2020'; ctx.shadowBlur=18;
    ctx.fillStyle='#ff4040';
  } else {
    ctx.fillStyle = urgent ? '#ff5555' : '#d0e6ff';
  }
  ctx.font=`bold ${urgent?19:18}px "Courier New",monospace`;
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(`${remMM}:${remSS}`, timerPillX+9, barY+5);
  ctx.restore();
  ctx.fillStyle='rgba(120,160,210,0.6)'; ctx.font='700 8px Arial';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText(bt.isBoss?'경과':'남음', timerPillX+9, barY+barH-4);

  // 시간 진행 바 (우측 세로)
  const pbX=timerPillX+timerPillW-12, pbY=barY+6, pbH=barH-12, pbW=4;
  ctx.fillStyle='rgba(255,255,255,0.05)'; roundRect(ctx,pbX,pbY,pbW,pbH,2); ctx.fill();
  if(prog>0){
    const fh=pbH*prog;
    ctx.fillStyle=`hsl(${hue},75%,55%)`; ctx.shadowColor=`hsl(${hue},75%,55%)`; ctx.shadowBlur=4;
    roundRect(ctx,pbX,pbY+pbH-fh,pbW,fh,2); ctx.fill(); ctx.shadowBlur=0;
  }

  // 골드 (우측 상단)
  ctx.save(); ctx.shadowColor='#b89030'; ctx.shadowBlur=5;
  ctx.fillStyle='#f0c050'; ctx.font='bold 12px Arial';
  ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText(`🪙 ${gs.gold}`, timerPillX+timerPillW-18, barY+5);
  ctx.restore();

  // 배속 표시
  if ((bt.speedMult||1) >= 2) {
    ctx.save();
    ctx.fillStyle='#f8e030'; ctx.font='bold 9px Arial';
    ctx.textAlign='right'; ctx.textBaseline='bottom';
    ctx.shadowColor='#f8e030'; ctx.shadowBlur=7;
    ctx.fillText('⚡ 2×', timerPillX+timerPillW-18, barY+barH-4);
    ctx.restore();
  }

  // ════════════════════════════════════════════════
  //  보스 전용 HP 바 (개선: 더 크게, 피격 흔들림, 이모지, 3단 페이즈)
  // ════════════════════════════════════════════════
  if (bt.isBoss) {
    const boss = bt.enemies && bt.enemies.find(e => e.isBoss);
    if (boss) {
      const bossTheme = (window.ACT_THEMES || [])[gs.act - 1] || {};
      const bossName  = bossTheme.bossName  || '???';
      const bossEmoji = bossTheme.bossEmoji || '👑';
      const hpRatio = Math.max(0, boss.hp / boss.maxHp);
      const phase = boss.phase || 1;
      // 페이즈별 색상
      const phaseCol = phase >= 3 ? '#ff3030' : phase >= 2 ? '#ff7030' : '#c9a84c';
      const barH2 = 18;  // 이전 14px → 18px 더 두껍게
      const barW2 = W - PAD * 2 - 6;
      const barX2 = PAD + 3;
      const barY2 = barY + barH + 10;
      const panH  = barH2 + 26;  // 패널 높이
      const panY  = barY2 - 18;

      // 피격 흔들림 오프셋
      const _hitShake = (boss.hitFlash || 0) > 0 ? (Math.random()-0.5)*3 : 0;

      ctx.save();
      ctx.translate(_hitShake, 0);

      // 배경 패널
      ctx.fillStyle = 'rgba(4,6,18,0.88)';
      roundRect(ctx, barX2 - 4, panY, barW2 + 8, panH, 10);
      ctx.fill();
      // 테두리 글로우
      const panBorder = ctx.createLinearGradient(barX2, panY, barX2+barW2, panY);
      panBorder.addColorStop(0, phaseCol+'88');
      panBorder.addColorStop(0.5, phaseCol+'ff');
      panBorder.addColorStop(1, phaseCol+'88');
      ctx.strokeStyle = panBorder; ctx.lineWidth = 1.5;
      roundRect(ctx, barX2 - 4, panY, barW2 + 8, panH, 10);
      ctx.stroke();

      // 보스 이름 + 이모지 (좌)
      ctx.fillStyle = phaseCol; ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.shadowColor = phaseCol; ctx.shadowBlur = 10;
      ctx.fillText(`${bossEmoji} ${bossName}`, barX2, panY + 4);
      ctx.shadowBlur = 0;

      // 페이즈 전환 무적 표시
      if((boss._phaseInvincible||0)>0){
        const blinkOn = Math.floor((boss._phaseInvincible||0)/6)%2===0;
        ctx.save(); ctx.globalAlpha = blinkOn ? 0.95 : 0.3;
        ctx.fillStyle='#ffffff'; ctx.font='bold 10px Arial'; ctx.textAlign='left';
        ctx.fillText('⚡ 변신 중…', barX2+80, panY+4);
        ctx.restore();
      }

      // 페이즈 라벨 (우)
      const pLabel = phase>=3 ? '🔥 FINAL PHASE' : phase>=2 ? '💢 PHASE 2' : '⚔️ PHASE 1';
      ctx.fillStyle = phaseCol; ctx.font = `bold ${phase>=2?10:9}px Arial`;
      ctx.textAlign = 'right';
      ctx.shadowColor = phaseCol; ctx.shadowBlur = 6;
      ctx.fillText(pLabel, barX2 + barW2, panY + 4);
      ctx.shadowBlur = 0;

      // HP 바 트랙 (반투명 홈)
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      roundRect(ctx, barX2, barY2, barW2, barH2, 5);
      ctx.fill();

      // HP 바 채움 + 그라데이션
      if (hpRatio > 0) {
        const fillW = barW2 * hpRatio;
        const grad = ctx.createLinearGradient(barX2, 0, barX2+barW2, 0);
        if (phase >= 3) {
          grad.addColorStop(0,'#aa0808'); grad.addColorStop(0.5,'#ff3018'); grad.addColorStop(1,'#ff5828');
        } else if (phase >= 2) {
          grad.addColorStop(0,'#a02808'); grad.addColorStop(0.5,'#ee6020'); grad.addColorStop(1,'#ffa030');
        } else {
          grad.addColorStop(0,'#806010'); grad.addColorStop(0.5,'#d8a020'); grad.addColorStop(1,'#f8cc40');
        }
        ctx.fillStyle = grad;
        ctx.shadowColor = phaseCol; ctx.shadowBlur = 12;
        roundRect(ctx, barX2, barY2, fillW, barH2, 5);
        ctx.fill(); ctx.shadowBlur = 0;
        // 상단 하이라이트
        ctx.fillStyle='rgba(255,255,255,0.22)';
        roundRect(ctx, barX2+1, barY2+2, fillW-2, 4, 3); ctx.fill();
        // 하단 어두움
        ctx.fillStyle='rgba(0,0,0,0.15)';
        roundRect(ctx, barX2+1, barY2+barH2-5, fillW-2, 4, 3); ctx.fill();
      }

      // HP 수치 (바 중앙)
      const hpPct = Math.round(hpRatio*100);
      ctx.fillStyle = hpRatio < 0.3 ? '#ff8080' : 'rgba(255,255,255,0.92)';
      ctx.font = `bold 10px Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`${Math.ceil(boss.hp).toLocaleString()} / ${boss.maxHp.toLocaleString()}  (${hpPct}%)`, barX2 + barW2/2, barY2 + barH2/2);

      // 페이즈 구분선 (33%, 66% — 3페이즈 기준)
      [1/3, 2/3].forEach(thresh => {
        const lx = barX2 + barW2 * thresh;
        ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(lx, barY2+1); ctx.lineTo(lx, barY2+barH2-1); ctx.stroke();
        ctx.setLineDash([]);
      });

      ctx.restore();
    }
  }

  // ════════════════════════════════════════════════
  //  콤보 표시 — 하단 중앙 (아이콘 바 위 안전 영역)
  //  COLLECTING(y=60), 보스HP바(y=68~116)와 완전 분리
  // ════════════════════════════════════════════════
  const _comboBaseY = sy0 - 66; // 아이콘 바 위 66px (≈684)

  if ((bt.comboKills||0) >= 3 && (bt.comboDisplay||0) > 0) {
    const comboAlpha = Math.min(1, bt.comboDisplay / 30);
    // 부드러운 선형 스케일: 3킬→1.0, 최대 53킬→1.35 (급격한 단계 없음)
    const rawScale  = 1.0 + Math.min(Math.max(0, bt.comboKills - 3), 50) * 0.007;
    const numSize   = Math.round(30 * rawScale);   // 숫자 크기 30~41px
    const lblSize   = Math.round(12 * rawScale);   // "COMBO" 레이블 크기

    // 색상: 킬 수에 따라 부드럽게 변화 (단계 없음)
    const hue = bt.comboKills >= 50 ? 0           // 진빨강
              : bt.comboKills >= 30 ? 15           // 주황빨
              : bt.comboKills >= 15 ? 35           // 주황
              : 52;                                // 노랑
    const ccol = `hsl(${hue},100%,60%)`;
    const ccolDim = `hsl(${hue},80%,38%)`;

    ctx.save();
    ctx.globalAlpha = comboAlpha;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';

    // ── 숫자 (크고 굵게) ──
    ctx.font = `900 ${numSize}px Arial, sans-serif`;
    // 외곽선 효과 (검은 테두리로 가독성 확보)
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = Math.round(numSize * 0.14);
    ctx.lineJoin = 'round';
    ctx.strokeText(String(bt.comboKills), W/2, _comboBaseY);
    // 그라디언트 채움
    const numGrad = ctx.createLinearGradient(0, _comboBaseY - numSize, 0, _comboBaseY);
    numGrad.addColorStop(0, '#ffffff');
    numGrad.addColorStop(0.4, ccol);
    numGrad.addColorStop(1, ccolDim);
    ctx.fillStyle = numGrad;
    ctx.shadowColor = ccol; ctx.shadowBlur = 16;
    ctx.fillText(String(bt.comboKills), W/2, _comboBaseY);
    ctx.shadowBlur = 0;

    // ── "COMBO" 레이블 ──
    const numW = ctx.measureText(String(bt.comboKills)).width;
    ctx.font = `700 ${lblSize}px Arial, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.70)';
    ctx.textBaseline = 'middle';
    ctx.fillText('COMBO', W/2, _comboBaseY - numSize/2);

    // ── 불꽃 (15킬 이상만, 숫자 양 옆 작게) ──
    if (bt.comboKills >= 15) {
      ctx.font = `${Math.round(lblSize * 1.1)}px serif`;
      ctx.textBaseline = 'middle';
      const margin = numW / 2 + Math.round(lblSize * 0.7);
      ctx.fillText('🔥', W/2 - margin, _comboBaseY - numSize/2);
      ctx.fillText('🔥', W/2 + margin, _comboBaseY - numSize/2);
    }

    ctx.restore();
  }

  // ── 미니 도전 HUD — 하단 좌측 ──
  if(bt.miniChallenge && !bt.miniChallenge.completed && !bt.miniChallenge.failed){
    const ch = bt.miniChallenge;
    const isEliteCh = ch.id && ch.id.startsWith('elite_');
    const mcX0 = PAD, mcY0 = _comboBaseY - 26, mcW = 230, mcH = 30;

    ctx.save();
    ctx.globalAlpha = 0.96;
    // 배경
    ctx.fillStyle = isEliteCh ? 'rgba(28,14,4,0.92)' : 'rgba(4,10,28,0.90)';
    roundRect(ctx, mcX0, mcY0, mcW, mcH, mcH/2); ctx.fill();
    // 테두리
    ctx.strokeStyle = isEliteCh ? 'rgba(255,150,60,0.7)' : 'rgba(90,208,255,0.65)';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = isEliteCh ? '#ff9040' : '#5ad0ff'; ctx.shadowBlur = 5;
    roundRect(ctx, mcX0, mcY0, mcW, mcH, mcH/2); ctx.stroke();
    ctx.shadowBlur = 0;

    // 아이콘
    ctx.font = '13px serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(ch.icon, mcX0 + 10, mcY0 + mcH/2);

    // 진행도 텍스트
    const progStr = ch.progress ? ch.progress() : '';
    const mainColor = isEliteCh ? '#ffb870' : '#b8e8ff';
    ctx.fillStyle = mainColor; ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(ch.text, mcX0 + 26, mcY0 + mcH/2 - 1);

    // 진행도 수치 (오른쪽)
    if(progStr){
      ctx.fillStyle = '#f0d080'; ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(progStr, mcX0 + mcW - 10, mcY0 + mcH/2 - 1);
    }
    ctx.restore();
  }

  // ── 캐릭터 패시브 상태 표시 (활성화된 경우만) ──
  {
    const _charId = gs.selectedChar?.id;
    let _passLabel = null, _passColor = '#aabbdd';
    if(_charId==='penguin' && (bt._penguinBladeStack||0) > 0){
      _passLabel = `⚔️ 원검 일체 ×${bt._penguinBladeStack} (+${bt._penguinBladeStack*25}%)`;
      _passColor = '#88e8ff';
    } else if(_charId==='fox' && (bt._foxExplosiveShots||0) > 0){
      _passLabel = `💥 폭발 직감 ${bt._foxExplosiveShots}발`;
      _passColor = '#ff8840';
    } else if(_charId==='rabbit' && (bt._rabbitStrikeWindow||0) > 0){
      _passLabel = `⚡ 도약 반격 ×2.5`;
      _passColor = '#ffe040';
    } else if(_charId==='cat' && (bt._catFrenzy||0) > 0){
      _passLabel = `😺 광란! (${Math.ceil((bt._catFrenzy||0)/60)}s)`;
      _passColor = '#f8e030';
    } else if(_charId==='bear' && p.hp <= p.maxHp*0.5){
      _passLabel = `🛡️ 철옹 피해 -25%`;
      _passColor = '#ff7050';
    }
    if(_passLabel){
      ctx.save();
      ctx.font = 'bold 11px Arial';
      const _pw = ctx.measureText(_passLabel).width + 22;
      const _px = W/2 - _pw/2;
      const _py = barY + barH + 6;
      ctx.globalAlpha = 0.93;
      ctx.fillStyle = 'rgba(4,10,26,0.86)';
      roundRect(ctx, _px, _py, _pw, 20, 10); ctx.fill();
      ctx.strokeStyle = _passColor + '90'; ctx.lineWidth = 1.5;
      ctx.shadowColor = _passColor; ctx.shadowBlur = 7;
      roundRect(ctx, _px, _py, _pw, 20, 10); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = _passColor;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(_passLabel, W/2, _py + 10);
      ctx.restore();
    }
  }

  // ════════════════════════════════════════════════
  //  하단 레이아웃 — 아래에서 위로 쌓는 구조
  //  Row 1(맨 아래): 스킬 아이콘바(좌) | 스탯 아이콘바(우)
  //  Row 2: 시너지 pills(좌) | 유물 바(우)
  //  Row 3: 엘리트 특수능력(좌, 있을 때만)
  // ════════════════════════════════════════════════
  const specialIcons = [];
  if(s.sword>0)        specialIcons.push({e:'🗡️', n:`검×${s.sword}`,       c:'#d8e4f0', tip:`회전 검 ×${s.sword}\n플레이어 주위를 선회하며 근접한 모든 적에게 지속 피해`});
  if(s.lightning>0){
    const _lMax = Math.max(8, 55-s.lightning*8);
    const _lReady = bt.lightningTimer <= 0;
    specialIcons.push({e:'⚡', n: _lReady ? `번개×${s.lightning}` : `번개 ${(bt.lightningTimer/60).toFixed(1)}s`,
      c: _lReady ? '#f8e030' : '#806010',
      cdTimer: _lReady ? 0 : bt.lightningTimer, cdMax: _lMax,
      tip:`번개 ×${s.lightning}\n자동으로 가장 가까운 적 ${s.lightning+1}마리를 감전시킴`});
  }
  if(s.freeze>0){
    const _fMax = Math.max(80, 200-s.freeze*30);
    const _fReady = bt.freezeTimer <= 0;
    specialIcons.push({e:'❄️', n: _fReady ? `빙결×${s.freeze}` : `빙결 ${Math.ceil(bt.freezeTimer/60)}s`,
      c: _fReady ? '#7dd8ff' : '#306080',
      cdTimer: _fReady ? 0 : bt.freezeTimer, cdMax: _fMax,
      tip:`빙결 ×${s.freeze}\n주기적으로 근처 적을 얼림`});
  }
  if(s.regen>0){
    const _rReady = bt.regenTimer <= 3;
    specialIcons.push({e:'💚', n:`재생+${s.regen}`,     c: _rReady ? '#4ecf7a' : '#2a7a50',
      cdTimer: _rReady ? 0 : bt.regenTimer, cdMax: 60,
      tip:`자연 회복 +${s.regen}\n매 초 HP를 ${s.regen} 회복`});
  }
  if(s.aoe>0)          specialIcons.push({e:'💥',  n:`폭발×${s.aoe}`,       c:'#f87040', tip:`폭발 ×${s.aoe}\n총알이 적에게 맞을 때 범위 폭발 피해 발생`});
  if(s.multiAoe>0)     specialIcons.push({e:'🌊',  n:`연쇄×${s.multiAoe}`,  c:'#f87040', tip:`연쇄 폭발 ×${s.multiAoe}\n폭발이 연속으로 터져 더 넓은 범위 피해`});
  if(s.piercing)       specialIcons.push({e:'💠',  n:'관통',                c:'#4af',    tip:`관통 탄\n총알이 적을 꿰뚫고 계속 날아감`});
  if(s.blackhole)      specialIcons.push({e:'🕳️',  n:'블랙홀',              c:'#9b6ee8', tip:`블랙홀\n주기적으로 주변 적을 중심으로 끌어당김`});
  if(s.deathBeam)      specialIcons.push({e:'🌀',  n:'레이저',              c:'#f0f',    tip:`소멸 광선\n강력한 레이저를 주기적으로 발사`});
  if(s.dash>0){
    const dReady = bt.dashCooldown<=0;
    const _dMax = 90; // 대시 최대 쿨타임
    specialIcons.push({e:'💫', n: dReady ? '대시' : `${Math.ceil(bt.dashCooldown/60)}s`,
      c: dReady ? '#aef' : '#446688',
      cdTimer: dReady ? 0 : bt.dashCooldown, cdMax: _dMax,
      tip:`대시 (Space/우측 탭)\n빠르게 이동${dReady?' — 준비됨!':` — 재충전 ${Math.ceil(bt.dashCooldown/60)}초`}`});
  }

  const statIcons = [];
  const totalBullets = 1 + (s.bulletCount||0);
  statIcons.push({e:'🔫', n:`×${totalBullets}발`, c: totalBullets>=4?'#f8e030':totalBullets>=3?'#4ecf7a':'#d8e4f0',
    tip:`발사 수 ×${totalBullets}\n동시에 발사되는 총알 수`});
  if((s.bulletSpeed||0)>0) statIcons.push({e:'💨', n:`탄속+${Math.round(s.bulletSpeed*10)/10}`, c:'#adf',
    tip:`탄속 +${Math.round(s.bulletSpeed*10)/10}\n총알의 이동 속도 증가`});
  if((s.fireRateBonus||0)>0) statIcons.push({e:'🔥', n:`연사+${s.fireRateBonus}ms`, c:'#f8a030',
    tip:`연사 속도 +${s.fireRateBonus}ms\n총알 발사 간격 단축`});
  if((s.magnet||0)>0)      statIcons.push({e:'🧲', n:`자석×${s.magnet}`,    c:'#f8c0f0',
    tip:`골드 자석 ×${s.magnet}\n골드와 아이템 자동 수집 범위 확대`});
  const deckN = gs.deck.length;
  const upgN = gs.deck.filter(c=>c._upgraded).length;
  statIcons.push({e:'🔮', n: upgN>0?`룬${deckN} ✦${upgN}`:`룬 ${deckN}장`, c: upgN>0?'#f0d060': deckN>=10?'#c9a84c':deckN>=6?'#4a9eff':'#8aaa', badge: upgN>0?`✦${upgN}`:null,
    tip:`룬 ${deckN}장${upgN>0?` (✦${upgN}장 각성됨)`:''}\n보유한 룬 수. 룬이 쌓일수록 시너지 발동 확률 증가`});

  // ════════════════════════════════════════════
  //  하단 HUD — 콤팩트(기본) / 확장(우클릭·Tab)
  //  bt._hudExpanded: false=콤팩트, true=확장
  // ════════════════════════════════════════════
  const _exp = !!(bt && bt._hudExpanded);

  if(!bt._iconHUDPos) bt._iconHUDPos = [];
  bt._iconHUDPos = [];
  if(!bt._synHUDPos)  bt._synHUDPos  = [];
  bt._synHUDPos  = [];
  if(!bt._relicHUDPos) bt._relicHUDPos = [];
  bt._relicHUDPos = [];

  const activeSyns = getActiveSynergies();
  const epList = gs.elitePowers || [];

  // ── 쿨타임 아크 공통 드로어 ──
  function drawCdArc(sk, ix, iy, sz) {
    if (!sk.cdMax || sk.cdTimer <= 0) return;
    const cdFrac = Math.min(1, sk.cdTimer / sk.cdMax);
    const cx2 = ix + sz/2, cy2 = iy + sz/2;
    const r2 = sz/2 - 2;
    ctx.save();
    ctx.globalAlpha = 0.62;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.beginPath(); ctx.moveTo(cx2,cy2);
    ctx.arc(cx2,cy2,r2,-Math.PI/2,-Math.PI/2+cdFrac*Math.PI*2,false);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    if (cdFrac > 0.05 && sk.cdTimer >= 4) {
      ctx.fillStyle='#fff'; ctx.font=`bold ${sz>=30?11:9}px Arial`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=4;
      ctx.fillText(Math.ceil(sk.cdTimer/60)+'s', cx2, cy2);
      ctx.shadowBlur=0;
    }
    if (cdFrac < 0.15) {
      const pulse2 = 0.5+0.5*Math.abs(Math.sin(_drawNow*0.02));
      ctx.globalAlpha = pulse2;
      ctx.strokeStyle = sk.c||'#aaa'; ctx.lineWidth=2;
      ctx.shadowColor=sk.c||'#aaa'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(cx2,cy2,r2,0,Math.PI*2); ctx.stroke();
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  if (_exp) {
    // ══════════════════════════════════════════
    //  확장 모드 — 풀 상세 HUD
    // ══════════════════════════════════════════
    const iconSize = 38, gap = 5;
    const iconBarH = iconSize + 14;
    const sy0 = W - PAD - iconSize - 2;

    function drawIconBarExp(icons, x0) {
      if (icons.length === 0) return;
      const panelW = icons.length * (iconSize + gap) - gap + 16;
      ctx.save();
      ctx.fillStyle = 'rgba(8,14,36,0.92)';
      roundRect(ctx, x0-5, sy0-6, panelW, iconBarH, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(100,160,255,0.30)'; ctx.lineWidth=1;
      roundRect(ctx, x0-5, sy0-6, panelW, iconBarH, 10); ctx.stroke();
      ctx.globalAlpha=0.07; ctx.fillStyle='#fff';
      roundRect(ctx, x0-5, sy0-6, panelW, 6, 10); ctx.fill();
      ctx.globalAlpha=1; ctx.restore();

      icons.forEach((sk,i) => {
        const ix = x0 + i*(iconSize+gap);
        bt._iconHUDPos.push({icon:sk, x:ix, y:sy0, size:iconSize});
        const hc = sk.c||'#aabbcc';
        ctx.fillStyle=hc+'22'; roundRect(ctx,ix,sy0,iconSize,iconSize,7); ctx.fill();
        ctx.strokeStyle=hc+'60'; ctx.lineWidth=1;
        roundRect(ctx,ix,sy0,iconSize,iconSize,7); ctx.stroke();
        ctx.font='21px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(sk.e, ix+iconSize/2, sy0+iconSize/2-4);
        ctx.fillStyle=hc; ctx.font='bold 9px Arial';
        ctx.textAlign='center'; ctx.textBaseline='alphabetic';
        ctx.fillText(sk.n, ix+iconSize/2, sy0+iconSize-1);
        if(sk.badge){
          ctx.save(); ctx.fillStyle='#f0d060'; ctx.shadowColor='#f0d060'; ctx.shadowBlur=6;
          ctx.font='bold 9px Arial'; ctx.textAlign='right'; ctx.textBaseline='top';
          ctx.fillText(sk.badge, ix+iconSize-2, sy0+2); ctx.restore();
        }
        drawCdArc(sk, ix, sy0, iconSize);
      });
    }

    drawIconBarExp(specialIcons, PAD);
    const statX0 = W - PAD - statIcons.length*(iconSize+gap)+gap-10;
    drawIconBarExp(statIcons, statX0);

    const pillH=18, pillGap=5;
    const row2Y = sy0 - 5 - 10 - pillH;

    // 시너지 pills
    if (activeSyns.length > 0) {
      let px = PAD;
      activeSyns.forEach(syn => {
        ctx.font='bold 11px Arial';
        const label=`${syn.emoji} ${syn.name}`;
        const pillW=ctx.measureText(label).width+22, pH=20;
        bt._synHUDPos.push({syn,x:px,y:row2Y,w:pillW,h:pH});
        ctx.save();
        ctx.fillStyle=syn.color+'30'; roundRect(ctx,px,row2Y,pillW,pH,pH/2); ctx.fill();
        ctx.globalAlpha=0.12; ctx.fillStyle='#fff';
        roundRect(ctx,px+1,row2Y+1,pillW-2,pH*0.45,pH/2); ctx.fill();
        ctx.globalAlpha=1;
        ctx.shadowColor=syn.color; ctx.shadowBlur=8;
        ctx.strokeStyle=syn.color+'90'; ctx.lineWidth=1.5;
        roundRect(ctx,px,row2Y,pillW,pH,pH/2); ctx.stroke();
        ctx.shadowBlur=0;
        ctx.fillStyle=syn.color; ctx.font='bold 11px Arial';
        ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillText(label, px+11, row2Y+pH/2);
        ctx.restore();
        px += pillW+pillGap;
      });
    }

    // 유물 바
    if (gs.relics.length > 0) {
      const rSize=28, rGap=4;
      const rTotalW=Math.min(gs.relics.length,12)*(rSize+rGap)-rGap;
      const rx0=W-PAD-rTotalW, ry0=row2Y-1;
      ctx.save();
      ctx.fillStyle='rgba(6,10,26,0.88)';
      roundRect(ctx,rx0-6,ry0-3,rTotalW+12,rSize+6,8); ctx.fill();
      ctx.globalAlpha=0.07; ctx.fillStyle='#fff';
      roundRect(ctx,rx0-6,ry0-3,rTotalW+12,6,8); ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(201,168,76,0.40)'; ctx.lineWidth=1.5;
      ctx.shadowColor='rgba(201,168,76,0.15)'; ctx.shadowBlur=8;
      roundRect(ctx,rx0-6,ry0-3,rTotalW+12,rSize+6,8); ctx.stroke();
      ctx.shadowBlur=0; ctx.restore();
      gs.relics.slice(0,12).forEach((r,i)=>{
        const ix=rx0+i*(rSize+rGap);
        bt._relicHUDPos.push({relic:r,x:ix,y:ry0,size:rSize});
        ctx.fillStyle=r.color+'22'; roundRect(ctx,ix,ry0,rSize,rSize,5); ctx.fill();
        ctx.strokeStyle=r.color+'55'; ctx.lineWidth=1;
        roundRect(ctx,ix,ry0,rSize,rSize,5); ctx.stroke();
        ctx.font='15px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(r.emoji,ix+rSize/2,ry0+rSize/2);
        if(r.id==='r_berserker_blood'&&(gs._relicBerserkActive||0)>0){
          ctx.save(); ctx.strokeStyle='#e05050'; ctx.lineWidth=2;
          ctx.shadowColor='#e05050'; ctx.shadowBlur=8;
          roundRect(ctx,ix,ry0,rSize,rSize,5); ctx.stroke(); ctx.restore();
        }
        if(r.id==='r_phoenix'&&!gs._relicPhoenixReady){
          ctx.save(); ctx.globalAlpha=0.5; ctx.fillStyle='rgba(0,0,0,0.6)';
          roundRect(ctx,ix,ry0,rSize,rSize,5); ctx.fill(); ctx.restore();
        }
      });
    }

    // 엘리트 특수능력
    if (epList.length > 0) {
      const epSize=26, epGap=3;
      const epTotalW=Math.min(epList.length,10)*(epSize+epGap)-epGap;
      const epX0=PAD, epY0=row2Y-epSize-12;
      ctx.save();
      ctx.fillStyle='rgba(16,4,34,0.90)';
      roundRect(ctx,epX0-5,epY0-3,epTotalW+10,epSize+6,8); ctx.fill();
      ctx.globalAlpha=0.07; ctx.fillStyle='#fff';
      roundRect(ctx,epX0-5,epY0-3,epTotalW+10,5,8); ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(155,110,232,0.55)'; ctx.lineWidth=1.5;
      ctx.shadowColor='rgba(155,110,232,0.2)'; ctx.shadowBlur=8;
      roundRect(ctx,epX0-5,epY0-3,epTotalW+10,epSize+6,8); ctx.stroke();
      ctx.shadowBlur=0; ctx.restore();
      ctx.fillStyle='rgba(180,140,255,0.75)'; ctx.font='bold 8px Arial';
      ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.fillText('💀 특수능력', epX0, epY0-4);
      epList.slice(0,10).forEach((pw,i)=>{
        const ix=epX0+i*(epSize+epGap);
        ctx.save();
        ctx.fillStyle=pw.color+'22'; roundRect(ctx,ix,epY0,epSize,epSize,5); ctx.fill();
        ctx.strokeStyle=pw.color+'66'; ctx.lineWidth=1;
        roundRect(ctx,ix,epY0,epSize,epSize,5); ctx.stroke();
        ctx.font='14px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(pw.emoji,ix+epSize/2,epY0+epSize/2);
        ctx.restore();
      });
    }

    // 확장 표시 힌트
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.font='bold 9px Arial';
    ctx.textAlign='right'; ctx.textBaseline='bottom';
    ctx.fillText('우클릭 · Tab = 간략히', W-PAD, W-PAD);
    ctx.restore();

  } else {
    // ══════════════════════════════════════════
    //  콤팩트 모드 — 아이콘만, 레이블 없음
    // ══════════════════════════════════════════
    const cSz = 26, cGap = 3;  // 작은 아이콘 크기
    const cy0 = W - PAD - cSz; // 아이콘 top Y

    // 스킬 아이콘 (좌) — 이모지 + 쿨타임 아크만
    if (specialIcons.length > 0) {
      const panelW = specialIcons.length*(cSz+cGap)-cGap+10;
      ctx.save();
      ctx.fillStyle='rgba(6,12,30,0.80)';
      roundRect(ctx, PAD-4, cy0-4, panelW, cSz+8, 8); ctx.fill();
      ctx.strokeStyle='rgba(100,160,255,0.20)'; ctx.lineWidth=1;
      roundRect(ctx, PAD-4, cy0-4, panelW, cSz+8, 8); ctx.stroke();
      ctx.restore();

      specialIcons.forEach((sk,i)=>{
        const ix = PAD + i*(cSz+cGap);
        bt._iconHUDPos.push({icon:sk, x:ix, y:cy0, size:cSz});
        const hc = sk.c||'#aabbcc';
        ctx.fillStyle=hc+'20'; roundRect(ctx,ix,cy0,cSz,cSz,6); ctx.fill();
        ctx.strokeStyle=hc+'50'; ctx.lineWidth=1;
        roundRect(ctx,ix,cy0,cSz,cSz,6); ctx.stroke();
        ctx.font='15px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(sk.e, ix+cSz/2, cy0+cSz/2);
        drawCdArc(sk, ix, cy0, cSz);
      });
    }

    // 유물 (우) — 미니 이모지 아이콘
    if (gs.relics.length > 0) {
      const rSz=20, rGap=3;
      const rMax = Math.min(gs.relics.length, 16);
      const rW = rMax*(rSz+rGap)-rGap;
      const rx0 = W-PAD-rW, ry0 = cy0+(cSz-rSz)/2;
      ctx.save();
      ctx.fillStyle='rgba(6,10,26,0.75)';
      roundRect(ctx,rx0-4,ry0-3,rW+8,rSz+6,6); ctx.fill();
      ctx.strokeStyle='rgba(201,168,76,0.25)'; ctx.lineWidth=1;
      roundRect(ctx,rx0-4,ry0-3,rW+8,rSz+6,6); ctx.stroke();
      ctx.restore();
      gs.relics.slice(0,rMax).forEach((r,i)=>{
        const ix=rx0+i*(rSz+rGap);
        bt._relicHUDPos.push({relic:r,x:ix,y:ry0,size:rSz});
        ctx.font='11px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        if(r.id==='r_phoenix'&&!gs._relicPhoenixReady){ctx.save();ctx.globalAlpha=0.4;}
        ctx.fillText(r.emoji, ix+rSz/2, ry0+rSz/2);
        if(r.id==='r_phoenix'&&!gs._relicPhoenixReady){ctx.restore();}
      });
    }

    // 시너지 dots (하단 좌측 위, 있을 때만)
    if (activeSyns.length > 0) {
      const dotR=5, dotGap=4;
      const dotY = cy0 - dotR*2 - 6;
      let dotX = PAD;
      activeSyns.forEach(syn=>{
        bt._synHUDPos.push({syn,x:dotX-dotR,y:dotY-dotR,w:dotR*2,h:dotR*2});
        ctx.save();
        ctx.shadowColor=syn.color; ctx.shadowBlur=6;
        ctx.fillStyle=syn.color;
        ctx.beginPath(); ctx.arc(dotX, dotY, dotR, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        dotX += dotR*2+dotGap;
      });
    }

    // 엘리트 특수능력 (초소형)
    if (epList.length > 0) {
      const epSz=18, epGap=2;
      const epW = Math.min(epList.length,10)*(epSz+epGap)-epGap;
      const epX0 = PAD, epY0 = cy0 - epSz - (activeSyns.length>0?18:6);
      ctx.save();
      ctx.fillStyle='rgba(14,4,28,0.78)';
      roundRect(ctx,epX0-3,epY0-3,epW+6,epSz+6,5); ctx.fill();
      ctx.strokeStyle='rgba(155,110,232,0.35)'; ctx.lineWidth=1;
      roundRect(ctx,epX0-3,epY0-3,epW+6,epSz+6,5); ctx.stroke();
      ctx.restore();
      epList.slice(0,10).forEach((pw,i)=>{
        const ix=epX0+i*(epSz+epGap);
        ctx.font='11px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(pw.emoji, ix+epSz/2, epY0+epSz/2);
      });
    }

    // 콤팩트 힌트
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.font='bold 8px Arial';
    ctx.textAlign='right'; ctx.textBaseline='bottom';
    ctx.fillText('우클릭·Tab = 상세', W-PAD, W-PAD);
    ctx.restore();
  }

  ctx.restore();
}

// ── 플레이어 캐릭터 Canvas 직접 드로잉 (이모지 대체) ──
// ctx는 이미 플레이어 위치로 translate + pAngle+PI/2 rotate 된 상태
// s = player.size (~20)
function drawPlayerCharacter(ctx, charId, s) {
  switch(charId) {

    default:
    case 'penguin': {
      // 날개
      const wingG = ctx.createRadialGradient(-s*.1,-s*.1,0,0,0,s*1.3);
      wingG.addColorStop(0,'#2a2e58'); wingG.addColorStop(1,'#080c20');
      ctx.fillStyle=wingG;
      ctx.beginPath(); ctx.ellipse(-s*1.0,s*.1,s*.34,s*.68,-0.28,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse( s*1.0,s*.1,s*.34,s*.68, 0.28,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.ellipse(-s*1.0,s*.1,s*.34,s*.68,-0.28,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse( s*1.0,s*.1,s*.34,s*.68, 0.28,0,Math.PI*2); ctx.stroke();
      // 몸통
      const bdG=ctx.createRadialGradient(-s*.25,-s*.2,0,0,s*.1,s*1.4);
      bdG.addColorStop(0,'#2e3468'); bdG.addColorStop(.5,'#14183a'); bdG.addColorStop(1,'#060810');
      ctx.fillStyle=bdG;
      ctx.beginPath(); ctx.ellipse(0,s*.15,s*.9,s*1.1,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.ellipse(0,s*.15,s*.9,s*1.1,0,0,Math.PI*2); ctx.stroke();
      // 흰 배
      const blG=ctx.createRadialGradient(0,s*.2,0,0,s*.25,s*.72);
      blG.addColorStop(0,'#f8f8ff'); blG.addColorStop(.65,'#e0e8f4'); blG.addColorStop(1,'#c4d4e8');
      ctx.fillStyle=blG;
      ctx.beginPath(); ctx.ellipse(0,s*.28,s*.54,s*.72,0,0,Math.PI*2); ctx.fill();
      // 머리
      const hdG=ctx.createRadialGradient(-s*.2,-s*1.05,0,0,-s*.9,s*.72);
      hdG.addColorStop(0,'#2e3468'); hdG.addColorStop(.55,'#14183a'); hdG.addColorStop(1,'#06080e');
      ctx.fillStyle=hdG;
      ctx.beginPath(); ctx.arc(0,-s*.9,s*.62,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=1.8; ctx.stroke();
      // 흰 얼굴
      ctx.fillStyle='#f0f0f8';
      ctx.beginPath(); ctx.ellipse(0,-s*.82,s*.38,s*.42,0,0,Math.PI*2); ctx.fill();
      // 눈
      [-s*.2,s*.2].forEach(ex=>{
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,-s*.98,s*.16,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#0e1030'; ctx.beginPath(); ctx.arc(ex+s*.04,-s*.97,s*.10,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex+s*.08,-s*1.02,s*.04,0,Math.PI*2); ctx.fill();
      });
      // 부리
      ctx.fillStyle='#ff8830';
      ctx.beginPath(); ctx.moveTo(-s*.14,-s*.74); ctx.lineTo(s*.14,-s*.74); ctx.lineTo(0,-s*.58); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#cc5500'; ctx.lineWidth=.8; ctx.stroke();
      // 발
      ctx.fillStyle='#ff8830';
      [-s*.34,s*.34].forEach(fx=>{ ctx.beginPath(); ctx.ellipse(fx,s*1.18,s*.28,s*.13,0,0,Math.PI*2); ctx.fill(); });
      // 하이라이트
      const hlG=ctx.createRadialGradient(-s*.28,-s*.5,0,-s*.28,-s*.5,s*.72);
      hlG.addColorStop(0,'rgba(255,255,255,0.28)'); hlG.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=hlG;
      ctx.beginPath(); ctx.ellipse(-s*.2,-s*.42,s*.55,s*.72,-0.3,0,Math.PI*2); ctx.fill();
      break;
    }

    case 'fox': {
      // 꼬리 (뒤에)
      const tlG=ctx.createRadialGradient(s*.8,s*.45,0,s*.8,s*.45,s*.82);
      tlG.addColorStop(0,'#ff9848'); tlG.addColorStop(.6,'#e06020'); tlG.addColorStop(1,'#b04010');
      ctx.fillStyle=tlG;
      ctx.beginPath(); ctx.ellipse(s*.85,s*.4,s*.55,s*.42,0.5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(100,20,0,.6)'; ctx.lineWidth=1.2; ctx.stroke();
      ctx.fillStyle='#f8f0e8';
      ctx.beginPath(); ctx.ellipse(s*1.08,s*.35,s*.26,s*.2,0.5,0,Math.PI*2); ctx.fill();
      // 몸통
      const bdF=ctx.createRadialGradient(-s*.2,-s*.15,0,0,s*.1,s*1.25);
      bdF.addColorStop(0,'#ffa050'); bdF.addColorStop(.5,'#e07030'); bdF.addColorStop(1,'#b04820');
      ctx.fillStyle=bdF;
      ctx.beginPath(); ctx.ellipse(0,s*.15,s*.88,s*1.0,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(90,20,0,.65)'; ctx.lineWidth=1.8; ctx.stroke();
      // 흰 배
      ctx.fillStyle='#f8f0e8';
      ctx.beginPath(); ctx.ellipse(0,s*.28,s*.48,s*.65,0,0,Math.PI*2); ctx.fill();
      // 머리
      const hdF=ctx.createRadialGradient(-s*.15,-s*.98,0,0,-s*.88,s*.65);
      hdF.addColorStop(0,'#ffa050'); hdF.addColorStop(.65,'#e07030'); hdF.addColorStop(1,'#b04820');
      ctx.fillStyle=hdF;
      ctx.beginPath(); ctx.arc(0,-s*.85,s*.58,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(90,20,0,.65)'; ctx.lineWidth=1.8; ctx.stroke();
      // 귀
      [[-s*.28,-s*1.4],[s*.28,-s*1.4]].forEach(([ex,ey])=>{
        ctx.fillStyle='#e07030';
        ctx.beginPath(); ctx.moveTo(ex-s*.22,ey+s*.3); ctx.lineTo(ex,ey); ctx.lineTo(ex+s*.22,ey+s*.3); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(90,20,0,.6)'; ctx.lineWidth=1.2; ctx.stroke();
        ctx.fillStyle='#ff88a8';
        ctx.beginPath(); ctx.moveTo(ex-s*.12,ey+s*.24); ctx.lineTo(ex,ey+s*.06); ctx.lineTo(ex+s*.12,ey+s*.24); ctx.closePath(); ctx.fill();
      });
      // 눈
      [-s*.2,s*.2].forEach(ex=>{
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,-s*.92,s*.15,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#0e1030'; ctx.beginPath(); ctx.arc(ex+s*.03,-s*.91,s*.09,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex+s*.06,-s*.95,s*.035,0,Math.PI*2); ctx.fill();
      });
      // 코
      ctx.fillStyle='#1a1a2e'; ctx.beginPath(); ctx.ellipse(0,-s*.72,s*.09,s*.065,0,0,Math.PI*2); ctx.fill();
      // 하이라이트
      const hlF=ctx.createRadialGradient(-s*.3,-s*.48,0,-s*.3,-s*.48,s*.65);
      hlF.addColorStop(0,'rgba(255,255,255,0.3)'); hlF.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=hlF;
      ctx.beginPath(); ctx.ellipse(-s*.2,-s*.36,s*.5,s*.65,-0.3,0,Math.PI*2); ctx.fill();
      break;
    }

    case 'rabbit': {
      // 긴 귀
      [[-s*.25,-s*1.5],[s*.25,-s*1.5]].forEach(([ex,ey])=>{
        const eG=ctx.createRadialGradient(ex,ey+s*.3,0,ex,ey+s*.3,s*.3);
        eG.addColorStop(0,'#f8f0f8'); eG.addColorStop(1,'#dcd0e8');
        ctx.fillStyle=eG;
        ctx.beginPath(); ctx.ellipse(ex,ey+s*.55,s*.2,s*.65,ex<0?-0.12:0.12,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(160,140,190,.5)'; ctx.lineWidth=1.2; ctx.stroke();
        ctx.fillStyle='rgba(255,160,180,0.6)';
        ctx.beginPath(); ctx.ellipse(ex,ey+s*.55,s*.1,s*.48,ex<0?-0.12:0.12,0,Math.PI*2); ctx.fill();
      });
      // 몸통
      const bdR=ctx.createRadialGradient(-s*.2,-s*.1,0,0,s*.1,s*1.1);
      bdR.addColorStop(0,'#ffffff'); bdR.addColorStop(.5,'#f0eef8'); bdR.addColorStop(1,'#d4cce8');
      ctx.fillStyle=bdR;
      ctx.beginPath(); ctx.ellipse(0,s*.15,s*.85,s*1.0,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(140,120,170,.55)'; ctx.lineWidth=1.8; ctx.stroke();
      // 머리
      const hdR=ctx.createRadialGradient(-s*.15,-s*.95,0,0,-s*.85,s*.62);
      hdR.addColorStop(0,'#ffffff'); hdR.addColorStop(.6,'#f0eef8'); hdR.addColorStop(1,'#d4cce8');
      ctx.fillStyle=hdR;
      ctx.beginPath(); ctx.arc(0,-s*.82,s*.6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(140,120,170,.55)'; ctx.lineWidth=1.8; ctx.stroke();
      // 눈 (크고 반짝)
      [-s*.22,s*.22].forEach(ex=>{
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,-s*.9,s*.17,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#3a2060'; ctx.beginPath(); ctx.arc(ex+s*.03,-s*.89,s*.11,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex+s*.07,-s*.94,s*.045,0,Math.PI*2); ctx.fill();
      });
      // 코
      ctx.fillStyle='#ff88a8';
      ctx.beginPath(); ctx.moveTo(-s*.1,-s*.68); ctx.lineTo(s*.1,-s*.68); ctx.lineTo(0,-s*.56); ctx.closePath(); ctx.fill();
      // 볼 홍조
      ctx.save(); ctx.globalAlpha=.35; ctx.fillStyle='#ff8888';
      ctx.beginPath(); ctx.ellipse(-s*.38,-s*.72,s*.18,s*.1,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse( s*.38,-s*.72,s*.18,s*.1,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      // 하이라이트
      const hlR=ctx.createRadialGradient(-s*.25,-s*.5,0,-s*.25,-s*.5,s*.65);
      hlR.addColorStop(0,'rgba(255,255,255,0.48)'); hlR.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=hlR;
      ctx.beginPath(); ctx.ellipse(-s*.18,-s*.38,s*.52,s*.65,-0.3,0,Math.PI*2); ctx.fill();
      break;
    }

    case 'cat': {
      // 꼬리 (곡선)
      ctx.save(); ctx.strokeStyle='#8080a0'; ctx.lineWidth=s*.24; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(s*.38,s*.5); ctx.bezierCurveTo(s*1.18,s*.28,s*1.38,-s*.5,s*.88,-s*.78); ctx.stroke();
      ctx.strokeStyle='#606080'; ctx.lineWidth=s*.12;
      ctx.beginPath(); ctx.moveTo(s*.38,s*.5); ctx.bezierCurveTo(s*1.18,s*.28,s*1.38,-s*.5,s*.88,-s*.78); ctx.stroke();
      ctx.restore();
      // 몸통
      const bdC=ctx.createRadialGradient(-s*.2,-s*.1,0,0,0,s*1.25);
      bdC.addColorStop(0,'#b0b0ce'); bdC.addColorStop(.5,'#8888a8'); bdC.addColorStop(1,'#5c5c80');
      ctx.fillStyle=bdC;
      ctx.beginPath(); ctx.ellipse(0,s*.15,s*.88,s*1.0,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(40,40,70,.65)'; ctx.lineWidth=1.8; ctx.stroke();
      // 줄무늬
      ctx.save(); ctx.globalAlpha=.22; ctx.strokeStyle='#404060'; ctx.lineWidth=s*.12;
      [-s*.32,0,s*.32].forEach(sx=>{ ctx.beginPath(); ctx.moveTo(sx,-s*.22); ctx.lineTo(sx+s*.1,s*.6); ctx.stroke(); });
      ctx.restore();
      // 흰 배
      ctx.fillStyle='#e8e8f0'; ctx.beginPath(); ctx.ellipse(0,s*.28,s*.48,s*.62,0,0,Math.PI*2); ctx.fill();
      // 머리
      const hdC=ctx.createRadialGradient(-s*.15,-s*.98,0,0,-s*.88,s*.62);
      hdC.addColorStop(0,'#b0b0ce'); hdC.addColorStop(.6,'#8888a8'); hdC.addColorStop(1,'#5c5c80');
      ctx.fillStyle=hdC;
      ctx.beginPath(); ctx.arc(0,-s*.85,s*.6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(40,40,70,.65)'; ctx.lineWidth=1.8; ctx.stroke();
      // 뾰족 귀
      [[-s*.32,-s*1.38],[s*.32,-s*1.38]].forEach(([ex,ey])=>{
        ctx.fillStyle='#8888a8';
        ctx.beginPath(); ctx.moveTo(ex-s*.24,ey+s*.28); ctx.lineTo(ex,ey); ctx.lineTo(ex+s*.24,ey+s*.28); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(40,40,70,.6)'; ctx.lineWidth=1.2; ctx.stroke();
        ctx.fillStyle='#ff88a8';
        ctx.beginPath(); ctx.moveTo(ex-s*.12,ey+s*.22); ctx.lineTo(ex,ey+s*.06); ctx.lineTo(ex+s*.12,ey+s*.22); ctx.closePath(); ctx.fill();
      });
      // 눈 (수직 동공)
      [-s*.22,s*.22].forEach(ex=>{
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,-s*.92,s*.15,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#60d080'; ctx.beginPath(); ctx.arc(ex,-s*.91,s*.12,0,Math.PI*2); ctx.fill(); // 초록 홍채
        ctx.fillStyle='#0e1030'; ctx.beginPath(); ctx.ellipse(ex,-s*.91,s*.05,s*.11,0,0,Math.PI*2); ctx.fill(); // 수직 동공
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex+s*.05,-s*.95,s*.03,0,Math.PI*2); ctx.fill();
      });
      // 코+수염
      ctx.fillStyle='#ff88a8'; ctx.beginPath(); ctx.arc(0,-s*.73,s*.07,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(180,180,200,.7)'; ctx.lineWidth=0.8;
      [[-1,1],[-1,0],[1,1],[1,0]].forEach(([d,r])=>{
        ctx.beginPath(); ctx.moveTo(s*.06*Math.sign(d),-s*.73); ctx.lineTo(s*d*.52,-s*.73+s*.06*r); ctx.stroke();
      });
      // 하이라이트
      const hlC=ctx.createRadialGradient(-s*.28,-s*.48,0,-s*.28,-s*.48,s*.65);
      hlC.addColorStop(0,'rgba(255,255,255,0.32)'); hlC.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=hlC; ctx.beginPath(); ctx.ellipse(-s*.2,-s*.36,s*.52,s*.65,-0.3,0,Math.PI*2); ctx.fill();
      break;
    }

    case 'bear': {
      // 귀 먼저
      [[-s*.45,-s*1.32],[s*.45,-s*1.32]].forEach(([ex,ey])=>{
        ctx.fillStyle='#c07840'; ctx.beginPath(); ctx.arc(ex,ey,s*.3,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(80,28,0,.6)'; ctx.lineWidth=1.5; ctx.stroke();
        ctx.fillStyle='#e8a060'; ctx.beginPath(); ctx.arc(ex,ey,s*.18,0,Math.PI*2); ctx.fill();
      });
      // 몸통
      const bdB=ctx.createRadialGradient(-s*.25,-s*.15,0,0,s*.1,s*1.3);
      bdB.addColorStop(0,'#d89050'); bdB.addColorStop(.5,'#c07840'); bdB.addColorStop(1,'#7a4020');
      ctx.fillStyle=bdB;
      ctx.beginPath(); ctx.ellipse(0,s*.2,s*1.0,s*1.1,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(70,24,0,.65)'; ctx.lineWidth=1.8; ctx.stroke();
      // 배
      ctx.fillStyle='#e8a868'; ctx.beginPath(); ctx.ellipse(0,s*.32,s*.6,s*.72,0,0,Math.PI*2); ctx.fill();
      // 머리
      const hdB=ctx.createRadialGradient(-s*.18,-s*.95,0,0,-s*.82,s*.72);
      hdB.addColorStop(0,'#d89050'); hdB.addColorStop(.6,'#c07840'); hdB.addColorStop(1,'#7a4020');
      ctx.fillStyle=hdB;
      ctx.beginPath(); ctx.arc(0,-s*.82,s*.7,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(70,24,0,.65)'; ctx.lineWidth=1.8; ctx.stroke();
      // 주둥이
      ctx.fillStyle='#e8a868'; ctx.beginPath(); ctx.ellipse(0,-s*.6,s*.35,s*.28,0,0,Math.PI*2); ctx.fill();
      // 눈
      [-s*.25,s*.25].forEach(ex=>{
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,-s*.96,s*.16,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#0e1030'; ctx.beginPath(); ctx.arc(ex+s*.02,-s*.95,s*.1,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex+s*.06,-s*1.0,s*.04,0,Math.PI*2); ctx.fill();
      });
      // 코
      ctx.fillStyle='#1a1a2e'; ctx.beginPath(); ctx.ellipse(0,-s*.67,s*.13,s*.09,0,0,Math.PI*2); ctx.fill();
      // 하이라이트
      const hlB=ctx.createRadialGradient(-s*.32,-s*.55,0,-s*.32,-s*.55,s*.72);
      hlB.addColorStop(0,'rgba(255,255,255,0.28)'); hlB.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=hlB; ctx.beginPath(); ctx.ellipse(-s*.22,-s*.38,s*.55,s*.72,-0.3,0,Math.PI*2); ctx.fill();
      break;
    }
  }
}

// ── 적 그리기 — 귀엽고 아트스타일 통일 ──
function drawEnemyAnimal(ctx,e){
  const _now = Date.now(); // 함수 당 한 번만 호출
  // ── 공격 예고 링 (발사 20프레임 전) ──
  const _canShoot = (e.type==='tank'||e.type==='fast'||e.type==='normal') && !e.isBoss && !e.isEliteBoss && !e.isSplit;
  if(_canShoot && e.shootTimer>0 && e.shootTimer<=22){
    const _prog = 1 - e.shootTimer/22; // 0→1 (발사에 가까울수록 1)
    const _pulse = 0.5+0.5*Math.abs(Math.sin(_now*0.03));
    ctx.save();
    ctx.globalAlpha = 0.25+_prog*0.55;
    ctx.strokeStyle = `rgba(255,${Math.floor(220-_prog*180)},0,1)`;
    ctx.lineWidth = 2+_prog*3;
    ctx.shadowColor='#ff6600'; ctx.shadowBlur=10+_prog*14;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.size+5+_prog*8, 0, Math.PI*2); ctx.stroke();
    // 작은 화살표(방향 표시) — 플레이어 방향
    const _p = gs&&gs.player ? gs.player : null;
    if(_p && _prog>0.5){
      const _a=Math.atan2(_p.y-e.y,_p.x-e.x);
      const _r=e.size+14+_prog*6;
      ctx.globalAlpha=_prog*0.8;
      ctx.fillStyle='#ff8800';
      ctx.beginPath();
      ctx.moveTo(e.x+Math.cos(_a)*_r,e.y+Math.sin(_a)*_r);
      ctx.lineTo(e.x+Math.cos(_a+2.4)*(_r*0.5),e.y+Math.sin(_a+2.4)*(_r*0.5));
      ctx.lineTo(e.x+Math.cos(_a-2.4)*(_r*0.5),e.y+Math.sin(_a-2.4)*(_r*0.5));
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  ctx.save();
  const hitAlpha = e.hitFlash>0 ? 0.45+0.55*Math.sin(e.hitFlash*2.5) : 1;
  ctx.globalAlpha = hitAlpha;
  const tint = gs.act===2 ? 'ice' : gs.act===3 ? 'fire' : '';
  const fr=e.frozen>0, s=e.size;
  const bob = fr ? 0 : Math.sin((e.walkTime||0)*0.22)*Math.min(s*0.18,3.5);
  const lowHp = e.maxHp>1 && e.hp/e.maxHp<0.3;
  const x=e.x, y=e.y - bob;

  // 바닥 그림자
  ctx.save(); ctx.globalAlpha=hitAlpha*0.28; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(e.x, e.y+s*0.55, s*0.95, s*0.28, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // 방향 반전 (플레이어 방향으로)
  const flip = e.facingRight ? -1 : 1;
  ctx.save();
  ctx.translate(e.x, 0); ctx.scale(flip, 1); ctx.translate(-e.x, 0);

  // 빙결 오버레이 함수
  function frozenOverlay(rx,ry){
    if(!fr)return;
    ctx.save(); ctx.globalAlpha=0.45; ctx.fillStyle='#a8d8f0';
    ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  // 저체력 눈 발광 헬퍼
  function angryGlow(){
    if(!lowHp)return;
    ctx.save(); ctx.globalAlpha=hitAlpha*0.5+0.3*Math.abs(Math.sin(_now*0.01));
    ctx.shadowColor='#ff3030'; ctx.shadowBlur=10; ctx.fillStyle='#ff3030';
    ctx.beginPath(); ctx.arc(x-s*.18,y-s*.4,s*.06,0,Math.PI*2);
    ctx.arc(x+s*.18,y-s*.4,s*.06,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  switch(e.type){

    case'normal': { // SVG 여우형
      const col=fr?'#78c0e0':tint==='ice'?'#90d0ff':tint==='fire'?'#ff7830':'#f59040';
      const drk=fr?'#183848':tint==='ice'?'#182858':tint==='fire'?'#501008':'#401808';
      const ear=fr?'#4898c0':tint==='ice'?'#5098e0':tint==='fire'?'#d03818':'#d06020';
      const OL=3; ctx.lineWidth=OL; ctx.strokeStyle=drk; ctx.lineCap='round'; ctx.lineJoin='round';
      // 그림자
      ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x,y+s,s*1.1,s*.22,0,0,Math.PI*2); ctx.fill();
      // 꼬리
      ctx.fillStyle=ear; ctx.beginPath(); ctx.ellipse(x+s*1.1,y+s*.2,s*.55,s*.45,0.6,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff8f0'; ctx.beginPath(); ctx.ellipse(x+s*1.22,y+s*.18,s*.28,s*.22,0.6,0,Math.PI*2); ctx.fill();
      // 몸통
      ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,y+s*.15,s*1.05,s*.85,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // 왼 귀 (뾰족)
      ctx.fillStyle=ear;
      ctx.beginPath(); ctx.moveTo(x-s*.8,y-s*.75); ctx.lineTo(x-s*.5,y-s*.2); ctx.lineTo(x-s*.28,y-s*.7); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#f08080'; ctx.beginPath(); ctx.moveTo(x-s*.72,y-s*.65); ctx.lineTo(x-s*.52,y-s*.25); ctx.lineTo(x-s*.36,y-s*.62); ctx.closePath(); ctx.fill();
      // 오른 귀
      ctx.fillStyle=ear;
      ctx.beginPath(); ctx.moveTo(x+s*.04,y-s*.72); ctx.lineTo(x+s*.18,y-s*.2); ctx.lineTo(x+s*.38,y-s*.68); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#f08080'; ctx.beginPath(); ctx.moveTo(x+s*.1,y-s*.62); ctx.lineTo(x+s*.2,y-s*.26); ctx.lineTo(x+s*.32,y-s*.6); ctx.closePath(); ctx.fill();
      // 머리
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x-s*.3,y-s*.45,s*.62,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // 눈
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-s*.54,y-s*.56,s*.16,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-s*.12,y-s*.54,s*.16,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=drk; ctx.beginPath(); ctx.arc(x-s*.5,y-s*.54,s*.09,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=drk; ctx.beginPath(); ctx.arc(x-s*.08,y-s*.52,s*.09,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-s*.44,y-s*.6,s*.04,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-s*.02,y-s*.58,s*.04,0,Math.PI*2); ctx.fill();
      // 코
      ctx.fillStyle=drk; ctx.beginPath(); ctx.ellipse(x-s*.3,y-s*.3,s*.1,s*.07,0,0,Math.PI*2); ctx.fill();
      frozenOverlay(s*1.15,s*.9); angryGlow();
      break;
    }

    case'fast': { // SVG 토끼형
      const col=fr?'#c0e0f8':tint==='ice'?'#d8f0ff':tint==='fire'?'#ffc080':'#f8f4ee';
      const drk=fr?'#183848':tint==='ice'?'#182858':tint==='fire'?'#602010':'#504030';
      const OL=3; ctx.lineWidth=OL; ctx.strokeStyle=drk; ctx.lineCap='round';
      // 그림자
      ctx.fillStyle='rgba(0,0,0,0.17)'; ctx.beginPath(); ctx.ellipse(x,y+s*.85,s*.9,s*.2,0,0,Math.PI*2); ctx.fill();
      // 귀 (길고 얇은 타원)
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.ellipse(x-s*.28,y-s*1.15,s*.22,s*.72,-0.15,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x+s*.28,y-s*1.1,s*.22,s*.72,0.15,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // 귀 안 (분홍)
      ctx.fillStyle='#f090a8';
      ctx.beginPath(); ctx.ellipse(x-s*.28,y-s*1.12,s*.1,s*.54,-0.15,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+s*.28,y-s*1.08,s*.1,s*.54,0.15,0,Math.PI*2); ctx.fill();
      // 몸통
      ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,y+s*.12,s*.88,s*.75,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // 꼬리 (작은 흰 원)
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-s*.7,y+s*.45,s*.22,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // 머리
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y-s*.5,s*.52,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // 눈 (크고 초롱)
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-s*.2,y-s*.6,s*.17,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+s*.2,y-s*.6,s*.17,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=drk; ctx.beginPath(); ctx.arc(x-s*.17,y-s*.58,s*.1,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=drk; ctx.beginPath(); ctx.arc(x+s*.22,y-s*.58,s*.1,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-s*.11,y-s*.65,s*.05,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+s*.28,y-s*.65,s*.05,0,Math.PI*2); ctx.fill();
      // 코 (분홍 동그라미)
      ctx.fillStyle='#f090a8'; ctx.beginPath(); ctx.arc(x,y-s*.38,s*.09,0,Math.PI*2); ctx.fill(); ctx.stroke();
      frozenOverlay(s*.9,s*.75); angryGlow();
      break;
    }

    case'tank': { // SVG 거북형
      const sc=fr?'#68b0d0':tint==='ice'?'#78c0e0':tint==='fire'?'#b84020':'#68b068';
      const sh=fr?'#3888b0':tint==='ice'?'#4898c0':tint==='fire'?'#882810':'#3a8840';
      const sd=fr?'#185878':tint==='ice'?'#1a5888':tint==='fire'?'#581808':'#185828';
      const OL=3.5; ctx.lineWidth=OL; ctx.strokeStyle=sd; ctx.lineCap='round';
      // 그림자
      ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(x,y+s*.85,s*1.3,s*.25,0,0,Math.PI*2); ctx.fill();
      // 다리 4개
      ctx.fillStyle=sc;
      [[-s*1.1,s*.05],[s*1.1,s*.05],[-s*.85,s*.65],[s*.85,s*.65]].forEach(([lx,ly])=>{
        ctx.beginPath(); ctx.ellipse(x+lx,y+ly,s*.32,s*.24,lx<0?-0.4:0.4,0,Math.PI*2); ctx.fill(); ctx.stroke();
      });
      // 등딱지 (굵은 타원)
      ctx.fillStyle=sh; ctx.beginPath(); ctx.ellipse(x,y,s*1.22,s*.88,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // 딱지 무늬 (굵은 선으로)
      ctx.lineWidth=2; ctx.strokeStyle=sd+'aa';
      ctx.beginPath(); ctx.ellipse(x,y,s*.7,s*.5,0,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x,y-s*.5); ctx.lineTo(x,y+s*.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-s*.7,y); ctx.lineTo(x+s*.7,y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-s*.5,y-s*.35); ctx.lineTo(x+s*.5,y+s*.35); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+s*.5,y-s*.35); ctx.lineTo(x-s*.5,y+s*.35); ctx.stroke();
      ctx.lineWidth=OL; ctx.strokeStyle=sd;
      // 머리
      ctx.fillStyle=sc; ctx.beginPath(); ctx.arc(x,y-s*.82,s*.38,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // 눈
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-s*.16,y-s*.9,s*.13,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+s*.16,y-s*.9,s*.13,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=sd; ctx.beginPath(); ctx.arc(x-s*.14,y-s*.88,s*.07,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=sd; ctx.beginPath(); ctx.arc(x+s*.18,y-s*.88,s*.07,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-s*.1,y-s*.93,s*.035,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+s*.22,y-s*.93,s*.035,0,Math.PI*2); ctx.fill();
      frozenOverlay(s*1.28,s*.88); angryGlow();
      break;
    }

    case'split': { // SVG 병아리형
      const col=fr?'#b0d8f0':tint==='ice'?'#c8e8ff':tint==='fire'?'#ffc040':'#fce040';
      const drk=fr?'#183848':tint==='ice'?'#182858':tint==='fire'?'#602008':'#504008';
      const orn='#ff6010';
      const OL=3; ctx.lineWidth=OL; ctx.strokeStyle=drk; ctx.lineCap='round';
      // 그림자
      ctx.fillStyle='rgba(0,0,0,0.17)'; ctx.beginPath(); ctx.ellipse(x,y+s*.88,s*.9,s*.2,0,0,Math.PI*2); ctx.fill();
      // 날개 (양쪽)
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.ellipse(x-s*1.0,y+s*.08,s*.38,s*.26,-0.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x+s*1.0,y+s*.08,s*.38,s*.26,0.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // 몸통
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y+s*.1,s*.88,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // 볏 (굵은 삼각형 3개)
      ctx.fillStyle=orn;
      ctx.beginPath(); ctx.moveTo(x-s*.28,y-s*.82); ctx.lineTo(x-s*.18,y-s*1.18); ctx.lineTo(x-s*.06,y-s*.82); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-s*.1,y-s*.82); ctx.lineTo(x,y-s*1.25); ctx.lineTo(x+s*.1,y-s*.82); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+s*.06,y-s*.82); ctx.lineTo(x+s*.18,y-s*1.18); ctx.lineTo(x+s*.28,y-s*.82); ctx.closePath(); ctx.fill(); ctx.stroke();
      // 머리
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y-s*.72,s*.52,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // 눈 (검은 동그라미, 귀여운)
      ctx.fillStyle=drk; ctx.beginPath(); ctx.arc(x-s*.2,y-s*.82,s*.13,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=drk; ctx.beginPath(); ctx.arc(x+s*.2,y-s*.82,s*.13,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-s*.14,y-s*.88,s*.06,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+s*.26,y-s*.88,s*.06,0,Math.PI*2); ctx.fill();
      // 부리 (오렌지 삼각형)
      ctx.fillStyle=orn;
      ctx.beginPath(); ctx.moveTo(x-s*.14,y-s*.64); ctx.lineTo(x+s*.14,y-s*.64); ctx.lineTo(x,y-s*.44); ctx.closePath(); ctx.fill(); ctx.stroke();
      frozenOverlay(s*.88,s*.88); angryGlow();

    }
    case'elite':
      ctx.fillStyle=fr?'#6da3c0':'#9b6ee8';
      for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;ctx.beginPath();ctx.ellipse(x+Math.cos(a)*s*.8,y+Math.sin(a)*s*.6,s*.3,s*.4,a,0,Math.PI*2);ctx.fill();}
      ctx.fillStyle=fr?'#a8d0e8':'#c9a84c';
      ctx.beginPath();ctx.arc(x,y,s*.7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#0a0d1a';ctx.beginPath();ctx.arc(x-s*.2,y-s*.1,s*.15,0,Math.PI*2);ctx.arc(x+s*.2,y-s*.1,s*.15,0,Math.PI*2);ctx.fill();
      break;

    case'elite_berserker': {
