

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐧 Penguin Spire</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Jua&family=Noto+Sans+KR:wght@300;400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0d1a;
  --panel:#111827;
  --border:#1e3a5f;
  --gold:#c9a84c;
  --gold2:#f0d080;
  --red:#e05050;
  --blue:#4a9eff;
  --green:#4ecf7a;
  --purple:#9b6ee8;
  --gray:#6b7a8d;
  --text:#d8e4f0;
  --text2:#8aa0b8;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Jua','Noto Sans KR',sans-serif;color:var(--text);}
html,body,canvas{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#root{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
canvas{display:block;}

/* ── 공통 UI ── */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:rgba(5,8,18,0.96);}
.screen.hidden{display:none;}
/* 성장 패널이 표시될 때 콘텐츠가 가려지지 않도록 (지도/전투 제외) */
#shopScreen,#restScreen,#cardScreen,#deckScreen{padding-bottom:72px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 32px;box-shadow:0 0 60px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.04);}

/* ── 시작 화면 ── */
#startScreen{flex-direction:column;gap:20px;}
.game-title{font-family:'Cinzel',serif;font-size:42px;font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(201,168,76,0.6),0 0 60px rgba(201,168,76,0.3);letter-spacing:3px;text-align:center;}
.game-sub{color:var(--text2);font-size:14px;text-align:center;margin-top:-8px;letter-spacing:2px;}
.char-grid{display:flex;gap:14px;justify-content:center;margin-top:8px;}
.char-card{width:120px;padding:16px 12px;border-radius:12px;border:2px solid var(--border);background:rgba(255,255,255,0.03);cursor:pointer;text-align:center;transition:all 0.2s;position:relative;}
.char-card:hover{border-color:var(--gold);transform:translateY(-3px);background:rgba(201,168,76,0.08);}
.char-card.selected{border-color:var(--gold);background:rgba(201,168,76,0.12);box-shadow:0 0 20px rgba(201,168,76,0.25);}
.char-card.locked{opacity:0.4;cursor:not-allowed;filter:grayscale(1);}
.char-emoji{font-size:40px;display:block;margin-bottom:8px;}
.char-name{font-size:14px;font-weight:700;color:var(--gold);}
.char-desc{font-size:10px;color:var(--text2);margin-top:4px;line-height:1.4;}
.lock-badge{position:absolute;top:6px;right:6px;font-size:14px;}

/* ── 캐릭터 프로필 카드 ── */
.char-profile{text-align:left;animation:cpFadeIn .18s ease;}
@keyframes cpFadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.char-profile-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.char-profile-emoji{font-size:48px;line-height:1;filter:drop-shadow(0 0 10px rgba(255,255,255,0.2));}
.char-profile-title{flex:1;}
.char-profile-name{font-size:18px;font-weight:900;color:var(--gold);letter-spacing:1px;}
.char-profile-type{display:inline-block;margin-top:3px;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;}
.char-profile-hp{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.char-profile-hp-bar{flex:1;height:7px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;}
.char-profile-hp-fill{height:100%;border-radius:4px;transition:width .3s;}
.char-profile-hp-val{font-size:11px;color:var(--text2);white-space:nowrap;}
.char-profile-bonuses{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.char-bonus-pill{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(74,158,255,0.12);border:1px solid rgba(74,158,255,0.3);color:#90c8ff;}
.char-passive-block{border-radius:10px;overflow:hidden;}
.char-passive-header{display:flex;align-items:center;gap:6px;padding:7px 12px;}
.char-passive-emoji{font-size:17px;}
.char-passive-label{font-size:9px;font-weight:700;opacity:.7;letter-spacing:.5px;text-transform:uppercase;}
.char-passive-name{font-size:13px;font-weight:900;margin-left:auto;}
#charInfo{cursor:pointer;transition:none;user-select:none;}
#charInfo b{font-weight:800;}
.cp-toggle-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;
  font-size:10px;font-weight:700;cursor:pointer;border:1px solid;transition:all .15s;
  background:rgba(0,0,0,0.25);}
.cp-toggle-btn:hover{filter:brightness(1.3);}

/* ── 버튼 ── */
.btn{padding:12px 32px;border-radius:10px;border:none;cursor:pointer;font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:15px;transition:all 0.18s;outline:none;}
.btn-primary{background:linear-gradient(135deg,#c9a84c,#8b6914);color:#0a0d1a;box-shadow:0 4px 20px rgba(201,168,76,0.3);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(201,168,76,0.45);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.best-row{background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);border-radius:8px;padding:10px 16px;font-size:12px;color:var(--text2);text-align:center;}

/* ── 지도 화면 ── */
#mapScreen{flex-direction:column;gap:0;background:rgba(4,6,16,0.98);}
#mapScreen .map-header{
  width:960px;max-width:98vw;padding:14px 24px;
  background:linear-gradient(135deg,rgba(8,12,28,0.97),rgba(14,20,40,0.97));
  border-bottom:1px solid rgba(201,168,76,0.25);
  display:flex;align-items:center;justify-content:space-between;
  border-radius:16px 16px 0 0;
  box-shadow:inset 0 -1px 0 rgba(201,168,76,0.1);
}
#mapScreen .map-title{font-family:'Cinzel',serif;color:var(--gold);font-size:20px;font-weight:700;letter-spacing:2px;}
#mapCanvas{border-radius:0 0 20px 20px;display:block;}

/* ── 전투 ── */
#gameCanvas{border-radius:12px;box-shadow:0 0 60px rgba(0,0,0,0.8);}
#battleUI{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;}

/* ── 카드 선택 ── */
#cardScreen{flex-direction:column;gap:16px;}
.card-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
/* 카드 — 고정 크기, hover 시 레이아웃 변화 없음 */
@keyframes cardSlideIn{0%{opacity:0;transform:translateY(28px) scale(0.92)}70%{transform:translateY(-4px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cardPickFlash{0%{box-shadow:0 0 0 0 rgba(255,255,255,0)}30%{box-shadow:0 0 40px 16px rgba(255,255,255,0.55)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);opacity:0;transform:scale(1.08)}}
@keyframes epicGlow{0%,100%{box-shadow:0 0 22px rgba(155,110,232,0.3),0 0 0 1px rgba(155,110,232,0.15)}50%{box-shadow:0 0 36px rgba(155,110,232,0.55),0 0 0 2px rgba(155,110,232,0.35)}}
@keyframes rareGlow{0%,100%{box-shadow:0 0 18px rgba(201,168,76,0.25)}50%{box-shadow:0 0 30px rgba(201,168,76,0.5)}}
.card{width:155px;min-height:185px;border-radius:14px;padding:15px 12px;cursor:pointer;
  transition:transform 0.18s ease, box-shadow 0.2s ease, border-color 0.2s ease;display:flex;flex-direction:column;
  align-items:center;text-align:center;position:relative;overflow:hidden;opacity:0;
  animation:cardSlideIn 0.4s cubic-bezier(0.34,1.4,0.64,1) both;}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,0.08),transparent 55%);pointer-events:none;}
.card.common{border:2px solid #6b7a8d;background:rgba(107,122,141,0.12);}
.card.uncommon{border:2px solid #4a9eff;background:rgba(74,158,255,0.10);box-shadow:0 0 12px rgba(74,158,255,0.15);}
.card.rare{border:2px solid #c9a84c;background:rgba(201,168,76,0.10);animation-name:cardSlideIn,rareGlow;animation-duration:0.4s,2s;animation-timing-function:cubic-bezier(0.34,1.4,0.64,1),ease-in-out;animation-fill-mode:both;animation-iteration-count:1,infinite;}
.card.epic{border:2.5px solid #b888ff;background:rgba(155,110,232,0.14);animation-name:cardSlideIn,epicGlow;animation-duration:0.4s,1.6s;animation-timing-function:cubic-bezier(0.34,1.4,0.64,1),ease-in-out;animation-fill-mode:both;animation-iteration-count:1,infinite;}
.card.curse{border:2px solid #e05050;background:rgba(224,80,80,0.10);}
.card:hover{transform:translateY(-4px) scale(1.03);}
.card:hover.common{box-shadow:0 6px 24px rgba(107,122,141,0.5);border-color:#8a9ab0;}
.card:hover.uncommon{box-shadow:0 0 22px rgba(74,158,255,0.5);border-color:#70b8ff;}
.card:hover.rare{box-shadow:0 0 26px rgba(201,168,76,0.6);border-color:#e8c870;}
.card:hover.epic{box-shadow:0 0 26px rgba(155,110,232,0.6);border-color:#b88aff;}
.card.curse{border:2px solid #b01414;background:linear-gradient(180deg,#1a0606 0%,#110404 100%);box-shadow:0 0 22px rgba(224,40,40,0.25);}
.card:hover.curse{box-shadow:0 0 28px rgba(224,40,40,0.55);border-color:#e03030;}
.card.curse .card-rarity{color:#e05050;letter-spacing:3px;}
.card.curse .card-name{color:#ffaaaa;}
.card.curse .card-effect{color:#ff7070;}
.card.curse::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top,rgba(180,20,20,0.12),transparent 70%);pointer-events:none;}
.card-icon{font-size:34px;margin-bottom:8px;}
.card-name{font-size:14px;font-weight:700;color:var(--gold2);margin-bottom:4px;}
.card-rarity{font-size:9px;font-weight:700;letter-spacing:2px;margin-bottom:6px;}
.card.common .card-rarity{color:var(--gray);}
.card.uncommon .card-rarity{color:var(--blue);}
.card.rare .card-rarity{color:var(--gold);}
.card.epic .card-rarity{color:var(--purple);}
/* 설명은 항상 숨김 — 우클릭 툴팁으로만 표시 */
.card-desc{display:none !important;}
.card-effect{font-size:12px;color:var(--green);margin-top:6px;font-weight:700;}
.skip-btn{color:var(--gray);font-size:12px;cursor:pointer;text-decoration:underline;transition:color 0.2s;}
.skip-btn:hover{color:var(--text);}

/* ── 덱 보기 ── */
#deckScreen{flex-direction:column;gap:16px;max-height:90vh;overflow-y:auto;}
.deck-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:700px;}
.deck-card-mini{width:100px;padding:10px 8px;border-radius:8px;text-align:center;font-size:10px;border:1px solid var(--border);}
.deck-card-mini .d-icon{font-size:22px;display:block;margin-bottom:4px;}

/* ── 상점 ── */
#shopScreen{flex-direction:column;gap:0;}
.shop-items{display:flex;flex-direction:column;gap:5px;}
/* 상점 아이템 — 컴팩트 가로 행 */
.shop-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 10px;border-radius:10px;
  border:1px solid var(--border);background:rgba(255,255,255,0.025);
  position:relative;transition:all 0.15s;
}
.shop-item .si-icon{font-size:22px;flex-shrink:0;width:28px;text-align:center;}
.shop-item .si-info{flex:1;min-width:0;}
.shop-item .si-name{font-size:13px;color:var(--gold2);font-family:'Jua',sans-serif;line-height:1.2;}
.shop-item .si-desc{font-size:10px;color:var(--text2);margin-top:1px;line-height:1.4;}
.shop-item .si-price{
  flex-shrink:0;padding:4px 10px;border-radius:7px;
  font-size:12px;font-family:'Jua',sans-serif;
  border:1px solid rgba(201,168,76,0.3);
  background:rgba(201,168,76,0.07);color:var(--gold2);
  white-space:nowrap;
}
.shop-item.can-buy{cursor:pointer;border-color:rgba(74,158,255,0.3);}
.shop-item.can-buy:hover{background:rgba(74,158,255,0.07);border-color:rgba(74,158,255,0.55);}
.shop-item.can-buy:hover .si-price{background:rgba(201,168,76,0.15);border-color:rgba(201,168,76,0.55);}
.shop-item.bought{opacity:0.3;pointer-events:none;}
.shop-item.cannot-buy .si-price{opacity:0.4;filter:grayscale(0.6);}
.price-tag{font-size:12px;color:var(--gold);margin-top:6px;}
.gold-display{font-size:15px;color:var(--gold);font-family:'Jua',sans-serif;}

/* ── 휴식 화면 ── */
#restScreen{flex-direction:column;gap:20px;}
.rest-options{display:flex;gap:14px;justify-content:center;}
.rest-opt{width:160px;padding:18px 12px;border-radius:12px;border:2px solid var(--border);background:rgba(255,255,255,0.03);cursor:pointer;text-align:center;transition:all 0.2s;}
.rest-opt:hover{border-color:var(--gold);background:rgba(201,168,76,0.08);transform:translateY(-3px);}
.rest-opt .rest-icon{font-size:32px;margin-bottom:8px;}
.rest-opt .rest-name{font-size:14px;font-weight:700;color:var(--gold2);}
.rest-opt .rest-desc{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.5;}

/* ── 보스 승리 ── */
#bossVictoryScreen{flex-direction:column;gap:20px;}

/* ── 게임오버 / 승리 ── */
#gameOverScreen{flex-direction:column;gap:0;}
.result-panel{width:380px;padding:32px;}
.result-title{font-family:'Cinzel',serif;font-size:32px;font-weight:900;text-align:center;margin-bottom:6px;}
.result-title.win{color:var(--gold);text-shadow:0 0 30px rgba(201,168,76,0.6);}
.result-title.lose{color:var(--red);text-shadow:0 0 30px rgba(224,80,80,0.5);}
.result-stats{display:flex;flex-direction:column;gap:10px;margin:20px 0;}
.stat-row{display:flex;justify-content:space-between;font-size:14px;padding:8px 12px;background:rgba(255,255,255,0.03);border-radius:8px;}
.stat-label{color:var(--text2);}
.stat-val{color:var(--text);font-weight:700;}
.progress-dots{display:flex;gap:8px;justify-content:center;margin:4px 0;}
.dot{width:12px;height:12px;border-radius:50%;background:var(--border);}
.dot.done{background:var(--gold);}
.dot.boss{width:16px;height:16px;border:2px solid var(--red);}
.dot.boss.done{background:var(--red);}

/* ── HUD — 캔버스 위에 직접 그림, DOM 패널 불필요 ── */
#hud{display:none !important;} /* JS updateHUD 호출은 유지하되 DOM HUD 숨김 */
#deckBtn{pointer-events:all;position:fixed;bottom:16px;right:16px;z-index:90;padding:9px 16px;font-size:12px;font-weight:700;background:rgba(6,10,24,0.92);border:1px solid rgba(201,168,76,0.4);border-radius:10px;cursor:pointer;color:rgba(201,168,76,0.85);transition:all 0.2s;letter-spacing:0.5px;}
#deckBtn:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.08);}

/* ── 스크롤바 ── */
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ── 토스트 — 화면 하단 중앙 (웨이브 노티와 분리) ── */
#toast{
  position:fixed;bottom:18%;left:50%;transform:translateX(-50%);
  z-index:200;pointer-events:none;
  font-family:'Jua','Noto Sans KR',sans-serif;font-size:16px;font-weight:400;
  color:var(--gold);
  text-shadow:0 0 12px rgba(201,168,76,0.8);
  background:rgba(4,8,22,0.82);
  border:1px solid rgba(201,168,76,0.38);
  border-radius:100px;
  padding:7px 22px;
  backdrop-filter:blur(6px);
  box-shadow:0 4px 20px rgba(0,0,0,0.5),0 0 12px rgba(201,168,76,0.1);
  white-space:nowrap;
  opacity:0;transition:opacity 0.28s;
}

/* ── 웨이브 알림 — 중앙 (토스트와 위치 분리) ── */
#waveNotif{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;pointer-events:none;text-align:center;opacity:0;transition:opacity 0.28s;}
@keyframes waveNotifIn{0%{transform:scale(0.7) translateY(18px);opacity:0}60%{transform:scale(1.06) translateY(-4px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes waveNotifOut{0%{transform:scale(1);opacity:1}100%{transform:scale(0.88) translateY(-12px);opacity:0}}
@keyframes waveClearPulse{0%,100%{text-shadow:0 0 20px rgba(240,200,60,0.85),0 0 40px rgba(240,200,60,0.35)}50%{text-shadow:0 0 40px rgba(255,220,80,1),0 0 80px rgba(255,220,80,0.6),0 0 120px rgba(255,200,40,0.3)}}

/* ══════════════════════════════════════
   LOBBY — 캐주얼 귀여운 동물 게임 스타일
══════════════════════════════════════ */
#startScreen{flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;overflow:hidden;
  background:linear-gradient(180deg,#4ab8e8 0%,#7dd8f0 28%,#b8f0c8 60%,#6ed450 82%,#50b838 100%);}
.lobby-wrap{width:100%;max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;}

/* 구름 장식 */
.lob-cloud{position:absolute;border-radius:100px;background:#fff;opacity:0.88;pointer-events:none;}
.lob-cloud::before,.lob-cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;}
.lob-cloud.c1{width:80px;height:22px;top:12px;left:5%;animation:cloudDrift 18s linear infinite;}
.lob-cloud.c1::before{width:38px;height:38px;top:-20px;left:12px;}
.lob-cloud.c1::after{width:26px;height:26px;top:-14px;right:10px;}
.lob-cloud.c2{width:100px;height:26px;top:22px;left:38%;animation:cloudDrift 24s linear infinite 4s;}
.lob-cloud.c2::before{width:46px;height:46px;top:-24px;left:16px;}
.lob-cloud.c2::after{width:30px;height:30px;top:-16px;right:14px;}
.lob-cloud.c3{width:70px;height:18px;top:8px;right:8%;animation:cloudDrift 20s linear infinite 9s;}
.lob-cloud.c3::before{width:34px;height:34px;top:-18px;left:10px;}
.lob-cloud.c3::after{width:22px;height:22px;top:-12px;right:8px;}
@keyframes cloudDrift{0%{transform:translateX(0)}50%{transform:translateX(18px)}100%{transform:translateX(0)}}

/* 상단 HUD */
.lobby-top{display:flex;align-items:center;padding:10px 14px 8px;gap:8px;flex-shrink:0;position:relative;z-index:10;}
.lobby-cur{display:flex;align-items:center;gap:5px;padding:6px 12px;background:rgba(255,255,255,0.9);border:2px solid #fff;border-radius:100px;font-size:13px;font-weight:800;cursor:pointer;transition:all 0.2s;color:#2a5a2a;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.lobby-cur:hover{background:#fff;transform:scale(1.04);}
.lobby-top-btns{display:flex;gap:6px;margin-left:auto;}
.lb-top-btn{padding:6px 11px;border-radius:100px;border:2px solid rgba(255,255,255,0.7);background:rgba(255,255,255,0.8);font-size:12px;font-weight:800;cursor:pointer;color:#2a5a8a;transition:all 0.2s;box-shadow:0 2px 6px rgba(0,0,0,0.12);}
.lb-top-btn:hover{background:#fff;transform:translateY(-1px);}

/* 캐릭터 스테이지 */
.lobby-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0 0 4px;}
.lobby-stage-glow{position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,200,0.55) 0%,rgba(100,220,120,0.2) 50%,transparent 70%);animation:lbGlow 3s ease-in-out infinite;pointer-events:none;}
@keyframes lbGlow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.1);opacity:1}}
.lobby-char-emo{font-size:96px;position:relative;z-index:2;line-height:1;animation:charBob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 16px rgba(0,0,0,0.22));cursor:default;user-select:none;}
@keyframes charBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.lobby-platform{width:120px;height:20px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,0.25) 0%,transparent 70%);margin-top:-4px;animation:charBob 2.4s ease-in-out infinite reverse;}
.lobby-char-name{font-family:'Cinzel',serif;font-size:22px;font-weight:800;color:#fff;margin-top:12px;text-shadow:0 2px 8px rgba(0,0,0,0.35),0 0 20px rgba(255,255,200,0.4);letter-spacing:1px;}
.lobby-char-desc{font-size:11px;color:rgba(255,255,255,0.85);margin-top:5px;text-align:center;max-width:260px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,0.3);}
.lobby-char-locked{margin-top:8px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:100px;padding:4px 14px;font-size:11px;font-weight:700;}

/* 좌우 화살표 */
.lb-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.85);border:3px solid rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#2a7a3a;transition:all 0.18s;box-shadow:0 3px 10px rgba(0,0,0,0.18);z-index:5;font-weight:900;}
.lb-arrow:hover{background:#fff;transform:translateY(-50%) scale(1.12);box-shadow:0 5px 16px rgba(0,0,0,0.25);}
.lb-arrow:active{transform:translateY(-50%) scale(0.95);}

/* 장비 슬롯 행 */
.lobby-equip-row{display:flex;gap:10px;padding:0 20px;justify-content:center;flex-shrink:0;margin-bottom:10px;}
.eq-slot{width:64px;height:64px;border-radius:14px;border:2px solid rgba(255,255,255,0.6);background:rgba(255,255,255,0.75);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.1),inset 0 1px 0 rgba(255,255,255,0.8);}
.eq-slot:hover{border-color:#fff;transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,0,0,0.16);}
.eq-slot .sl{font-size:8px;font-weight:700;margin-top:2px;text-align:center;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4a6a2a;}
.eq-slot.uncommon{border-color:#4ecf7a;background:rgba(78,207,122,0.15);}
.eq-slot.rare{border-color:#4a9eff;background:rgba(74,158,255,0.15);}
.eq-slot.legendary{border-color:#f0c050;background:rgba(240,192,80,0.2);}
.eq-slot-label{font-size:9px;color:rgba(255,255,255,0.7);text-align:center;margin-top:2px;font-weight:600;}

/* 시작 버튼 */
.lb-start{
  width:100%;padding:14px;font-size:16px;font-weight:800;border:none;cursor:pointer;
  border-radius:14px;font-family:'Noto Sans KR',sans-serif;transition:all 0.25s;
  letter-spacing:0.5px;position:relative;overflow:hidden;
}
.lb-start:not(:disabled){
  background:linear-gradient(135deg,#3dcc5a,#28a845);color:#fff;
  box-shadow:0 4px 0 #1a7a32,0 0 20px rgba(61,204,90,0.3);
  animation:startPulse 2.4s ease-in-out infinite;
}
.lb-start:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 0 #1a7a32,0 0 28px rgba(61,204,90,0.5);}
.lb-start:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 #1a7a32,0 0 14px rgba(61,204,90,0.2);}
.lb-start:disabled{
  background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.35);
  box-shadow:none;cursor:not-allowed;
}
@keyframes startPulse{0%,100%{box-shadow:0 4px 0 #1a7a32,0 0 16px rgba(61,204,90,0.3)}50%{box-shadow:0 4px 0 #1a7a32,0 0 28px rgba(61,204,90,0.55)}}
.lb-energy-info{text-align:center;font-size:11px;color:rgba(255,255,255,0.8);margin:6px 16px 0;min-height:16px;text-shadow:0 1px 3px rgba(0,0,0,0.25);}

/* 하단 탭 */
.lobby-tabs{display:flex;background:rgba(255,255,255,0.92);border-top:3px solid rgba(255,255,255,0.6);flex-shrink:0;box-shadow:0 -3px 12px rgba(0,0,0,0.1);}
.lb-tab{flex:1;padding:8px 4px 6px;text-align:center;cursor:pointer;transition:all 0.18s;border-top:3px solid transparent;position:relative;color:#5a8a5a;}
.lb-tab:hover{background:rgba(78,207,122,0.1);}
.lb-tab.lb-tab-active{border-top-color:#3dcc5a;color:#2a7a2a;background:rgba(78,207,122,0.12);}
.lb-tab .ti{font-size:22px;display:block;margin-bottom:1px;}
.lb-tab .tl{font-size:9px;font-weight:700;}

/* 장비/상점/배틀패스 오버레이 공통 */
.lb-overlay{position:fixed;inset:0;z-index:300;background:rgba(4,6,16,0.97);overflow-y:auto;}
.lb-ov-inner{max-width:460px;width:100%;margin:0 auto;padding:16px;}
.lb-ov-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
.lb-ov-back{border:none;background:rgba(255,255,255,0.07);color:var(--text);padding:8px 13px;border-radius:9px;cursor:pointer;font-size:16px;transition:background .2s;}
.lb-ov-back:hover{background:rgba(255,255,255,0.12);}
.lb-ov-title{font-family:'Cinzel',serif;font-size:18px;color:var(--gold);}
.lb-ov-gems{margin-left:auto;font-size:14px;color:var(--gold);font-weight:700;}

/* 뽑기 카드 */
.pull-box{background:rgba(155,110,232,0.08);border:1px solid rgba(155,110,232,0.25);border-radius:14px;padding:16px;margin-bottom:16px;text-align:center;}
.pull-rate{font-size:11px;color:var(--text2);margin-bottom:10px;}
.pull-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.pull-btn{padding:10px 20px;border:none;cursor:pointer;border-radius:10px;font-weight:700;font-size:12px;font-family:'Noto Sans KR',sans-serif;transition:all .18s;}
.pull-btn:hover{transform:translateY(-1px);}
.pull-btn-gem{background:linear-gradient(135deg,#9b6ee8,#6040a0);color:#fff;}
.pull-btn-free{background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.4);color:var(--gold);}
.pull-btn-dis{background:rgba(255,255,255,0.04);border:1px solid #2a3a4a;color:#3a5a6a;cursor:not-allowed;}

/* 장비 카드 그리드 */
.eq-grid{display:flex;flex-wrap:wrap;gap:8px;}
.eq-card{width:calc(50% - 4px);padding:10px;border-radius:10px;cursor:pointer;position:relative;transition:all .2s;}
.eq-card:hover{transform:scale(1.02);}
.eq-badge-on{position:absolute;top:5px;right:6px;font-size:8px;background:var(--gold);color:#000;border-radius:4px;padding:1px 5px;font-weight:800;}

/* 상점 섹션 */
.store-sec{border-radius:14px;padding:14px;margin-bottom:12px;}
.store-sec.green{background:rgba(78,207,122,0.07);border:1px solid rgba(78,207,122,0.2);}
.store-sec.blue{background:rgba(74,158,255,0.07);border:1px solid rgba(74,158,255,0.2);}
.store-sec.gold{background:rgba(201,168,76,0.07);border:1px solid rgba(201,168,76,0.2);}
.store-sec h3{font-size:13px;font-weight:700;margin-bottom:6px;}
.store-pkg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pkg-card{padding:13px 10px;border:1px solid rgba(201,168,76,0.2);border-radius:12px;background:rgba(201,168,76,0.04);text-align:center;position:relative;cursor:default;}
.pkg-badge{position:absolute;top:-1px;right:8px;background:var(--gold);color:#000;font-size:8px;font-weight:800;padding:2px 7px;border-radius:0 0 5px 5px;}

/* 배틀패스 */
.bp-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;margin-bottom:5px;}
.bp-lv{font-size:10px;font-weight:700;width:30px;flex-shrink:0;}
.bp-cell{flex:1;padding:5px 8px;border-radius:7px;text-align:center;font-size:10px;}

/* ── 성장 패널 (항상 표시) ── */
#growthBar{
  position:fixed;bottom:0;left:0;right:0;z-index:150;
  background:linear-gradient(0deg,rgba(4,8,20,0.97) 0%,rgba(8,14,32,0.94) 100%);
  border-top:1px solid rgba(201,168,76,0.22);
  padding:6px 14px 8px;
  display:none;
  flex-direction:column;gap:4px;
}
#growthBar .gb-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
#growthBar .gb-label{font-size:9px;color:rgba(255,255,255,0.32);font-weight:700;letter-spacing:1px;white-space:nowrap;min-width:24px;}
#growthBar .gb-hp-bar{width:80px;height:5px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;display:inline-block;}
#growthBar .gb-hp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#e05050,#f08060);transition:width 0.3s;}
#growthBar .gb-hp-text{font-size:10px;color:#e09080;font-weight:700;}
#growthBar .gb-gold{font-size:11px;color:#c9a84c;font-weight:700;margin-left:4px;}
.gb-chip{display:inline-flex;align-items:center;gap:2px;padding:2px 7px;border-radius:100px;
  font-size:10px;font-weight:700;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  white-space:nowrap;color:#b8c8d8;cursor:default;}
.gb-chip.upgraded{border-color:rgba(240,192,80,0.4);background:rgba(240,192,80,0.07);color:#f0d080;}
.gb-chip.relic{background:rgba(155,110,232,0.1);border-color:rgba(155,110,232,0.3);color:#c8a8ff;}

/* ── 화면별 뒤로가기 버튼 ── */
.screen-back-btn{
  padding:7px 14px;border:1px solid rgba(255,255,255,0.14);border-radius:9px;
  background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);
  font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  transition:all 0.18s;flex-shrink:0;
}
.screen-back-btn:hover{background:rgba(255,255,255,0.11);color:#fff;border-color:rgba(255,255,255,0.28);}
</style>
</head>
<body>
<div id="root">

<!-- 시작 화면 -->
<div id="startScreen" class="screen">
  <div class="panel" style="width:560px;">
    <div class="game-title">🐾 WILD LAST STAND</div>
    <div class="game-sub">ROGUELIKE · SURVIVORS</div>
    <div style="margin-top:22px;">
      <div style="font-size:11px;color:var(--text2);margin-bottom:10px;text-align:center;letter-spacing:.5px;font-weight:700;">▸ 캐릭터 선택</div>
      <div class="char-grid" id="charGrid"></div>
    </div>
    <div id="charInfo" style="margin-top:14px;background:rgba(6,10,26,0.7);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--text2);min-height:80px;border:1px solid var(--border);"></div>
    <div id="bestRow" class="best-row" style="margin-top:10px;display:none;"></div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn btn-primary" id="startBtn" style="flex:1;">모험 시작<br><span style="font-size:10px;color:rgba(255,255,255,0.7);" id="ascLabel"></span></button>
    </div>
  </div>
</div>

<!-- 지도 화면 -->
<div id="mapScreen" class="screen hidden">
  <div class="map-header">
    <div class="map-title" id="mapFloorLabel">ACT 1</div>
    <div style="display:flex;gap:12px;align-items:center;">
      <button onclick="showElitePowersPanel()" id="elitePowerBtn"
        style="display:none;background:rgba(155,110,232,0.15);border:1px solid rgba(155,110,232,0.5);
        color:#c8b0f8;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;">
        💀 특수능력 <span id="elitePowerCount">0</span>
      </button>
      <span class="gold-display" id="mapGold">🪙 0</span>
      <span style="font-size:13px;color:var(--text2);" id="mapHpDisplay">❤️ 100/100</span>
      <button onclick="if(confirm('진행 중인 런을 포기하고 타이틀로 돌아가시겠습니까?'))location.reload();"
        style="padding:5px 11px;border-radius:8px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">
        ✕ 포기
      </button>
    </div>
  </div>
  <canvas id="mapCanvas" width="960" height="600"></canvas>
</div>

<!-- 전투 화면 -->
<canvas id="gameCanvas" width="800" height="800" style="display:none;"></canvas>
<div id="hud" style="display:none;">
  <div class="hud-panel">
    <div class="hud-label">HP</div>
    <div class="hud-val" id="hudHp">100/100</div>
    <div class="hud-hp-bar"><div class="hud-hp-fill" id="hudHpFill" style="width:100%;background:var(--green);"></div></div>
  </div>
  <div class="hud-panel" style="min-width:120px;">
    <div class="hud-label">웨이브</div>
    <div class="hud-val" id="hudWave">1 / 5</div>
    <div class="hud-label" style="margin-top:4px;">처치</div>
    <div class="hud-val" id="hudKills">0</div>
  </div>
  <div class="hud-panel">
    <div class="hud-label">타이머</div>
    <div class="hud-val" id="hudTimer">00:00</div>
    <div class="hud-label" style="margin-top:4px;font-size:10px;" id="hudSkills"></div>
  </div>
</div>
<button id="deckBtn" style="display:none;">🔮 보유 룬</button>
<button id="pauseBtn" onclick="toggleBattlePause()" style="display:none;position:fixed;top:12px;right:12px;z-index:50;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);background:rgba(4,8,20,0.7);color:#8aa0b8;font-size:16px;cursor:pointer;align-items:center;justify-content:center;" title="일시정지 (P / ESC)">⏸</button>

<!-- 카드 선택 화면 -->
<div id="cardScreen" class="screen hidden">
  <div style="text-align:center;position:relative;width:100%;">
    <div style="font-family:'Cinzel',serif;font-size:26px;color:var(--gold);margin-bottom:4px;" id="cardScreenTitle">룬 선택</div>
    <div style="font-size:13px;color:var(--text2);" id="cardScreenSub">룬을 선택하세요</div>
  </div>
  <div class="card-row" id="cardRow"></div>
  <div style="text-align:center;font-size:11px;color:rgba(160,180,210,0.5);margin-top:-8px;letter-spacing:0.5px;">
    🖱️ 우클릭 / 📱 꾹 눌러 상세보기
  </div>
  <!-- 리롤 버튼 행 -->
  <div id="_cardRerollRow" style="display:none;justify-content:center;align-items:center;gap:14px;margin:6px 0 2px;">
    <button id="_rerollBtn" style="display:flex;align-items:center;gap:8px;padding:9px 22px;border-radius:100px;
      border:1px solid rgba(80,180,255,0.45);background:rgba(10,28,60,0.9);color:#80c8ff;
      font-family:'Jua',sans-serif;font-size:14px;cursor:pointer;transition:all 0.18s;
      box-shadow:0 2px 12px rgba(40,120,255,0.18);">
      🔄 리롤 &nbsp;<span style="color:#ffe080;font-size:12px;">💎 1</span>
    </button>
    <span style="font-size:12px;color:#5a7a9a;">보유 <b id="_rerollGemCount" style="color:#c9a84c;">0</b> 💎</span>
  </div>
  <span class="skip-btn" id="skipCardBtn">건너뛰기</span>
</div>

<!-- 룬 화면 -->
<div id="deckScreen" class="screen hidden">
  <div class="panel" style="max-width:720px;max-height:85vh;overflow-y:auto;">
    <div style="font-family:'Cinzel',serif;font-size:20px;color:var(--gold);margin-bottom:16px;text-align:center;">📖 현재 룬 (<span id="deckCount">0</span>장)</div>
    <div class="deck-grid" id="deckGrid"></div>
    <button class="btn btn-ghost" style="width:100%;margin-top:20px;" id="closeDeckBtn">← 뒤로</button>
  </div>
</div>

<!-- 상점 화면 -->
<div id="shopScreen" class="screen hidden">
  <div class="panel" style="width:480px;padding:14px 16px;">
    <!-- 헤더: 뒤로 + 타이틀 + 골드 인라인 -->
    <div style="display:flex;align-items:center;margin-bottom:10px;">
      <button class="screen-back-btn" style="flex-shrink:0;" onclick="showMapScreen()">← 뒤로</button>
      <div style="flex:1;text-align:center;font-family:'Cinzel',serif;font-size:18px;color:var(--gold);" id="shopTitle">🏪 상점</div>
      <div style="text-align:right;flex-shrink:0;min-width:70px;">
        <div style="font-size:10px;color:rgba(201,168,76,0.55);letter-spacing:1px;" id="shopGoldLabel">보유 골드</div>
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:4px;">
          <span style="font-family:'Jua',sans-serif;font-size:20px;color:#f0d080;line-height:1;" id="shopGold">0</span>
          <span style="font-size:15px;">🪙</span>
        </div>
      </div>
    </div>
    <!-- 아이템 목록 -->
    <div class="shop-items" id="shopItems"></div>
    <!-- 체력 회복 -->
    <div style="display:flex;gap:6px;margin-top:8px;" id="healOptions"></div>
    <!-- 서비스 (동적으로 채워짐 — leave버튼 위에 위치) -->
    <div id="shopServicesSection" style="margin-top:8px;display:none;flex-direction:column;gap:5px;"></div>
    <!-- 지도로 -->
    <button class="btn btn-primary" style="width:100%;margin-top:10px;font-family:'Jua',sans-serif;font-size:14px;padding:10px;" id="leaveShopBtn">🗺️ 지도로 돌아가기</button>
  </div>
</div>

<!-- 휴식 화면 -->
<div id="restScreen" class="screen hidden">
  <div class="panel" style="width:560px;position:relative;">
    <button class="screen-back-btn" style="position:absolute;top:14px;left:14px;" onclick="showMapScreen()">← 뒤로</button>
    <div style="font-family:'Cinzel',serif;font-size:22px;color:var(--gold);text-align:center;margin-bottom:6px;">🏕️ 휴식처</div>
    <div style="font-size:13px;color:var(--text2);text-align:center;margin-bottom:20px;">조용한 곳에서 잠시 쉬어갑니다.</div>
    <div class="rest-options" id="restOptions" style="flex-wrap:wrap;"></div>
  </div>
</div>

<!-- 보스 승리 -->
<div id="bossVictoryScreen" class="screen hidden">
  <div class="panel" style="width:420px;text-align:center;">
    <div style="font-family:'Cinzel',serif;font-size:28px;color:var(--gold);margin-bottom:8px;">👑 보스 처치!</div>
    <div style="font-size:14px;color:var(--text2);margin-bottom:24px;" id="bossVictoryText">새로운 구역이 열렸습니다.</div>
    <button class="btn btn-primary" style="width:100%;" id="bossVictoryBtn">다음 구역으로 →</button>
  </div>
</div>

<!-- 게임 오버 -->
<div id="gameOverScreen" class="screen hidden">
  <div class="panel result-panel">
    <div class="result-title" id="resultTitle">모험 종료</div>
    <div class="progress-dots" id="progressDots"></div>
    <div class="result-stats" id="resultStats"></div>
    <div style="display:flex;gap:10px;margin-top:4px;">
      <button class="btn btn-primary" style="flex:1;" id="retryBtn">다시 도전</button>
      <button class="btn btn-ghost" style="flex:1;" id="titleBtn">타이틀</button>
    </div>
  </div>
</div>

<!-- 성장 패널 -->
<div id="growthBar">
  <div class="gb-row" id="gbTopRow">
    <span class="gb-label">HP</span>
    <span class="gb-hp-bar"><span class="gb-hp-fill" id="gbHpFill" style="width:100%"></span></span>
    <span class="gb-hp-text" id="gbHpText">100/100</span>
    <span class="gb-gold" id="gbGold">🪙 0</span>
  </div>
  <div class="gb-row" id="gbCardRow">
    <span class="gb-label">룬</span>
  </div>
  <div class="gb-row" id="gbRelicRow" style="display:none;">
    <span class="gb-label">아티팩트</span>
  </div>
</div>

<!-- 토스트 -->
<div id="toast"></div>
<div id="waveNotif"></div>

<script>

function hasCurse(id) {
  if (!gs || !gs.deck) return false;
  return gs.deck.some(c => c.rarity === 'curse' && (id ? c.id === id : true));
}

function _patchData(arr, transMap, fields) {
  arr.forEach(obj => {
    const tr = transMap[obj.id];
    if (!tr) return;
    fields.forEach(f => {
      if (tr[f] !== undefined) {
        if (!obj['_orig_' + f]) obj['_orig_' + f] = obj[f];
        obj[f] = tr[f];
      }
    });
  });
}
function _restoreData(arr, fields) {
  arr.forEach(obj => {
    fields.forEach(f => {
      const bk = '_orig_' + f;
      if (obj[bk] !== undefined) { obj[f] = obj[bk]; delete obj[bk]; }
    });
  });
}

function setLang(lang) {
  LANG = lang;
  localStorage.setItem('penguinSpireLang', lang);
  if (lang === 'en') {
    _patchData(CHARACTERS, EN.chars, ['name','desc']);
    _patchData(CARD_POOL,  EN.cards, ['name','desc','effect','flavor']);
    _patchData(RELIC_POOL, EN.relics, ['name','desc']);
    _patchData(SYNERGIES,  EN.synergies, ['name','desc']);
  } else {
    _restoreData(CHARACTERS, ['name','desc']);
    _restoreData(CARD_POOL,  ['name','desc','effect','flavor']);
    _restoreData(RELIC_POOL, ['name','desc']);
    _restoreData(SYNERGIES,  ['name','desc']);
  }
  // Re-render lobby
  try { initLobby(); showScreen('startScreen'); } catch(e) {}
}

// 현재 덱에서 활성화된 시너지 계산 (캐시: 매 프레임 재계산 방지)
let _synCache = null;
let _synCacheDeckKey = '';
/** 활성 시너지 목록 반환. 덱 키 기반 캐시 사용. */
function getActiveSynergies() {
  // 덱 구성이 바뀐 경우에만 재계산
  const dkey = gs.deck.map(c=>c.id).sort().join(',');
  if (_synCache && dkey === _synCacheDeckKey) return _synCache;
  const deckIds = new Set(gs.deck.map(c => c.id));
  _synCache = SYNERGIES.filter(syn =>
    syn.requires.every(req => deckIds.has(req))
  );
  _synCacheDeckKey = dkey;
  return _synCache;
}
function invalidateSynCache() { _synCache = null; _synCacheDeckKey = ''; }

// 카드 획득 후 시너지 적용 (매번 재계산) — 캐시도 무효화
function applyAllSynergies() {
  invalidateSynCache();
  // _syn* 플래그를 전부 지운 뒤 조건 충족 시너지만 재적용
  Object.keys(gs.skills).filter(k=>k.startsWith('_syn')).forEach(k=>delete gs.skills[k]);
  const active = getActiveSynergies();
  active.forEach(syn => syn.apply(gs.skills, gs.player, gs));
  return active;
}

// 카드 선택 화면에서 "이 카드를 고르면 발동될 시너지" 계산
function getSynergyPreview(cardId) {
  const deckIds = new Set([...gs.deck.map(c => c.id), cardId]);
  return SYNERGIES.filter(syn =>
    syn.requires.every(req => deckIds.has(req)) &&
    !syn.requires.every(req => new Set(gs.deck.map(c=>c.id)).has(req))
  );
}

// 이 카드가 기여하는 미완성 시너지 + 남은 카드 목록 반환
function getSynergyContribution(cardId) {
  const deckIds = new Set(gs.deck.map(c => c.id));
  return SYNERGIES
    .filter(syn => syn.requires.includes(cardId) && !syn.requires.every(r => deckIds.has(r)))
    .map(syn => {
      const missing = syn.requires.filter(r => r !== cardId && !deckIds.has(r));
      const have = syn.requires.filter(r => deckIds.has(r)).length + 1; // +1 for this card
      return { syn, missing, have, total: syn.requires.length };
    });
}

// 유물 보유 목록에서 특정 id 유물 보유 여부
function hasRelic(id){ return gs.relics.some(r=>r.id===id); }

// Fisher-Yates 셔플 (편향 없는 무작위 순서)
function rndShuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// 모든 유물 onFrame 호출 (updateBattle 내)
function tickRelics(bt){
  const p=gs.player,s=gs.skills;
  gs.relics.forEach(r=>{ if(r.onFrame) r.onFrame(p,s,gs,bt); });
  // 광분 속도
  if(gs.player._berserkSpeed) gs.player._speedMult=2.0;
  else gs.player._speedMult=1.0;
}

// 유물 처치 트리거
function relicsOnKill(e){
  if(!bt) return;
  const p=gs.player,s=gs.skills;
  gs.relics.forEach(r=>{ if(r.onKill) r.onKill(p,s,gs,e); });
  // 엘리트 특수능력: 흡혈
  if((gs._eliteVampire||0)>0){
    p.hp=Math.min(p.maxHp, p.hp+gs._eliteVampire);
    spawnDN&&spawnDN(p.x,p.y-30,'+'+(gs._eliteVampire)+'❤','#e05050');
  }
  // 공허 수정
  if(hasRelic('r_void_crystal')&&Math.random()<0.05&&bt.explosions){
    bt.explosions.push({x:e.x,y:e.y,maxRadius:60,radius:0,timer:12});
    const near=[...bt.enemies];
    near.forEach(t=>{ if(Math.hypot(t.x-e.x,t.y-e.y)<60) window._relicDamageEnemy&&window._relicDamageEnemy(t,5); });
    Audio.sfx.explosion();
  }
}

// 유물 웨이브 트리거
function relicsOnWaveStart(){
  const p=gs.player,s=gs.skills;
  gs.relics.forEach(r=>{ if(r.onWaveStart) r.onWaveStart(p,s,gs,bt); }); // [B1] bt 전달 — coin_purse 등 bt 의존 유물 정상 동작
}

// 유물 사망 트리거 — true 반환 시 사망 취소
function relicsOnDeath(){
  const p=gs.player,s=gs.skills;
  for(const r of gs.relics){
    if(r.onDeath){ const cancel=r.onDeath(p,s,gs); if(cancel){ spawnP&&spawnP(p.x,p.y,'#f87040',20,6); showToast('🪶 불사조의 깃털! 부활!',2000); Audio.sfx.synergy(); return true; }}
  }
  return false;
}

// 유물 총알 데미지 배율 (최대 5.0× 캡)
function relicsBulletMult(){
  let mult=1;
  gs.relics.forEach(r=>{ if(r.getBulletMult) mult*=r.getBulletMult(gs,gs.player); });
  return Math.min(mult, 5.0);
}

};
const FLOORS_PER_ACT = 7; // 보스 제외 6레이어 + 1보스
const ACTS = 3;

function generateMap(act) {
  // 레이어당 3~4 노드, 총 7레이어 (마지막은 보스 1개)
  const layers = [];
  const totalLayers = FLOORS_PER_ACT;
  for (let l = 0; l < totalLayers; l++) {
    if (l === totalLayers - 1) {
      layers.push([{ type:'boss', id:`${l}-0` }]);
      continue;
    }
    const count = l === 0 ? 3 : 2 + Math.floor(Math.random()*2);
    const row = [];
    for (let n = 0; n < count; n++) {
      let type;
      if (l === 0) { type = 'battle'; }
      else if (l === totalLayers - 2) { type = 'rest'; }
      else {
        const r = Math.random();
        if (r < 0.28) type = 'battle';
        else if (r < 0.45) type = 'elite';
        else if (r < 0.59) type = 'shop';
        else if (r < 0.72) type = 'rest';
        else type = 'event';
      }
      row.push({ type, id:`${l}-${n}` });
    }
    layers.push(row);
  }
  // 경로 연결: 각 노드에서 다음 레이어 1~2개 연결
  for (let l = 0; l < totalLayers - 1; l++) {
    const cur = layers[l], nxt = layers[l+1];
    if (!nxt || nxt.length === 0) continue; // [H1] 다음 레이어가 비어있으면 스킵
    cur.forEach((node, ni) => {
      const targets = new Set();
      const idx = Math.min(Math.floor(ni * nxt.length / cur.length), nxt.length - 1);
      targets.add(idx);
      if (Math.random() < 0.4) {
        const idx2 = Math.min(idx + 1, nxt.length - 1);
        targets.add(idx2);
      }
      node.paths = [...targets].map(t => nxt[t].id);
    });
  }
  // 시작 노드 접근 가능 설정
  layers[0].forEach(n => n.accessible = true);
  return layers;
}

// 현재 초월 레벨에 따른 배율 계산 (런 시작 시 gs.ascMult에 저장)
function calcAscMultipliers(ascLevel) {
  let hp=1, spd=1, dmg=1, bossHp=1, bossSpd=1, shopPrice=1;
  let healPenalty=0, startHpPen=0, cardMinus=0;
  let bossAggro=0, noEliteRelic=false, noEliteCard=false, noHeal=false, boss4Phase=false;
  ASCENSION_MODS.slice(0, ascLevel).forEach(m => {
    if (m.hp)          hp          += m.hp;
    if (m.spd)         spd         += m.spd;
    if (m.dmg)         dmg         += m.dmg;
    if (m.bossHp)      bossHp      += m.bossHp;
    if (m.bossSpd)     bossSpd     += m.bossSpd;
    if (m.shopPrice)   shopPrice   += m.shopPrice;
    if (m.healPenalty) healPenalty += m.healPenalty;
    if (m.startHpPen)  startHpPen  += m.startHpPen;
    if (m.cardMinus)   cardMinus   += m.cardMinus;
    if (m.bossAggro)   bossAggro   += m.bossAggro;
    if (m.noEliteRelic) noEliteRelic = true;
    if (m.noEliteCard)  noEliteCard  = true;
    if (m.noHeal)       noHeal       = true;
    if (m.boss4Phase)   boss4Phase   = true;
  });
  healPenalty = Math.min(1, healPenalty); // 최대 100% 감소
  return {hp, spd, dmg, bossHp, bossSpd, shopPrice,
          healPenalty, startHpPen, cardMinus,
          bossAggro, noEliteRelic, noEliteCard, noHeal, boss4Phase};
}

// 캐릭터 해금 체크 — 런 종료 시 및 앱 시작 시 호출
function checkCharUnlocks() {
  const unlockTable = [
    { id:'fox',    kills:50,  idx:1 },
    { id:'rabbit', kills:150, idx:2 },
    { id:'cat',    kills:200, idx:3 },
    { id:'bear',   kills:350, idx:4 },
  ];
  let changed = false;
  unlockTable.forEach(({id, kills, idx}) => {
    if (meta.totalKills >= kills && !meta.unlockedChars.includes(id)) {
      meta.unlockedChars.push(id);
      CHARACTERS[idx].unlocked = true;
      changed = true;
    }
  });
  // 저장된 unlockedChars → CHARACTERS 반영 (항상)
  meta.unlockedChars.forEach(id => {
    const c = CHARACTERS.find(c => c.id === id);
    if (c) c.unlocked = true;
  });
  if (changed) saveMeta();
}

// 초월 회복 패널티 적용 헬퍼
function healPlayer(amount) {
  const p = gs.player;
  const am = gs.ascMult || {};
  if (am.noHeal) return 0; // 초월30: 완전 회복 불가
  const mult = 1 - Math.min(1, am.healPenalty || 0);
  const actual = Math.max(0, Math.ceil(amount * mult));
  p.hp = Math.min(p.maxHp, p.hp + actual);
  return actual;
}

function loadRunSave(data) {
  // 기본 수치 복구
  gs.act = data.act;
  gs.currentLayer = data.currentLayer;
  gs.currentNodeId = data.currentNodeId;
  gs.chosenPaths = new Set(data.chosenPaths || []);
  gs.gold = data.gold;
  gs.totalKills = data.totalKills || 0;
  gs.totalTime = data.totalTime || 0;
  gs.bossesDefeated = data.bossesDefeated || 0;
  gs.shieldCount = data.shieldCount || 0;
  gs.curses = data.curses ? JSON.parse(JSON.stringify(data.curses)) : [];
  gs._eliteVampire = data._eliteVampire || 0;

  // 캐릭터
  const ch = CHARACTERS.find(c => c.id === data.selectedCharId) || CHARACTERS[0];
  gs.selectedChar = ch;

  // 플레이어
  Object.assign(gs.player, data.player);

  // 스킬
  Object.assign(gs.skills, data.skills);

  // 덱 복구 (레벨/강화 상태 포함)
  gs.deck = (data.deckSave || data.deckIds?.map(id => ({id})) || []).map(saved => {
    const base = CARD_POOL.find(c => c.id === (saved.id || saved));
    if (!base) return null;
    return { ...base, level: saved.level || 1, upgrades: saved.upgrades || [] };
  }).filter(Boolean);

  // 유물 복구
  gs.relics = (data.relicIds || []).map(id => RELIC_POOL.find(r => r.id === id)).filter(Boolean);

  // 엘리트 특수능력 복구
  gs.elitePowers = (data.elitePowerIds || []).map(id => ELITE_POWERS.find(p => p.id === id)).filter(Boolean);

  // 맵 복구
  gs.map = data.map;

  // 유물 플래그 복원 (onPickup 재실행: _relicCoinPurse 등 flag 복구 목적)
  gs.relics.forEach(r => { if (r && r.onPickup) r.onPickup(gs.player, gs.skills, gs); });
  // [B2] onPickup이 HP를 변경할 수 있으므로 저장된 플레이어 수치로 덮어씀
  const _savedHp = data.player.hp;
  gs.player.maxHp = data.player.maxHp;
  gs.player.hp    = Math.min(_savedHp, gs.player.maxHp);
  gs.player.invincible = data.player.invincible || 0;
  gs.shieldCount  = data.shieldCount || 0;

  // 유물 플래그 재초기화
  gs._relicPhoenixReady = gs.relics.some(r => r.id === 'r_phoenix');
  gs._relicBoneShieldCount = gs._relicBoneShieldCount || 0;
  gs._relicCoinPurse = gs.relics.some(r => r.id === 'r_coin_purse');

  // 임시 전투 타이머 초기화 (bt 오브젝트에 속하므로 저장 불필요, 새 전투 시 자동 리셋됨)
  // dashTimer, summonTimer 등은 bt(전투 상태)에 존재하므로 gs 로드 시 별도 초기화 불필요
  gs.player.invincible = 0; // 무적 타이머는 로드 후 항상 초기화
}

    bpLevel: 0,

    subExpiry: {},      // 구독 만료 날짜 { weekly: ISO, monthly: ISO }
  };
  try { return Object.assign(def, JSON.parse(localStorage.getItem(PREMIUM_KEY) || '{}')); }
  catch(e) { return def; }
}
let prem = loadPremium();
function savePremium() {
  // [M13] QuotaExceededError 방어
  try {
    localStorage.setItem(PREMIUM_KEY, JSON.stringify(prem));
  } catch(e) {
    if (e.name === 'QuotaExceededError') {
      console.warn('저장 공간 부족 — 오래된 런 데이터 정리 중');
      localStorage.removeItem(RUN_KEY);

}

function syncEnergy() {
  const now = Date.now();
  // 만충 상태이면 타이머를 지금으로 리셋 (오래된 lastEnergyTime으로 인한 즉시충전 버그 방지)
  if (prem.energy >= MAX_ENERGY) {
    prem.lastEnergyTime = now;
    return;
  }
  const base = prem.lastEnergyTime || now;
  const elapsed = Math.max(0, now - base);
  // 최대 7일치만 인정 (오버플로우 방지)
  const cappedElapsed = Math.min(elapsed, MAX_ENERGY * ENERGY_REGEN_MS);
  const gained = Math.floor(cappedElapsed / ENERGY_REGEN_MS);
  if (gained > 0) {
    prem.energy = Math.min(MAX_ENERGY, prem.energy + gained);
    // 정확하게 gained번 째 충전 완료 시점으로 타이머 이동
    prem.lastEnergyTime = base + gained * ENERGY_REGEN_MS;
    if (prem.energy >= MAX_ENERGY) prem.lastEnergyTime = now;
    savePremium();
  }
}

function nextEnergyTimer() {
  if (prem.energy >= MAX_ENERGY) return null;
  const elapsed = Math.max(0, Date.now() - (prem.lastEnergyTime || Date.now()));
  const remaining = ENERGY_REGEN_MS - (elapsed % ENERGY_REGEN_MS);
  const m = Math.floor(remaining / 60000), s = Math.floor((remaining % 60000) / 1000);
  return `${m}:${String(s).padStart(2,'0')}`;
}

function getTodayStr() { return new Date().toISOString().slice(0,10); }

function pullEquipment() {
  const r = Math.random();
  let rarity;
  if (r < 0.03) rarity = 'legendary';
  else if (r < 0.15) rarity = 'rare';
  else if (r < 0.45) rarity = 'uncommon';
  else rarity = 'common';
  const pool = EQUIPMENT_POOL.filter(e => e.rarity === rarity);
  const item = pool[Math.floor(Math.random() * pool.length)];
  prem.inventory.push(item.id);
  savePremium();
  return item;
}

function applyEquipment() {
  const p = gs.player, s = gs.skills;
  ['weapon','armor','ring'].forEach(slot => {
    const id = prem.equipment[slot];
    if (!id) return;
    const eq = EQUIPMENT_POOL.find(e => e.id === id);
    if (!eq) return;
    if (slot === 'weapon') {
      if (eq.id === 'wpn_snowball') { s.bulletCount += 1; }
      else if (eq.id === 'wpn_fishgun') { s.bulletSpeed += 2; }
      else if (eq.id === 'wpn_icicle') { s.damage = (s.damage||10) + 5; s.piercing = true; }
      else if (eq.id === 'wpn_blizzard') { s.bulletCount += 2; s.bulletSpeed += 3; }
    } else if (slot === 'armor') {
      if (eq.id === 'arm_icecape') { p.maxHp += 20; p.hp += 20; }
      else if (eq.id === 'arm_puffsuit') { p.maxHp += 40; p.hp += 40; s.regen += 1; }
      else if (eq.id === 'arm_glacier') { p.maxHp += 60; p.hp += 60; gs.shieldCount += 1; s.shield += 1; }
      else if (eq.id === 'arm_aurora') { p.maxHp += 80; p.hp += 80; s.regen += 2; }
    } else if (slot === 'ring') {
      if (eq.id === 'rng_pebble') { gs.gold += 10; }
      else if (eq.id === 'rng_coral') { p.speed += 0.5; }
      else if (eq.id === 'rng_frost') { gs._extraCardChoice = (gs._extraCardChoice||0) + 1; }
      else if (eq.id === 'rng_cosmos') { p.maxHp += 20; p.hp += 20; s.bulletCount += 1; p.speed += 0.3; gs.gold += 15; }
    }
  });
}

function addBpXp(xp) {
  prem.bpXp += xp;
  const xpPerLevel = 100;
  while (prem.bpXp >= xpPerLevel && prem.bpLevel < 30) {
    prem.bpXp -= xpPerLevel;
    prem.bpLevel++;
  }
  savePremium();
}

// ── 데일리 미션 ──
function generateDailyMissions() {
  const today = getTodayStr();
  if (prem.dailyDate === today && prem.dailyMissions && prem.dailyMissions.length === 3) return;
  // 날짜 기반 시드 랜덤 (같은 날 항상 같은 미션)
  let seed = today.split('-').reduce((a,b) => a*31 + parseInt(b), 1);
  function sr() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  const pool = [...DAILY_MISSION_POOL];
  const chosen = [];
  for (let i = 0; i < 3 && pool.length; i++) {
    const idx = Math.floor(sr() * pool.length);
    chosen.push(pool.splice(idx, 1)[0]);
  }
  prem.dailyDate = today;
  prem.dailyMissions = chosen.map(m => ({...m, progress:0, claimed:false}));
  savePremium();
}

function trackMission(type, amount) {
  generateDailyMissions();
  let changed = false;
  prem.dailyMissions.forEach(m => {
    if (m.type === type && !m.claimed) {
      m.progress = Math.min(m.goal, (m.progress || 0) + amount);
      changed = true;
    }
  });
  if (changed) savePremium();
}

function claimDailyMission(idx) {
  generateDailyMissions();
  const m = prem.dailyMissions[idx];
  if (!m || m.claimed || m.progress < m.goal) return;
  m.claimed = true;
  if (m.reward.gems)  { prem.gems  += m.reward.gems; }
  savePremium();
  showDailyMissionOverlay(); // 오버레이 새로고침
  if (window._lobbyRender) window._lobbyRender();
}

// ── 성장 패널 업데이트 ──
function updateGrowthBar() {
  if (!gs || !gs.player) return;
  const p = gs.player;

  // HP 바
  const hpPct = Math.max(0, Math.min(100, (p.hp / p.maxHp) * 100));
  const fill = document.getElementById('gbHpFill');
  const txt  = document.getElementById('gbHpText');
  const goldEl = document.getElementById('gbGold');
  if (fill) fill.style.width = hpPct + '%';
  if (fill) fill.style.background = hpPct > 50 ? 'linear-gradient(90deg,#4ecf7a,#7ef0a0)' : hpPct > 25 ? 'linear-gradient(90deg,#e0a030,#f0c050)' : 'linear-gradient(90deg,#e05050,#f07050)';
  if (txt)  txt.textContent = `${Math.ceil(p.hp)}/${p.maxHp}`;
  if (goldEl) goldEl.textContent = `🪙 ${gs.gold}`;

  // 카드 행
  const cardRow = document.getElementById('gbCardRow');
  if (cardRow) {
    cardRow.innerHTML = '<span class="gb-label">룬</span>';
    if (gs.deck && gs.deck.length > 0) {
      // 중복 카드 집계
      const cardCount = {};
      gs.deck.forEach(c => { cardCount[c.id] = cardCount[c.id] || {c, n:0}; cardCount[c.id].n++; });
      Object.values(cardCount).forEach(({c, n}) => {
        const chip = document.createElement('span');
        chip.className = 'gb-chip' + (c._upgraded ? ' upgraded' : '');
        chip.title = c.name + (c._upgraded ? ' (강화됨)' : '');
        chip.textContent = c.emoji + (n > 1 ? ` ×${n}` : '') + (c._upgraded ? '⬆' : '');
        cardRow.appendChild(chip);
      });
    } else {
      const empty = document.createElement('span');
      empty.style.cssText = 'font-size:10px;color:rgba(255,255,255,0.2);';
      empty.textContent = '(없음)';
      cardRow.appendChild(empty);
    }
  }

  // 유물 행
  const relicRow = document.getElementById('gbRelicRow');
  if (relicRow) {
    if (gs.relics && gs.relics.length > 0) {
      relicRow.style.display = 'flex';
      relicRow.innerHTML = '<span class="gb-label">아티팩트</span>';
      gs.relics.forEach(r => {
        const chip = document.createElement('span');
        chip.className = 'gb-chip relic';
        chip.title = r.name;
        chip.textContent = r.emoji + ' ' + r.name;
        relicRow.appendChild(chip);
      });
    } else {
      relicRow.style.display = 'none';
    }
  }
}

//  LOBBY (모바일 메인 화면)
// ═══════════════════════════════════════════════
function initLobby() {
  checkCharUnlocks(); // 저장된 해금 상태를 CHARACTERS에 반영 (boot 직후 포함)
  syncEnergy();
  generateDailyMissions();
  const sc = document.getElementById('startScreen');
  sc.innerHTML = '';

  let curCharIdx = CHARACTERS.findIndex(c => c.id === (meta.selectedChar || 'penguin'));
  if (curCharIdx < 0) curCharIdx = 0;
  window._lobbyCharIdx = curCharIdx; // showLobbyCharDetail에서 접근 가능하도록 전역 동기화

  function renderLobby() {
    window._lobbyCharIdx = curCharIdx; // 캐릭터 변경 시 전역 동기화
    syncEnergy();
    const ch = CHARACTERS[curCharIdx];
    const locked = !ch.unlocked;
    const eq = prem.equipment;
    const slots = ['weapon','armor','ring'];
    const slotEmoji = { weapon:'⚔️', armor:'🛡️', ring:'💍' };
    const slotLabel = { weapon:'무기', armor:'방어구', ring:'반지' };

    function eqCard(slot) {
      const id = eq[slot];
      const item = id ? EQUIPMENT_POOL.find(e=>e.id===id) : null;
      const rarityBg = item ? {common:'rgba(140,140,140,0.12)',uncommon:'rgba(78,207,122,0.15)',rare:'rgba(74,158,255,0.15)',legendary:'rgba(240,192,80,0.2)'}[item.rarity] : 'rgba(255,255,255,0.75)';
      const rarityBorder = item ? RARITY_COLOR2[item.rarity] : 'rgba(255,255,255,0.6)';
      return `<div class="eq-slot ${item?item.rarity:''}" data-slot="${slot}" style="background:${rarityBg};border-color:${rarityBorder}">
        <div style="font-size:26px;line-height:1">${item ? item.emoji : slotEmoji[slot]}</div>
        <div class="sl" style="color:${item?RARITY_COLOR2[item.rarity]:'#6a8a4a'}">${item ? item.name : slotLabel[slot]}</div>
      </div>`;
    }

    // 에너지: 999개 아이콘 대신 숫자로 표시
    const energyPct = Math.min(100, (prem.energy / MAX_ENERGY) * 100);
    const nextTimer = nextEnergyTimer();
    const bpPct = Math.min(100, (prem.bpXp / 100) * 100);

    sc.innerHTML = `
      <div class="lobby-wrap">
        <!-- 구름 장식 -->
        <div class="lob-cloud c1"></div>
        <div class="lob-cloud c2"></div>
        <div class="lob-cloud c3"></div>

        <!-- 상단 HUD -->
        <div class="lobby-top">
          <!-- 젬 -->
          <div class="lobby-cur" onclick="showStoreOverlay()" title="상점">
            <span style="font-size:14px">💎</span>
            <span style="font-weight:900">${prem.gems}</span>
          </div>
          <!-- 에너지: 숫자+바 -->
          <div class="lobby-cur" style="flex:1;gap:7px" onclick="showStoreOverlay()" title="에너지">
            <span style="font-size:13px">⚡</span>
            <div style="flex:1;height:7px;background:rgba(0,0,0,0.12);border-radius:4px;overflow:hidden">
              <div id="energyBar" style="width:${energyPct}%;height:100%;background:linear-gradient(90deg,#f0c050,#ffe080);border-radius:4px;transition:width 0.5s"></div>
            </div>
            <span id="energyTimerText" style="font-size:11px;font-weight:800;color:#2a6a2a;min-width:32px;text-align:right">${prem.energy >= MAX_ENERGY ? 'MAX' : nextTimer || ''}</span>
          </div>
          <!-- 상점/패스 버튼 -->
          <div class="lobby-top-btns">
            <button class="lb-top-btn" onclick="showStoreOverlay()">🛒</button>
            <button class="lb-top-btn" onclick="showBattlePassOverlay()">🎖️<span style="font-size:9px;margin-left:2px;color:#e07030">Lv.${prem.bpLevel}</span></button>
          </div>
        </div>

        <!-- 타이틀 -->
        <div style="text-align:center;padding:4px 0 0;position:relative;z-index:2">
          <div style="font-family:'Cinzel',serif;font-size:11px;font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:3px;text-shadow:0 1px 4px rgba(0,0,0,0.3)">WILD LAST STAND</div>
          ${bestRecord&&bestRecord.act>0?`<div style="text-align:center;font-size:10px;color:rgba(255,200,50,0.8);margin-bottom:2px">🏆 최고: ACT${bestRecord.act} · ${bestRecord.kills}킬</div>`:''}
        </div>

        <!-- 캐릭터 스테이지 -->
        <div class="lobby-stage">
          <div class="lobby-stage-glow"></div>
          <button class="lb-arrow" style="left:10px" id="arrowL">‹</button>

          <div style="text-align:center;z-index:2;position:relative;cursor:pointer" onclick="showLobbyCharDetail()">
            <div class="lobby-char-emo">${locked?'🔒':ch.emoji}</div>
            <div class="lobby-platform"></div>
            <div class="lobby-char-name">${ch.name}</div>
            <div class="lobby-char-desc">${ch.desc}</div>
            ${locked ? `<div class="lobby-char-locked" style="width:90%;margin:10px auto 0">
  <div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.7);margin-bottom:4px">
    <span>🔒 처치 ${Math.min(meta.totalKills, ch.unlockKills).toLocaleString()} / ${ch.unlockKills.toLocaleString()}</span>
    <span>${Math.min(100,Math.floor(meta.totalKills/ch.unlockKills*100))}%</span>
  </div>
  <div style="height:6px;background:rgba(0,0,0,0.3);border-radius:3px;overflow:hidden">
    <div style="width:${Math.min(100,Math.floor(meta.totalKills/ch.unlockKills*100))}%;height:100%;background:linear-gradient(90deg,#4a9eff,#7dd8ff);border-radius:3px;transition:width 0.5s"></div>
  </div>
</div>` :
`<div style="display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:8px;max-width:220px;margin-left:auto;margin-right:auto">
  <span style="background:rgba(255,80,80,0.25);border:1px solid rgba(255,80,80,0.4);border-radius:100px;padding:3px 9px;font-size:10px;font-weight:700;color:#ff8888">❤️ ${ch.hp}</span>
  ${Object.entries(ch.bonuses||{}).slice(0,3).map(([k,v])=>{
    const labels={bulletCount:'탄수',bulletSpeed:'탄속',sword:'검',lightning:'번개',aoe:'폭발',regen:'재생',dash:'대시',shield:'보호막',speed:'속도',fireRateBonus:'연사'};
    const col=v>0?'rgba(78,207,122,0.25)':'rgba(232,80,80,0.25)';
    const bc=v>0?'rgba(78,207,122,0.4)':'rgba(232,80,80,0.4)';
    const tc=v>0?'#88ff88':'#ff8888';
    const sign=v>0?'+':'';
    return `<span style="background:${col};border:1px solid ${bc};border-radius:100px;padding:3px 9px;font-size:10px;font-weight:700;color:${tc}">${labels[k]||k} ${sign}${v}</span>`;
  }).join('')}
</div>`}
          </div>

          <button class="lb-arrow" style="right:10px" id="arrowR">›</button>

          <!-- 캐릭터 선택 점 -->
          <div style="position:absolute;bottom:8px;display:flex;gap:6px;z-index:3">
            ${CHARACTERS.map((c,i)=>`<div style="width:${i===curCharIdx?10:7}px;height:${i===curCharIdx?10:7}px;border-radius:50%;
  background:${i===curCharIdx?'#fff':c.unlocked?'rgba(78,207,122,0.7)':'rgba(255,255,255,0.25)'};
  border:${!c.unlocked&&i!==curCharIdx?'1px solid rgba(255,255,255,0.2)':'none'};
  transition:all 0.2s;cursor:pointer" onclick="(()=>{curCharIdx=${i};meta.selectedChar='${c.id}';saveMeta();renderLobby();})()" title="${c.name}${c.unlocked?'':' 🔒'}"></div>`).join('')}
          </div>
        </div>

        <!-- 런 통계 미니 -->
        <div style="display:flex;justify-content:center;gap:0;padding:3px 20px;flex-shrink:0;background:rgba(0,0,0,0.08);border-radius:12px;margin:0 16px;">
          ${[
            {v:(meta.totalRuns||0).toLocaleString(), l:'런'},
            {v:(meta.totalKills||0).toLocaleString(), l:'누적 처치'},
            {v:`${meta.maxAscension||0}`, l:'최고 초월'},
          ].map((s,i)=>`${i>0?'<div style="width:1px;background:rgba(255,255,255,0.2);margin:5px 0"></div>':''}
          <div style="flex:1;text-align:center;padding:5px 4px">
            <div style="font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.3)">${s.v}</div>
            <div style="font-size:9px;color:rgba(255,255,255,0.65);margin-top:1px">${s.l}</div>
          </div>`).join('')}
        </div>

        <!-- 장비 슬롯 -->
        <div style="padding:0 16px;flex-shrink:0">
          <div class="lobby-equip-row" style="padding:0;margin-bottom:4px;gap:8px">
            ${slots.map(s=>eqCard(s)).join('')}
          </div>
        </div>

        <!-- 시작 버튼 -->
        <div style="padding:12px 16px 6px;flex-shrink:0">
          ${hasSavedRun() ? `<button id="lobbyContinue" style="width:100%;padding:13px;font-size:15px;font-weight:800;border:none;cursor:pointer;border-radius:12px;margin-bottom:8px;
            font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#4a9eff,#2a6ecc);color:#fff;
            box-shadow:0 3px 0 #1a4a9a;letter-spacing:0.5px;">
            ↩ ${t('이어하기', 'Continue')} <span style="font-size:11px;opacity:0.75;font-weight:400">(ACT ${hasSavedRun().act} · ${hasSavedRun().currentLayer+1}F)</span>
          </button>` : ''}
          <button class="lb-start" id="lobbyStart" ${locked||prem.energy<=0?'disabled':''}>
            ${locked ? t('🔒 캐릭터 잠김', '🔒 Locked') : prem.energy<=0 ? t('⚡ 에너지 부족', '⚡ No Energy') : t('▶ 새 모험 시작!', '▶ Play Game!')}
          </button>
          <div class="lb-energy-info" id="energyInfoText">
            ${prem.energy<=0&&!locked ? `충전까지 ${nextTimer||'만충'} · 💎 30으로 즉시 충전` : prem.energy<MAX_ENERGY&&!locked ? `다음 충전까지 ${nextTimer}` : ''}
          </div>
        </div>

        <!-- 배틀패스 미니 바 (탭 위에 얇게) -->
        <div style="padding:4px 16px 0;flex-shrink:0;cursor:pointer;display:flex;align-items:center;gap:8px" onclick="showBattlePassOverlay()">
          <span style="font-size:10px;font-weight:800;color:rgba(255,255,255,0.7)">🎖️ Lv.${prem.bpLevel}</span>
          <div style="flex:1;height:4px;background:rgba(0,0,0,0.18);border-radius:2px;overflow:hidden">
            <div style="width:${bpPct}%;height:100%;background:linear-gradient(90deg,#f0c050,#ffea80);border-radius:2px;transition:width 0.5s"></div>
          </div>
          <span style="font-size:9px;color:rgba(255,255,255,0.5)">${prem.bpXp}/100</span>
        </div>

        <!-- 하단 탭 -->
        <div class="lobby-tabs">
          <div class="lb-tab lb-tab-active">
            <span class="ti">🗺️</span><span class="tl">모험</span>
          </div>
          <div class="lb-tab" onclick="showTraitOverlay()">
            <span class="ti">🎰</span><span class="tl">뽑기</span>
          </div>
          <div class="lb-tab" onclick="showEquipOverlay(null)">
            <span class="ti">🎒</span><span class="tl">장비</span>
          </div>
          <div class="lb-tab" onclick="showStoreOverlay()">
            <span class="ti">🛒</span><span class="tl">상점</span>
          </div>
          <div class="lb-tab" onclick="showDailyMissionOverlay()" style="position:relative">
            <span class="ti">📋</span><span class="tl">미션</span>
            ${(()=>{const done=prem.dailyMissions&&prem.dailyMissions.filter(m=>m.progress>=m.goal&&!m.claimed).length;return done?`<span style="position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#e05050;"></span>`:''})()}
          </div>
        </div>
      </div>`;

    document.getElementById('arrowL').onclick = (e) => {
      e.stopPropagation();
      curCharIdx = (curCharIdx - 1 + CHARACTERS.length) % CHARACTERS.length;
      meta.selectedChar = CHARACTERS[curCharIdx].id;
      saveMeta();
      renderLobby();
    };
    document.getElementById('arrowR').onclick = (e) => {
      e.stopPropagation();
      curCharIdx = (curCharIdx + 1) % CHARACTERS.length;
      meta.selectedChar = CHARACTERS[curCharIdx].id;
      saveMeta();
      renderLobby();
    };

    // 이어하기 버튼
    const contBtn = document.getElementById('lobbyContinue');
    if (contBtn) {
      contBtn.onclick = () => {
        const saved = hasSavedRun();
        if (!saved) { renderLobby(); return; }
        audioCtx.resume();
        loadRunSave(saved);
        Audio.startBGM('map');
        showMapScreen();
      };
    }

    const startBtn = document.getElementById('lobbyStart');
    if (startBtn && !startBtn.disabled) {
      startBtn.onclick = () => {
        if (prem.energy < 1) { showStoreOverlay(); return; }
        gs.selectedChar = CHARACTERS[curCharIdx];
        showAscensionSelector(() => {
          savePremium();
          audioCtx.resume();
          showBuildThemeSelector(() => {
            Audio.startBGM('map');
            startNewRun();
          });
        });
      };
    } else if (startBtn && prem.energy <= 0 && !locked) {
      startBtn.onclick = () => showStoreOverlay();
    }

    sc.querySelectorAll('.eq-slot').forEach(el => {
      el.onclick = () => showEquipOverlay(el.dataset.slot);
    });
  }

  renderLobby();
  window._lobbyRender = renderLobby;

  // 실시간 에너지 타이머 (매초 갱신)
  if (window._energyTimerId) clearInterval(window._energyTimerId);
  window._energyTimerId = setInterval(() => {
    // 로비 화면이 아니면 타이머 중지
    if (gs.screen !== 'startScreen') { clearInterval(window._energyTimerId); return; }
    syncEnergy();
    // 타이머 텍스트와 에너지 바만 부분 업데이트 (전체 리렌더 없이)
    const timerEl = document.getElementById('energyTimerText');
    const barEl   = document.getElementById('energyBar');
    const infoEl  = document.getElementById('energyInfoText');
    if (!timerEl) return; // 로비 DOM이 사라진 경우
    const t = nextEnergyTimer();
    if (timerEl) timerEl.textContent = prem.energy >= MAX_ENERGY ? 'MAX' : (t || '');
    if (barEl) barEl.style.width = Math.min(100, (prem.energy / MAX_ENERGY) * 100) + '%';
    if (infoEl) {
      const locked2 = !CHARACTERS.find(c=>c.id===(meta.selectedChar||'penguin'))?.unlocked;
      infoEl.textContent = prem.energy<=0&&!locked2 ? `충전까지 ${t||'만충'} · 💎 30으로 즉시 충전`
        : prem.energy<MAX_ENERGY&&!locked2 ? `다음 충전까지 ${t}` : '';
    }
  }, 1000);

  // 처음 실행 시 튜토리얼
  if (!meta.tutorialDone) showTutorial();
}

      lines: ['나와 함께 <b>Wild Last Stand</b>를 탐험해보자!', '강해지면서 탑 꼭대기를 정복하는 거야. 👑'],
      btn: '다음 →',
    },
    {
      emoji: '🗺️',
      title: '지도를 따라 전진!',
      lines: [
        '노드를 선택해 앞으로 나아가세요.',
        '⚔️ <b>전투</b>   💀 <b>엘리트</b>   👑 <b>보스</b>',
        '🏪 <b>상점</b>   🏕️ <b>휴식</b>   ❓ <b>이벤트</b>',
      ],
      btn: '다음 →',
    },
    {
      emoji: '⚔️',

    document.getElementById('tutNextBtn').onclick = () => {
      cur++;
      if (cur >= steps.length) {

function showEquipOverlay(focusSlot) {
  const ov = document.createElement('div');
  ov.className = 'lb-overlay';
  const slots = ['weapon','armor','ring'];
  const slotLabel = { weapon:'무기', armor:'방어구', ring:'반지' };
  let activeSlot = focusSlot || 'weapon';

  function render() {
    const today = getTodayStr();
    const freeAvail = prem.lastFreeGacha !== today;
    const inventory = prem.inventory.map(id => EQUIPMENT_POOL.find(e=>e.id===id)).filter(Boolean);

    ov.innerHTML = `<div class="lb-ov-inner">
      <div class="lb-ov-head"><span>🎒 장비 관리</span><button onclick="this.closest('.lb-overlay').remove();window._lobbyRender&&window._lobbyRender()">✕</button></div>

      <div style="display:flex;gap:8px;margin-bottom:12px">
        ${slots.map(s=>`<button onclick="window._eqSlot='${s}';this.closest('.lb-overlay').querySelectorAll('.slot-tab').forEach(b=>b.classList.remove('lb-tab-active'));this.classList.add('lb-tab-active');this.closest('.lb-overlay').querySelector('#eqList').innerHTML=renderEqList('${s}')" class="slot-tab lb-tab ${s===activeSlot?'lb-tab-active':''}">${slotLabel[s]}</button>`).join('')}
      </div>

      <div id="eqList">${renderEqList(activeSlot)}</div>

      <div style="margin-top:14px;border-top:1px solid #2a3555;padding-top:12px">
        <div style="font-size:13px;color:#c9a84c;margin-bottom:8px">🎰 장비 뽑기</div>
        <div style="font-size:11px;color:#aaa;margin-bottom:8px">일반(55%) 고급(30%) 희귀(12%) 전설(3%)</div>
        <div class="pull-box">
          <button class="pull-btn-${freeAvail?'free':'dis'}" onclick="window._doPullFree&&window._doPullFree()">${freeAvail?'무료 뽑기':'내일 무료 가능'}</button>
          <button class="pull-btn-gem" onclick="window._doPullGem&&window._doPullGem()">💎 50 뽑기</button>
        </div>
      </div>
    </div>`;

    window._eqSlot = activeSlot;
  }

  function renderEqList(slot) {
    const equipped = prem.equipment[slot];
    const inv = prem.inventory.map(id=>EQUIPMENT_POOL.find(e=>e.id===id)).filter(e=>e&&e.slot===slot);
    if (inv.length === 0) return `<div style="color:#666;font-size:13px;text-align:center;padding:16px">보유 장비 없음 — 뽑기로 획득!</div>`;
    return `<div class="eq-grid">${inv.map(item=>`
      <div class="eq-card ${item.rarity}" onclick="window._equipItem&&window._equipItem('${item.slot}','${item.id}')" style="border-color:${RARITY_COLOR2[item.rarity]};${equipped===item.id?'outline:2px solid #f0c050':''}" title="${item.desc}">
        <div style="font-size:22px">${item.emoji}</div>
        <div style="font-size:11px;font-weight:bold;color:${RARITY_COLOR2[item.rarity]}">${item.name}</div>
        <div style="font-size:10px;color:#aaa">${item.desc}</div>
        ${equipped===item.id?'<div style="font-size:10px;color:#f0c050">✓ 장착 중</div>':''}
      </div>`).join('')}</div>`;
  }

  window._equipItem = (slot, id) => {
    prem.equipment[slot] = prem.equipment[slot] === id ? null : id;
    savePremium();
    ov.querySelector('#eqList').innerHTML = renderEqList(slot);
    ov.querySelectorAll('.eq-card').forEach(c => {});
  };

  window._doPullFree = () => {
    const item = pullEquipment();
    prem.lastFreeGacha = getTodayStr();
    savePremium();
    showToast(`🎰 ${RARITY_LABEL[item.rarity]}! ${item.emoji} ${item.name} 획득!`, 2500);
    render();
  };

  window._doPullGem = () => {
    if (prem.gems < 50) { showToast('💎 젬이 부족합니다!', 1500); return; }
    prem.gems -= 50;
    const item = pullEquipment();
    savePremium();
    showToast(`🎰 ${RARITY_LABEL[item.rarity]}! ${item.emoji} ${item.name} 획득!`, 2500);
    render();
  };

  render();
  document.body.appendChild(ov);
}

//  구매 플로우 — 결제 시트 & 처리 모달
//  실제 PG(Toss Payments 등) 연동 시
//  processPurchase() 내부 _IAP_LIVE 블록만 교체하면 됩니다.

// 개발 테스트 모드 여부 (배포 시 false로 변경)
const _IAP_TEST_MODE = true;

/**
 * showPurchaseSheet(product)
 * product = { id, name, desc, price, emoji, onSuccess }
 *   id:        상품 식별자 (예: 'gem_80', 'battlepass', 'sub_monthly')
 *   name:      상품명
 *   desc:      설명
 *   price:     표시 가격 문자열 (예: '₩1,200')
 *   emoji:     아이콘
 *   onSuccess: 결제 성공 시 실행할 함수 (젬 지급 등)
 */
function showPurchaseSheet(product) {
  // 기존 시트가 있으면 제거
  document.getElementById('_purchaseSheet')?.remove();

  const sheet = document.createElement('div');
  sheet.id = '_purchaseSheet';
  sheet.style.cssText = `
    position:fixed;inset:0;z-index:900;display:flex;align-items:flex-end;
    background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);
    animation:_psIn 0.25s ease;
  `;

  // 결제 수단 목록 (시각용)
  const payMethods = [
    { icon:'💳', name:'신용카드', sel:true },
    { icon:'📱', name:'카카오페이', sel:false },
    { icon:'🏦', name:'토스페이', sel:false },
  ];
  let selPay = 0;

  function renderSheet(state='ready') {
    const methodsHtml = payMethods.map((m,i)=>`
      <div onclick="window._selPay&&window._selPay(${i})"
        style="flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid ${i===selPay?'#4a9eff':'#2a3555'};
          background:${i===selPay?'rgba(74,158,255,0.12)':'rgba(255,255,255,0.04)'};
          text-align:center;cursor:pointer;transition:all 0.15s">
        <div style="font-size:18px">${m.icon}</div>
        <div style="font-size:10px;margin-top:3px;color:${i===selPay?'#a0c8ff':'#888'}">${m.name}</div>
      </div>`).join('');

    const isProcessing = state === 'processing';
    const isDone       = state === 'success';
    const isFail       = state === 'fail';

    sheet.innerHTML = `
      <style>
        @keyframes _psIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
        @keyframes _spin{to{transform:rotate(360deg)}}
        @keyframes _pop{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
        #_purchaseSheet .ps-inner{
          width:100%;max-width:480px;margin:0 auto;
          background:linear-gradient(180deg,#16213e 0%,#0e1628 100%);
          border-radius:22px 22px 0 0;padding:24px 20px 32px;
          box-shadow:0 -8px 40px rgba(0,0,0,0.5);
        }
        #_purchaseSheet .ps-handle{width:40px;height:4px;background:#2a3555;border-radius:2px;margin:0 auto 20px}
        #_purchaseSheet .ps-badge{
          display:inline-block;font-size:10px;padding:2px 8px;border-radius:6px;
          background:rgba(74,158,255,0.15);color:#4a9eff;margin-bottom:8px;
        }
        #_purchaseSheet .ps-price{font-size:28px;font-weight:900;color:#f0f4ff;letter-spacing:-1px}
        #_purchaseSheet .ps-btn{
          width:100%;padding:15px;border:none;border-radius:14px;
          font-size:16px;font-weight:800;cursor:pointer;transition:all 0.15s;
          background:linear-gradient(90deg,#4a9eff,#7060f0);color:#fff;
          box-shadow:0 4px 18px rgba(74,158,255,0.35);letter-spacing:0.5px;
        }
        #_purchaseSheet .ps-btn:active{transform:scale(0.97)}
        #_purchaseSheet .ps-cancel{
          width:100%;padding:10px;border:none;background:none;
          color:#556;font-size:13px;cursor:pointer;margin-top:4px;
        }
      </style>
      <div class="ps-inner">
        <div class="ps-handle"></div>
        ${isDone ? `
          <div style="text-align:center;padding:20px 0">
            <div style="font-size:60px;animation:_pop 0.4s ease">${product.emoji}</div>
            <div style="font-size:20px;font-weight:800;color:#4ecf7a;margin:12px 0 4px">결제 완료!</div>
            <div style="font-size:13px;color:#8aa0b8">${product.name} 지급되었습니다</div>
            ${_IAP_TEST_MODE?'<div style="font-size:10px;color:#4a9eff;margin-top:8px;opacity:0.7">🛠 TEST MODE — 실제 결제 없음</div>':''}
            <button class="ps-btn" style="margin-top:24px" onclick="document.getElementById(\'_purchaseSheet\')?.remove();window._lobbyRender&&window._lobbyRender()">확인</button>
          </div>
        ` : isFail ? `
          <div style="text-align:center;padding:20px 0">
            <div style="font-size:48px">❌</div>
            <div style="font-size:18px;font-weight:800;color:#e05050;margin:12px 0 4px">결제 실패</div>
            <div style="font-size:12px;color:#8aa0b8">잠시 후 다시 시도해 주세요</div>
            <button class="ps-btn" style="margin-top:24px;background:linear-gradient(90deg,#e05050,#c03030)" onclick="document.getElementById(\'_purchaseSheet\')?.remove()">닫기</button>
          </div>
        ` : isProcessing ? `
          <div style="text-align:center;padding:30px 0">
            <div style="width:44px;height:44px;border:3px solid #2a3555;border-top-color:#4a9eff;border-radius:50%;margin:0 auto;animation:_spin 0.7s linear infinite"></div>
            <div style="font-size:14px;color:#8aa0b8;margin-top:16px">결제 처리 중...</div>
          </div>
        ` : `
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
            <div style="font-size:40px">${product.emoji}</div>
            <div>
              <div class="ps-badge">인앱 구매</div>
              <div style="font-size:15px;font-weight:700;color:#d8e4f0">${product.name}</div>
              <div style="font-size:12px;color:#6a7a8e;margin-top:2px">${product.desc}</div>
            </div>
          </div>

          <div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
            <div style="font-size:12px;color:#8aa0b8">결제 금액</div>
            <div class="ps-price">${product.price}</div>
          </div>

          <div style="font-size:11px;color:#6a7a8e;margin-bottom:10px">결제 수단</div>
          <div style="display:flex;gap:8px;margin-bottom:20px">${methodsHtml}</div>

          ${_IAP_TEST_MODE?'<div style="font-size:10px;color:#4a9eff;text-align:center;margin-bottom:10px;opacity:0.7">🛠 개발 테스트 모드 — 실제 결제 없이 즉시 지급</div>':''}

          <button class="ps-btn" onclick="window._confirmPurchase&&window._confirmPurchase()">
            ${product.price} 결제하기
          </button>
          <button class="ps-cancel" onclick="document.getElementById('_purchaseSheet')?.remove()">취소</button>
        `}
      </div>
    `;

    window._selPay = (i) => { selPay=i; renderSheet(); };
  }

  // 결제 처리
  window._confirmPurchase = async () => {
    renderSheet('processing');

    // ── 실제 PG 연동 시 이 블록을 교체 ──────────────────────────
    // const result = await TossPayments('YOUR_CLIENT_KEY').requestPayment({ ... });
    // ─────────────────────────────────────────────────────────────

    const delay = _IAP_TEST_MODE ? 1200 : 3000; // 테스트: 1.2초, 실제: PG 응답 대기
    await new Promise(r => setTimeout(r, delay));

    // 테스트 모드: 항상 성공 / 실제 모드: PG 결과 기반
    const ok = _IAP_TEST_MODE ? true : false; // TODO: PG 연동 후 변경
    if (ok) {
      product.onSuccess();
      savePremium();
      renderSheet('success');
    } else {
      renderSheet('fail');
    }
  };

  renderSheet();

  // 배경 클릭 시 닫기
  sheet.addEventListener('click', e => { if(e.target===sheet) sheet.remove(); });
  document.body.appendChild(sheet);
}

const GACHA_SINGLE_COST = 60;

function doPull(count) {
  const results = [];
  for (let i = 0; i < count; i++) {
    prem.gachaPity++;
    prem.gachaLegPity++;
    let rarity;
    // 전설 천장 (50연차)
    if (prem.gachaLegPity >= 50) { rarity = 'legendary'; prem.gachaLegPity = 0; prem.gachaPity = 0; }
    // 희귀 천장 (10연차)
    else if (prem.gachaPity >= 10) { rarity = 'rare'; prem.gachaPity = 0; }
    else {
      const r = Math.random();
      if      (r < 0.03) { rarity = 'legendary'; prem.gachaLegPity = 0; prem.gachaPity = 0; }
      else if (r < 0.15) { rarity = 'rare';      prem.gachaPity = 0; }
      else if (r < 0.45) rarity = 'uncommon';
      else               rarity = 'common';
    }
    const pool = EQUIPMENT_POOL.filter(e => e.rarity === rarity);
    const item = pool[Math.floor(Math.random() * pool.length)];
    if (item) {
      prem.inventory.push(item.id);
      results.push(item);
    }
  }
  // 히스토리 저장 (최근 20개)
  prem.gachaHistory = [...results.map(i=>i.id), ...(prem.gachaHistory||[])].slice(0, 20);
  savePremium();
  return results;
}

function showGachaResult(items, parentOv) {
  const res = document.createElement('div');
