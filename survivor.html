  const rankColor = gs.totalKills>200?'#c9a84c':gs.totalKills>120?'#9b6ee8':gs.totalKills>60?'#4a9eff':'#4ecf7a';
  const buildName = getBuildName();
  const synCount  = getActiveSynergies().length;
  const deckNames = gs.deck.slice(0,4).map(c=>c.emoji+' '+c.name).join('  ·  ');

  const overlay = document.createElement('div');
  overlay.id = 'finalVictoryOverlay';
  overlay.style.cssText = `position:fixed;inset:0;z-index:400;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity 1.2s;`;
  document.body.appendChild(overlay);

  // ── 별빛 배경 Canvas ──
  const bgC = document.createElement('canvas');
  bgC.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
  bgC.width  = window.innerWidth;
  bgC.height = window.innerHeight;
  overlay.appendChild(bgC);
  const fvc = bgC.getContext('2d');
  const BW = bgC.width, BH = bgC.height;

  const stars200 = Array.from({length:200},()=>({
    x:Math.random()*BW, y:Math.random()*BH,
    r:0.3+Math.random()*1.8, sp:0.003+Math.random()*0.006, ph:Math.random()*Math.PI*2
  }));
  const glitters = Array.from({length:45},()=>({
    x:Math.random()*BW, y:Math.random()*BH,
    vx:(Math.random()-.5)*0.4, vy:-0.2-Math.random()*0.5,
    r:0.8+Math.random()*2, life:Math.random()*180
  }));

  // gradient는 매 프레임 생성하지 않고 한 번만 만들어서 재사용
  const _fvBg = fvc.createRadialGradient(BW/2,BH*0.4,0, BW/2,BH*0.4, BW*0.85);
  _fvBg.addColorStop(0,'#1a0a30'); _fvBg.addColorStop(0.5,'#0c0620'); _fvBg.addColorStop(1,'#050210');

  let fvRunning = true;
  function fvFrame(t) {
    if (!fvRunning) return;
    // 배경 (캐싱된 gradient 재사용)
    fvc.fillStyle = _fvBg; fvc.fillRect(0,0,BW,BH);
    // 별
    stars200.forEach(s=>{
      const a=0.25+0.75*Math.abs(Math.sin(t*0.001*s.sp*300+s.ph));
      fvc.save(); fvc.globalAlpha=a; fvc.fillStyle='#fff';
      fvc.beginPath(); fvc.arc(s.x,s.y,s.r,0,Math.PI*2); fvc.fill(); fvc.restore();
    });
    // 금빛 파티클
    glitters.forEach(g=>{
      g.x+=g.vx; g.y+=g.vy; g.life--;
      if(g.life<0){g.x=Math.random()*BW;g.y=BH*(0.5+Math.random()*0.5);g.life=100+Math.random()*120;}
      fvc.save(); fvc.globalAlpha=Math.min(1,g.life/25)*0.7;
      fvc.fillStyle='#c9a84c'; fvc.beginPath(); fvc.arc(g.x,g.y,g.r,0,Math.PI*2); fvc.fill(); fvc.restore();
    });
    requestAnimationFrame(fvFrame);
  }
  requestAnimationFrame(fvFrame);

  // ── UI 패널 (스크롤 없이 한 화면에 표시) ──
  const panel = document.createElement('div');
  panel.style.cssText = `position:relative;z-index:1;text-align:center;
    padding:16px 20px;max-width:520px;width:92%;`;

  const ascUnlockHtml = (()=>{
    if(ascCur >= (meta.maxAscension||0) && ascCur < 30){
      return `<div style="margin-bottom:10px;padding:7px 14px;background:rgba(170,0,255,0.14);border:1px solid rgba(170,0,255,0.45);border-radius:9px;display:flex;align-items:center;gap:8px;justify-content:center;">
        <span style="font-size:13px;color:#cc88ff;font-weight:700;">☠️ 초월 ${ascCur+1} 해금!</span>
        <span style="font-size:10px;color:#8a68aa;">${ASCENSION_MODS[ascCur]?.emoji||''} ${ASCENSION_MODS[ascCur]?.name||''}</span>
      </div>`;
    }
    if(ascCur >= 30) return `<div style="margin-bottom:10px;padding:7px 14px;background:rgba(255,200,0,0.1);border:1px solid rgba(255,200,0,0.4);border-radius:9px;font-size:12px;color:#ffdd44;font-weight:700;">👑 모든 초월 완료! 진정한 전설!</div>`;
    return '';
  })();
  panel.innerHTML = `
  <style>
    @keyframes fvGold{0%,100%{text-shadow:0 0 18px #c9a84c33}50%{text-shadow:0 0 44px #c9a84c,0 0 80px #c9a84c55}}
    @keyframes fvPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  </style>

  <!-- 헤더 -->
  <div style="font-size:52px;margin-bottom:2px;animation:fvPulse 2.5s infinite;">👑</div>
  <div style="font-family:'Cinzel',serif;font-size:9px;color:#c9a84c;letter-spacing:6px;margin-bottom:2px;">✦ LEGENDARY CLEAR ✦</div>
  <div style="font-family:'Cinzel',serif;font-size:22px;font-weight:900;color:#f0d080;
    animation:fvGold 2.5s infinite;margin-bottom:2px;">
    ${gs.selectedChar.emoji} ${gs.selectedChar.name}의 전설

  <div style="font-size:10px;color:#c9a84c88;letter-spacing:1px;margin-bottom:8px;">${buildName}</div>

  <!-- 등급 + 빌드 한 줄 -->

  </div>

  <!-- 핵심 통계 3×2 -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:7px;">
    ${[
      {e:'⏱️',l:'클리어 시간',v:`${mm}:${ss}`,c:'#7dd8ff'},
      {e:'💀',l:'총 처치',    v:`${gs.totalKills}킬`,c:'#e05050'},
      {e:'🪙',l:'획득코인',   v:`+${earnedCoins}`,c:'#c9a84c'},
      {e:'💎',l:'아티팩트',   v:`${gs.relics.length}개`,c:'#9b6ee8'},
      {e:'⚡',l:'시너지',     v:`${synCount}개`,c:'#f8e030'},
      {e:'🔮',l:'룬',         v:`${gs.deck.length}장`,c:'#c9a84c'},

function showGameOver(won) {
  stopBattleTimers();
  clearRunSave(); // 런 종료 시 세이브 삭제
  if (won) { showFinalVictory(); return; }
  const earnedCoins = earnMetaCoins();

  const _dPool = LANG === 'en' ? DEATH_MSGS_EN : DEATH_MSGS;
  const deathMsg = _dPool[Math.floor(Math.random()*_dPool.length)];
  const mm = String(Math.floor(gs.totalTime/60)).padStart(2,'0');
  const ss = String(gs.totalTime%60).padStart(2,'0');

  // 등급 계산
  const killScore = gs.totalKills;
  const actScore  = (gs.act - 1) * 100 + gs.currentLayer * 10;
  const totalScore = killScore + actScore + gs.bossesDefeated * 50;
  const grade = totalScore >= 400 ? 'S' : totalScore >= 250 ? 'A' : totalScore >= 120 ? 'B' : totalScore >= 50 ? 'C' : 'D';
  const gradeColor = {S:'#f0c050',A:'#9b6ee8',B:'#4a9eff',C:'#4ecf7a',D:'#8aa0b8'}[grade];

  // 진행도 바
  let progressHTML = '<div style="display:flex;gap:3px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;">';
  for(let a=1;a<=ACTS;a++){
    for(let f=0;f<FLOORS_PER_ACT;f++){
      const isBoss = f===FLOORS_PER_ACT-1;
      const done = a<gs.act || (a===gs.act && f<=gs.currentLayer);
      const isCur = a===gs.act && f===gs.currentLayer;
      const theme = ACT_THEMES[a-1];
      const col = done ? (isBoss?'#e05050':theme.color) : 'rgba(255,255,255,0.1)';
      const size = isBoss?'10px':'8px';
      const w    = isBoss?'12px':size;
      progressHTML += `<div style="width:${w};height:${size};border-radius:${isBoss?'3':'50'}px;background:${col};${isCur?'outline:2px solid #fff;outline-offset:1px;':''}"></div>`;
    }
    if(a<ACTS) progressHTML += '<div style="width:8px"></div>';
  }
  progressHTML += '</div>';

  // 덱 카드 미리보기 (최대 12장)
  const deckPreview = gs.deck.length > 0
    ? `<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:4px">

        ${gs.deck.length>12?`<span style="font-size:11px;color:#5a7a9a;align-self:center">+${gs.deck.length-12}</span>`:''}
      </div>`
    : '<div style="color:#3a5a7a;font-size:12px">룬 없음</div>';

  // 유물 미리보기

      border:1px solid #1e3a5f;border-radius:22px;text-align:center;box-shadow:0 0 80px rgba(0,0,0,0.85);margin:auto;">

          {e:'💔',l:'받은 피해', v: (gs._totalDmgTaken||0)>999?`${((gs._totalDmgTaken||0)/1000).toFixed(1)}k`:Math.round(gs._totalDmgTaken||0)+'', c:'#e05050'},

        </div>
      </div>

      <!-- 시너지 -->

        <span style="background:rgba(240,192,80,0.08);border:1px solid rgba(240,192,80,0.25);border-radius:100px;padding:5px 13px;font-size:12px;color:#f0c050">🎖️ +${bpXpEarned} XP</span>

      <!-- 버튼 -->

        <button onclick="(()=>{const el=document.getElementById('_deathOverlay');if(el)el.remove();stopBattleTimers();if(battleAnimId){cancelAnimationFrame(battleAnimId);battleAnimId=null;}if(bt){bt.screenShake=0;bt.won=true;}gs.screen='startScreen';showAscensionSelector(()=>{audioCtx.resume();Audio.startBGM('map');startNewRun();});})()"
          style="flex:2;padding:13px;font-size:15px;font-weight:800;border:none;cursor:pointer;border-radius:12px;
          font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#3dcc5a,#28a845);color:#fff;

        </button>

          font-family:'Noto Sans KR',sans-serif;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:#8aa0b8">

  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.style.opacity = '1');
  Audio.stopBGM(1.0);
  [200,160,130].forEach((_,i)=>setTimeout(()=>Audio.sfx.playerHurt(),i*200));

// 빌드 이름 자동 생성
function getBuildName() {
  const s = gs.skills;
  const syns = getActiveSynergies();
  if (syns.length > 0) return syns[0].emoji + ' ' + syns[0].name + ' 빌드';
  if (s.deathBeam && s.piercing) return '🌀 레이저 저격 빌드';
  if ((s.sword||0) >= 3) return '⚔️ 검술 달인 빌드';
  if ((s.lightning||0) >= 3) return '⚡ 번개 폭풍 빌드';
  if ((s.bulletCount||0) >= 4) return '🔫 탄막 빌드';
  if (s.blackhole && s.aoe) return '🕳️ 중력 파괴 빌드';
  if ((s.freeze||0) >= 2 && s.lightning) return '❄️ 빙결 지배 빌드';
  if (gs.relics.length >= 3) return '💎 아티팩트 수집가 빌드';
  if (gs.deck.length >= 8) return '🔮 룬 마스터 빌드';
  return gs.selectedChar.emoji + ' ' + gs.selectedChar.name + ' 빌드';
}

function saveBest(){
  if(gs.act>bestRecord.act||(gs.act===bestRecord.act&&gs.totalKills>bestRecord.kills)){
    bestRecord.act=gs.act; bestRecord.kills=gs.totalKills; bestRecord.time=gs.totalTime;
    localStorage.setItem('penguinSpireBest',JSON.stringify(bestRecord));
  }
}

// ═══════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  keys[e.key]=true;

  // ── 전투 중 키보드 단축키 ──
  if (gs.screen === '__battle__' && bt) {
    // ESC — 일시정지 토글
    if (e.key === 'Escape') { e.preventDefault(); toggleBattlePause(); return; }
    // P — 일시정지 토글
    if (e.key === 'p' || e.key === 'P') { toggleBattlePause(); return; }
    // F — 속도 배속 토글
    if (e.key === 'f' || e.key === 'F') { toggleBattleSpeed(); return; }
    // Tab — HUD 확장/축소 토글
    if (e.key === 'Tab') { e.preventDefault(); bt._hudExpanded = !bt._hudExpanded; return; }
  }

  if((e.key===' '||e.key==='Spacebar')&&gs.skills.dash>0&&bt.dashCooldown<=0){
    bt.dashCooldown = gs._dashCdReduced ? 90 : 120; bt.dashActive=12;
    gs.player.invincible=Math.max(gs.player.invincible,14); // 대시 무적 프레임
    if(bt.miniChallenge&&bt.miniChallenge.id==='dash') bt._miniDashCount=(bt._miniDashCount||0)+1;
    Audio.sfx.dash(); spawnP(gs.player.x,gs.player.y,'#4af',10,5);
    if(hasRelic('r_shadow_cloak')){ gs.player.invincible=18; gs._relicShadowReady=true; }
    // blade_dancer: 대시 시 검 데미지 폭발
    if(gs.skills._synBladeDancer){
      bt.enemies.forEach(e=>{
        if(Math.hypot(e.x-gs.player.x,e.y-gs.player.y)<120){
          damageEnemy(e,3*Math.max(1,gs.skills.sword));
        }
      });
      bt.explosions.push({x:gs.player.x,y:gs.player.y,maxRadius:120,radius:0,timer:15});
      spawnP(gs.player.x,gs.player.y,'#d8e4f0',14,5);
    }
  }
});
document.addEventListener('keyup',e=>keys[e.key]=false);

// 우클릭: 기본 메뉴 방지 + HUD 확장/축소 토글
gameCanvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (bt && gs.screen === '__battle__') bt._hudExpanded = !bt._hudExpanded;
});
// 창 포커스 잃으면 모든 키 해제 (우클릭 메뉴 열릴 때 keyup 안 들어오는 문제 방지)
window.addEventListener('blur', () => { Object.keys(keys).forEach(k => keys[k] = false); });

gameCanvas.addEventListener('touchstart',e=>{
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    const rect=gameCanvas.getBoundingClientRect();
    const relX=(t.clientX-rect.left)/rect.width;
    if(relX > 0.72 && gs.skills.dash>0 && bt.dashCooldown<=0){
      // 오른쪽 영역 탭 = 대시
      bt.dashCooldown = gs._dashCdReduced ? 90 : 120; bt.dashActive=12;
      gs.player.invincible=Math.max(gs.player.invincible,14); // 대시 무적 프레임
      if(bt.miniChallenge&&bt.miniChallenge.id==='dash') bt._miniDashCount=(bt._miniDashCount||0)+1;
      Audio.sfx.dash(); spawnP(gs.player.x,gs.player.y,'#4af',10,5);
      if(gs.skills._synBladeDancer){
        bt.enemies.forEach(en=>{if(Math.hypot(en.x-gs.player.x,en.y-gs.player.y)<120)damageEnemy(en,3*Math.max(1,gs.skills.sword));});
        bt.explosions.push({x:gs.player.x,y:gs.player.y,maxRadius:120,radius:0,timer:15});
      }
    } else if(relX <= 0.72) {
      joystick.active=true; joystick.startX=t.clientX; joystick.startY=t.clientY; joystick.dx=0; joystick.dy=0;
      joystick.id=t.identifier;
    }
  }
  e.preventDefault();
},{passive:false});
gameCanvas.addEventListener('touchmove',e=>{
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(t.identifier!==joystick.id)continue;
    const dx=t.clientX-joystick.startX, dy=t.clientY-joystick.startY;
    const dist=Math.hypot(dx,dy), max=52;
    joystick.dx=dist>max?(dx/dist)*max:dx;
    joystick.dy=dist>max?(dy/dist)*max:dy;
  }
  e.preventDefault();
},{passive:false});
gameCanvas.addEventListener('touchend',e=>{
  for(let i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===joystick.id){
      joystick.active=false; joystick.dx=0; joystick.dy=0; joystick.id=null;
    }
  }
});

// ══════════════════════════════════════════════════
//  HUD 통합 호버 툴팁 (스킬 아이콘 / 시너지 / 유물)
// ══════════════════════════════════════════════════
let _hudTooltipEl = null;

function _getOrCreateTooltip() {
  if (!_hudTooltipEl) {
    _hudTooltipEl = document.createElement('div');
    _hudTooltipEl.style.cssText = `
      position:fixed;z-index:9999;pointer-events:none;
      max-width:220px;padding:10px 14px;border-radius:12px;
      background:rgba(6,12,28,0.97);
      font-family:'Noto Sans KR',sans-serif;font-size:12px;line-height:1.6;
      color:#c8d8e8;box-shadow:0 4px 24px rgba(0,0,0,0.8);
      transition:opacity 0.1s;
    `;
    document.body.appendChild(_hudTooltipEl);
  }
  return _hudTooltipEl;
}

function _showTooltipAt(html, borderColor, clientX, clientY) {
  const el = _getOrCreateTooltip();
  el.style.border = `1px solid ${borderColor||'rgba(100,160,255,0.5)'}`;
  el.innerHTML = html;
  el.style.display = 'block';
  el.style.opacity = '1';
  // 화면 밖 넘침 방지
  const tipX = Math.min(clientX + 16, window.innerWidth - 240);
  const tipY = Math.max(clientY - el.offsetHeight - 8, 10);
  el.style.left = tipX + 'px';
  el.style.top  = tipY + 'px';
}

function _hideTooltip() {
  if (_hudTooltipEl) { _hudTooltipEl.style.display = 'none'; }
}

gameCanvas.addEventListener('mousemove', (e) => {
  if (!bt || gs.screen !== '__battle__') { _hideTooltip(); return; }

  const rect = gameCanvas.getBoundingClientRect();
  const scaleX = 800 / rect.width;
  const scaleY = 800 / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top)  * scaleY;

  // 1) 스킬 아이콘 바 (specialIcons + statIcons)
  const iconPositions = bt._iconHUDPos || [];
  for (const pos of iconPositions) {
    if (cx >= pos.x && cx <= pos.x + pos.size && cy >= pos.y && cy <= pos.y + pos.size) {
      const sk = pos.icon;
      if (!sk.tip) continue;
      const lines = sk.tip.split('\n');
      const html = `
        <div style="font-size:22px;text-align:center;margin-bottom:4px;">${sk.e}</div>
        <div style="font-size:13px;font-weight:700;color:${sk.c||'#d8e4f0'};margin-bottom:4px;text-align:center;">${lines[0]}</div>
        ${lines.slice(1).map(l=>`<div style="color:#8aacbe;font-size:11px;">${l}</div>`).join('')}
      `;
      _showTooltipAt(html, (sk.c||'#4a9eff')+'99', e.clientX, e.clientY);
      return;
    }
  }

  // 2) 시너지 pills
  const synPositions = bt._synHUDPos || [];
  for (const pos of synPositions) {
    if (cx >= pos.x && cx <= pos.x + pos.w && cy >= pos.y && cy <= pos.y + pos.h) {
      const syn = pos.syn;
      const html = `
        <div style="font-size:13px;font-weight:700;color:${syn.color};margin-bottom:4px;">${syn.emoji} ${syn.name}</div>
        <div style="color:#8aacbe;font-size:11px;">${syn.desc||'시너지 효과 활성화'}</div>
        ${syn.requires ? `<div style="color:#5a8aaa;font-size:10px;margin-top:4px;">조합: ${syn.requires.join(' + ')}</div>` : ''}
      `;
      _showTooltipAt(html, syn.color+'88', e.clientX, e.clientY);
      return;
    }
  }

  // 3) 유물 바
  const relicPositions = bt._relicHUDPos || [];
  for (const pos of relicPositions) {
    if (cx >= pos.x && cx <= pos.x + pos.size && cy >= pos.y && cy <= pos.y + pos.size) {
      const r = pos.relic;
      const TIER_LABEL = {common:'일반', uncommon:'희귀', rare:'전설'};
      const TIER_COL   = {common:'#7a8a9a', uncommon:'#4a9eff', rare:'#c9a84c'};
      const html = `
        <div style="font-size:24px;text-align:center;margin-bottom:4px;">${r.emoji}</div>
        <div style="font-size:10px;color:${TIER_COL[r.tier]||'#aaa'};text-align:center;letter-spacing:2px;margin-bottom:4px;">
          ${TIER_LABEL[r.tier]||r.tier}
        </div>
        <div style="font-size:13px;font-weight:700;color:#f0d080;text-align:center;margin-bottom:6px;">${r.name}</div>
        <div style="color:#8aacbe;font-size:11px;">${r.desc}</div>
      `;
      _showTooltipAt(html, r.color+'88', e.clientX, e.clientY);
      return;
    }
  }

  _hideTooltip();
});

gameCanvas.addEventListener('mouseleave', _hideTooltip);

// 반응형 — 게임 캔버스는 화면 최대한 활용
function resizeGame(){
  const vw=window.innerWidth, vh=window.innerHeight;
  // 게임 캔버스: 세로 기준 최대, 최소 여백 8px
  const size = Math.min(vw - 8, vh - 8, 860);
  gameCanvas.style.width  = size + 'px';
  gameCanvas.style.height = size + 'px';
  // 지도 캔버스
  const mw = Math.min(vw - 16, 960);
  const mh = Math.floor(mw * 600 / 960);
  mapCanvas.width  = 960; mapCanvas.height = 600;
  mapCanvas.style.width  = mw + 'px';
  mapCanvas.style.height = mh + 'px';
}
window.addEventListener('resize',resizeGame);
// [M10] orientationchange 대응 — 뷰포트 변화 후 300ms 지연 후 재조정
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    const vw = Math.min(window.innerWidth, window.innerHeight);
    if (gameCanvas) {
      gameCanvas.style.width = vw + 'px';
      gameCanvas.style.height = vw + 'px';
    }
    resizeGame();
  }, 300);
});
resizeGame();

// ─── BOOT ───
if (LANG !== 'ko') setLang(LANG); // apply saved language to data arrays
initLobby();
showScreen('startScreen');
