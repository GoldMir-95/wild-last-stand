  const rarityBg   = {common:'rgba(140,140,140,0.12)',uncommon:'rgba(78,207,122,0.12)',rare:'rgba(74,158,255,0.15)',legendary:'rgba(240,192,80,0.2)'};
  const rarityGlow = {common:'#888',uncommon:'#4ecf7a',rare:'#4a9eff',legendary:'#f0c050'};

  const cards = items.map(it => `
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;
      border-radius:12px;background:${rarityBg[it.rarity]};border:1px solid ${rarityGlow[it.rarity]}55;

      <div style="font-size:8px;font-weight:700;color:${rarityGlow[it.rarity]};letter-spacing:1px">${RARITY_LABEL[it.rarity].toUpperCase()}</div>
      <div style="font-size:9px;color:#c8d8e8;text-align:center;line-height:1.3">${it.name}</div>
    </div>`).join('');

  // 전설 나왔는지 체크
  const hasLeg = items.some(i => i.rarity === 'legendary');
  const hasRare = items.some(i => i.rarity === 'rare');

  res.innerHTML = `
    <div style="font-family:'Cinzel',serif;font-size:${hasLeg?'22px':'16px'};font-weight:900;
      color:${hasLeg?'#f0c050':hasRare?'#4a9eff':'#c8d8e8'};margin-bottom:16px;text-align:center;
      ${hasLeg?'text-shadow:0 0 20px #f0c050;':''}">${hasLeg?'✨ 전설 획득! ✨':hasRare?'💙 희귀 획득':'뽑기 결과'}</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:360px;margin-bottom:24px">
      ${cards}

    <button id="_gResClose" style="padding:12px 40px;font-size:15px;font-weight:800;border:none;cursor:pointer;
      border-radius:12px;font-family:'Noto Sans KR',sans-serif;
      background:linear-gradient(135deg,#9b6ee8,#6a3ea8);color:#fff;">확인</button>`;

  res.querySelector('#_gResClose').addEventListener('click', () => {
    res.style.opacity = '0';
    setTimeout(() => { res.remove(); if(parentOv) { parentOv.remove(); showGachaOverlay(); } }, 280);
  });

  document.body.appendChild(res);
  if (hasLeg) { playSound(1100,0.3,'sine',0.1); setTimeout(()=>playSound(1320,0.25,'sine',0.08),120); }
  else if (hasRare) { playSound(880,0.2,'sine',0.08); }
  requestAnimationFrame(() => res.style.opacity = '1');
}

    bulletCount:   v => `🔫 탄환 +${v}발`,
    fireRateBonus: () => `🔥 연사 강화`,
    sword:         v => `🗡️ 회전검 ${v}개`,
    aoe:           v => `💥 폭발 ${v}강`,
    lightning:     v => `⚡ 번개 ${v}강`,
    speed:         v => `🏃 이동 ${v>0?'+':''}${v}`,
    dash:          v => `💨 대시 ${v}강`,
    regen:         v => `♥ 재생 +${v}`,
    shield:        v => `🛡️ 보호막 ${v}개`,
    pierce:        () => `🔷 관통`,
  };
  return Object.entries(c.bonuses||{}).map(([k,v]) => {
    const label = LABELS[k] ? LABELS[k](v) : `${k} ${v>0?'+':''}${v}`;
    const isNeg = typeof v === 'number' && v < 0;
    const st = isNeg
      ? 'background:rgba(255,80,80,0.12);border:1px solid rgba(255,80,80,0.3);color:#ff8888;'
      : `background:${theme.bg};border:1px solid ${theme.color}44;color:${theme.color};`;
    return `<span class="char-bonus-pill" style="${st}">${label}</span>`;
  }).join('');
}

// ── 공용 Long-press 헬퍼 ──
// el 에 long-press 이벤트를 붙이고, onFire 콜백을 호출한다.
// feedbackEl: 실제 박스 피드백을 보여줄 요소 (null 이면 el 자신)
// 길게 누른 뒤 click 이벤트가 오발되지 않도록 캡처 단계에서 차단한다.
function _attachLongPress(el, onFire, feedbackEl) {
  let _t = null, _moved = false, _fired = false, _sx = 0, _sy = 0;
  const _fb = feedbackEl || el;

  function _start(cx, cy) {
    _moved = false; _fired = false; _sx = cx; _sy = cy;
    _fb.style.transition = 'box-shadow 0.52s ease';
    _fb.style.boxShadow  = '0 0 0 0 rgba(255,255,255,0.0)';
    requestAnimationFrame(() => { _fb.style.boxShadow = '0 0 0 7px rgba(255,255,255,0.20)'; });
    _t = setTimeout(() => {
      if (!_moved) {
        _fired = true;
        _fb.style.boxShadow = ''; _fb.style.transition = '';
        onFire();
      }
    }, 520);
  }
  function _cancel() {
    clearTimeout(_t); _t = null;
    _fb.style.boxShadow = ''; _fb.style.transition = '';
  }

  el.addEventListener('mousedown', e => { if (e.button === 0) _start(e.clientX, e.clientY); });
  el.addEventListener('mousemove', e => {
    if (_t && (Math.abs(e.clientX-_sx)>8 || Math.abs(e.clientY-_sy)>8)) { _moved=true; _cancel(); }
  });
  el.addEventListener('mouseup',    _cancel);
  el.addEventListener('mouseleave', _cancel);
  // 길게 눌렀을 때 이후에 발생하는 click을 캡처 단계에서 차단
  el.addEventListener('click', e => { if (_fired) { _fired=false; e.stopPropagation(); e.preventDefault(); } }, true);

  el.addEventListener('touchstart', e => { const t=e.touches[0]; _start(t.clientX, t.clientY); }, {passive:true});
  el.addEventListener('touchmove', e => {
    const t=e.touches[0];
    if (_t && (Math.abs(t.clientX-_sx)>8 || Math.abs(t.clientY-_sy)>8)) { _moved=true; _cancel(); }
  }, {passive:true});
  el.addEventListener('touchend',   _cancel);
  el.addEventListener('touchcancel',_cancel);
}

// ── 토글 함수 (버튼 onclick & 길게 클릭 공용) ──
function _toggleCharDetail(info) {
  if (!info) info = document.getElementById('charInfo');
  if (!info) return;
  info._detailed = !info._detailed;
  const cur = info._previewChar || gs.selectedChar;
  if (!cur || !cur.unlocked) return; // 잠금 캐릭터는 상세 불가
  info.innerHTML = buildCharProfile(cur, !!info._detailed);
}

// ── 외부 진입점: detailed 여부에 따라 빌더 선택 ──
function buildCharProfile(c, detailed = false) {
  if (!c.unlocked) return _buildLocked(c);
  return detailed ? _buildDetail(c) : _buildFun(c);
}

function initStartScreen() {
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  const CARD_COLORS = { penguin:'#4a9eff', fox:'#ff8840', rabbit:'#4ecf7a', cat:'#ff55bb', bear:'#c07840' };
  const CHAR_TYPES  = { penguin:'균형형', fox:'전략가', rabbit:'돌격자', cat:'고속사수', bear:'요새형' };
  CHARACTERS.forEach(c => {
    const cc = CARD_COLORS[c.id] || '#c9a84c';
    const isSelected = gs.selectedChar.id === c.id;
    const d = document.createElement('div');
    d.className = 'char-card' + (c.unlocked?'':' locked') + (isSelected?' selected':'');
    // 선택된 카드는 캐릭터 테마 색상 강조
    if (isSelected && c.unlocked) {
      d.style.cssText = `border-color:${cc};background:${cc}18;box-shadow:0 0 18px ${cc}40;`;
    }
    const typeTag = `<div style="font-size:9px;color:${cc};font-weight:700;margin-top:3px;opacity:0.85;">${CHAR_TYPES[c.id]||''}</div>`;
    const lockInfo = (!c.unlocked && c.unlockKills)
      ? `<div style="margin-top:5px;font-size:9px;color:#c9a84c;line-height:1.4;">${meta.totalKills}/${c.unlockKills}</div>`
      : '';
    d.innerHTML = `<span class="char-emoji">${c.emoji}</span><div class="char-name" style="color:${c.unlocked?cc:'#888'}">${c.name}</div>${typeTag}${c.unlocked?'':'<span class="lock-badge">🔒</span>'}${lockInfo}`;
    // ── 클릭: 캐릭터 선택 + 바로 상세 정보 표시 ──
    if (c.unlocked) {
      d.onclick = () => {
        gs.selectedChar = c;
        // 카드 선택 강조
        document.querySelectorAll('.char-card').forEach(el => {
          el.style.borderColor=''; el.style.background=''; el.style.boxShadow='';
        });
        d.style.cssText = `border-color:${cc};background:${cc}18;box-shadow:0 0 18px ${cc}40;`;
        // 상세 정보 즉시 표시
        const inf = document.getElementById('charInfo');
        if (inf) { inf._previewChar = null; inf._detailed = true; inf.innerHTML = buildCharProfile(c, true); }
      };
    } else {
      d.onclick = () => {
        document.querySelectorAll('.char-card').forEach(el => el.style.outline = '');
        d.style.outline = `2px solid ${cc}66`;
        const inf = document.getElementById('charInfo');
        inf._previewChar = c; inf._detailed = false;
        inf.innerHTML = buildCharProfile(c, false);
      };
    }
    grid.appendChild(d);
  });
  const info = document.getElementById('charInfo');
  info._detailed = false;
  info._previewChar = null;
  info.innerHTML = buildCharProfile(gs.selectedChar);
  const ascLbl = document.getElementById('ascLabel');
  if (ascLbl) {
    if (meta.maxAscension >= 1) {
      ascLbl.textContent = '☠️ 초월 ' + (meta.ascension||0) + ' / ' + meta.maxAscension;
    } else {
      ascLbl.textContent = '';
    }
  }
  const best = document.getElementById('bestRow');
  if (bestRecord.act > 0) {
    best.style.display = 'block';
    const mm=String(Math.floor(bestRecord.time/60)).padStart(2,'0'), ss=String(bestRecord.time%60).padStart(2,'0');
    best.innerHTML = `🏆 최고 기록 · ACT ${bestRecord.act} · 처치 ${bestRecord.kills} · ${mm}:${ss}`;
  }
}

document.getElementById('startBtn').onclick = () => {
  audioCtx.resume();
  showAscensionSelector(() => {
    Audio.startBGM('map');
    startNewRun();
  });
};

function showBuildThemeSelector(onSelect) {
  // 선택된 캐릭터와 어울리는 테마 우선 + 나머지 섞어서 3개 추출
  const charId = gs.selectedChar?.id;
  const matched  = BUILD_THEMES.filter(t => t.chars.includes(charId));
  const unmatched = BUILD_THEMES.filter(t => !t.chars.includes(charId));
  // 매칭 1~2개 + 나머지로 총 3개
  const pool = [...rndShuffle(matched).slice(0,2), ...rndShuffle(unmatched)].slice(0,3);

  const ov = document.createElement('div');
  ov.id = '_buildThemeOv';
  ov.style.cssText = `position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#070e1c,#0d1a2e);overflow:hidden;`;

  const cardHTML = pool.map((t, i) => `
    <div class="_bt-card" data-idx="${i}" style="
      flex:1;min-height:0;border-radius:14px;padding:14px 14px;cursor:pointer;
      background:rgba(255,255,255,0.04);border:1px solid ${t.color}28;
      transition:all .18s;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;">
      <!-- 왼쪽 컬러 바 -->
      <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,${t.color},${t.color}66);border-radius:14px 0 0 14px;"></div>
      <div style="padding-left:10px;">
        <!-- 타이틀 행 -->
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <span style="font-size:26px;line-height:1;filter:drop-shadow(0 2px 8px ${t.color}90);flex-shrink:0;">${t.emoji}</span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:900;color:#fff;line-height:1.1;">${t.name}</div>
            <div style="font-size:10px;font-weight:700;color:${t.color};opacity:.85;margin-top:1px;">${t.tag}</div>
          </div>
          <div style="width:20px;height:20px;border-radius:50%;border:1.5px solid ${t.color}44;
            display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <div style="width:7px;height:7px;border-radius:50%;background:${t.color};opacity:0;transition:opacity .15s;" class="_bt-dot"></div>
          </div>
        </div>
        <!-- 설명 (한 줄) -->
        <div style="font-size:11px;color:rgba(255,255,255,0.42);margin-bottom:7px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.desc}</div>
        <!-- 키워드 + 보너스 한 줄 -->
        <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
          ${t.keys.map(k=>`<span style="padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;
            background:${t.color}16;border:1px solid ${t.color}38;color:${t.color}bb;white-space:nowrap;">${k}</span>`).join('')}
          <span style="margin-left:auto;font-size:9px;font-weight:800;color:${t.color};white-space:nowrap;opacity:.9;">+보너스</span>
        </div>
        <!-- 시작 보너스 (선택시만 강조 — 항상 표시) -->
        <div style="margin-top:6px;font-size:10px;color:rgba(255,255,255,0.35);">${t.bonusDesc}</div>
      </div>
    </div>`).join('');

  ov.innerHTML = `
    <style>
      ._bt-card:active { transform:scale(0.98); }
      ._bt-card.selected { border-color:var(--btc) !important; background:var(--btbg) !important; }
      ._bt-card.selected ._bt-dot { opacity:1 !important; }
      ._bt-card.selected > div > div:last-child { color:rgba(255,255,255,0.6) !important; }
    </style>

    <!-- 헤더 (compact) -->
    <div style="padding:20px 20px 12px;text-align:center;flex-shrink:0;">
      <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:2.5px;margin-bottom:5px;">NEW RUN</div>
      <div style="font-size:19px;font-weight:900;color:#fff;margin-bottom:3px;">빌드를 골라봐요</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.35);">카드 출현율이 테마 방향으로 기울어져요</div>
    </div>

    <!-- 카드 3장 (균등 분배) -->
    <div style="flex:1;display:flex;flex-direction:column;gap:8px;padding:0 14px;min-height:0;">
      ${cardHTML}
    </div>

    <!-- 버튼 영역 -->
    <div style="padding:12px 14px 28px;display:flex;flex-direction:column;gap:7px;flex-shrink:0;">
      <button id="_btConfirm" style="width:100%;padding:13px;border:none;border-radius:13px;
        font-size:15px;font-weight:900;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
        background:#2a3a4a;color:rgba(255,255,255,0.3);transition:all .2s;letter-spacing:.3px;" disabled>
        ✔ 이 빌드로 시작!
      </button>
      <button id="_btSkip" style="width:100%;padding:9px;border:none;border-radius:12px;
        font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
        background:transparent;color:rgba(255,255,255,0.28);letter-spacing:.2px;">
        건너뛰기 (테마 없이 시작)
      </button>
    </div>`;

  document.body.appendChild(ov);

  // 카드 선택 인터랙션
  let selectedIdx = -1;
  ov.querySelectorAll('._bt-card').forEach((card, i) => {
    const t = pool[i];
    card.style.setProperty('--btc', t.color);
    card.style.setProperty('--btbg', `${t.color}14`);
    card.addEventListener('click', () => {
      ov.querySelectorAll('._bt-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedIdx = i;
      const btn = document.getElementById('_btConfirm');
      btn.disabled = false;
      btn.style.background = `linear-gradient(135deg,${t.color}dd,${t.color}99)`;
      btn.style.color = '#fff';
      btn.style.boxShadow = `0 3px 0 ${t.color}55`;
    });
  });

  document.getElementById('_btConfirm').addEventListener('click', () => {
    if (selectedIdx < 0) return;
    gs.buildTheme = pool[selectedIdx];
    ov.remove();
    onSelect();
  });
  document.getElementById('_btSkip').addEventListener('click', () => {
    gs.buildTheme = null;
    ov.remove();
    onSelect();
  });
}

// ── 상점 재고 생성 (노드 진입 시 1회 고정) ──
function generateShopInventory() {
  const base = SHOP_ITEMS.filter(i => i.id !== 'shop_card');
  const shuffled = rndShuffle(base);
  const regular = shuffled.slice(0, 3).map(i => i.id);
  const deal = shuffled[3] ? shuffled[3].id : shuffled[0].id; // 특가 아이템
  // 유물 2종 선택
  const ownedIds = new Set((gs.relics || []).map(r => r.id));
  const relicIds = rndShuffle(RELIC_POOL.filter(r => !ownedIds.has(r.id))).slice(0, 2).map(r => r.id);
  return { regular, deal, relicIds };
}

function startNewRun() {
  gs.act = 1;
  gs.currentLayer = 0;
  gs.currentNodeId = null;
  gs.chosenPaths = new Set();
  gs.relics = [];
  gs.elitePowers = [];
  gs._shopInventory = null;
  gs._upgradedCards = new Set();
  gs._critDmgUpgraded = false;
  gs._dashCdReduced = false;
  gs._shieldHealBonus = 0;
  gs._goldShotBonus = 0;
  gs._freezeDurBonus = 0;
  gs._curseBloodPact = false;
  gs._curseDemonEye = false;
  gs._eliteVampire = 0;
  gs._totalDmgDealt = 0;
  gs._totalDmgTaken = 0;
  gs._totalGoldEarned = 0;
  gs._noDmgClears = 0;
  gs._maxCombo = 0;
  gs._perfectWaves = 0;
  gs._runStartTime = Date.now();
  gs.gold = 100;
  gs.deck = [];
  gs.shieldCount = 0;
  gs.totalKills = 0;
  gs.totalTime = 0;
  gs.bossesDefeated = 0;
  gs.curses = []; // 챌린지 시스템 제거 — 항상 빈 배열
  const p = gs.player;
  const c = gs.selectedChar;
  p.x=300; p.y=300; p.size=20; p.speed=3; p.hp=c.hp; p.maxHp=c.hp; p.kills=0; p.invincible=0;
  const s = gs.skills;
  for (const k in s) { if (typeof s[k]==='boolean') s[k]=false; else s[k]=0; }
  const b = c.bonuses||{};
  if (b.speed)        p.speed += b.speed;
  if (b.bulletSpeed)  s.bulletSpeed += b.bulletSpeed;
  if (b.bulletCount)  s.bulletCount += b.bulletCount;
  if (b.fireRateBonus) s.fireRateBonus = (s.fireRateBonus||0) + b.fireRateBonus;
  if (b.aoe)          s.aoe += b.aoe;
  if (b.lightning)    s.lightning += b.lightning;
  if (b.sword)        s.sword += b.sword;
  if (b.dash)         s.dash += b.dash;
  if (b.regen)        s.regen += b.regen;
  if (b.shield)       { s.shield += b.shield; gs.shieldCount += b.shield; }
  if (b.pierce)       s.piercing = true;
  if (b.multiAoe)     s.multiAoe = (s.multiAoe||0) + b.multiAoe;
  // ── 빌드 테마 시작 보너스 적용 ──
  if (gs.buildTheme?.startBonus) {
    gs.buildTheme.startBonus(s, p, gs);
    showToast(`${gs.buildTheme.emoji} ${gs.buildTheme.name} — ${gs.buildTheme.bonusDesc}`, 2500);
  }
  gs.map = generateMap(gs.act);
  Object.keys(gs.skills).filter(k=>k.startsWith('_syn')).forEach(k=>delete gs.skills[k]);
  applyEquipment();
  // 초월 배율 계산 및 저장
  gs.ascension = meta.ascension || 0;
  gs.ascMult = calcAscMultipliers(gs.ascension);
  // 초월: 시작 HP 패널티
  if (gs.ascMult.startHpPen > 0) {
    p.maxHp = Math.max(20, p.maxHp - gs.ascMult.startHpPen);
    p.hp = p.maxHp;
  }
  // 저주 초기 효과 적용
  showMapScreen();
}

const mapCanvas = document.getElementById('mapCanvas');

// ── 빌드 테마 배지 (맵·전투 중 상단 고정) ──
function _updateBuildBadge() {
  let badge = document.getElementById('_buildBadge');
  const t = gs.buildTheme;
  if (!t) { if (badge) badge.remove(); return; }
  if (badge) badge.style.opacity = '1'; // 전투 후 복원
  if (!badge) {
    badge = document.createElement('div');
    badge.id = '_buildBadge';
    badge.style.cssText = `position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:8000;
      pointer-events:none;transition:opacity .3s;opacity:1;`;
    document.body.appendChild(badge);
  }
  badge.innerHTML = `<div style="display:inline-flex;align-items:center;gap:5px;
    background:rgba(8,14,28,0.82);border:1px solid ${t.color}55;border-radius:20px;
    padding:4px 11px 4px 8px;backdrop-filter:blur(6px);
    box-shadow:0 2px 12px rgba(0,0,0,0.4),0 0 0 1px rgba(255,255,255,0.04);">
    <span style="font-size:14px;line-height:1">${t.emoji}</span>
    <span style="font-size:11px;font-weight:800;color:${t.color};letter-spacing:.3px">${t.name}</span>
  </div>`;
}

let mapAnimId = null;
function showMapScreen() {
  showScreen('mapScreen');
  _updateBuildBadge();
  document.getElementById('mapFloorLabel').textContent = `ACT ${gs.act}`;
  updateMapGold();
  audioCtx.resume();
  Audio.startBGM('map');
  saveRun(); // ← 맵 화면 복귀 시 자동 저장
  // 펄스 애니메이션용 루프
  if (mapAnimId) cancelAnimationFrame(mapAnimId);
  function mapLoop() {
    if (gs.screen !== 'mapScreen') return;
    drawMap();
    mapAnimId = requestAnimationFrame(mapLoop);
  }
  mapLoop();
}

function updateMapGold() {
  document.getElementById('mapGold').textContent = `🪙 ${gs.gold}`;
  document.getElementById('mapHpDisplay').textContent = `❤️ ${Math.ceil(gs.player.hp)}/${gs.player.maxHp}`;
  // 엘리트 특수능력 버튼
  const epBtn = document.getElementById('elitePowerBtn');
  const epCount = document.getElementById('elitePowerCount');
  const powers = gs.elitePowers || [];
  if (epBtn) { epBtn.style.display = powers.length > 0 ? 'inline-block' : 'none'; }
  if (epCount) epCount.textContent = powers.length;
  // 유물 아이콘 표시
  let relicEl = document.getElementById('mapRelics');
  if (!relicEl) {
    relicEl = document.createElement('div');
    relicEl.id = 'mapRelics';
    relicEl.style.cssText='display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:300px;';
    document.querySelector('#mapScreen .map-header').appendChild(relicEl);
  }
  relicEl.innerHTML = '';
  gs.relics.forEach(r => {
    const span = document.createElement('span');
    span.style.cssText = `font-size:22px;cursor:pointer;display:inline-block;
      filter:drop-shadow(0 0 5px ${r.color});transition:transform 0.15s;`;
    span.textContent = r.emoji;

    // 호버 툴팁
    span.addEventListener('mouseenter', () => {
      let tip = document.getElementById('_relicTip');
      if (!tip) {
        tip = document.createElement('div');
        tip.id = '_relicTip';
        tip.style.cssText = `position:fixed;z-index:9998;pointer-events:none;max-width:200px;
          background:rgba(8,14,32,0.97);border-radius:10px;padding:9px 12px;
          font-family:'Jua','Noto Sans KR',sans-serif;
          box-shadow:0 4px 24px rgba(0,0,0,0.7);`;
        document.body.appendChild(tip);
      }
      tip.style.borderLeft = `3px solid ${r.color}`;
      tip.innerHTML = `<div style="font-size:12px;font-weight:700;color:${r.color};margin-bottom:4px;">${r.emoji} ${r.name}</div>
        <div style="font-size:11px;color:#8aa0b8;line-height:1.5;">${r.desc}</div>`;
      const rect = span.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = Math.min(rect.right + 8, window.innerWidth - 215) + 'px';
      tip.style.top  = Math.max(4, rect.bottom + 4) + 'px';
      span.style.transform = 'scale(1.25)';
    });
    span.addEventListener('mouseleave', () => {
      const tip = document.getElementById('_relicTip');
      if (tip) tip.style.display = 'none';
      span.style.transform = '';
    });

    // 클릭 → 상세 모달
    span.addEventListener('click', () => {
      document.getElementById('_relicTip')?.remove();
      const existing = document.getElementById('_relicModal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.id = '_relicModal';
      modal.style.cssText = `position:fixed;inset:0;z-index:9999;
        background:rgba(0,0,0,0.72);display:flex;align-items:center;justify-content:center;
        opacity:0;transition:opacity 0.2s;`;
      modal.innerHTML = `
        <div style="background:linear-gradient(160deg,#0d1526,#111e38);
          border:2px solid ${r.color}55;border-radius:22px;
          padding:32px 36px;max-width:300px;width:88%;text-align:center;
          box-shadow:0 0 50px ${r.color}22,0 16px 60px rgba(0,0,0,0.8);">
          <div style="font-size:72px;margin-bottom:14px;
            filter:drop-shadow(0 0 24px ${r.color});">${r.emoji}</div>
          <div style="font-family:'Cinzel',serif;font-size:20px;color:${r.color};
            font-weight:700;margin-bottom:4px;">${r.name}</div>
          <div style="font-size:10px;color:rgba(201,168,76,0.5);letter-spacing:3px;
            text-transform:uppercase;margin-bottom:16px;">${r.rarity || 'ARTIFACT'}</div>
          <div style="font-size:13px;color:#c8d8e8;line-height:1.7;
            border-top:1px solid rgba(255,255,255,0.07);padding-top:14px;">${r.desc}</div>
          <button id="_relicModalClose"
            style="margin-top:20px;padding:8px 28px;border-radius:10px;
            border:1px solid ${r.color}44;background:${r.color}11;
            color:${r.color};cursor:pointer;font-family:'Jua',sans-serif;font-size:13px;
            transition:all 0.15s;">닫기</button>
        </div>`;
      document.body.appendChild(modal);
      requestAnimationFrame(() => modal.style.opacity = '1');
      const close = () => { modal.style.opacity='0'; setTimeout(()=>modal.remove(),200); };
      modal.querySelector('#_relicModalClose').onclick = close;
      modal.addEventListener('click', e => { if(e.target===modal) close(); });
    });

    relicEl.appendChild(span);
  });

  // 저주 표시 제거 (챌린지 시스템 삭제됨)
  document.getElementById('mapCurses')?.remove();
}

const NODE_W = 54, NODE_H = 54;
let nodePositions = {};
let hoverNodeId = null;
let _starCache = null; // 별 위치 캐시 (P3)

function drawMap() {
  const MW = mapCanvas.width, MH = mapCanvas.height;
  mctx.clearRect(0, 0, MW, MH);

  const act = gs.act;
  const theme = ACT_THEMES[act-1] || ACT_THEMES[0];
  const t = Date.now();

  // ═══════════════════════════════════
  //  1. 배경 — 슬더스2 스타일 (깊은 우주적 신비감)
  // ═══════════════════════════════════
  // 기본 깊은 네이비 그라데이션 (ACT별 미묘한 색조 차이)
  const bgBase = mctx.createLinearGradient(0,0,0,MH);
  if (act===1) {
    bgBase.addColorStop(0,'#080c18'); bgBase.addColorStop(0.5,'#0a1020');
    bgBase.addColorStop(1,'#060c14');
  } else if (act===2) {
    bgBase.addColorStop(0,'#070a18'); bgBase.addColorStop(0.5,'#090e22');
    bgBase.addColorStop(1,'#060810');
  } else {
    bgBase.addColorStop(0,'#100810'); bgBase.addColorStop(0.5,'#140a0c');
    bgBase.addColorStop(1,'#0c0608');
  }
  mctx.fillStyle = bgBase; mctx.fillRect(0,0,MW,MH);

  // 별 배경 (고정된 위치 — seed 기반)
  mctx.save();
  if (!_starCache) {
    _starCache = [];
    for(let i=0;i<120;i++){
      _starCache.push({
        sx:(Math.sin(i*127.1)*0.5+0.5)*MW,
        sy:(Math.cos(i*311.7)*0.5+0.5)*MH,
        sr:0.4+((i*73)%100)/100*1.2,
        phase:i*0.7, alphaBase:0.4+((i*53)%100)/200
      });
    }
  }
  _starCache.forEach(star => {
    const twinkle=0.4+0.6*Math.abs(Math.sin(t/1200+star.phase));
    mctx.globalAlpha=twinkle*star.alphaBase;
    mctx.fillStyle='#ffffff';
    mctx.beginPath(); mctx.arc(star.sx,star.sy,star.sr,0,Math.PI*2); mctx.fill();
  });
  // 밝은 별 몇 개 (십자 모양)
  [[MW*0.15,MH*0.2],[MW*0.7,MH*0.15],[MW*0.45,MH*0.35],[MW*0.85,MH*0.4]].forEach(([sx,sy],i)=>{
    const tw=0.5+0.5*Math.abs(Math.sin(t/800+i));
    mctx.globalAlpha=tw*0.7; mctx.fillStyle='#e8f0ff';
    mctx.beginPath(); mctx.arc(sx,sy,1.5,0,Math.PI*2); mctx.fill();
    mctx.globalAlpha=tw*0.3; mctx.strokeStyle='#c8d8ff'; mctx.lineWidth=0.8;
    mctx.beginPath(); mctx.moveTo(sx-8,sy); mctx.lineTo(sx+8,sy);
    mctx.moveTo(sx,sy-8); mctx.lineTo(sx,sy+8); mctx.stroke();
  });
  mctx.restore();

  // 중앙 성운 글로우 (ACT별 색상)
  mctx.save();
  const nebulaColors = {1:'rgba(80,120,200,0.06)',2:'rgba(100,160,220,0.07)',3:'rgba(180,80,100,0.07)'};
  const nebula1=mctx.createRadialGradient(MW*0.3,MH*0.4,0,MW*0.3,MH*0.4,MW*0.4);
  nebula1.addColorStop(0,nebulaColors[act]||nebulaColors[1]); nebula1.addColorStop(1,'transparent');
  mctx.fillStyle=nebula1; mctx.fillRect(0,0,MW,MH);
  const nebula2=mctx.createRadialGradient(MW*0.75,MH*0.6,0,MW*0.75,MH*0.6,MW*0.3);
  nebula2.addColorStop(0,nebulaColors[act]||nebulaColors[1]); nebula2.addColorStop(1,'transparent');
  mctx.fillStyle=nebula2; mctx.fillRect(0,0,MW,MH);
  mctx.restore();

  // 하단 안개 (지면 느낌)
  mctx.save();
  const fogGrad=mctx.createLinearGradient(0,MH*0.75,0,MH);
  fogGrad.addColorStop(0,'transparent');
  fogGrad.addColorStop(1, act===1?'rgba(20,40,30,0.35)':act===2?'rgba(15,25,50,0.35)':'rgba(40,15,15,0.35)');
  mctx.fillStyle=fogGrad; mctx.fillRect(0,0,MW,MH);
  mctx.restore();

  // ACT 테마 코너 빛 (은은하게)
  mctx.save();
  const c1=mctx.createRadialGradient(0,MH,10,0,MH,MW*0.35);
  c1.addColorStop(0,theme.color+'20'); c1.addColorStop(1,'transparent');
  mctx.fillStyle=c1; mctx.fillRect(0,0,MW,MH);
  const c2=mctx.createRadialGradient(MW,0,10,MW,0,MW*0.28);
  c2.addColorStop(0,theme.color+'14'); c2.addColorStop(1,'transparent');
  mctx.fillStyle=c2; mctx.fillRect(0,0,MW,MH);
  mctx.restore();

  // ═══════════════════════════════════
  //  2. 레이어 구분선 + 층수 표시
  // ═══════════════════════════════════
  const layers = gs.map;
  const totalL = layers.length;
  const padX = 80, totalW = MW - padX*2;
  nodePositions = {};

  // 노드 위치 계산
  layers.forEach((row, li) => {
    const x = padX + (li / (totalL-1)) * totalW;
    row.forEach((node, ni) => {
      const step = MH / (row.length + 1);
      const y = step * (ni+1);
      nodePositions[node.id] = { x, y, node };
    });
  });

  // 레이어 수직 구분선 (은은하게)
  mctx.save();
  layers.forEach((row, li) => {
    if (li===0 || li===totalL-1) return;
    const x = padX + (li / (totalL-1)) * totalW;
    const isBossLayer = li === totalL-1;
    mctx.globalAlpha = 0.07;
    mctx.strokeStyle = theme.color;
    mctx.lineWidth = 1;
    mctx.setLineDash([3,8]);
    mctx.beginPath(); mctx.moveTo(x,20); mctx.lineTo(x,MH-30); mctx.stroke();
  });
  mctx.setLineDash([]);
  mctx.restore();

  // 층수 레이블 (상단)
  mctx.save();
  layers.forEach((row, li) => {
    const x = padX + (li / (totalL-1)) * totalW;
    const isBoss = li === totalL-1;
    const layerDone = row.every(n => n.visited);
    mctx.textAlign='center'; mctx.textBaseline='top';

    if (isBoss) {
      // BOSS 레이블 — 화려하게
      mctx.font = 'bold 11px "Cinzel",serif';
      mctx.fillStyle = layerDone ? '#5a6a7a' : '#c9a84c';
      mctx.globalAlpha = layerDone ? 0.4 : 0.9;
      if (!layerDone) { mctx.shadowColor='#c9a84c'; mctx.shadowBlur=8; }
      mctx.fillText('BOSS', x, 8);
      mctx.shadowBlur=0;
    } else {
      mctx.font = 'bold 10px Arial';
      mctx.fillStyle = layerDone ? '#3a5a4a' : theme.color+'aa';
      mctx.globalAlpha = layerDone ? 0.5 : 0.75;
      mctx.fillText(`${li+1}F`, x, 8);
    }
  });
  mctx.restore();

  // ═══════════════════════════════════
  //  3. 경로 — 곡선 + 두께 변화
  // ═══════════════════════════════════
  layers.forEach(row => {
    row.forEach(node => {
      if (!node.paths) return;
      const from = nodePositions[node.id];
      node.paths.forEach(toId => {
        const to = nodePositions[toId];
        if (!from || !to) return;

        const isChosen = gs.chosenPaths.has(node.id + '->' + toId);
        const siblingChosen = !isChosen && node.visited &&
          node.paths.some(tid => gs.chosenPaths.has(node.id + '->' + tid));

        mctx.save();
        mctx.setLineDash([]);

        if (isChosen) {
          // ── 지나온 경로: 금색 글로우 실선 ──
          // 외곽 글로우
          mctx.globalAlpha=0.35; mctx.strokeStyle='#c9a84c';
          mctx.lineWidth=7; mctx.shadowColor='#c9a84c'; mctx.shadowBlur=12;
          mctx.beginPath();
          const mx1=(from.x+to.x)/2, my1=(from.y+to.y)/2;
          mctx.moveTo(from.x,from.y); mctx.quadraticCurveTo(mx1,my1-(to.x-from.x)*0.1,to.x,to.y);
          mctx.stroke();
          // 중심선
          mctx.globalAlpha=1; mctx.strokeStyle='#f0d080';
          mctx.lineWidth=2.5; mctx.shadowBlur=0;
          mctx.beginPath();
          mctx.moveTo(from.x,from.y); mctx.quadraticCurveTo(mx1,my1-(to.x-from.x)*0.1,to.x,to.y);
          mctx.stroke();
          // 흐르는 점 효과
          const prog = ((t/1200)%1);
          const cx = from.x+(to.x-from.x)*prog, cy = from.y+(to.y-from.y)*prog;
          mctx.globalAlpha=0.8; mctx.fillStyle='#fff8c0';
          mctx.shadowColor='#fff'; mctx.shadowBlur=6;
          mctx.beginPath(); mctx.arc(cx,cy,3,0,Math.PI*2); mctx.fill();
          mctx.shadowBlur=0;

        } else if (siblingChosen) {
          // ── 잠긴 경로 ──
          mctx.globalAlpha=0.08; mctx.strokeStyle='#2a3a5a';
          mctx.lineWidth=1; mctx.setLineDash([2,8]);
          mctx.beginPath(); mctx.moveTo(from.x,from.y); mctx.lineTo(to.x,to.y); mctx.stroke();

        } else {
          // ── 일반 경로: 곡선 점선 ──
          const toNode = gs.map.flat().find(n=>n.id===toId);
          const canReach = isNodeAccessible(toNode);
          const mx2=(from.x+to.x)/2, my2=(from.y+to.y)/2 - (to.x-from.x)*0.08;

          if (canReach) {
            // 접근 가능 — 밝은 점선
            mctx.globalAlpha=0.5; mctx.strokeStyle=theme.color;
            mctx.lineWidth=1.8; mctx.setLineDash([6,5]);
            mctx.shadowColor=theme.color; mctx.shadowBlur=4;
          } else {
            // 아직 먼 경로 — 희미하지만 모두 표시 (루트 사전 파악 가능)
            mctx.globalAlpha=0.28; mctx.strokeStyle='#4a6a9a';
            mctx.lineWidth=1.2; mctx.setLineDash([5,6]);
          }
          mctx.beginPath(); mctx.moveTo(from.x,from.y);
          mctx.quadraticCurveTo(mx2,my2,to.x,to.y); mctx.stroke();
          mctx.shadowBlur=0;
        }
        mctx.restore();
      });
    });
  });

  // ═══════════════════════════════════
  //  4. 노드 — 카드 스타일
  // ═══════════════════════════════════
  Object.values(nodePositions).forEach(({ x, y, node }) => {
    const nt = NODE_TYPES[node.type];
    const accessible = isNodeAccessible(node);
    const visited = node.visited;
    const isCurrent = node.id === gs.currentNodeId;
    const isHover = node.id === hoverNodeId && accessible;
    const isBossNode = node.type === 'boss';

    mctx.save();

    const NW = isBossNode ? 64 : isHover ? 58 : 52;
    const NH = isBossNode ? 76 : isHover ? 70 : 62;
    const NR = 12; // 모서리 둥글기

    // ── 상태별 알파 ──
    mctx.globalAlpha = visited ? 0.38 : accessible ? 1 : 0.42;

    // ── 현재 노드 펄스 링 ──
    if (isCurrent) {
      const pulse = 0.4 + 0.6*Math.abs(Math.sin(t/350));
      mctx.save();
      mctx.globalAlpha = pulse * 0.7;
      mctx.strokeStyle = nt.color; mctx.lineWidth = 3;
      mctx.shadowColor = nt.color; mctx.shadowBlur = 20;
      _roundRect(mctx, x-NW/2-6, y-NH/2-6, NW+12, NH+12, NR+4);
      mctx.stroke(); mctx.shadowBlur=0;
      mctx.restore();
    }

    // ── 호버 글로우 ──
    if (isHover && accessible) {
      mctx.shadowColor = nt.color; mctx.shadowBlur = 22;
    }

    // ── 카드 배경 ──
    // 그림자
    mctx.save();
    mctx.globalAlpha *= 0.5;
    mctx.fillStyle = 'rgba(0,0,0,0.6)';
    _roundRect(mctx, x-NW/2+3, y-NH/2+4, NW, NH, NR);
    mctx.fill();
    mctx.restore();

    // 카드 본체
    let cardFill;
    if (visited) {
      cardFill = '#0a0e1c';
    } else if (isCurrent) {
      cardFill = mctx.createLinearGradient(x,y-NH/2,x,y+NH/2);
      cardFill.addColorStop(0,'#1a2a50'); cardFill.addColorStop(1,'#0e1830');
    } else if (accessible) {
      cardFill = mctx.createLinearGradient(x,y-NH/2,x,y+NH/2);
      cardFill.addColorStop(0,'#141e35'); cardFill.addColorStop(1,'#0c1428');
    } else {
      cardFill = '#08101e';
    }
    mctx.fillStyle = cardFill;
    _roundRect(mctx, x-NW/2, y-NH/2, NW, NH, NR);
    mctx.fill();

    // 카드 상단 색상 띠
    if (!visited) {
      mctx.save();
      mctx.globalAlpha *= (accessible ? 0.85 : 0.35);
      const stripH = 5;
      mctx.fillStyle = nt.color;
      mctx.shadowColor = accessible ? nt.color : 'transparent';
      mctx.shadowBlur = accessible ? 8 : 0;
      // 상단 모서리만 둥글게
      mctx.beginPath();
      mctx.moveTo(x-NW/2+NR,y-NH/2);
      mctx.lineTo(x+NW/2-NR,y-NH/2);
      mctx.quadraticCurveTo(x+NW/2,y-NH/2,x+NW/2,y-NH/2+NR);
      mctx.lineTo(x+NW/2,y-NH/2+stripH);
      mctx.lineTo(x-NW/2,y-NH/2+stripH);
      mctx.lineTo(x-NW/2,y-NH/2+NR);
      mctx.quadraticCurveTo(x-NW/2,y-NH/2,x-NW/2+NR,y-NH/2);
      mctx.closePath(); mctx.fill();
      mctx.shadowBlur=0;
      mctx.restore();
    }

    // 카드 테두리
    mctx.strokeStyle = visited ? '#1a2a3a' : accessible ? nt.color : '#1a2a4a';
    mctx.lineWidth = isCurrent ? 2.5 : accessible ? 1.8 : 1;
    _roundRect(mctx, x-NW/2, y-NH/2, NW, NH, NR);
    mctx.stroke();
    mctx.shadowBlur=0;

    // ── 아이콘 (이모지) ──
    const emojiSize = isBossNode ? 28 : isHover ? 24 : 22;
    mctx.font = `${emojiSize}px serif`;
    mctx.textAlign='center'; mctx.textBaseline='middle';
    mctx.globalAlpha = visited ? 0.35 : accessible ? 1 : 0.5;
    if (accessible && !visited) {
      mctx.shadowColor = nt.color; mctx.shadowBlur = 6;
    }
    mctx.fillText(nt.emoji, x, y - 4);
    mctx.shadowBlur=0;

    // ── 타입 레이블 ──
    mctx.font = `bold ${isBossNode?10:8}px "Noto Sans KR",Arial`;
    mctx.textAlign='center'; mctx.textBaseline='alphabetic';
    const labelColor = visited ? '#3a5a4a' : accessible ? nt.color : '#4a6a8a';
    mctx.fillStyle = labelColor;
    mctx.globalAlpha = visited ? 0.4 : accessible ? 0.9 : 0.5;
    mctx.fillText(nt.label, x, y+NH/2-6);

    // ── 방문 완료 체크 ──
    if (visited) {
      mctx.font='14px serif'; mctx.globalAlpha=0.45;
      mctx.fillText('✓', x+NW/2-10, y-NH/2+16);
    }

    // ── 보스 노드 특수 장식 ──
    if (isBossNode && !visited) {
      const pulse2 = 0.3+0.7*Math.abs(Math.sin(t/500));
      mctx.save();
      mctx.globalAlpha=(accessible?0.6:0.15)*pulse2;
      mctx.strokeStyle='#c9a84c'; mctx.lineWidth=1.5;
      mctx.shadowColor='#c9a84c'; mctx.shadowBlur=12;
      _roundRect(mctx, x-NW/2-3, y-NH/2-3, NW+6, NH+6, NR+3);
      mctx.stroke(); mctx.shadowBlur=0;
      mctx.restore();
    }

    mctx.restore();
  });

  // ═══════════════════════════════════
  //  5. 상단 진행 바 (완성도)
  // ═══════════════════════════════════
  mctx.save();
  const totalNodes = gs.map.flat().length;
  const visitedNodes = gs.map.flat().filter(n=>n.visited).length;
  const progPct = totalNodes > 0 ? visitedNodes/totalNodes : 0;
  const pbW=200, pbH=4, pbX=(MW-pbW)/2, pbY=MH-10;
  mctx.fillStyle='rgba(255,255,255,0.08)';
  _roundRect(mctx,pbX,pbY,pbW,pbH,2); mctx.fill();
  if(progPct>0){
    mctx.fillStyle=theme.color;
    mctx.shadowColor=theme.color; mctx.shadowBlur=4;
    _roundRect(mctx,pbX,pbY,pbW*progPct,pbH,2); mctx.fill();
    mctx.shadowBlur=0;
  }
  // 진행도 텍스트
  mctx.font='bold 9px Arial'; mctx.textAlign='center'; mctx.textBaseline='bottom';
  mctx.fillStyle=theme.color+'aa'; mctx.globalAlpha=0.7;
  mctx.fillText(`${visitedNodes}/${totalNodes} ${t('방 탐험','explored')}`, MW/2, pbY-2);
  mctx.restore();
}

// drawMap용 roundRect 헬퍼
function _roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function isNodeAccessible(node) {
  if (!node) return false;
  if (node.visited) return false;
  const li = parseInt(node.id.split('-')[0]);

  // 0층: 아직 아무것도 선택 안 했으면 전부 접근 가능
  if (li === 0) {
    return !gs.map[0].some(n => n.visited);
  }

  // 이전 레이어의 visited 노드 중 이 노드로 연결된 paths가 있는지 확인
  const prevLayer = gs.map[li - 1];
  return prevLayer.some(pn => {
    if (!pn.visited || !pn.paths) return false;
    if (!pn.paths.includes(node.id)) return false;
    // 이 pn에서 이미 다른 방향으로 경로를 선택했으면 잠김
    const alreadyChose = pn.paths.some(tid => gs.chosenPaths.has(pn.id + '->' + tid));
    if (alreadyChose) {
      return gs.chosenPaths.has(pn.id + '->' + node.id);
    }
    return true;
  });
}

mapCanvas.addEventListener('click', e => {
  if (gs.screen !== 'mapScreen') return;
  const rect = mapCanvas.getBoundingClientRect();
  const scaleX = mapCanvas.width / rect.width, scaleY = mapCanvas.height / rect.height;
  const mx = (e.clientX - rect.left)*scaleX, my = (e.clientY - rect.top)*scaleY;
  Object.values(nodePositions).forEach(({x,y,node})=>{
    if (Math.hypot(mx-x,my-y)<30 && isNodeAccessible(node)) {
      playSound(440, 0.08, 'sine', 0.05); // 짧은 선택음
      enterNode(node);
    }
  });
});

function enterNode(node) {
  Audio.sfx.mapMove();
  // 이전 노드 → 현재 노드 경로 기록 (경로 잠금용)
  if (gs.currentNodeId) {
    gs.chosenPaths.add(gs.currentNodeId + '->' + node.id);
  }
  gs.currentNodeId = node.id;
  const li = parseInt(node.id.split('-')[0]);
  gs.currentLayer = li;
  switch(node.type) {
    case 'battle': startBattle(false, false); break;
    case 'elite':  startBattle(true, false); break;
    case 'boss':   startBattle(false, true); break;
    case 'shop':   node.visited=true; gs._shopInventory = generateShopInventory(); showShop(); break;
    case 'rest':   node.visited=true; showRest(); break;
    case 'event':  node.visited=true; showEvent(); break;
  }
}

  // ─── BGM 엔진 (절차적 생성) ───
  // 각 BGM은 반복되는 드럼 + 베이스 + 멜로디 레이어로 구성
  const BGM_CONFIGS = {
    map: {
      bpm: 72, vol: 0.18,
      // 조용하고 신비로운 탐험 음악
      melody: [392,0,392,0,440,0,392,0, 349,0,330,0,294,0,0,0],
      bass:   [98, 0, 98, 0, 110,0, 98, 0,  87,0, 82,0, 73,0,0,0],
      melodyOct: 1, bassOct:0,
    },
    act1: {
      bpm: 95, vol: 0.22,
      // 활기차고 경쾌한 초원 전투
      melody: [523,0,659,523, 784,0,659,0, 523,0,659,523, 880,0,784,0],
      bass:   [130,0,130,0,   164,0,164,0,  130,0,130,0,  196,0,196,0],

      bass:   [110,0,110,0, 98, 0, 98,0,  87,0, 87,0,  82,0, 82,0],
      melodyOct:1, bassOct:0,
    },
    act3: {
      bpm: 115, vol: 0.24,
      // 격렬하고 빠른 용암 전투
      melody: [587,0,698,587, 784,587,698,0, 880,0,784,698, 1047,0,880,0],
      bass:   [146,0,146,0,  196,0,196,0,   220,0,220,0,   261,0,261,0],
      melodyOct:1, bassOct:0,
    },
    boss: {
      bpm: 130, vol: 0.28,
      // 긴장감 최고조 보스 전투
      melody: [440,415,392,370, 349,330,311,294, 277,262,247,233, 220,0,0,0],
      bass:   [110,0,110,0,     87, 0, 87,0,      73,0, 73,0,      55,0,0,0],
      melodyOct:1, bassOct:0,
    },
  };

  let bgmScheduler = null;
  let bgmGainNode = null;
  let bgmStartTime = 0;
  let bgmCurrentConfig = null;
  let bgmStep = 0;

  function startBGM(type) {
    if (bgmType === type) return;
    stopBGM(0.8);
    bgmType = type;
    const cfg = BGM_CONFIGS[type];
    if (!cfg) return;

    bgmGainNode = audioCtx.createGain();
    const bgmUserVol = typeof appSettings !== 'undefined' ? appSettings.bgmVol : 1.0;
    bgmGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    bgmGainNode.gain.linearRampToValueAtTime(cfg.vol * bgmIntensity * bgmUserVol, audioCtx.currentTime + 1.5);
    bgmGainNode.connect(bgmBus);
    bgmBus.gain.setValueAtTime(1, audioCtx.currentTime);
    bgmCurrentConfig = cfg;
    bgmStep = 0;
    bgmStartTime = audioCtx.currentTime;
    scheduleBGM();
  }

  function scheduleBGM() {
    if (!bgmCurrentConfig || !bgmGainNode) return;
    const cfg = bgmCurrentConfig;
    const stepDur = 60 / cfg.bpm / 2; // 8분음표
    const totalSteps = cfg.melody.length;

    // 한 루프치 미리 스케줄
    for (let i = 0; i < totalSteps; i++) {
      const t = audioCtx.currentTime + i * stepDur;
      const mFreq = cfg.melody[i];
      const bFreq = cfg.bass[i];

      if (mFreq) {
        // 멜로디 (triangle - 부드러움)
        try {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(bgmGainNode);
          o.type = 'triangle';
          o.frequency.value = mFreq;
          g.gain.setValueAtTime(0.18, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 0.85);
          o.start(t); o.stop(t + stepDur * 0.9);
        } catch(e) {}
      }
      if (bFreq) {
        // 베이스 (sine - 두꺼움)
        try {
          const o2 = audioCtx.createOscillator();
          const g2 = audioCtx.createGain();
          o2.connect(g2); g2.connect(bgmGainNode);
          o2.type = 'sine';
          o2.frequency.value = bFreq;
          g2.gain.setValueAtTime(0.22, t);
          g2.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 0.7);
          o2.start(t); o2.stop(t + stepDur * 0.75);
        } catch(e) {}
        // 드럼 킥 (비트 1,3)
        if (i % 4 === 0) {
          try {
            const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.15, audioCtx.sampleRate);
            const d = buf.getChannelData(0);
            for(let j=0;j<d.length;j++) d[j]=(Math.random()*2-1)*Math.exp(-j/(audioCtx.sampleRate*0.05));
            const src = audioCtx.createBufferSource();
            const kickG = audioCtx.createGain();
            const kickF = audioCtx.createBiquadFilter();
            src.buffer = buf;
            kickF.type='lowpass'; kickF.frequency.value=200;
            src.connect(kickF); kickF.connect(kickG); kickG.connect(bgmGainNode);
            kickG.gain.setValueAtTime(0.3, t);
            kickG.gain.exponentialRampToValueAtTime(0.001, t+0.12);
            src.start(t);
          } catch(e) {}
        }
        // 하이햇 (8분음표마다)
        if (i % 2 === 1) {
          try {
            const buf2 = audioCtx.createBuffer(1, audioCtx.sampleRate*0.05, audioCtx.sampleRate);
            const d2 = buf2.getChannelData(0);
            for(let j=0;j<d2.length;j++) d2[j]=(Math.random()*2-1)*Math.exp(-j/(audioCtx.sampleRate*0.01));
            const src2 = audioCtx.createBufferSource();
            const hhG = audioCtx.createGain();
            const hhF = audioCtx.createBiquadFilter();
            src2.buffer = buf2;
            hhF.type='highpass'; hhF.frequency.value=8000;
            src2.connect(hhF); hhF.connect(hhG); hhG.connect(bgmGainNode);
            hhG.gain.setValueAtTime(0.06, t);
            hhG.gain.exponentialRampToValueAtTime(0.001, t+0.04);
            src2.start(t);
          } catch(e) {}
        }
      }
    }

    // 루프: 한 루프 끝나면 다시 스케줄
    bgmScheduler = setTimeout(() => scheduleBGM(), totalSteps * stepDur * 1000 - 100);
  }

  function stopBGM(fadeTime=1.0) {
    bgmType = null;
    bgmCurrentConfig = null;
    if (bgmScheduler) { clearTimeout(bgmScheduler); bgmScheduler = null; }
    if (bgmGainNode) {
      bgmGainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + fadeTime);
      bgmGainNode = null;
    }
  }

  function setBGMIntensity(val) {
    bgmIntensity = val;
    if (bgmGainNode && bgmCurrentConfig) {
      bgmGainNode.gain.linearRampToValueAtTime(bgmCurrentConfig.vol * val, audioCtx.currentTime + 0.5);
    }
  }

  function setMasterVol(v) { master.gain.linearRampToValueAtTime(v, audioCtx.currentTime+0.2); }
  function setBGMVol(v) {
    if (bgmGainNode && bgmCurrentConfig) {
      bgmGainNode.gain.linearRampToValueAtTime(bgmCurrentConfig.vol * bgmIntensity * v, audioCtx.currentTime+0.3);
    }
  }
  function setSFXVol(v) { sfxBus.gain.linearRampToValueAtTime(v, audioCtx.currentTime+0.2); }

  return { sfx, startBGM, stopBGM, setBGMIntensity, setMasterVol, setBGMVol, setSFXVol, bgmBus };
})();

function playSound(f,d,t='sine',v=0.07) {
  try {
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type=t; o.frequency.setValueAtTime(f,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f*0.3,audioCtx.currentTime+d);
    g.gain.setValueAtTime(v,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.start(); o.stop(audioCtx.currentTime+d);
  } catch(e){}
}

        <div style="font-family:'Cinzel',serif;font-size:32px;font-weight:900;color:${theme.color||'#c9a84c'};
          text-shadow:0 0 40px ${theme.color||'#c9a84c'},0 0 80px ${theme.color||'#c9a84c'}66;
          letter-spacing:2px;margin-bottom:10px;">${theme.bossName||'???'}</div>
        <div style="font-size:13px;color:#8aa0b8;letter-spacing:3px;margin-bottom:6px;">ACT ${gs.act} — FINAL BOSS</div>
        <div style="font-size:11px;color:${theme.color||'#c9a84c'}88;font-style:italic;">"${theme.bossIntro||theme.intro||''}"</div>
      </div>`;
    if(!document.getElementById('_bossPulseStyle')){
      const st=document.createElement('style'); st.id='_bossPulseStyle';
      st.textContent=`@keyframes bossPulse{from{transform:scale(1)}to{transform:scale(1.08)}}
        @keyframes bossPhaseIn{from{opacity:0;transform:translateY(-30px) scale(1.3)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes bossPhaseOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(0.8)}}`;
      document.head.appendChild(st);
    }
    document.body.appendChild(ov);
    setTimeout(()=>{
      ov.style.background=`radial-gradient(ellipse at center, ${theme.color||'#c9a84c'}18 0%, rgba(0,0,0,0.92) 70%)`;
      document.getElementById('_bossIntroInner').style.opacity='1';
      document.getElementById('_bossIntroInner').style.transform='scale(1) translateY(0)';
      ov.querySelectorAll('._bossLine').forEach(l=>l.style.transform='scaleX(1)');
    }, 50);
    Audio.setBGMIntensity(1.4);
    // 3단계 사운드: 저음 → 충격 → 보스 등장
    setTimeout(()=>{ Audio.sfx.bossAppear(); }, 100);
    setTimeout(()=>{ ov.style.opacity='0'; ov.style.transition='opacity 0.5s'; setTimeout(()=>ov.remove(), 500); }, 2600);
    // 카운트다운은 인트로 후 시작
    setTimeout(startCountdown, 2000);
  } else {
    startCountdown();
  }

  function startCountdown() {
    let countdown = 3;
    const cdInterval = setInterval(() => {
      if (!bt || bt.won) { clearInterval(cdInterval); return; }
      if (countdown > 0) {
        showWaveNotif(String(countdown), isBoss ? '👑 BOSS BATTLE' : `WAVE 1 / ${wavesTotal}`);
        Audio.sfx.cardPick();
        countdown--;
      } else {
        clearInterval(cdInterval);
        bt.paused = false;
        showWaveNotif(isBoss ? '👑 FIGHT!' : '⚔️ START!', '');
        Audio.sfx.waveComplete();
        startBattleTimers(isElite, isBoss);
        // ── 웨이브 1 미니 도전 부여 ──
        if (!isBoss && !isElite && Math.random() < 0.8) {
          setTimeout(() => { if(bt && !bt.won) assignMiniChallenge(false); }, 1200);
        } else if (isElite) {
          setTimeout(() => { if(bt && !bt.won) assignMiniChallenge(true); }, 1200);
        }
      }
    }, 800);
  }
}

function assignMiniChallenge(isElite) {
  const pool = isElite ? ELITE_CHALLENGES : MINI_CHALLENGES;
  // 대시 도전: 대시 스킬 없으면 제외
  const filtered = pool.filter(c => c.id !== 'dash' || (gs.skills&&gs.skills.dash>0));
  const ch = filtered[Math.floor(Math.random()*filtered.length)];
  bt.miniChallenge = { ...ch, completed:false, failed:false };
  if(ch.onStart) ch.onStart();
  // 기존 배너 제거 후 새 배너 표시
  document.getElementById('_miniChallengeEl')?.remove();
  const el = document.createElement('div');
  el.id = '_miniChallengeEl';
  el.style.cssText=`position:fixed;top:76px;left:50%;transform:translateX(-50%);
    z-index:180;pointer-events:none;text-align:center;opacity:0;transition:opacity 0.3s;`;
  const bc = isElite ? 'rgba(255,150,60,0.6)' : 'rgba(80,180,255,0.45)';
  const tc = isElite ? '#ffb870' : '#80d8ff';
  const extraTxt = ch.rewardExtra==='coin' ? ' <span style="color:#c060ff">+1🔮</span>' : '';
  el.innerHTML=`<div style="display:inline-block;padding:6px 18px;border-radius:20px;
    background:rgba(8,16,44,0.90);border:1px solid ${bc};
    font-size:12px;color:${tc};font-family:'Jua','Noto Sans KR',sans-serif;
    box-shadow:0 2px 14px rgba(0,0,0,0.5);">
    ${ch.icon} 도전: ${ch.text} <span style="color:#f0d060;margin-left:4px">+${ch.reward}🪙</span>${extraTxt}
  </div>`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.style.opacity='1');
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3500);
}

function checkMiniChallenge() {
  if(!bt.miniChallenge || bt.miniChallenge.completed) return;
  if(bt.miniChallenge.check && bt.miniChallenge.check()){
    bt.miniChallenge.completed = true;
    const ch = bt.miniChallenge;
    const _chalMult = 1.0;
    const reward = Math.round(ch.reward * _chalMult);
    gs.gold += reward;
    gs._totalGoldEarned = (gs._totalGoldEarned||0)+reward;
    trackMission('gold', reward);
    // 메타코인 추가 보상
    let extraText = '';
    document.getElementById('_miniChallengeEl')?.remove();
    const el = document.createElement('div');
    el.id = '_miniChallengeEl';
    el.style.cssText=`position:fixed;top:76px;left:50%;transform:translateX(-50%);
      z-index:180;pointer-events:none;text-align:center;opacity:0;transition:opacity 0.3s;`;
    el.innerHTML=`<div style="display:inline-block;padding:7px 24px;border-radius:20px;
      background:rgba(6,24,10,0.94);border:1px solid rgba(78,207,122,0.7);
      font-size:13px;color:#4ecf7a;font-family:'Jua','Noto Sans KR',sans-serif;
      box-shadow:0 0 18px rgba(78,207,122,0.3);">
      ✅ 도전 성공! <span style="color:#f0d060">+${reward}🪙</span>${extraText}
    </div>`;
    document.body.appendChild(el);
    requestAnimationFrame(()=>el.style.opacity='1');
    setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 2200);
    Audio.sfx.miniComplete();
  }
}

function startBattleTimers(isElite, isBoss) {
  // 웨이브 타이머
  bt.waveInterval = setInterval(() => {
    if (!bt || bt.paused || bt.won) return;
    bt.battleTime++;
    gs.totalTime++;
    bt.waveTimer++;
    if (!bt.isBoss && bt.waveTimer >= bt.waveDuration) {
      bt.waveTimer = 0;
      bt.wave++;
      if (bt.wave > bt.wavesTotal) {
        collectAllItems(() => battleWon());
        return;
      }
      relicsOnWaveStart();
      // ── 이전 웨이브 미니 도전 완료 체크 ──
      checkMiniChallenge();
      // ── 새 웨이브 미니 도전 부여 (80% 확률) ──
      if (!bt.isBoss && !bt.isElite && bt.wave <= bt.wavesTotal && Math.random() < 0.8) {
        assignMiniChallenge(false);
      } else {
        bt.miniChallenge = null;
      }
      // ── 웨이브 클리어 연출: 슬로우모션 + 배너 ──
      const clearedWave = bt.wave - 1;
      // 완벽 웨이브 (무피격) 추적
      if(!bt._miniChallengeHitThisWave){
        gs._perfectWaves = (gs._perfectWaves||0)+1;
      }
      bt._miniChallengeHitThisWave = false; // 다음 웨이브 초기화
      // 슬로우모션 1.2초
      bt.slowMotion = true; bt.slowScale = 0.25;
      setTimeout(()=>{ if(bt){ bt.slowMotion = false; } }, 1200);
      Audio.sfx.waveComplete();
      collectAllItems(() => {
        showWaveNotif(`WAVE ${bt.wave} / ${bt.wavesTotal}`, `✓ WAVE ${clearedWave} CLEAR`);
      });
    }
    // 보스 전투는 시간 제한 없이 처치가 목표 — 자동 win 없음
  }, 1000);

  // 적 스폰
  bt.spawnId = setInterval(() => {
    if (!bt || bt.paused || bt.won) return;
    spawnEnemiesForWave();
  }, isElite ? 700 : isBoss ? 1200 : 750);
}

function stopBattleTimers() {
  if (!bt) return; // bt가 null이면 타이머도 없음
  if (bt.waveInterval) { clearInterval(bt.waveInterval); bt.waveInterval = null; }
  if (bt.spawnId)      { clearInterval(bt.spawnId);      bt.spawnId = null; }
}

function spawnEnemiesForWave() {
  const w = bt.wave, diff = bt.diffMult, act = gs.act;

  // 화면 내 일반몹 수 상한 — 초과 시 스폰 스킵 (성능 보호)
  const maxOnScreen = act === 1 ? 18 : act === 2 ? 13 : 10;
  const curNormal = bt.enemies.filter(e => !e.isBoss && !e.isEliteBoss).length;
  if (curNormal >= maxOnScreen) return;

  // 스폰 수: ACT별 상한 제한으로 랙 방지
  const actSpawnBonus = act === 1 ? 0 : act === 2 ? 0 : 1;
  const base  = 2 + w + actSpawnBonus;
  const curseMult = 1.0;
  const spawnCap = act === 1 ? 14 : act === 2 ? 9 : 7;
  const count = Math.min(spawnCap, maxOnScreen - curNormal,
    Math.ceil(base * diff * (bt.isElite ? 1.3 : 1.0) * curseMult));

  // 엘리트 방 wave1 시작 시 엘리트 보스 1마리 등장
  if (bt.isElite && w === 1 && !bt.eliteBossSpawned) {
    bt.eliteBossSpawned = true;
    const hpM = 1 + (act-1)*0.7;
    const spdM = 0.8 + (act-1)*0.15;
    const ex = (bt.cam||{x:0}).x + 400, ey = (bt.cam||{x:0,y:0}).y - 30;
    const k = bt.eliteKind;
    let eb;
    if (k === 'berserker') {
      eb = {x:ex,y:ey,size:32,speed:1.3*spdM,hp:Math.ceil(28*diff*hpM),maxHp:Math.ceil(28*diff*hpM),
        color:'#e05050',type:'elite_berserker',isEliteBoss:true,dashTimer:120,dashActive:0,hitFlash:0};
    } else if (k === 'necromancer') {
      eb = {x:ex,y:ey,size:30,speed:0.6*spdM,hp:Math.ceil(32*diff*hpM),maxHp:Math.ceil(32*diff*hpM),
        color:'#7040c0',type:'elite_necromancer',isEliteBoss:true,summonTimer:180,hasShield:true,hitFlash:0};
    } else {
      eb = {x:ex,y:ey,size:48,speed:0.45*spdM,hp:Math.ceil(45*diff*hpM),maxHp:Math.ceil(45*diff*hpM),
        color:'#40a060',type:'elite_colossus',isEliteBoss:true,shockTimer:200,hitFlash:0};
    }
    bt.enemies.push(eb);
    const names = {berserker:'💀 광전사 출현!', necromancer:'💀 강령술사 출현!', colossus:'💀 거인 출현!'};
    showWaveNotif(names[k], '');
  }

  for (let i=0; i<count; i++) {
    const side = Math.floor(Math.random()*4);
    let x,y;
    // 카메라(=플레이어 화면 기준) 바깥에서 스폰
    const cx = (bt.cam||{x:0}).x, cy = (bt.cam||{x:0,y:0}).y;
    if (side===0){x=cx+Math.random()*800;y=cy-40;}
    else if(side===1){x=cx+Math.random()*800;y=cy+840;}
    else if(side===2){x=cx-40;y=cy+Math.random()*800;}
    else{x=cx+840;y=cy+Math.random()*800;}
    const curseHpMult  = 1.0;
    const curseSpdMult = 1.0;
    const ascM = gs.ascMult || {hp:1, spd:1, bossHp:1, bossSpd:1, bossAggro:0, boss4Phase:false};
    // HP 배율: ACT2부터 급격히 상승 + 초월 배율
    const actHpBonus = act===1 ? 0 : act===2 ? 1.3 : 2.8;
    const timeSecs = Math.floor(bt.battleTime / 60); // 경과 초
    const timeBonus = timeSecs <= 50 ? timeSecs * 0.04 : 2.0 + (timeSecs - 50) * 0.01; // 50초 이후 점진적
    const hpM = (1.2 + actHpBonus + (w-1)*0.25 + timeBonus) * (hasRelic('r_time_glass')?0.8:1) * curseHpMult * ascM.hp;
    // 속도 배율: ACT2부터 체감되게 빨라짐 + 초월 배율
    const actSpdBonus = act===1 ? 0 : act===2 ? 0.42 : 0.78;
    const spdM = (1.1 + actSpdBonus + (w-1)*0.12) * curseSpdMult * ascM.spd;
    const r = Math.random();
    let e;
    if (bt.isBoss && bt.enemies.filter(e=>e.isBoss).length===0) {
      // 이미 보스가 스폰됐다가 처치됐으면 → 승리
      if (bt._bossSpawned) { battleWon(); return; }
      bt._bossSpawned = true;
      // 보스 HP: ACT3 대폭 상향 (ACT3=4.0), 초월 배율 포함
      const bossActMult = act===1 ? 1.0 : act===2 ? 1.8 : 3.2; // [V1] ACT3 보스 HP -20% 조정
      const bossHp = Math.ceil(260 * diff * bossActMult * ascM.bossHp);
      // 보스 스피드: ACT3 더 빠르게, 초월 배율 포함
      const bossBaseSpd = act===3 ? 0.72 : act===2 ? 0.58 : 0.5;
      // 초월 10+: 보스 공격 타이머 감소 (더 빈번한 공격)
      const aggroMult = 1 / (1 + ascM.bossAggro);
      const chargeT = Math.ceil(220 * aggroMult);
      const summonT = Math.ceil(420 * aggroMult);
      e={x,y,size:act===3?62:56,speed:bossBaseSpd*spdM*ascM.bossSpd,hp:bossHp,maxHp:bossHp,
         color:'#c9a84c',type:'boss',isBoss:true,
         chargeTimer:chargeT, summonTimer:summonT, hitFlash:0, phase:1,
         _spdM: spdM, // 페이즈 전환 속도 복구에 사용
         _boss4Phase: ascM.boss4Phase || act===3}; // ACT3 or 초월25+는 4페이즈
      bt.enemies.push(e); return;
    }
    // ACT별 적 테마 색상 및 스폰 비율
    const actTint = act===2 ? 'ice' : act===3 ? 'fire' : 'normal';
    // ACT1: 균형(기본), ACT2: 탱크 중심(단단하고 느린 전투), ACT3: 속공+분열 중심(군집 혼전)
    let thr; // [normal, fast, tank] 경계값 (split은 나머지)
    if(act===2) thr=[0.35,0.52,0.82]; // normal35% fast17% tank30% split18%
    else if(act===3) thr=[0.28,0.61,0.71]; // normal28% fast33% tank10% split29%
    else thr=[0.48,0.72,0.88]; // ACT1 기본
    // 기본 HP를 올려서 총알 여러 발 필요하도록 (act1 기준: normal=3발, tank=9발, split=6발)
    if(r<thr[0]) e={x,y,size:12,speed:1.15*spdM,hp:Math.ceil(2*hpM), maxHp:Math.ceil(2*hpM), color:'#d2b48c',type:'normal',hitFlash:0,actTint};
    else if(r<thr[1]) e={x,y,size:7, speed:2.2*spdM, hp:Math.ceil(1.2*hpM), maxHp:Math.ceil(1.2*hpM), color:'#f5deb3',type:'fast',hitFlash:0,actTint};
    else if(r<thr[2]) e={x,y,size:22,speed:0.68*spdM,hp:Math.ceil(5*hpM),maxHp:Math.ceil(5*hpM),color:'#8fbc8f',type:'tank',hitFlash:0,actTint};
    else            e={x,y,size:14,speed:1.35*spdM, hp:Math.ceil(3*hpM),maxHp:Math.ceil(3*hpM),color:'#daa520',type:'split',hitFlash:0,actTint};
    bt.enemies.push(e);
  }

  // ── 웨이브 3+ : 특수 소환 패턴 (ring/cross/spiral) ──
  // 패턴 쿨다운: 최소 6회 스폰(약 4.5초) 이후에만 재발동
  if (!bt.isBoss && !bt.isElite && bt.wave >= 3) {
    bt._patternCooldown = (bt._patternCooldown || 0) - 1;
    const curTotal = bt.enemies.filter(e => !e.isBoss && !e.isEliteBoss).length;
    if (bt._patternCooldown <= 0 && Math.random() < 0.35 && curTotal < maxOnScreen - 4) {
      bt._patternCooldown = 6; // 약 4.5초 쿨다운
      // 실제 플레이어 좌표 사용
      const px = gs.player.x, py = gs.player.y;
      const actTint = gs.act===2?'ice':gs.act===3?'fire':'normal';
      const hpM = 1.2 + (bt.wave-1)*0.25;
      const spdM = 1.1 + (bt.wave-1)*0.12;
      const pat = ['ring','cross','spiral'][Math.floor(Math.random()*3)];
      const _canSpawn = () => bt.enemies.filter(e=>!e.isBoss&&!e.isEliteBoss).length < maxOnScreen;
      if (pat === 'ring') {
        const n = Math.min(6 + (bt.wave >= 5 ? 2 : 0), maxOnScreen - curTotal);
        for(let i=0;i<n;i++){
          if(!_canSpawn()) break;
          const ang = (i/n)*Math.PI*2;
          const ex = px + Math.cos(ang)*500, ey = py + Math.sin(ang)*500;
          bt.enemies.push({x:ex,y:ey,size:10,speed:1.5*spdM,hp:Math.ceil(1.5*hpM),maxHp:Math.ceil(1.5*hpM),color:'#f5deb3',type:'fast',hitFlash:0,actTint});
        }
      } else if (pat === 'cross') {
        [0,Math.PI/2,Math.PI,Math.PI*1.5].forEach(ang=>{
          for(let d=1;d<=2;d++){
            if(!_canSpawn()) return;
            const ex = px + Math.cos(ang)*d*280, ey = py + Math.sin(ang)*d*280;
            bt.enemies.push({x:ex,y:ey,size:12,speed:1.1*spdM,hp:Math.ceil(2*hpM),maxHp:Math.ceil(2*hpM),color:'#d2b48c',type:'normal',hitFlash:0,actTint});
          }
        });
      } else { // spiral
        const n = Math.min(8, maxOnScreen - curTotal);
        for(let i=0;i<n;i++){
          if(!_canSpawn()) break;
          const ang = (i/n)*Math.PI*2 + bt.wave*0.3;
          const dist = 360 + i*28;
          const ex = px + Math.cos(ang)*dist, ey = py + Math.sin(ang)*dist;
          bt.enemies.push({x:ex,y:ey,size:8,speed:1.8*spdM,hp:Math.ceil(hpM),maxHp:Math.ceil(hpM),color:'#f5deb3',type:'fast',hitFlash:0,actTint});
        }
      }
    }
  }
}

// ─── 배틀 승리 ───
/** 전투 승리 처리. bt._battleWonDone 플래그로 중복 방지 */
function battleWon() {
  if (!bt) return;
  if (bt._battleWonDone) return; // [M4] 중복 호출 방지 — 보스 킬 직후 + wave 완료 양쪽에서 호출될 수 있음
  bt._battleWonDone = true;
  bt.won = true;
  stopBattleTimers();
  const node = gs.map.flat().find(n=>n.id===gs.currentNodeId);
  if (node) node.visited = true;

  const relicBonus = hasRelic('r_golden_idol') ? 20 : 0;
  // 골드 드롭: 일반전+40, 엘리트+65, 보스+100 (황금 우상 유물 시 +20 추가)
  const goldGain = (bt.isBoss ? 100 : bt.isElite ? 65 : 40) + relicBonus;
  gs.gold += goldGain;
  // 💎 다이아 지급 (보스+3, 엘리트+2, 일반+1, 무결점+1)
  const _diamondGain = (bt.isBoss ? 3 : bt.isElite ? 2 : 1) + (bt._noDamageThisBattle ? 1 : 0);
  prem.gems = (prem.gems || 0) + _diamondGain;
  if (typeof savePremium === 'function') savePremium();
  // gs.totalKills는 killEnemy()에서 이미 실시간으로 누적되므로 여기서 중복 합산 제거
  // 미션 추적
  trackMission('kills', gs.player.kills);
  trackMission('gold', goldGain);
  if (bt.isElite) trackMission('elite', 1);

  if (bt.isBoss) {
    // 보스 처치 — 화려한 클리어 연출
    gs.bossesDefeated++;
    trackMission('boss', 1);
    // 보스 무결점 보너스
    if (bt._noDamageThisBattle) {
      gs.gold += 30;
      gs._noDmgClears = (gs._noDmgClears||0) + 1;
      showToast(t('✨ 보스 무결점! +30🪙', '✨ Boss Perfect! +30🪙'), 2000);
    }
    const isLastBoss = gs.act >= ACTS;
    triggerBossClearFX(() => {
      if (isLastBoss) {
        // 마지막 보스: 최종 승리
        showBossVictory();
      } else {
        // 중간 보스: 유물 선택 후 ACT 전환
        const relicCount = 1;
        showRelicSelection(relicCount, () => showBossVictory());
      }
    });
  } else {
    // 일반/엘리트 클리어
    if (bt.isElite) checkMiniChallenge();
    playSound(520,0.2,'sine',0.1); playSound(660,0.3,'sine',0.08);
    const killStr = gs.player.kills > 0 ? `처치 ${gs.player.kills}  ·  ` : '';
    const _noDmg = bt._noDamageThisBattle;
    showWaveNotif(bt.isElite ? '⚔️ 엘리트 처치!' : '🏆 클리어!', `${killStr}+${goldGain}🪙${_noDmg?' ✨무결점':''}` );
    bt._cardSelectBlocked = true;
    setTimeout(() => { bt._cardSelectBlocked = false; }, 300);

    // 전투 결과 저장 (카드 선택 화면 상단에 표시)
    window._btResult = {
      kills: gs.player.kills,
      gold: goldGain,
      noDmg: _noDmg,
      isElite: bt.isElite,
      waves: bt.wavesTotal || 1
    };

    if (_noDmg) {
      gs._noDmgClears = (gs._noDmgClears||0) + 1;
      const _noDmgGold = bt.isElite ? 10 : 20;
      gs.gold += _noDmgGold;
      window._btResult.gold += _noDmgGold;
      window._btResult.noDmgBonus = _noDmgGold;
      if (bt.isElite) {
        setTimeout(() => showCardSelection(), 1800);
      } else {
        setTimeout(() => showCardSelection(() =>
          showCardSelection(() => showMapScreen(), {title:t('✨ 무결점 보너스','✨ Perfect Bonus'), sub:t('추가 룬을 선택하세요','Choose a bonus rune'), count:3})
        ), 2400);
      }
    } else {
      setTimeout(() => showCardSelection(), 1800);
    }
  }
}

// 캔버스에 파티클 폭발 + 화면 플래시 → onDone 호출
function triggerBossClearFX(onDone) {
  // 파티클 폭발
  const theme = ACT_THEMES[gs.act - 1] || ACT_THEMES[0];
  for(let i = 0; i < 60; i++) {
    setTimeout(() => {
      spawnP(400 + (Math.random()-.5)*300, 400 + (Math.random()-.5)*300,
        [theme.color,'#fff','#c9a84c','#f0d080'][Math.floor(Math.random()*4)],
        6, 5 + Math.random()*4);
    }, i * 30);
  }
  // 사운드 팡파레
  Audio.sfx.bossClear();
  Audio.stopBGM(1.5);
  // 큰 화면 흔들림 (짧게만)
  bt.screenShake = 12;
  setTimeout(() => { if(bt) bt.screenShake = 0; }, 600); // 0.6초 후 떨림 종료
  // 플래시 오버레이
  bt.bossKillFlash = 1.0;
  // 2.2초 후 ACT 전환 화면으로
  setTimeout(() => onDone(), 2200);
}

function battleLost() {
  if (!bt || bt.won) return; // 이미 처리됨

  stopBattleTimers();

// 뭉게구름 — 여러 원을 자연스럽게 겹쳐 입체감
function drawCloud(ctx, cx, cy, w, h, alpha=0.88, tint='#ffffff') {
  ctx.save();
  // 그림자 (구름 하단 부분)
  ctx.globalAlpha = alpha * 0.25;
  const shadow = ctx.createLinearGradient(cx, cy, cx, cy+h*1.2);
  shadow.addColorStop(0, '#c8d8e8'); shadow.addColorStop(1, 'rgba(160,180,200,0)');
  ctx.fillStyle = shadow;
  ctx.beginPath(); ctx.ellipse(cx, cy+h*0.35, w*0.85, h*0.55, 0, 0, Math.PI*2); ctx.fill();

  // 구름 본체 (여러 원 겹침)
  const circles = [
    [cx,       cy,       w*0.55, h*0.9 ],
    [cx-w*0.38, cy+h*0.1, w*0.42, h*0.75],
    [cx+w*0.36, cy+h*0.08,w*0.45, h*0.72],
    [cx-w*0.18, cy-h*0.18,w*0.38, h*0.65],
    [cx+w*0.16, cy-h*0.15,w*0.35, h*0.60],
    [cx+w*0.55, cy+h*0.25,w*0.32, h*0.55],
    [cx-w*0.55, cy+h*0.22,w*0.30, h*0.52],
  ];
  ctx.globalAlpha = alpha;
  ctx.fillStyle = tint;
  ctx.shadowColor = 'rgba(200,220,240,0.4)';
  ctx.shadowBlur = 8;
  circles.forEach(([ex,ey,ew,eh]) => {
    ctx.beginPath(); ctx.ellipse(ex,ey,ew,eh,0,0,Math.PI*2); ctx.fill();
  });
  // 하이라이트 (상단 밝게)
  ctx.globalAlpha = alpha * 0.4;
  ctx.fillStyle = '#ffffff';
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.ellipse(cx-w*0.05, cy-h*0.08, w*0.35, h*0.38, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// 원신 스타일 나무 — 여러 레이어 잎 + 그림자 + 윤곽선
function drawTree(ctx, tx, ty, size, colorSet) {
  const [trunk, dark, mid, light, highlight] = colorSet;
  ctx.save();

  // 줄기
  const trunkW = size * 0.18, trunkH = size * 0.55;
  const trunkGrad = ctx.createLinearGradient(tx-trunkW,0, tx+trunkW,0);
  trunkGrad.addColorStop(0, trunk); trunkGrad.addColorStop(0.5,'#8b5e2a'); trunkGrad.addColorStop(1,'#5a3a14');
  ctx.fillStyle = trunkGrad;
  ctx.beginPath();
  ctx.moveTo(tx-trunkW*0.8, ty);
  ctx.bezierCurveTo(tx-trunkW, ty-trunkH*0.3, tx-trunkW*0.6, ty-trunkH*0.7, tx-trunkW*0.3, ty-trunkH);
  ctx.lineTo(tx+trunkW*0.3, ty-trunkH);
  ctx.bezierCurveTo(tx+trunkW*0.6, ty-trunkH*0.7, tx+trunkW, ty-trunkH*0.3, tx+trunkW*0.8, ty);
  ctx.closePath(); ctx.fill();

  // 나무 그림자 (바닥)
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#2a4a18';
  ctx.beginPath(); ctx.ellipse(tx, ty+3, size*0.5, size*0.1, 0, 0, Math.PI*2); ctx.fill();

  ctx.globalAlpha = 1;
  // 잎 레이어 4겹 (뒤→앞, 아래→위)
  const layers = [
    { y: ty-trunkH*0.85, rx: size*0.72, ry: size*0.52, col: dark  },
    { y: ty-trunkH*1.05, rx: size*0.65, ry: size*0.50, col: mid   },
    { y: ty-trunkH*1.25, rx: size*0.55, ry: size*0.45, col: mid   },
    { y: ty-trunkH*1.42, rx: size*0.40, ry: size*0.38, col: light },
  ];
  layers.forEach(({y,rx,ry,col}) => {
    // 좌우 두 덩어리
    const leafGrad = ctx.createRadialGradient(tx-rx*0.15, y-ry*0.1, 0, tx, y, rx);
    leafGrad.addColorStop(0, light); leafGrad.addColorStop(0.5, col); leafGrad.addColorStop(1, dark);
    ctx.fillStyle = leafGrad;
    ctx.beginPath(); ctx.ellipse(tx, y, rx, ry, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(tx-rx*0.45, y+ry*0.12, rx*0.68, ry*0.72, -0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(tx+rx*0.42, y+ry*0.10, rx*0.65, ry*0.70, 0.15, 0, Math.PI*2); ctx.fill();
  });
  // 하이라이트 (상단 좌측)
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = highlight;
  ctx.beginPath(); ctx.ellipse(tx-size*0.18, ty-trunkH*1.5, size*0.22, size*0.18, -0.3, 0, Math.PI*2); ctx.fill();

  // 잎 외곽 음영
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = dark; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(tx, ty-trunkH*1.1, size*0.68, size*0.52, 0, 0, Math.PI*2); ctx.stroke();

  ctx.restore();
}

// 원신 스타일 산 — 여러 레이어 + 눈/안개
function drawMountain(ctx, mx, mh, mw, colors, snowCap=false) {
  const [base, mid2, ridge] = colors;
  ctx.save();
  // 산 본체 그라데이션
  const mg = ctx.createLinearGradient(mx+mw/2, mh, mx+mw/2, mh+300);
  mg.addColorStop(0, ridge); mg.addColorStop(0.4, mid2); mg.addColorStop(1, base);
  ctx.fillStyle = mg;
  // 자연스러운 산 실루엣 (베지어)
  ctx.beginPath();
  ctx.moveTo(mx, mh+300);
  ctx.bezierCurveTo(mx+mw*0.15, mh+200, mx+mw*0.3, mh+60, mx+mw*0.45, mh);
  ctx.bezierCurveTo(mx+mw*0.5, mh-8, mx+mw*0.52, mh-5, mx+mw*0.55, mh+15);
  ctx.bezierCurveTo(mx+mw*0.7, mh+70, mx+mw*0.85, mh+180, mx+mw, mh+300);
  ctx.closePath(); ctx.fill();
  // 측면 음영
  ctx.globalAlpha = 0.2;
  const shade = ctx.createLinearGradient(mx, 0, mx+mw, 0);
  shade.addColorStop(0,'rgba(0,0,0,0.3)'); shade.addColorStop(0.45,'rgba(0,0,0,0)'); shade.addColorStop(1,'rgba(0,0,0,0.15)');
  ctx.fillStyle = shade;
  ctx.beginPath();
  ctx.moveTo(mx, mh+300);
  ctx.bezierCurveTo(mx+mw*0.15, mh+200, mx+mw*0.3, mh+60, mx+mw*0.45, mh);
  ctx.bezierCurveTo(mx+mw*0.5, mh-8, mx+mw*0.52, mh-5, mx+mw*0.55, mh+15);
  ctx.bezierCurveTo(mx+mw*0.7, mh+70, mx+mw*0.85, mh+180, mx+mw, mh+300);
  ctx.closePath(); ctx.fill();
  // 눈 (필요 시)
  if (snowCap) {
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(mx+mw*0.45, mh);
    ctx.bezierCurveTo(mx+mw*0.38, mh+45, mx+mw*0.30, mh+80, mx+mw*0.28, mh+90);
    ctx.lineTo(mx+mw*0.72, mh+90);
    ctx.bezierCurveTo(mx+mw*0.70, mh+80, mx+mw*0.62, mh+45, mx+mw*0.55, mh+15);
    ctx.bezierCurveTo(mx+mw*0.52, mh-5, mx+mw*0.5, mh-8, mx+mw*0.45, mh);
    ctx.closePath(); ctx.fill();
    // 눈 하이라이트
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = '#e8f4ff';
    ctx.beginPath(); ctx.ellipse(mx+mw*0.42, mh+30, mw*0.06, mw*0.04, -0.4, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ══════════════════════════════════════════════════════════
//  SVG 기반 배경 시스템
//  — 고품질 SVG를 오프스크린 캔버스에 렌더링 후 재사용
// ══════════════════════════════════════════════════════════
const _bgCache = {}; // act_boss -> {img, ready}
function clearBgCache(){ for(const k in _bgCache) delete _bgCache[k]; for(const k in _floorPatternCache) delete _floorPatternCache[k]; }

function buildBgSVG(act, isBoss) {
  const key = act + '_' + (isBoss?'boss':'normal');
  if (_bgCache[key]) return _bgCache[key];
  const obj = { img: new Image(), ready: false };
  _bgCache[key] = obj;

  const svg = createBgSVG(act, isBoss);
  const blob = new Blob([svg], {type:'image/svg+xml'});
  const url  = URL.createObjectURL(blob);
  obj.img.onload = () => { obj.ready = true; URL.revokeObjectURL(url); };
  obj.img.src = url;
  return obj;
}

function createBgSVG(act, isBoss) {
  if (act === 1 && !isBoss) return SVG_ACT1();
  if (act === 2 && !isBoss) return SVG_ACT2();
  if (act === 3 && !isBoss) return SVG_ACT3();
  return SVG_BOSS(act);
}

// ─── 월드 스크롤 바닥 타일 패턴 ─────────────────────────
// 각 ACT의 무한 타일링 바닥 패턴을 오프스크린 캔버스로 생성
const _floorPatternCache = {};
function buildFloorPattern(act) {
  if (_floorPatternCache[act]) return _floorPatternCache[act];
  const sz = 200; // 타일 크기
  const oc = document.createElement('canvas');
  oc.width = sz; oc.height = sz;
  const c = oc.getContext('2d');

  if (act === 1) {
    // ACT1: 초원 — 밝은 그라데이션 잔디 + 풀잎 + 소형 꽃 (Vampire Survivors 스타일 밝은 녹색)
    // 기본 그라운드 그라데이션
    const gndGrad = c.createLinearGradient(0,0,sz,sz);
    gndGrad.addColorStop(0,'#52b820'); gndGrad.addColorStop(0.5,'#46a018'); gndGrad.addColorStop(1,'#3a8c14');
    c.fillStyle=gndGrad; c.fillRect(0,0,sz,sz);
    // 낮은 대비 결 (자연스러운 풀밭)
    c.save(); c.globalAlpha=0.09;
    for(let i=-sz;i<sz*2;i+=28){
      c.fillStyle=i%56===0?'#80e040':'#2e7010';
      c.beginPath();c.moveTo(i,0);c.lineTo(i+28,0);c.lineTo(i+28+sz,sz);c.lineTo(i+sz,sz);c.closePath();c.fill();
    }
    c.restore();
    // 풀잎 그룹 (랜덤 위치 16개)
    const grassPos=[[20,30],[55,80],[90,15],[140,60],[170,110],[30,150],[100,140],[180,40],[45,170],[130,100],[75,50],[160,180],[10,100],[120,30],[85,160],[150,75]];
    grassPos.forEach(([gx,gy])=>{
      const h=6+Math.random()*6, w=1.2;
      c.save(); c.strokeStyle=`rgba(${30+Math.random()*30|0},${180+Math.random()*60|0},${10+Math.random()*20|0},0.80)`;
      c.lineWidth=w; c.lineCap='round';
      // 중앙 풀잎
      c.beginPath(); c.moveTo(gx,gy); c.quadraticCurveTo(gx+2,gy-h*0.6,gx+(Math.random()>0.5?3:-3),gy-h); c.stroke();
      // 좌우 풀잎
      c.globalAlpha=0.5;
      c.beginPath(); c.moveTo(gx-2,gy); c.quadraticCurveTo(gx-4,gy-h*0.5,gx-5,gy-h*0.75); c.stroke();
      c.beginPath(); c.moveTo(gx+2,gy); c.quadraticCurveTo(gx+5,gy-h*0.5,gx+5,gy-h*0.7); c.stroke();
      c.restore();
    });
    // 작은 꽃 (4개)
    [[50,55,'#ffe0a0'],[130,145,'#ffc0c0'],[90,190,'#c0e0ff'],[170,30,'#fff0b0']].forEach(([fx,fy,col])=>{
      c.save();c.globalAlpha=0.55;c.fillStyle=col;
      for(let p=0;p<5;p++){const a=p/5*Math.PI*2;c.beginPath();c.ellipse(fx+Math.cos(a)*3,fy+Math.sin(a)*3,2.5,1.5,a,0,Math.PI*2);c.fill();}
      c.fillStyle='#ffe060';c.beginPath();c.arc(fx,fy,2,0,Math.PI*2);c.fill();
      c.restore();
    });
  } else if (act === 2) {
    // ACT2: 얼음 타일 (밝은 아이시 블루)
    c.fillStyle = '#c8eaff'; c.fillRect(0,0,sz,sz);
    // 얼음 반사광 (더 선명하게)
    c.fillStyle='rgba(255,255,255,0.40)'; c.beginPath(); c.ellipse(60,50,40,20,-0.3,0,Math.PI*2); c.fill();
    c.fillStyle='rgba(255,255,255,0.28)'; c.beginPath(); c.ellipse(155,140,35,18,0.4,0,Math.PI*2); c.fill();
    c.fillStyle='rgba(200,240,255,0.30)'; c.beginPath(); c.ellipse(110,100,30,15,0.8,0,Math.PI*2); c.fill();
    // 균열선
    c.strokeStyle='rgba(140,200,255,0.65)'; c.lineWidth=1.2;
    [[20,30,70,60],[80,10,110,80],[130,40,180,120],[40,120,90,170],[140,100,190,160]].forEach(([x1,y1,x2,y2])=>{
      c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    });
    // 타일 경계
    c.strokeStyle='rgba(100,160,220,0.2)'; c.lineWidth=1.5;
    c.strokeRect(0,0,sz,sz);
    // 반짝임 점
    [[40,60],[120,30],[170,150],[80,160],[10,130],[150,80]].forEach(([x,y])=>{
      c.fillStyle='rgba(255,255,255,0.90)'; c.beginPath(); c.arc(x,y,2,0,Math.PI*2); c.fill();
      // 별 모양 반짝임
      c.strokeStyle='rgba(200,240,255,0.6)'; c.lineWidth=0.8;
      c.beginPath(); c.moveTo(x-4,y); c.lineTo(x+4,y); c.moveTo(x,y-4); c.lineTo(x,y+4); c.stroke();
    });
  } else {
    // ACT3: 용암 바위 타일
    c.fillStyle = '#2a1008'; c.fillRect(0,0,sz,sz);
    // 바위 텍스처 (약간 밝게)
    [[40,40,28,22,'#381608'],[110,30,22,18,'#321208'],[160,90,26,20,'#3a1808'],[60,140,24,19,'#2e1006'],[150,160,22,17,'#401a0a']].forEach(([x,y,rx,ry,col])=>{
      c.fillStyle=col; c.beginPath(); c.ellipse(x,y,rx,ry,Math.random()*0.5,0,Math.PI*2); c.fill();
    });
    // 용암 균열 (더 선명하게)
    c.strokeStyle='rgba(255,100,0,0.7)'; c.lineWidth=1.5;
    [[10,50,60,100],[80,20,140,80],[150,60,180,130],[30,140,90,180],[120,110,170,170]].forEach(([x1,y1,x2,y2])=>{
      c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    });
    // 용암 발광 점 (더 밝고 크게)
    [[50,70,'rgba(255,130,0,0.85)'],[130,50,'rgba(255,90,0,0.75)'],[80,160,'rgba(255,110,0,0.8)'],[170,140,'rgba(255,70,0,0.75)'],[20,110,'rgba(255,100,0,0.65)'],[160,170,'rgba(255,80,0,0.7)']].forEach(([x,y,col])=>{
      const g=c.createRadialGradient(x,y,0,x,y,12); g.addColorStop(0,col); g.addColorStop(0.5,'rgba(255,60,0,0.3)'); g.addColorStop(1,'transparent');
      c.fillStyle=g; c.beginPath(); c.arc(x,y,12,0,Math.PI*2); c.fill();
    });
    // 타일 경계
    c.strokeStyle='rgba(255,60,0,0.18)'; c.lineWidth=1;
    c.strokeRect(0,0,sz,sz);
  }

  try {
    const pat = gctx.createPattern(oc, 'repeat');
    _floorPatternCache[act] = {pattern: pat, size: sz};
    return _floorPatternCache[act];
  } catch(e) {
    return null;
  }
}

// 월드 좌표계 배경 그리기 (카메라 트랜스폼 적용 후 호출)
function drawWorldFloor(ctx, cam, act, now) {
  const fl = buildFloorPattern(act);
  if (fl && fl.pattern) {
    // 패턴을 카메라 오프셋에 맞게 위상 이동
    const mat = new DOMMatrix().translate(-((cam.x % fl.size + fl.size) % fl.size), -((cam.y % fl.size + fl.size) % fl.size));
    fl.pattern.setTransform(mat);
    ctx.save();
    ctx.fillStyle = fl.pattern;
    // 가시 영역보다 약간 크게 그려서 경계가 잘리지 않게
    ctx.fillRect(cam.x - 10, cam.y - 10, 820, 820);
    ctx.restore();
  } else {
    // 폴백: 단색
    const colors = ['#2a5c14','#9ac8e0','#1a0804'];
    ctx.save(); ctx.fillStyle = colors[act-1] || '#2a5c14';
    ctx.fillRect(cam.x-10, cam.y-10, 820, 820); ctx.restore();
  }
}

function spawnP(x,y,color,count=6,speed=3){
  for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=speed*(0.5+Math.random());bt.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*15,maxLife:35,color,size:2+Math.random()*3});}
}
function spawnDN(x,y,val,color='#fff',big=false,type=''){
  // type: 'crit'|'heal'|'poison'|'fire'|'ice'|'text'|''
  let _col=color, _big=big, _life=big?55:40, _vy=big?-1.8:-1.2;
  let _scale=1.0; // 초기 스케일 (crit은 크게 시작 후 줄어들기)
  if(type==='crit'){ _col=color||'#ffe040'; _big=true; _life=62; _vy=-2.4; _scale=1.5; }
  else if(type==='heal'){ _col='#4ecf7a'; _life=50; _vy=-1.5; }
  else if(type==='poison'){ _col='#a0e860'; _vy=-1.0; }
  else if(type==='fire'){ _col='#ff8840'; _big=true; _vy=-1.8; }
  else if(type==='ice'){ _col='#80d8ff'; _vy=-0.9; }
  bt.damageNums.push({x,y,val,color:_col,life:_life,vy:_vy,big:_big,x0:x,type,scale:_scale});
}
